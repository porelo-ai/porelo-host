---
argument_specs:
  main:
    short_description: Porelo's setup for the account, and the vault named as the person's step while missing or shut.
    options:
      porelo_account:
        type: str
        required: true
        description: The account Porelo's tasks run as, from the collection-wide variable porelo_host_account.
  install:
    short_description: Porelo's repository by its pinned key, Porelo from it, and its setup script for the account.
    options:
      porelo_account:
        type: str
        required: true
        description: The account Porelo's setup script makes.
      porelo_distribution:
        type: str
        default: releases
        choices: [releases, snapshots]
        description: Which of Porelo's published distributions the host installs from.
      porelo_key_url:
        type: str
        default: https://fuinorg.jfrog.io/artifactory/api/security/keypair/porelo-packages/public
        description: Where Porelo's package key is fetched from.
      porelo_key_fingerprint:
        type: str
        default: BF27A2FA637F505CAFBE431768D19D175D904415
        description: The fingerprint the key must have, as porelo's getting-started pins it.
      porelo_repository_url:
        type: str
        default: https://fuinorg.jfrog.io/artifactory/porelo-dist-deb
        description: Porelo's apt repository.
      porelo_setup_script:
        type: path
        default: /usr/share/porelo/setup/porelo-setup.sh
        description: Porelo's setup script, as the package porelo ships it.
  project:
    short_description: The second inventory from the machine file, its keys checked in the vault, the project followed.
    options:
      porelo_account:
        type: str
        required: true
        description: The account Porelo's tasks run as.
      porelo_machine_file:
        type: path
        default: /srv/porelo-host/drive/porelo-host/machine.yml
        description: The person's machine file on their drive, which Porelo reads.
  tasks:
    short_description: >-
      After project, every offered agent and the project's transport packages installed, with no task started.
    options:
      porelo_account:
        type: str
        required: true
        description: The account Porelo's tasks run as.
      porelo_distribution:
        type: str
        default: releases
        choices: [releases, snapshots]
        description: >-
          Which of Porelo's published distributions the setup script lists and installs packages from.
      porelo_setup_script:
        type: path
        default: /usr/share/porelo/setup/porelo-setup.sh
        description: >-
          Porelo's setup script, which lists agents with --list --json and installs missing packages with --with.
  down:
    short_description: >-
      Every running task of the account stopped, its vault cleared and the stop's account file removed before the host
      is given back.
    options:
      porelo_account:
        type: str
        required: true
        description: The account Porelo's tasks run as.
