---
argument_specs:
  main:
    short_description: Porelo's setup for the account, and the vault named as the person's step while missing or shut.
    options:
      porelo_account:
        type: str
        required: true
        description: The account Porelo's tasks run as.
  install:
    short_description: Porelo's repository by its pinned key, Porelo's packages from it, and the stop command.
    options:
      porelo_distribution:
        type: str
        default: releases
        choices: [releases, snapshots]
        description: Which of Porelo's published distributions the host installs from.
      porelo_key_url:
        type: str
        default: https://fuinorg.jfrog.io/artifactory/api/security/keypair/porelo-packages/public
        description: Where Porelo's package key is fetched from.
      porelo_key_fingerprint:
        type: str
        default: BF27A2FA637F505CAFBE431768D19D175D904415
        description: The fingerprint the key must have, as porelo's getting-started pins it.
      porelo_repository_url:
        type: str
        default: https://fuinorg.jfrog.io/artifactory/porelo-dist-deb
        description: Porelo's apt repository.
  down:
    short_description: The organization's follow, its keys and the setup's files removed before the host is given back.
    options:
      porelo_machine_file:
        type: path
        default: /etc/porelo-host/setup/machine.yml
        description: The machine file, whose directory down removes.
  person:
    short_description: >-
      The root helper /usr/local/sbin/porelo-host-person, its password and sync sudoers drop-in and SSH authorized_keys
      drop-in.
    options:
      porelo_machine_file:
        type: path
        default: /etc/porelo-host/setup/machine.yml
        description: The machine file whose organization mapping supplies settings, known_hosts and pin text.
  people:
    short_description: >-
      Refuse at the start of down while any person record still holds a membership on the host.
