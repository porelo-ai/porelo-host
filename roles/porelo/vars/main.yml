---
__porelo_organization: "{{ (__porelo_organization_machine.content | b64decode | from_yaml).organization }}"
__porelo_user_environment:
  XDG_RUNTIME_DIR: "/run/user/{{ ansible_facts['getent_passwd'][porelo_account][1] }}"
  DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ ansible_facts['getent_passwd'][porelo_account][1] }}/bus"
# Where the interface uploads machine.yml before up, root's, the account reading them alone.
__porelo_setup_dir: "{{ porelo_machine_file | dirname }}"
# What porelo's vault clear names as a transport's own, whether or not it fills the item's transport.
__porelo_transport_kinds: [transport, conversation]
# Where down reads the people's records before stopping anything; the unit tests name another directory in its place.
__porelo_people_dir: /etc/porelo-host/people
# The host's test mode, which the host program reads; the unit tests name another file in its place.
__porelo_test_mode_path: /etc/porelo-host/test-mode.json
__porelo_test_mode_owner: root
# The test switches the host program knows; the role refuses any other name.
__porelo_test_known: [start-uncertified]
__porelo_test_switches: "{{ porelo_host_test_switches }}"
