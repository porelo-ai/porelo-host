---
__porelo_user_environment:
  XDG_RUNTIME_DIR: "/run/user/{{ ansible_facts['getent_passwd'][porelo_account][1] }}"
__porelo_second: "{{ __porelo_inventory.stdout | from_yaml }}"
__porelo_host: "{{ __porelo_second.all.hosts.localhost }}"
__porelo_followed: "{{ (__porelo_following.stdout | from_json).follows
  | selectattr('name', 'equalto', __porelo_host.porelo_project.name) | list }}"
__porelo_transports: "{{ __porelo_host.porelo_transports | default([]) }}"
__porelo_task_packages: "{{ (((__porelo_setup_packages.stdout | from_json).packages
  | selectattr('kind', 'equalto', 'agent') | selectattr('installed', 'equalto', false)
  | map(attribute='name') | list) + (__porelo_transports | map(attribute='package') | list)
  + (['porelo-matrix-homeserver'] if 'matrix' in (__porelo_transports | map(attribute='scheme')) else []))
  | unique | list }}"
# dpkg-query prints "<package> installed" for an installed one and nothing on stdout for one it does not know.
__porelo_task_packages_missing: "{{ __porelo_task_packages | difference(__porelo_task_packages_installed.stdout_lines
  | default([]) | select('match', '^\\S+ installed$') | map('split') | map('first') | list) }}"
