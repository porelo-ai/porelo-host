---
__porelo_user_environment:
  XDG_RUNTIME_DIR: "/run/user/{{ ansible_facts['getent_passwd'][porelo_account][1] }}"
__porelo_second: "{{ __porelo_inventory.stdout | from_yaml }}"
__porelo_host: "{{ __porelo_second.all.hosts.localhost }}"
__porelo_followed: "{{ (__porelo_following.stdout | from_json).follows
  | selectattr('name', 'equalto', __porelo_host.porelo_project.name) | list }}"
__porelo_agent_packages: "{{ __porelo_host.porelo_tasks | default([]) | selectattr('agent_package', 'defined')
  | map(attribute='agent_package') | unique | list }}"
# dpkg-query prints "<package> installed" for an installed one and nothing on stdout for one it does not know.
__porelo_agent_missing: "{{ __porelo_agent_packages | difference(__porelo_agent_installed.stdout_lines | default([])
  | select('match', '^\\S+ installed$') | map('split') | map('first') | list) }}"
__porelo_task_agents: "{{ __porelo_host.porelo_tasks | default([]) | selectattr('agent', 'defined')
  | map(attribute='agent') | unique | list }}"
__porelo_agents_known: "{{ (__porelo_agents.stdout | from_json).agents }}"
__porelo_tasks_running: "{{ __porelo_task_status.results | map(attribute='stdout') | map('from_json')
  | selectattr('running') | map(attribute='name') | list }}"
