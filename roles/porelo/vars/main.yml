---
__porelo_user_environment:
  XDG_RUNTIME_DIR: "/run/user/{{ ansible_facts['getent_passwd'][porelo_account][1] }}"
__porelo_second: "{{ __porelo_inventory.stdout | from_yaml }}"
__porelo_host: "{{ __porelo_second.all.hosts.localhost }}"
__porelo_followed: "{{ (__porelo_following.stdout | from_json).follows
  | selectattr('name', 'equalto', __porelo_host.porelo_project.name) | list }}"
__porelo_transports: "{{ __porelo_host.porelo_transports | default([]) }}"
__porelo_task_packages: "{{ (((__porelo_setup_packages.stdout | from_json).packages
  | selectattr('kind', 'equalto', 'agent') | selectattr('installed', 'equalto', false)
  | map(attribute='name') | list) + (__porelo_transports | map(attribute='package') | list)
  + (['porelo-matrix-homeserver'] if 'matrix' in (__porelo_transports | map(attribute='scheme')) else []))
  | unique | list }}"
# dpkg-query prints "<package> installed" for an installed one and nothing on stdout for one it does not know.
__porelo_task_packages_missing: "{{ __porelo_task_packages | difference(__porelo_task_packages_installed.stdout_lines
  | default([]) | select('match', '^\\S+ installed$') | map('split') | map('first') | list) }}"
__porelo_hosts_dropin: "{{ ansible_facts['getent_passwd'][porelo_account][4]
  }}/.config/containers/containers.conf.d/porelo-host-hosts.conf"
# Where the interface uploads machine.yml and the project's bundle before up, root's, the account reading them alone.
__porelo_setup_dir: "{{ porelo_machine_file | dirname }}"
# The one place the person's stop writes the registration token of the room's homeserver, as the project names it and
# as it lies in the account's home.
__porelo_matrix_token_named: "~/.config/porelo/matrix/host-registration-token"
__porelo_matrix_token_files: "{{ __porelo_transports | selectattr('scheme', 'equalto', 'matrix')
  | map(attribute='files', default={}) | selectattr('registration_token_file', 'defined')
  | map(attribute='registration_token_file') | list }}"
__porelo_matrix_token_path: >-
  {{ ansible_facts['getent_passwd'][porelo_account][4] }}/.config/porelo/matrix/host-registration-token
# What porelo's vault clear names as a transport's own, whether or not it fills the item's transport.
__porelo_transport_kinds: [transport, conversation]
# Where down reads the people's records before stopping anything; the unit tests name another directory in its place.
__porelo_people_dir: /etc/porelo-host/people
