---
# up's second play, the vault open: the second inventory Porelo writes from the machine file, the machine's keys
# checked in the vault, where the person's stop put them, the project followed by its signature. Every answer is
# Porelo's own (porelo's doc/hosts.md).
- name: project | Read the account's id
  ansible.builtin.getent:
    database: passwd
    key: "{{ porelo_account }}"

# machine.yml pins the project's signing key, so a file the account could write would let a task choose what it
# follows; the place is checked before Porelo reads anything of it.
- name: project | Read the setup's directory and the machine file
  ansible.builtin.stat:
    path: "{{ item }}"
    get_checksum: false
    get_mime: false
  loop: ["{{ __porelo_setup_dir }}", "{{ porelo_machine_file }}"]
  register: __porelo_setup_place

- name: project | Stop where the setup's files are missing or anybody but root can write them, naming what was found
  ansible.builtin.assert:
    that:
      - __porelo_setup_place.results[0].stat.isdir | default(false)
      - __porelo_setup_place.results[1].stat.isreg | default(false)
      - __porelo_setup_place.results | map(attribute='stat.uid', default=-1) | unique | list == [0]
      - __porelo_setup_place.results | selectattr('stat.wgrp') | list | length == 0
      - __porelo_setup_place.results | selectattr('stat.woth') | list | length == 0
    fail_msg: >-
      {{ __porelo_setup_dir }} a directory and {{ porelo_machine_file }} a plain file must be there, root's, and
      written by root alone; found
      {% for r in __porelo_setup_place.results %}{{ r.item }}:
      {{ 'missing' if not r.stat.exists
      else (('link' if r.stat.islnk else ('directory' if r.stat.isdir
      else ('plain file' if r.stat.isreg else 'other'))) ~ ' uid ' ~ r.stat.uid ~ ' mode ' ~ r.stat.mode) }}
      {{- '; ' if not loop.last }}
      {%- endfor %}
    quiet: true

- name: project | Ask Porelo for the second play's inventory from the person's machine file
  ansible.builtin.command:
    cmd: porelo project inventory --machine-file {{ porelo_machine_file }}
  become: true
  become_user: "{{ porelo_account }}"
  environment: "{{ __porelo_user_environment }}"
  register: __porelo_inventory
  changed_when: false
  failed_when: false
  check_mode: false

- name: project | Stop on Porelo's refusal of the machine file, with its own words
  ansible.builtin.assert:
    that: __porelo_inventory.rc == 0
    fail_msg: >-
      porelo project inventory refused {{ porelo_machine_file }} with {{ __porelo_inventory.rc }}
      ({{ 'no such file' if __porelo_inventory.rc == 66 else 'its project part is wrong' }}):
      {{ __porelo_inventory.stderr }}
    quiet: true

- name: project | Stop on an inventory of a version this role does not know
  ansible.builtin.assert:
    that: __porelo_second.all.vars.porelo_inventory_version == 2
    fail_msg: >-
      Porelo wrote inventory version {{ __porelo_second.all.vars.porelo_inventory_version }}, this role reads 2
    quiet: true

# The bundle the machine file names is followed as the project's origin, so it must lie beside the machine file and be
# root's alone too: an account that could change it could hand an older commit signed by the same key.
- name: project | Read the bundle the machine file names
  ansible.builtin.stat:
    path: "{{ __porelo_host.porelo_project.url }}"
    get_checksum: false
    get_mime: false
  register: __porelo_bundle

- name: project | Stop where the bundle lies elsewhere or anybody but root can write it, naming what was found
  ansible.builtin.assert:
    that:
      - (__porelo_host.porelo_project.url | dirname) == __porelo_setup_dir
      - __porelo_bundle.stat.isreg | default(false)
      - __porelo_bundle.stat.uid == 0
      - not __porelo_bundle.stat.wgrp and not __porelo_bundle.stat.woth
    fail_msg: >-
      the project's url must be a plain file in {{ __porelo_setup_dir }}, root's and written by root alone; found
      {{ __porelo_host.porelo_project.url }}:
      {{ 'missing' if not __porelo_bundle.stat.exists
      else (('link' if __porelo_bundle.stat.islnk else ('directory' if __porelo_bundle.stat.isdir
      else ('plain file' if __porelo_bundle.stat.isreg else 'other')))
      ~ ' uid ' ~ __porelo_bundle.stat.uid ~ ' mode ' ~ __porelo_bundle.stat.mode) }}
    quiet: true

- name: project | Ask Porelo which entries the vault holds, by name
  ansible.builtin.command:
    cmd: porelo vault list
  become: true
  become_user: "{{ porelo_account }}"
  environment: "{{ __porelo_user_environment }}"
  register: __porelo_vault_list
  changed_when: false
  check_mode: false

# Only names pass here: each key reaches the vault on the stop's pipe, never through Ansible.
- name: project | Stop on a key of the machine file the vault does not hold, naming it
  ansible.builtin.assert:
    that: __porelo_keys_missing | length == 0
    fail_msg: >-
      keys: the vault holds no {{ __porelo_keys_missing | join(', ') }}; give them with
      porelo-host-stop --stdin keys and run up again
    quiet: true
  vars:
    __porelo_keys_missing: "{{ __porelo_host.porelo_vault_keys | default([]) | map(attribute='name')
      | reject('in', __porelo_vault_list.stdout_lines | map('split') | map('first') | list) | list }}"

# The registration token of the room's homeserver comes only on the stop's pipe, into the one path the stop writes; a
# project naming it is never followed without it (porelo's inventory names a transport's *_file settings, paths only).
- name: project | Stop on a project naming another path for the room's registration token
  ansible.builtin.assert:
    that: __porelo_matrix_token_files | reject('equalto', __porelo_matrix_token_named) | list | length == 0
    fail_msg: >-
      registration_token_file: the project names {{ __porelo_matrix_token_files
      | reject('equalto', __porelo_matrix_token_named) | join(', ') }} for the room's registration token; the host keeps
      it at {{ __porelo_matrix_token_named }} alone, so the project file must name that
    quiet: true

- name: project | Read the room's registration token and its directory, where the project names one
  ansible.builtin.stat:
    path: "{{ item }}"
    get_checksum: false
    get_mime: false
  loop:
    - "{{ __porelo_matrix_token_path | dirname | dirname }}"
    - "{{ __porelo_matrix_token_path | dirname }}"
    - "{{ __porelo_matrix_token_path }}"
  register: __porelo_matrix_token_place
  when: __porelo_matrix_token_files | length > 0

- name: project | Stop while the project names a registration token the account does not hold, naming its place
  ansible.builtin.assert:
    that:
      - __porelo_matrix_token_place.results[:2] | map(attribute='stat.isdir', default=false) | select | list
        | length == 2
      - __porelo_matrix_token_place.results[:2] | map(attribute='stat.mode', default='') | unique | list == ['0700']
      - __porelo_matrix_token_place.results[2].stat.isreg | default(false)
      - __porelo_matrix_token_place.results[2].stat.mode | default('') == '0600'
      - __porelo_matrix_token_place.results[2].stat.size | default(0) > 0
      - __porelo_matrix_token_place.results | map(attribute='stat.uid', default=-1) | unique | list
        == [ansible_facts['getent_passwd'][porelo_account][1] | int]
    fail_msg: >-
      matrix-token: {{ __porelo_matrix_token_path }} must be the account's own plain file, mode 0600 and not empty, in
      the account's own directories of mode 0700; give it with porelo-host-stop --stdin matrix-token and run up again
    quiet: true
  when: __porelo_matrix_token_files | length > 0

- name: project | Ask Porelo which projects the account follows
  ansible.builtin.command:
    cmd: porelo project following --json
  become: true
  become_user: "{{ porelo_account }}"
  environment: "{{ __porelo_user_environment }}"
  register: __porelo_following
  changed_when: false
  check_mode: false

# A bundle is read once when followed, so a newer one the interface uploads at the same path is only seen here.
- name: project | Read the commits the bundle's heads point at
  ansible.builtin.command:
    argv: [git, bundle, list-heads, "{{ __porelo_host.porelo_project.url }}"]
  register: __porelo_bundle_heads
  changed_when: false
  check_mode: false

# Followed again only where the address or the pinned key differs, or the followed commit is none of the bundle's heads;
# never --unverified.
- name: project | Follow the project, checked against the key the machine file names
  ansible.builtin.command:
    argv:
      - porelo
      - project
      - follow
      - "{{ __porelo_host.porelo_project.name }}"
      - "{{ __porelo_host.porelo_project.url }}"
      - "--signed-by={{ __porelo_host.porelo_project.signed_by }}"
  when: >-
    __porelo_followed | length == 0
    or __porelo_followed[0].url != __porelo_host.porelo_project.url
    or __porelo_host.porelo_project.signed_by not in (__porelo_followed[0].signed_by | default([]))
    or __porelo_followed[0].commit not in (__porelo_bundle_heads.stdout_lines | map('split') | map('first') | list)
  become: true
  become_user: "{{ porelo_account }}"
  environment: "{{ __porelo_user_environment }}"
  changed_when: true
