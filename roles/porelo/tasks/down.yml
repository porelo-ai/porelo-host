---

# First, and plainly: no variable an extra var could outrank decides it.
- name: down | Take the host's test mode away
  ansible.builtin.file:
    path: /etc/porelo-host/test-mode.json
    state: absent

- name: down | Remove the collection's former host programs
  ansible.builtin.include_tasks: "{{ role_path }}/tasks/legacy_programs.yml"

# What the follow holds, taken off the host before it is given back.
- name: down | Stop the host's follow of its organization
  ansible.builtin.systemd_service:
    name: porelo-host-follow.timer
    state: stopped
    enabled: false
  failed_when: false

- name: down | Remove the follow's units, the organization's keys and what the fetch kept
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/systemd/system/porelo-host-follow.timer
    - /etc/systemd/system/porelo-host-follow.service
    - /etc/porelo-host/organization
    - /etc/porelo-host/signers
    - /var/lib/porelo-host-org-fetch
    - /var/lib/private/porelo-host-org-fetch
  register: __porelo_follow_removed

- name: down | Forget the follow's units
  ansible.builtin.systemd_service:
    daemon_reload: true
  when: __porelo_follow_removed.results | selectattr('changed') | list | length > 0

- name: down | Remove the account's name the person's stop reads
  ansible.builtin.file:
    path: /etc/porelo-host/stop.conf
    state: absent

# Nothing of the project stays on a host given back.
- name: down | Remove the setup's files the interface uploaded
  ansible.builtin.file:
    path: "{{ __porelo_setup_dir }}"
    state: absent
