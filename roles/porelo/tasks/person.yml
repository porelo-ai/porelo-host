---
- name: person | Configure the organization and its follow timer
  ansible.builtin.include_tasks: "{{ role_path }}/tasks/organization.yml"

- name: person | Allow people their own commands
  ansible.builtin.template:
    src: "{{ role_path }}/templates/porelo-host-person.sudoers.j2"
    dest: /etc/sudoers.d/porelo-host-person
    owner: root
    group: root
    mode: "0440"
    validate: /usr/sbin/visudo -cf %s
    backup: true

- name: person | Restore private runtime directories and boot rules for recorded people
  ansible.builtin.command:
    argv: [env, -i, 'PATH=/usr/sbin:/usr/bin:/sbin:/bin', /usr/sbin/porelo-host, org, follow]
  changed_when: false

- name: person | Install the daily task token sweep
  ansible.builtin.template:
    src: "{{ role_path }}/templates/{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
    backup: true
  loop:
    - porelo-host-task-sweep.service
    - porelo-host-task-sweep.timer
  register: __porelo_task_sweep_units

- name: person | Enable the daily task token sweep
  ansible.builtin.systemd_service:
    name: porelo-host-task-sweep.timer
    daemon_reload: "{{ __porelo_task_sweep_units is changed }}"
    enabled: true
    state: started
