---
- name: person | Install the host's person helper
  ansible.builtin.copy:
    src: "{{ role_path }}/files/porelo-host-person"
    dest: /usr/local/sbin/porelo-host-person
    owner: root
    group: root
    mode: "0700"

- name: person | Allow people to sync their project
  ansible.builtin.copy:
    src: "{{ role_path }}/files/porelo-host-person.sudoers"
    dest: /etc/sudoers.d/porelo-host-person
    owner: root
    group: root
    mode: "0440"
    validate: /usr/sbin/visudo -cf %s

- name: person | Restore private runtime directories and boot rules for recorded people
  ansible.builtin.command:
    argv: [/usr/local/sbin/porelo-host-person, restore-runtime]
  register: __porelo_restored_runtime
  changed_when: (__porelo_restored_runtime.stdout | from_json).changed > 0

- name: person | Install the daily task token sweep
  ansible.builtin.copy:
    src: "{{ role_path }}/files/{{ item }}"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - porelo-host-task-sweep.service
    - porelo-host-task-sweep.timer
  register: __porelo_task_sweep_units

- name: person | Enable the daily task token sweep
  ansible.builtin.systemd_service:
    name: porelo-host-task-sweep.timer
    daemon_reload: "{{ __porelo_task_sweep_units is changed }}"
    enabled: true
    state: started
