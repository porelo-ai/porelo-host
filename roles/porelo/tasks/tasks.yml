---
# Agents come from Porelo's repository; only the person's task start may use their sign-ins or enable a homeserver.
- name: tasks | Ask Porelo's setup script which packages its repository offers
  ansible.builtin.command:
    argv: [sh, "{{ porelo_setup_script }}", --user, "{{ porelo_account }}",
           --distribution, "{{ porelo_distribution }}", --list, --json]
  register: __porelo_setup_packages
  changed_when: false
  check_mode: false

- name: tasks | Stop when Porelo's repository offers no agent
  ansible.builtin.assert:
    that: (__porelo_setup_packages.stdout | from_json).packages
      | selectattr('kind', 'equalto', 'agent') | list | length > 0
    fail_msg: "Porelo's repository offers no agent"
    quiet: true

- name: tasks | Ask dpkg which of the agents and transport packages are installed
  ansible.builtin.command:
    argv: "{{ ['dpkg-query', '-W', '-f', '${Package} ${db:Status-Status}\n'] + __porelo_task_packages }}"
  register: __porelo_task_packages_installed
  changed_when: false
  # 1 names a package dpkg does not know; any other answer would make every package look missing.
  failed_when: __porelo_task_packages_installed.rc not in [0, 1]
  check_mode: false
  when: __porelo_task_packages | length > 0

# The homeserver is a disabled user unit; the transport's setup enables and starts it at the first task start.
- name: tasks | Install the missing agents and transport packages through Porelo's setup script
  ansible.builtin.command:
    argv: "{{ ['sh', porelo_setup_script, '--user', porelo_account, '--distribution', porelo_distribution]
      + (['--with'] | product(__porelo_task_packages_missing) | flatten) }}"
  changed_when: true
  when: __porelo_task_packages_missing | length > 0

- name: tasks | Ask Porelo which agents are installed and whether the vault holds their sign-ins
  ansible.builtin.command:
    cmd: porelo agents --json
  become: true
  become_user: "{{ porelo_account }}"
  environment: "{{ __porelo_user_environment }}"
  register: __porelo_agents
  changed_when: false
  check_mode: false

# An open vault remains a requirement even though agent sign-ins do not gate up.
- name: tasks | Stop unless the vault is open, since only then does Porelo say who is signed in
  ansible.builtin.assert:
    that: (__porelo_agents.stdout | from_json).vault == 'open'
    fail_msg: "porelo agents --json reads the vault {{ (__porelo_agents.stdout | from_json).vault }}, not open"
    quiet: true

- name: tasks | Keep the host's own names out of the account's containers
  ansible.builtin.include_tasks: "{{ role_path }}/tasks/hosts.yml"

- name: tasks | Remove the forge's certificate trust from the account and its tasks
  ansible.builtin.include_tasks: "{{ role_path }}/tasks/trust.yml"
  when: porelo_host_forge | default(false) | bool
