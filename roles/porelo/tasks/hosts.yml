---
- name: hosts | Read the account's home
  ansible.builtin.getent:
    database: passwd
    key: "{{ porelo_account }}"

# Podman copies the host's /etc/hosts into each container, where its loopback entry for the forge would hide the gate's
# address Porelo's resolver gives the task, and the room's name would name the person's computer; the resolver alone
# names what a task resolves, with the forge or without it.
- name: hosts | Make the account's Podman configuration directory
  ansible.builtin.file:
    path: "{{ ansible_facts['getent_passwd'][porelo_account][4] }}/{{ item }}"
    state: directory
    owner: "{{ porelo_account }}"
    group: "{{ porelo_account }}"
    mode: "0700"
  loop: [.config/containers, .config/containers/containers.conf.d]

- name: hosts | Keep the host's names out of the account's containers
  ansible.builtin.copy:
    dest: "{{ __porelo_hosts_dropin }}"
    content: |
      # Written by the role porelo at up; the host's /etc/hosts is the host's own, never a task's.
      [containers]
      base_hosts_file = "none"
    owner: "{{ porelo_account }}"
    group: "{{ porelo_account }}"
    mode: "0600"
