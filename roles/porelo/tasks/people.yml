---
# Start of down: refuse before anything is stopped while any person's record still holds a membership. Only names and
# memberships leave the reader; laptop keys stay in root's 0600 records.
- name: people | Read the memberships still held in the people directory
  ansible.builtin.command:
    argv:
      - /usr/bin/python3
      - -I
      - -c
      - |
        import json, os, re, stat, sys
        directory = sys.argv[1]
        owner = os.geteuid()
        user_re = re.compile(r"[a-z][a-z0-9-]{0,30}\Z")
        proj_re = re.compile(r"[a-z0-9]([a-z0-9-]{0,38}[a-z0-9])?\Z")
        def fail(words):
            print(words, file=sys.stderr)
            sys.exit(65)
        def member_key(value):
            if value == "hand":
                return (0, "", 0)
            parts = value.split(" ")
            if len(parts) == 2 and proj_re.match(parts[0]) and parts[1] in ("project-admin", "developer"):
                return (1, parts[0], 0 if parts[1] == "project-admin" else 1)
            fail("a person record holds an invalid membership")
        try:
            st = os.lstat(directory)
        except FileNotFoundError:
            print("[]")
            sys.exit(0)
        except OSError:
            fail(f"cannot inspect {directory}")
        if not stat.S_ISDIR(st.st_mode) or st.st_uid != owner or st.st_mode & 0o077:
            fail(f"{directory} is not a private directory of root's alone")
        holders = []
        for name in sorted(os.listdir(directory)):
            if not name.endswith(".conf") or not user_re.match(name[:-5]):
                fail("the people directory holds an unknown record")
            user = name[:-5]
            path = os.path.join(directory, name)
            try:
                fst = os.lstat(path)
            except OSError:
                fail(f"cannot inspect {path}")
            if not stat.S_ISREG(fst.st_mode) or fst.st_uid != owner or stat.S_IMODE(fst.st_mode) != 0o600:
                fail(f"{path} is not a private plain file of root's alone")
            try:
                with open(path, encoding="utf-8") as stream:
                    lines = stream.read().splitlines()
            except (OSError, UnicodeError):
                fail(f"cannot read {path}")
            if (
                len(lines) >= 4
                and lines[0] == "role=project-admin"
                and lines[1] == "projects="
                and lines[2] in ("locked=false", "locked=true")
                and all(line.startswith("laptop=") and len(line) > 7 for line in lines[3:])
            ):
                members = ["hand"]
            else:
                members, previous, index = [], None, 0
                while index < len(lines) and lines[index].startswith("member="):
                    member = lines[index][7:]
                    order = member_key(member)
                    if previous is not None and order <= previous:
                        fail(f"the record for {user} is malformed")
                    members.append(member)
                    previous = order
                    index += 1
                if (
                    len(lines) < index + 2
                    or lines[index] not in ("locked=false", "locked=true")
                    or any(not line.startswith("laptop=") or len(line) <= 7 for line in lines[index + 1 :])
                ):
                    fail(f"the record for {user} is malformed")
            if members:
                holders.append(f"{user} ({', '.join(members)})")
        print(json.dumps(holders))
      - "{{ __porelo_people_dir }}"
  register: __porelo_people_memberships
  changed_when: false
  check_mode: false

- name: people | Stop while any person still holds a membership
  ansible.builtin.assert:
    that: (__porelo_people_memberships.stdout | from_json) | length == 0
    fail_msg: >-
      people still hold memberships on this host:
      {{ (__porelo_people_memberships.stdout | from_json) | join('; ') }};
      use "Take the project off" to remove a project's memberships, or "Purge" to remove a person
    quiet: true
