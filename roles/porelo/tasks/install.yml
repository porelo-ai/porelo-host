---
# Both programs come from the same signed repository, at the collection's pinned package versions.
- name: install | Make the directory the key is kept in
  ansible.builtin.file:
    path: /var/cache/porelo-host
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: install | Download Porelo's package key
  ansible.builtin.get_url:
    url: "{{ porelo_key_url }}"
    dest: /var/cache/porelo-host/porelo-packages.asc
    owner: root
    group: root
    mode: "0644"

- name: install | Read the key's fingerprint
  ansible.builtin.command:
    cmd: gpg --show-keys --with-colons /var/cache/porelo-host/porelo-packages.asc
  register: __porelo_key
  changed_when: false
  check_mode: false

- name: install | Stop on a key without the pinned fingerprint
  ansible.builtin.assert:
    that: __porelo_key.stdout_lines | select('match', '^fpr:') | map('split', ':') | map(attribute=9) | list
      == [porelo_key_fingerprint]
    fail_msg: >-
      the key at {{ porelo_key_url }} is not the one with the fingerprint {{ porelo_key_fingerprint }}; nothing of
      Porelo is installed
    quiet: true

- name: install | Install the key for apt
  ansible.builtin.command:
    cmd: gpg --dearmor --yes -o /usr/share/keyrings/porelo.gpg /var/cache/porelo-host/porelo-packages.asc
    creates: /usr/share/keyrings/porelo.gpg

- name: install | Name Porelo's repository, signed by that key
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/porelo.list
    content: |
      deb [signed-by=/usr/share/keyrings/porelo.gpg] {{ porelo_repository_url }} {{ porelo_distribution }} main
    owner: root
    group: root
    mode: "0644"
  register: __porelo_repository

# What porelo-setup.sh always installs: Porelo, its message filter and rootless networking. The people's accounts
# are made by the host program, each with its own subordinate ID range, which the script would give them alike.
- name: install | Install Porelo from it, with its filter and rootless networking
  ansible.builtin.apt:
    name:
      - "porelo={{ porelo_version }}"
      - "porelo-host={{ porelo_host_version }}"
      - porelo-message-sluice-filter
      - uidmap
      - slirp4netns
      - passt
      - catatonit
      - acl
    state: present
    update_cache: true
  when: porelo_local_packages | length == 0

- name: install | Require an absolute directory for local packages
  ansible.builtin.assert:
    that: porelo_local_packages is string and porelo_local_packages is match('^/')
    fail_msg: "porelo_local_packages must name an absolute directory on the host"
    quiet: true
  when: porelo_local_packages | length > 0

- name: install | Refresh the repository before resolving local package dependencies
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: "{{ 0 if __porelo_repository is changed else 3600 }}"
  when: porelo_local_packages | length > 0

- name: install | Find the handed-over packages on the host
  ansible.builtin.find:
    paths: "{{ porelo_local_packages }}"
    patterns: '*.deb'
    file_type: file
  register: __porelo_local_packages
  when: porelo_local_packages | length > 0

- name: install | Require the local package directory to contain packages
  ansible.builtin.assert:
    that: __porelo_local_packages.matched > 0
    fail_msg: "no Debian packages in {{ porelo_local_packages }}"
    quiet: true
  when: porelo_local_packages | length > 0

# The apt module accepts one local archive, but their dependencies must be resolved in one transaction.
- name: install | Install local Porelo packages together with their dependencies
  ansible.builtin.command:  # noqa: command-instead-of-module
    argv: >-
      {{ ['apt-get', 'install', '-y', '-qq', '--allow-downgrades', '--no-remove']
         + (__porelo_local_packages.files | map(attribute='path') | sort | list)
         + ['porelo=' ~ porelo_version, 'porelo-host=' ~ porelo_host_version,
            'porelo-message-sluice-filter', 'uidmap', 'slirp4netns', 'passt', 'catatonit', 'acl'] }}
  environment:
    DEBIAN_FRONTEND: noninteractive
  register: __porelo_local_installed
  changed_when: __porelo_local_installed.stdout | trim | length > 0
  when: porelo_local_packages | length > 0

- name: install | Read the installed host package version
  ansible.builtin.command:
    argv: [dpkg-query, --show, '--showformat=${Version}', porelo-host]
  register: __porelo_host_package
  changed_when: false
  check_mode: false

- name: install | Compare the installed host package with the pinned version
  ansible.builtin.command:
    argv: [dpkg, --compare-versions, "{{ __porelo_host_package.stdout }}", ge, "{{ porelo_host_version }}"]
  register: __porelo_host_version_comparison
  changed_when: false
  failed_when: __porelo_host_version_comparison.rc not in [0, 1]
  check_mode: false

- name: install | Refuse an older host package version
  ansible.builtin.assert:
    that: __porelo_host_version_comparison.rc == 0
    fail_msg: >-
      installed porelo-host {{ __porelo_host_package.stdout }} is older than the required {{ porelo_host_version }}
    quiet: true

# Every published agent is installed (operator's decision, 2026-10-29): a person's project chooses among them without
# root. The repository is the catalogue, read as Porelo's setup script and daemon read it: each agent package
# declares Provides: porelo-agent, the acceptance suite's stub deliberately not. No agent package has a service or
# an install script, so nothing runs until a task starts its agent.
- name: install | Read which agents the repository publishes
  ansible.builtin.command: apt-cache showpkg porelo-agent
  register: __porelo_agent_catalogue
  changed_when: false

- name: install | Name the published agents
  ansible.builtin.set_fact:
    __porelo_agents: >-
      {{ (__porelo_agent_catalogue.stdout.split('Reverse Provides:') + [''])[1].splitlines()
         | map('trim') | reject('equalto', '') | map('split') | map('first') | unique | sort }}

- name: install | Refuse a repository that publishes no agent
  ansible.builtin.assert:
    that: __porelo_agents | length > 0
    fail_msg: "the repository {{ porelo_repository_url }} {{ porelo_distribution }} publishes no porelo-agent"
    quiet: true

- name: install | Install every published agent
  ansible.builtin.apt:
    name: "{{ __porelo_agents }}"
    state: present

- name: install | Install the build reader for the host's forge
  ansible.builtin.apt:
    name: porelo-adapter-forgejo
    state: present
  when: porelo_host_forge | default(false) | bool

# The host's settings and stop files live here; the directory itself holds no secret.
- name: install | Make the directory of the host's settings
  ansible.builtin.file:
    path: /etc/porelo-host
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: install | Remove the collection's former host programs
  ansible.builtin.include_tasks: "{{ role_path }}/tasks/legacy_programs.yml"
