---
- name: trust | Read the account's home
  ansible.builtin.getent:
    database: passwd
    key: "{{ porelo_account }}"

- name: trust | Remove the forge's CA from the account's trusted certificates
  ansible.builtin.blockinfile:
    path: "{{ ansible_facts['getent_passwd'][porelo_account][4] }}/.config/porelo/ca-certificates.pem"
    marker: "# {mark} porelo-host forge CA"
    state: absent

- name: trust | Remove the tasks' forge CA bundle
  ansible.builtin.file:
    path: "{{ ansible_facts['getent_passwd'][porelo_account][4] }}/.config/porelo/task-ca-certificates.pem"
    state: absent
