---
# Which of Porelo's published distributions the host installs from, releases or snapshots; from the collection-wide
# porelo_host_distribution that porelo-frontend's inventory names.
porelo_distribution: "{{ porelo_host_distribution | default('releases') }}"

# Exact Debian package versions; snapshot builds must name their complete ~snapshot.<build> version.
porelo_version: "0.5.0"
porelo_host_version: "0.5.1~snapshot.462"
# Root's directory of explicitly supplied local Debian packages; empty uses the signed repository.
porelo_local_packages: ""

# Porelo's package key, and the fingerprint porelo's getting-started pins for it on a page served from elsewhere: the
# key is installed only when it has exactly that fingerprint, and apt then takes only packages it signed.
porelo_key_url: https://fuinorg.jfrog.io/artifactory/api/security/keypair/porelo-packages/public
porelo_key_fingerprint: BF27A2FA637F505CAFBE431768D19D175D904415
porelo_repository_url: https://fuinorg.jfrog.io/artifactory/porelo-dist-deb

# The person's machine file, uploaded by the interface into the host's setup directory,
# which names the project, its signing key and the keys; Porelo reads it, never this role (porelo's doc/hosts.md).
porelo_machine_file: /etc/porelo-host/setup/machine.yml
