---
argument_specs:
  main:
    short_description: The shared Matrix homeserver reached through the transport's Unix socket gate.
    description:
      - Run after Porelo's package repository is configured.
    options:
      matrix_account:
        type: str
        default: porelo-matrix
        description: The account the homeserver and gate run as.
      matrix_name:
        type: str
        description: The homeserver's server name, matrix.<porelo_host_name>.porelo.internal by default.
      matrix_transport_command:
        type: path
        default: /usr/libexec/porelo/transports/porelo-message-transport-matrix
        description: The Matrix transport command providing gate --prepare.
  down:
    short_description: The gate, homeserver, admins files and service account removed.
    options:
      matrix_account:
        type: str
        default: porelo-matrix
        description: The account the homeserver and gate run as.
