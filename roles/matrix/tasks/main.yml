---
# The host's shared Matrix homeserver under an account of its own, with linger and subordinate ids for rootless podman.
- name: Make the homeserver's account
  ansible.builtin.user:
    name: "{{ matrix_account }}"
    shell: /usr/sbin/nologin
    create_home: true
  register: __matrix_user

- name: Give the homeserver's account its linger
  ansible.builtin.command:
    cmd: "loginctl enable-linger {{ matrix_account }}"
    creates: "/var/lib/systemd/linger/{{ matrix_account }}"

# Each file on its own: grep answers 1 for an account it does not name there, and 2 for a file it cannot read.
- name: Read the homeserver account's subordinate ids, in each file
  ansible.builtin.command:
    argv: [grep, -c, "^{{ matrix_account }}:", "{{ item }}"]
  loop: [/etc/subuid, /etc/subgid]
  register: __matrix_subids
  changed_when: false
  failed_when: __matrix_subids.rc not in [0, 1]
  check_mode: false

- name: Stop if the homeserver's account lacks the subordinate ids rootless podman needs
  ansible.builtin.assert:
    that: __matrix_subids.results | map(attribute='stdout') | map('int') | min > 0
    fail_msg: >-
      no subordinate ids for {{ matrix_account }} in {{ __matrix_subids.results | selectattr('stdout', 'equalto', '0')
      | map(attribute='item') | list }}
    quiet: true

- name: Keep the homeserver account's id and home
  ansible.builtin.set_fact:
    __matrix_uid: "{{ __matrix_user.uid }}"
    __matrix_home: "{{ __matrix_user.home }}"

# Base runs before this account exists, so its user manager is checked here before the container starts.
- name: Check the controllers of the homeserver's account
  ansible.builtin.include_role:
    name: porelo.host.base
    tasks_from: controllers
  vars:
    base_account: "{{ matrix_account }}"

- name: Install the Matrix homeserver and transport packages from Porelo's repository
  ansible.builtin.apt:
    name: "{{ __matrix_packages }}"
    state: present

- name: Read the homeserver's old TCP socket and proxy units
  ansible.builtin.command:
    argv:
      - systemctl
      - --user
      - list-unit-files
      - --no-legend
      - porelo-matrix-homeserver-vpn.socket
      - porelo-matrix-homeserver-vpn.service
  become: true
  become_user: "{{ matrix_account }}"
  environment: "{{ __matrix_environment }}"
  register: __matrix_old_units
  changed_when: false
  # systemd answers 1 where no unit file matches, as on a fresh host.
  failed_when: __matrix_old_units.rc not in [0, 1]
  check_mode: false

- name: Stop and disable the homeserver's old TCP socket and proxy
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    scope: user
    state: stopped
    enabled: false
  loop: [porelo-matrix-homeserver-vpn.socket, porelo-matrix-homeserver-vpn.service]
  become: true
  become_user: "{{ matrix_account }}"
  environment: "{{ __matrix_environment }}"
  # Only a socket publish enabled is a TCP way in; the package ships it disabled, with no address systemd would load.
  when: >-
    item in (__matrix_old_units.stdout_lines | map('split') | map('first') | list)
    and 'porelo-matrix-homeserver-vpn.socket' in (__matrix_old_units.stdout_lines | map('split')
    | rejectattr(1, 'equalto', 'disabled') | map('first') | list)

- name: Read the recorded people for registration token cleanup
  ansible.builtin.find:
    paths: /etc/porelo-host/people
    patterns: '*.conf'
    file_type: file
    follow: false
  register: __matrix_people

- name: Read the people's account homes
  ansible.builtin.getent:
    database: passwd

- name: Remove each recorded person's old registration token as that person
  ansible.builtin.command:
    argv:
      - rm
      - -f
      - --
      - "{{ ansible_facts['getent_passwd'][__matrix_person][4] }}/.config/porelo/matrix/host-registration-token"
  become: true
  become_user: "{{ __matrix_person }}"
  vars:
    __matrix_person: "{{ item.path | basename | regex_replace('\\.conf$', '') }}"
  loop: "{{ __matrix_people.files }}"
  loop_control:
    label: "{{ __matrix_person }}"
  when:
    - __matrix_person is match('^[a-z][a-z0-9-]{0,30}$')
    - __matrix_person != 'root'
    - __matrix_person in ansible_facts['getent_passwd']
    - ansible_facts['getent_passwd'][__matrix_person][1] | int >= 1000
  changed_when: false

- name: Resolve the homeserver's name through the host's loopback interface
  ansible.builtin.blockinfile:
    path: /etc/hosts
    marker: "# {mark} porelo-host matrix name"
    block: "127.0.0.1 {{ matrix_name }}"

# The homeserver's name stays stable across cloud-init and host reboots.
- name: Keep cloud-init from setting the hostname again at boot
  ansible.builtin.copy:
    dest: /etc/cloud/cloud.cfg.d/90-porelo-host-hostname.cfg
    content: "# Written by porelo-host's matrix role.\npreserve_hostname: true\n"
    mode: "0644"

- name: Name the host as its people's machines are named on the homeserver
  ansible.builtin.hostname:
    name: "{{ porelo_host_name }}"

- name: Resolve the host's own name through the host's loopback interface
  ansible.builtin.blockinfile:
    path: /etc/hosts
    marker: "# {mark} porelo-host host name"
    block: "127.0.1.1 {{ porelo_host_name }}"

- name: Make the homeserver's configuration directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ matrix_account }}"
    group: "{{ matrix_account }}"
    mode: "0700"
  loop:
    - "{{ __matrix_home }}/.config"
    - "{{ __matrix_home }}/.config/porelo"
    - "{{ __matrix_dir }}"

- name: Remove the homeserver's TCP and TLS settings
  ansible.builtin.lineinfile:
    path: "{{ __matrix_conf }}"
    regexp: '^(PORELO_MATRIX_PUBLISH|port|address|tls_.*)\s*='
    state: absent
  become: true
  become_user: "{{ matrix_account }}"
  notify: Restart the Matrix homeserver

# In gate mode the transport starts Tuwunel on its own socket and drops the TCP port; the host sets the mode alone.
- name: Set the homeserver's gate mode and server name
  ansible.builtin.lineinfile:
    path: "{{ __matrix_conf }}"
    regexp: '^{{ item.key }}\s*='
    line: "{{ item.key }}={{ item.value }}"
    create: true
    owner: "{{ matrix_account }}"
    group: "{{ matrix_account }}"
    mode: "0600"
  loop:
    - {key: PORELO_MATRIX_GATE, value: 1}
    - {key: PORELO_MATRIX_SERVER_NAME, value: "{{ matrix_name }}"}
  loop_control:
    label: "{{ item.key }}"
  become: true
  become_user: "{{ matrix_account }}"
  notify: Restart the Matrix homeserver

- name: Remove the homeserver's old TLS files
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  become: true
  become_user: "{{ matrix_account }}"
  loop:
    - "{{ __matrix_dir }}/tls"
    - "{{ __matrix_dir }}/ca.crt"

- name: Remove the host admin's old Matrix token
  ansible.builtin.file:
    path: /etc/porelo-host/matrix-admin.token
    state: absent

- name: Prepare the Matrix gate once after the homeserver unit is installed
  ansible.builtin.command:
    argv: ["{{ matrix_transport_command }}", gate, --prepare]
    creates: "{{ __matrix_dir }}/gate.prepared"
  become: true
  become_user: "{{ matrix_account }}"
  environment: "{{ __matrix_environment }}"
  register: __matrix_prepare

# Here, not in a handler: a play that fails later must still find the prepare done, and the homeserver starts below.
- name: Record the completed Matrix gate preparation
  ansible.builtin.copy:
    dest: "{{ __matrix_dir }}/gate.prepared"
    content: "prepared\n"
    owner: "{{ matrix_account }}"
    group: "{{ matrix_account }}"
    mode: "0600"
  become: true
  become_user: "{{ matrix_account }}"
  when: __matrix_prepare is changed  # noqa: no-handler

- name: Enable and start the Matrix homeserver
  ansible.builtin.systemd_service:
    name: porelo-matrix-homeserver.service
    scope: user
    enabled: true
    state: started
    daemon_reload: true
  become: true
  become_user: "{{ matrix_account }}"
  environment: "{{ __matrix_environment }}"

- name: Restart the Matrix homeserver now if its settings changed
  ansible.builtin.meta: flush_handlers

- name: Make the Matrix gate's socket group
  ansible.builtin.group:
    name: porelo-people
    system: true

- name: Make the Matrix gate's public socket directory
  ansible.builtin.file:
    path: /run/porelo-matrix
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install the Matrix gate's system socket and service
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop: [porelo-matrix-gate.socket, porelo-matrix-gate@.service]
  notify: Restart the Matrix gate socket

- name: Enable and start the Matrix gate socket
  ansible.builtin.systemd_service:
    name: porelo-matrix-gate.socket
    enabled: true
    state: started
    daemon_reload: true

- name: Restart the Matrix gate socket now if its unit changed
  ansible.builtin.meta: flush_handlers
