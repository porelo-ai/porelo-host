---
__matrix_packages:
  - porelo-matrix-homeserver
  - porelo-message-transport-matrix

__matrix_environment:
  XDG_RUNTIME_DIR: "/run/user/{{ __matrix_uid }}"
  DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ __matrix_uid }}/bus"

__matrix_dir: "{{ __matrix_home }}/.config/porelo/matrix"
__matrix_conf: "{{ __matrix_dir }}/homeserver.conf"

# Where the transport's homeserver unit mounts Tuwunel's own socket in gate mode, as porelo-message-matrix makes it.
__matrix_socket_dir: "{{ __matrix_environment.XDG_RUNTIME_DIR }}/porelo-matrix-gate"
