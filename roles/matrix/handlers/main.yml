---
- name: Restart the Matrix homeserver
  ansible.builtin.systemd_service:
    name: porelo-matrix-homeserver.service
    scope: user
    state: restarted
    daemon_reload: true
  become: true
  become_user: "{{ matrix_account }}"
  environment: "{{ __matrix_environment }}"

- name: Restart the Matrix gate socket
  ansible.builtin.systemd_service:
    name: porelo-matrix-gate.socket
    state: restarted
    daemon_reload: true

- name: Reload systemd for the Matrix gate
  ansible.builtin.systemd_service:
    daemon_reload: true
