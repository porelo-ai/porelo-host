---
argument_specs:
  main:
    short_description: Measure a disposable local host, refusing people and existing homeserver data.
    options:
      measure_out:
        type: path
        required: true
        description: Absolute path of a new result file on the measured machine.
      measure_given:
        type: dict
        required: true
        description: Provider and offer labels given by the person, never credentials or a host name.
        options:
          provider:
            type: str
            required: true
            description: Provider label, or local for local hardware.
          offer:
            type: str
            required: true
            description: Offer or machine class label, without an account or host identity.
      measure_distribution:
        type: str
        choices: [releases, snapshots]
        default: releases
        description: Which of Porelo's published distributions the run installs from; it stands in the result.
      measure_packages:
        type: path
        default: ""
        description: >-
          Root's directory of handed-over packages as build/stage-packages.sh stages them, each checked against its
          SHA256SUMS and installed in place of the channel's; empty installs from the distribution.
      measure_fresh:
        type: bool
        default: false
        description: The person's word that the machine is fresh and disposable; required to change it.
      measure_steps:
        type: list
        elements: str
        default: [idle]
        choices: [idle, task, agent, job]
        description: >-
          Idle measures four shapes; task measures one throwaway developer's stub tasks in the room's shape; job
          measures a Maven build in parallel forge jobs in the forge's shape; agent is recorded as not measured.
      measure_tasks:
        type: int
        default: 2
        description: How many stub tasks the task step starts in each sample, 1 to 12.
      measure_raise:
        type: bool
        default: false
        description: >-
          With the task step, also raise developers 1, 2, 4 and on, five stub tasks each, on one more up, until a start
          fails or the memory's or the CPU's pressure stays above its line; the count held is kept.
