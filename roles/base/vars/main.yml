---
# The groups that let an account open /dev/kvm and libvirt's socket.
__base_account_groups:
  - kvm
  - libvirt
# The file the CPU check reads its flags from; the unit tests name others in its place.
__base_cpuinfo: /proc/cpuinfo

__base_public: "{{ __base_routes.results | map(attribute='stdout') | map('from_json') | flatten
  | map(attribute='dev') | unique | list }}"
