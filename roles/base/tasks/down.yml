---
# Last at down: the person's key taken off the account, so nothing of theirs is left on a host that is given back. A
# failed up may have stopped before the account was there; down then has nothing of it to take.
- name: down | Read the account, if up got as far as Porelo's setup script
  ansible.builtin.getent:
    database: passwd
    key: "{{ base_account }}"
    fail_key: false

- name: down | Take the person's key off the account
  ansible.builtin.lineinfile:
    path: "{{ ansible_facts['getent_passwd'][base_account][4] }}/.ssh/authorized_keys"
    line: "{{ base_authorized_key }}"
    state: absent
  when:
    - base_authorized_key | length > 0
    - ansible_facts['getent_passwd'][base_account] is not none
