---
# Whether this host gets KVM and libvirt, for a VM pool or a job that makes a VM; only then is its CPU asked for them.
base_kvm: "{{ porelo_host_kvm | default(false) }}"

# The person's public ssh key for tasks_from: down; empty by default. A public key is no secret.
base_authorized_key: ""

# Packages every host gets, beside podman and any KVM.
base_packages:
  - acl
  - ca-certificates
  - curl
  - git
  - nftables
  - openssh-server

# Where tasks_from: host reads the host's summary fields and writes the JSON file at the end of up.
base_ssh_host_key_path: /etc/ssh/ssh_host_ed25519_key.pub
base_matrix_name: "{{ matrix_name | default('matrix.' ~ porelo_host_name ~ '.porelo.internal') }}"
base_host_path: /etc/porelo-host/host.json

# Setup pins the host admin's key here before up enables the root-owned SSH key source.
base_host_admin_key_file: /root/.ssh/authorized_keys
