---
argument_specs:
  main:
    short_description: The host's packages, KVM and podman, machine-wide.
    description:
      - Stops before it installs anything on a CPU without virtualization.
    options:
      base_packages:
        type: list
        elements: str
        description: Packages every host gets beside KVM's and podman's.
        default: [acl, ca-certificates, curl, git, nftables, openssh-server]
      base_host_admin_key_file:
        type: path
        default: /root/.ssh/authorized_keys
        description: The root-owned pinned host admin key file seeded before SSH reloads.
  account:
    short_description: Porelo's account in KVM's and libvirt's groups.
    description:
      - Run after Porelo's setup script made the account; checks its linger, subordinate ids and delegated controllers.
    options:
      base_account:
        type: str
        required: true
        description: The account Porelo's tasks run as.
      base_authorized_key:
        type: str
        default: ""
        description: The person's public ssh key, let in as the account.
  controllers:
    short_description: Refuse an account without the delegated controllers its container bounds need.
    options:
      base_account:
        type: str
        required: true
        description: An existing account whose user manager must delegate cpu, memory and pids.
  host:
    short_description: Write /etc/porelo-host/host.json and print the host's summary line at the end of up.
    options:
      base_ssh_host_key_path:
        type: path
        default: /etc/ssh/ssh_host_ed25519_key.pub
        description: The host's ed25519 public ssh key file, whose first two fields are reported.
      base_matrix_name:
        type: str
        description: The Matrix homeserver's DNS name, matrix.<porelo_host_name>.porelo.internal by default.
      base_host_path:
        type: path
        default: /etc/porelo-host/host.json
        description: Where the host's summary JSON is written, root's with mode 0644.
  down:
    short_description: Remove legacy VPN files and the host summary, with optional account key cleanup.
    options:
      base_account:
        type: str
        description: The account Porelo's tasks run as.
      base_authorized_key:
        type: str
        default: ""
        description: The person's public ssh key, as up added it.
  ssh:
    short_description: Seed host admin access and restrict SSH forwarding.
    options:
      base_host_admin_key_file:
        type: path
        default: /root/.ssh/authorized_keys
        description: The root-owned pinned host admin key file seeded before SSH reloads.
