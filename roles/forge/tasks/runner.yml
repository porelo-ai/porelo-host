---
# Forgejo's runner as a quadlet unit of its own account, its jobs in containers of that account's podman, which alone
# may open KVM; registered once, its token piped from Forgejo's command line straight into the runner's registration,
# never an argument, a variable or an output.
- name: runner | Let the runner's account open KVM, and no other account of the forge
  ansible.builtin.user:
    name: "{{ forge_runner_account }}"
    groups: [kvm]
    append: true

- name: runner | Keep the runner account's id and home
  ansible.builtin.set_fact:
    __forge_runner_uid: "{{ __forge_users.results[1].uid }}"
    __forge_runner_home: "{{ __forge_users.results[1].home }}"

- name: runner | Read whether the pinned JDK's directory is there
  ansible.builtin.stat:
    path: "{{ __forge_runner_jdk_dir }}"
  register: __forge_runner_jdk_before

- name: runner | Read whether the pinned JDK holds Java
  ansible.builtin.stat:
    path: "{{ __forge_runner_jdk_dir }}/bin/java"
  register: __forge_runner_java_before

- name: runner | Refuse an existing JDK directory without Java
  ansible.builtin.assert:
    that:
      - not __forge_runner_jdk_before.stat.exists or
        (__forge_runner_jdk_before.stat.isdir | default(false) and
        __forge_runner_java_before.stat.isreg | default(false))
    fail_msg: >-
      asked for no {{ __forge_runner_jdk_dir }} or a directory holding bin/java;
      got directory {{ __forge_runner_jdk_before.stat }} and Java {{ __forge_runner_java_before.stat }}

- name: runner | Make the host's directory for the pinned JDK
  ansible.builtin.file:
    path: /opt/porelo-host
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: runner | Fetch the JDK once and check its pinned digest before unpacking
  ansible.builtin.get_url:
    url: "{{ __forge_runner_jdk.url }}"
    dest: "{{ __forge_runner_jdk_dir }}.tar.gz"
    checksum: "sha256:{{ __forge_runner_jdk.sha256 }}"
    owner: root
    group: root
    mode: "0644"
  when: not __forge_runner_jdk_before.stat.exists

- name: runner | Make the pinned JDK's directory
  ansible.builtin.file:
    path: "{{ __forge_runner_jdk_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: runner | Unpack the checked JDK into its versioned directory
  ansible.builtin.unarchive:
    src: "{{ __forge_runner_jdk_dir }}.tar.gz"
    dest: "{{ __forge_runner_jdk_dir }}"
    remote_src: true
    extra_opts: [--strip-components=1]
    owner: root
    group: root
    mode: "u=rwX,go=rX"
  when: not __forge_runner_jdk_before.stat.exists

- name: runner | Remove the JDK's archive once it is unpacked
  ansible.builtin.file:
    path: "{{ __forge_runner_jdk_dir }}.tar.gz"
    state: absent

- name: runner | Keep the JDK readable by every account and writable by root alone
  ansible.builtin.file:
    path: "{{ __forge_runner_jdk_dir }}"
    state: directory
    recurse: true
    owner: root
    group: root
    mode: "u=rwX,go=rX"

- name: runner | Read Java after unpacking the pinned JDK
  ansible.builtin.stat:
    path: "{{ __forge_runner_jdk_dir }}/bin/java"
  register: __forge_runner_java

- name: runner | Refuse a pinned JDK without an executable Java
  ansible.builtin.assert:
    that:
      - __forge_runner_java.stat.isreg | default(false)
      - __forge_runner_java.stat.executable | default(false)
    fail_msg: >-
      asked for an executable {{ __forge_runner_jdk_dir }}/bin/java after unpacking the pinned JDK;
      got {{ __forge_runner_java.stat }}

- name: runner | Make the runner's directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ forge_runner_account }}"
    group: "{{ forge_runner_account }}"
    mode: "{{ item.mode }}"
  loop:
    - {path: "{{ __forge_runner_home }}/.config", mode: "0755"}
    - {path: "{{ __forge_runner_home }}/.config/containers", mode: "0755"}
    - {path: "{{ __forge_runner_home }}/.config/containers/systemd", mode: "0755"}
    - {path: "{{ __forge_runner_home }}/runner", mode: "0700"}
  loop_control:
    label: "{{ item.path }}"

- name: runner | Remove the old forge trust bundles
  ansible.builtin.file:
    path: "{{ __forge_runner_home }}/tls"
    state: absent

# Made before the runner's configuration mounts it into jobs, since vm_pool runs after the forge.
- name: runner | Make the VM pool's directory before the runner mounts it
  ansible.builtin.file:
    path: /etc/porelo-host/pool
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: porelo_host_vm_pool is defined

- name: runner | Check that the runner's jobs and the VM pool fit within half the host
  ansible.builtin.include_tasks: "{{ role_path }}/tasks/capacity.yml"

- name: runner | Give jobs a name table of the forge that no job can change
  ansible.builtin.copy:
    content: |
      127.0.0.1 localhost {{ forge_name }}
      ::1 localhost
    dest: "{{ __forge_runner_job_hosts }}"
    owner: root
    group: root
    mode: "0644"

- name: runner | Write the runner's configuration
  ansible.builtin.template:
    src: "{{ role_path }}/templates/runner-config.yml.j2"
    dest: "{{ __forge_runner_home }}/runner/config.yml"
    owner: "{{ forge_runner_account }}"
    group: "{{ forge_runner_account }}"
    mode: "0600"
  notify: Restart Forgejo's runner

- name: runner | Run the runner account's podman socket, for its jobs' containers
  ansible.builtin.systemd_service:
    name: podman.socket
    scope: user
    state: started
    enabled: true
  become: true
  become_user: "{{ forge_runner_account }}"
  environment: "{{ __forge_runner_environment }}"

- name: runner | Ask podman whether the runner's image is there
  ansible.builtin.command:
    argv: [podman, image, exists, "{{ __forge_runner_image }}"]
  become: true
  become_user: "{{ forge_runner_account }}"
  environment: "{{ __forge_runner_environment }}"
  register: __forge_runner_image_there
  changed_when: false
  failed_when: __forge_runner_image_there.rc not in [0, 1]
  check_mode: false

- name: runner | Pull the runner's image by its digest
  ansible.builtin.command:
    argv: [podman, pull, --quiet, "{{ __forge_runner_image }}"]
  become: true
  become_user: "{{ forge_runner_account }}"
  environment: "{{ __forge_runner_environment }}"
  when: __forge_runner_image_there.rc == 1
  changed_when: true

- name: runner | Ask podman whether the runner's proxy image is there
  ansible.builtin.command:
    argv: [podman, image, exists, "{{ __forge_runner_proxy_image }}"]
  become: true
  become_user: "{{ forge_runner_account }}"
  environment: "{{ __forge_runner_environment }}"
  register: __forge_runner_proxy_image_there
  changed_when: false
  failed_when: __forge_runner_proxy_image_there.rc not in [0, 1]
  check_mode: false

- name: runner | Pull the runner's proxy image by its digest
  ansible.builtin.command:
    argv: [podman, pull, --quiet, "{{ __forge_runner_proxy_image }}"]
  become: true
  become_user: "{{ forge_runner_account }}"
  environment: "{{ __forge_runner_environment }}"
  when: __forge_runner_proxy_image_there.rc == 1
  changed_when: true

- name: runner | Write the runner's proxy quadlet unit
  ansible.builtin.template:
    src: "{{ role_path }}/templates/forgejo-runner-proxy.container.j2"
    dest: "{{ __forge_runner_home }}/.config/containers/systemd/forgejo-runner-proxy.container"
    owner: "{{ forge_runner_account }}"
    group: "{{ forge_runner_account }}"
    mode: "0644"
  notify: Restart Forgejo's runner proxy

- name: runner | Run the proxy before registration joins its network namespace
  ansible.builtin.systemd_service:
    name: forgejo-runner-proxy.service
    scope: user
    state: "{{ 'restarted' if __forge_gate_units.changed else 'started' }}"
    daemon_reload: true
  become: true
  become_user: "{{ forge_runner_account }}"
  environment: "{{ __forge_runner_environment }}"

- name: runner | Register the runner once, its token piped from Forgejo into the registration
  ansible.builtin.shell:
    cmd: |
      set -euo pipefail
      cd /
      {
          printf '%s\n' http://127.0.0.1:{{ forge_http_port }}
          runuser -u {{ forge_account }} -- env XDG_RUNTIME_DIR=/run/user/{{ __forge_uid }} \
              DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/{{ __forge_uid }}/bus \
              podman exec forgejo forgejo actions generate-runner-token
          printf '%s\n' {{ forge_runner_name | quote }}
      } | runuser -u {{ forge_runner_account }} -- env XDG_RUNTIME_DIR=/run/user/{{ __forge_runner_uid }} \
              DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/{{ __forge_runner_uid }}/bus \
          podman run --rm -i --userns keep-id:uid=1000,gid=1000 \
          --network container:forgejo-runner-proxy \
          -v {{ __forge_runner_home }}/runner:/data {{ __forge_runner_image }} \
          /bin/forgejo-runner register --config /data/config.yml > /dev/null
    creates: "{{ __forge_runner_home }}/runner/.runner"
    executable: /bin/bash
  no_log: true

- name: runner | Move an existing registration to the proxy without replacing its token
  ansible.builtin.replace:
    path: "{{ __forge_runner_home }}/runner/.runner"
    regexp: '("address"\s*:\s*")[^"]*(")'
    replace: '\g<1>http://127.0.0.1:{{ forge_http_port }}\g<2>'
  no_log: true
  notify: Restart Forgejo's runner

- name: runner | Write the runner's quadlet unit
  ansible.builtin.template:
    src: "{{ role_path }}/templates/forgejo-runner.container.j2"
    dest: "{{ __forge_runner_home }}/.config/containers/systemd/forgejo-runner.container"
    owner: "{{ forge_runner_account }}"
    group: "{{ forge_runner_account }}"
    mode: "0644"
  notify: Restart Forgejo's runner

- name: runner | Run the runner
  ansible.builtin.systemd_service:
    name: forgejo-runner.service
    scope: user
    state: started
    daemon_reload: true
  become: true
  become_user: "{{ forge_runner_account }}"
  environment: "{{ __forge_runner_environment }}"

# Configured labels override those kept in .runner and are declared when the daemon starts.
- name: runner | Apply changed labels and configuration before the runner is used
  ansible.builtin.meta: flush_handlers
