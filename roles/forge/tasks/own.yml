---
# bring's and join's forge side, in the person's own account after porelo's own side: the host's forge as forge.conf
# names it, the person's own forge token out of their vault onto their runtime directory for this play alone, and the
# push config. A bring also gives the project's organization its repositories, main's protection, the teams and the
# Actions variables; a join changes nothing on the forge.
- name: own | Read the host's forge as up named it
  ansible.builtin.slurp:
    src: /etc/porelo-host/forge.conf
  register: __forge_own_conf

# porelo's own side checked the machine file in the setup directory; its forge section is the interface's, for a bring.
- name: own | Read the machine file's forge section
  ansible.builtin.slurp:
    src: "{{ porelo_machine_file }}"
  register: __forge_own_machine

- name: own | Stop where the host runs no forge
  ansible.builtin.assert:
    that:
      - __forge_own_settings.account | default('') != ''
      - __forge_own_settings.address | default('') is match('^10\.73\.[0-9]{1,3}\.1\Z')
      - __forge_own_settings.name | default('') is match('^forge\.[a-z0-9-]+\.porelo\.internal\Z')
      - __forge_own_settings.port | default('') is match('^[0-9]{1,5}\Z')
    fail_msg: >-
      /etc/porelo-host/forge.conf names no running forge; the host admin runs up with the forge on before a
      {{ porelo_own_act }}
    quiet: true

- name: own | Name the forge, the project's organization and its repositories for the forge's tasks
  ansible.builtin.set_fact:
    forge_address: "{{ __forge_own_settings.address }}"
    forge_http_port: "{{ __forge_own_settings.port | int }}"
    forge_name: "{{ __forge_own_settings.name }}"
    forge_owner: "{{ porelo_project }}"
    forge_repositories: "{{ (__forge_own_machine.content | b64decode | from_yaml).forge.repositories
      if porelo_own_act == 'bring' else [] }}"
    __forge_token: "{{ __forge_own_dir }}/forge.token"

- name: own | Act on the forge with the person's own token, and drop it from the runtime directory after
  block:
    # Only fixed words leave the shell; the token goes from the vault's answer into the file and nowhere else.
    - name: own | Take the person's forge token out of their vault into their runtime directory
      ansible.builtin.shell:
        cmd: |
          set -euo pipefail
          umask 077
          mkdir -p -- {{ __forge_own_dir | quote }}
          new=$(mktemp {{ __forge_own_dir | quote }}/forge.token.XXXXXX)
          trap 'rm -f "$new"' EXIT
          if ! printf 'protocol=https\nhost=%s\n\n' {{ forge_name | quote }} \
              | porelo vault credential --entry={{ (forge_name ~ '.person') | quote }} get 2> /dev/null \
              | sed -n 's/^password=//p' > "$new"; then
              echo missing; exit 0
          fi
          [ -s "$new" ] || { echo missing; exit 0; }
          mv -- "$new" {{ __forge_token | quote }}
          echo given
        executable: /bin/bash
      environment: "{{ __forge_own_environment }}"
      register: __forge_own_token
      changed_when: false
      no_log: true

    # The person's step: the message is the stop's needs as JSON, from which the interface opens the stop.
    - name: own | Wait for the stop that gives the person's forge token while the vault holds none
      ansible.builtin.fail:
        msg: "{{ ['identities'] | to_json }}"
      when: __forge_own_token.stdout != 'given'
      tags: [porelo_host_waiting]

    - name: own | Ask Forgejo whether the person owns the project's organization or belongs to it
      ansible.builtin.shell:
        cmd: |
          set -euo pipefail
          answer=$(mktemp) && trap 'rm -f "$answer"' EXIT
          code=$(curl -sS --max-time 10 --cacert {{ __forge_ca_dir }}/ca.pem \
              -H @<(sed 's/^/Authorization: token /' {{ __forge_token | quote }}) -o "$answer" -w '%{http_code}' \
              "https://{{ forge_address }}:{{ forge_http_port }}/api/v1/users/{{ porelo_account }}/orgs/{{
              forge_owner }}/permissions") || { echo failed; exit 0; }
          [ "$code" = 200 ] || { echo "http-$code"; exit 0; }
          python3 -I -c 'import json,sys; p=json.load(open(sys.argv[1]))
          print("owner" if p.get("is_owner") else ("member" if p.get("can_read") else "none"))' "$answer"
        executable: /bin/bash
      register: __forge_own_role
      changed_when: false
      check_mode: false
      no_log: true

    - name: own | Stop unless the person owns the organization for a bring, or belongs to it for a join
      ansible.builtin.assert:
        that: __forge_own_role.stdout in (['owner'] if porelo_own_act == 'bring' else ['owner', 'member'])
        fail_msg: >-
          {{ porelo_account }} is {{ __forge_own_role.stdout | regex_search('^[a-z0-9-]{1,40}$')
          | default('of no known standing', true) }} in the organization {{ forge_owner }};
          {{ 'the host admin registers the project with porelo-host-project add ' ~ forge_owner ~ ' '
          ~ porelo_account ~ ' first' if porelo_own_act == 'bring'
          else 'the project admin brings it and sync makes the person a developer first' }}
        quiet: true

    - name: own | Give the organization its repositories, the teams, main's protection and the Actions variables
      when: porelo_own_act == 'bring'
      block:
        - name: own | Make the organization and wait for the person's migration of what it lacks
          ansible.builtin.include_tasks: "{{ role_path }}/tasks/repositories.yml"

        # Before main's protection, which names the developers team as one allowed to approve and merge.
        - name: own | Make the project's teams
          ansible.builtin.include_tasks: "{{ role_path }}/tasks/teams.yml"

        - name: own | Protect each repository's main
          ansible.builtin.include_tasks: "{{ role_path }}/tasks/protection.yml"

        - name: own | Set the organization's Actions variables and placeholder secrets
          ansible.builtin.include_tasks: "{{ role_path }}/tasks/variables.yml"

    - name: own | Write the person's push config from the repositories the forge holds
      ansible.builtin.include_tasks: "{{ role_path }}/tasks/own_push.yml"
  always:
    - name: own | Remove the person's forge token from the runtime directory
      ansible.builtin.file:
        path: "{{ __forge_token }}"
        state: absent
