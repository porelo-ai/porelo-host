---
# Each repository migrated once from the central forge into the owner's organization, as an ordinary repository the
# tasks' gates push into, with a push mirror back to its address that runs only when started through the API. The
# person's token for the central forge is read from its file by the shell; it reaches Forgejo in a request body on a
# pipe, never a variable, a fact, an argument or an output.
- name: repositories | Stop on a repository the contract does not allow
  ansible.builtin.assert:
    that:
      - forge_repositories | map(attribute='name') | select('match', '^[A-Za-z0-9._-]{1,100}$') | list | length
        == forge_repositories | length
      - forge_repositories | map(attribute='name') | unique | list | length == forge_repositories | length
      - forge_owner is match('^[A-Za-z0-9._-]{1,40}$')
      - forge_repositories | map(attribute='url') | select('match', '^https://[^/@:]+(:[0-9]+)?/') | list | length
        == forge_repositories | length
    fail_msg: >-
      each repository needs a unique name of letters, digits, '.', '_' or '-' and an https:// address with no user
      in it: {{ forge_repositories }}
    quiet: true

- name: repositories | Read whether the person's token for the central forge is on the drive
  ansible.builtin.stat:
    path: "{{ forge_central_token_path }}"
  register: __forge_central_token

- name: repositories | Stop while the person's token for the central forge is missing
  ansible.builtin.assert:
    that: __forge_central_token.stat.exists and __forge_central_token.stat.size > 0
    fail_msg: >-
      the person's token for the central forge is not at {{ forge_central_token_path }}; put it there
      (porelo-host/forge-central.token in the person's tresor) and run up again
    quiet: true

- name: repositories | Make the owner's organization, unless Forgejo has it
  ansible.builtin.shell:
    cmd: |
      set -euo pipefail
      api() { curl -sS --cacert {{ __forge_ca_dir }}/ca.pem -H @<(printf 'Authorization: token %s\n' \
          "$(cat {{ __forge_token }})") -H 'Content-Type: application/json' "$@"; }
      base=https://{{ forge_address }}:{{ forge_http_port }}/api/v1
      code=$(api -o /dev/null -w '%{http_code}' "$base/orgs/{{ forge_owner }}")
      [ "$code" = 200 ] && { echo unchanged; exit 0; }
      [ "$code" = 404 ] || { echo "Forgejo answered $code for the organization {{ forge_owner }}" >&2; exit 1; }
      code=$(api -o /dev/null -w '%{http_code}' -X POST "$base/orgs" \
          -d '{"username": "{{ forge_owner }}", "visibility": "private"}')
      [ "$code" = 201 ] || { echo "Forgejo answered $code making the organization {{ forge_owner }}" >&2; exit 1; }
      echo made
    executable: /bin/bash
  register: __forge_org
  changed_when: __forge_org.stdout == 'made'

- name: repositories | Migrate each repository once, with its push mirror back to the central forge
  ansible.builtin.shell:
    cmd: |
      set -euo pipefail
      api() { curl -sS --cacert {{ __forge_ca_dir }}/ca.pem -H @<(printf 'Authorization: token %s\n' \
          "$(cat {{ __forge_token }})") -H 'Content-Type: application/json' "$@"; }
      base=https://{{ forge_address }}:{{ forge_http_port }}/api/v1
      repo="$base/repos/{{ forge_owner }}/{{ item.name }}"
      body() { python3 -I -c 'import json,sys; t=open(sys.argv[1]).read().strip(); d=json.loads(sys.argv[2]); \
          d[sys.argv[3]]=t; print(json.dumps(d))' {{ forge_central_token_path | quote }} "$1" "$2"; }
      answer=$(mktemp) && trap 'rm -f "$answer"' EXIT
      # Forgejo's own message on a refusal; its answers never repeat a request's body, so no token is in them.
      said() { python3 -I -c 'import json,sys; print(json.load(open(sys.argv[1])).get("message", ""))' \
          "$answer" 2>/dev/null || true; }
      changed=
      code=$(api -o /dev/null -w '%{http_code}' "$repo")
      if [ "$code" = 404 ]; then
          code=$(body '{"clone_addr": {{ item.url | to_json }}, "repo_name": {{ item.name | to_json }},
              "repo_owner": "{{ forge_owner }}", "service": "git", "mirror": false, "private": true}' auth_token \
              | api -o "$answer" -w '%{http_code}' -X POST "$base/repos/migrate" --data @-)
          [ "$code" = 201 ] || { echo "Forgejo answered $code migrating {{ item.name }}: $(said)" >&2; exit 1; }
          changed=yes
      elif [ "$code" != 200 ]; then
          echo "Forgejo answered $code for {{ item.name }}" >&2; exit 1
      fi
      mirrors=$(api "$repo/push_mirrors")
      if ! printf '%s' "$mirrors" | python3 -I -c 'import json,sys; sys.exit(0 if any(m["remote_address"] == \
          sys.argv[1] for m in json.load(sys.stdin)) else 1)' {{ item.url | quote }}; then
          code=$(body '{"remote_address": {{ item.url | to_json }}, "remote_username": "porelo-host",
              "interval": "0", "sync_on_commit": false}' remote_password \
              | api -o "$answer" -w '%{http_code}' -X POST "$repo/push_mirrors" --data @-)
          [ "$code" = 200 ] || [ "$code" = 201 ] \
              || { echo "Forgejo answered $code adding the push mirror of {{ item.name }}: $(said)" >&2; exit 1; }
          changed=yes
      fi
      echo "${changed:-unchanged}"
    executable: /bin/bash
  loop: "{{ forge_repositories }}"
  loop_control:
    label: "{{ item.name }}"
  register: __forge_migrated
  changed_when: __forge_migrated.stdout == 'yes'
  failed_when: false

# Collect failures to stop once with every repository's answer named; Ansible already runs every loop item.
- name: repositories | Stop on a repository Forgejo would not take, with its answer
  ansible.builtin.assert:
    that: __forge_migrated.results | rejectattr('rc', 'equalto', 0) | list | length == 0
    fail_msg: "{{ __forge_migrated.results | rejectattr('rc', 'equalto', 0) | map(attribute='stderr') | join('; ') }}"
    quiet: true
