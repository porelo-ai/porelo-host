---
# Forgejo as a quadlet unit of the forge's account. The image is pulled before the unit starts, so its start is not
# timed by a download; only the forge account can open the upstream socket.
- name: service | Remove the forge's old HTTPS listener
  ansible.builtin.include_tasks: "{{ role_path }}/tasks/legacy.yml"

- name: service | Make the account's directories for quadlet units
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ forge_account }}"
    group: "{{ forge_account }}"
    mode: "0755"
  loop:
    - "{{ __forge_home }}/.config"
    - "{{ __forge_home }}/.config/containers"
    - "{{ __forge_home }}/.config/containers/systemd"

# Only where archives are named: a host without them pulls as before and gets no new package.
- name: service | Stop on forge_image_archives that is not an absolute directory
  ansible.builtin.assert:
    that: forge_image_archives is match('^/')
    fail_msg: "forge_image_archives must be an absolute directory on the host, not {{ forge_image_archives }}"
    quiet: true
  when: forge_image_archives | length > 0

- name: service | Install skopeo, which loads an image from its archive by its digest
  ansible.builtin.apt:
    name: skopeo
    state: present
  when: forge_image_archives | length > 0

- name: service | Load Forgejo's image from its archive where forge_image_archives holds it
  ansible.builtin.include_tasks: "{{ role_path }}/tasks/image.yml"
  vars:
    __forge_archive_image: "{{ __forge_image }}"
    __forge_archive_account: "{{ forge_account }}"
    __forge_archive_environment: "{{ __forge_environment }}"
  when: forge_image_archives | length > 0

- name: service | Ask podman whether Forgejo's image is there
  ansible.builtin.command:
    argv: [podman, image, exists, "{{ __forge_image }}"]
  become: true
  become_user: "{{ forge_account }}"
  environment: "{{ __forge_environment }}"
  register: __forge_image_there
  changed_when: false
  failed_when: __forge_image_there.rc not in [0, 1]
  check_mode: false

- name: service | Pull Forgejo's image by its digest
  ansible.builtin.command:
    argv: [podman, pull, --quiet, "{{ __forge_image }}"]
  become: true
  become_user: "{{ forge_account }}"
  environment: "{{ __forge_environment }}"
  when: __forge_image_there.rc == 1
  changed_when: true

- name: service | Make the directory of the gate and of the push hook
  ansible.builtin.file:
    path: /usr/local/libexec/porelo
    state: directory
    owner: root
    group: root
    mode: "0755"

# Forgejo's container mounts the file itself, so a new hook reaches it only when the container starts again.
- name: service | Install the hook that has the host judge each push
  ansible.builtin.copy:
    src: "{{ role_path }}/files/porelo-forge-pre-receive"
    dest: /usr/local/libexec/porelo/pre-receive
    owner: root
    group: root
    mode: "0755"
  notify: Restart Forgejo

- name: service | Write the push judge's socket units
  ansible.builtin.template:
    src: "{{ role_path }}/templates/{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop: [porelo-host-verify.socket, porelo-host-verify@.service]
  notify: Restart the push judge's socket

# Forgejo's container mounts the socket's directory, so the socket listens before the container starts.
- name: service | Listen for the forge's pushes before Forgejo starts
  ansible.builtin.systemd_service:
    name: porelo-host-verify.socket
    enabled: true
    state: started
    daemon_reload: true

- name: service | Write Forgejo's quadlet unit
  ansible.builtin.template:
    src: "{{ role_path }}/templates/forgejo.container.j2"
    dest: "{{ __forge_home }}/.config/containers/systemd/forgejo.container"
    owner: "{{ forge_account }}"
    group: "{{ forge_account }}"
    mode: "0644"
  notify: Restart Forgejo

# A quadlet unit is generated, so it cannot be enabled; its [Install] section starts it with the account's services.
- name: service | Run Forgejo
  ansible.builtin.systemd_service:
    name: forgejo.service
    scope: user
    state: started
    daemon_reload: true
  become: true
  become_user: "{{ forge_account }}"
  environment: "{{ __forge_environment }}"

- name: service | Restart Forgejo now if its unit changed
  ansible.builtin.meta: flush_handlers

- name: service | Wait until Forgejo answers on its private socket
  ansible.builtin.command:
    argv: [curl, -fsS, --max-time, "5", --unix-socket, "{{ __forge_socket }}", "http://localhost/api/v1/version"]
  register: __forge_version
  changed_when: false
  until: __forge_version.rc == 0
  retries: 30
  delay: 2

- name: service | Make the people's socket group before admission
  ansible.builtin.group:
    name: porelo-people
    state: present


- name: service | Write the system socket and gate units
  ansible.builtin.template:
    src: "{{ role_path }}/templates/{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - porelo-forge-web.socket
    - porelo-forge-web@.service
    - porelo-forge-git.socket
    - porelo-forge-git@.service
    - porelo-forge-runner.socket
    - porelo-forge-runner@.service
  register: __forge_gate_units
  notify: Restart the forge's gate sockets

- name: service | Enable and start the gate sockets after Forgejo answers
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    state: started
    daemon_reload: true
  loop: [porelo-forge-web.socket, porelo-forge-git.socket, porelo-forge-runner.socket]

- name: service | Apply changed gate units before the forge is used
  ansible.builtin.meta: flush_handlers

# A socket systemd stopped leaves the forward to it answering nothing; up says so here rather than the person's browser.
- name: service | Check that the gate sockets listen
  ansible.builtin.command:
    argv:
      - /bin/sh
      - -ec
      - >-
        for unit in porelo-forge-web.socket porelo-forge-git.socket porelo-forge-runner.socket
        porelo-host-verify.socket;
        do systemctl is-active --quiet "$unit" || { echo "$unit is not active" >&2; exit 1; }; done;
        for path in /run/porelo-forge/web.sock /run/porelo-forge/git.sock /run/porelo-forge/runner.sock
        /run/porelo-host/verify/verify.sock;
        do test -S "$path" || { echo "$path is no socket" >&2; exit 1; }; done
  changed_when: false
