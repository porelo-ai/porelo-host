---
- name: tls | Resolve the forge's name through the host's loopback HTTPS socket
  ansible.builtin.blockinfile:
    path: /etc/hosts
    marker: "# {mark} porelo-host forge name"
    block: "127.0.0.1 {{ forge_name }}"

# The CA is the person's, made once on their desktop, and its key never reaches the host; the stop wrote its
# certificate as ca.pem and the forge's certificate beside the key request made. Moved, never copied, into the forge
# account's tls/, so one copy of the key is on the host.
- name: tls | Make the forge's certificate directory
  ansible.builtin.file:
    path: "{{ __forge_home }}/tls"
    state: directory
    owner: "{{ forge_account }}"
    group: "{{ forge_account }}"
    mode: "0700"

- name: tls | Move a signed certificate and its key from where the stop left them, or keep the forge's own
  ansible.builtin.shell:
    cmd: |
      set -euo pipefail
      # A certificate holds where it ends in more than 30 days, verifies under the person's CA, names exactly the
      # forge's address and name, and is for its key; each public key read on its own, so none compares on nothing.
      holds() {
          [ -f "$1" ] && [ -f "$2" ] && [ -f "$wait/ca.pem" ] && [ ! -L "$1" ] && [ ! -L "$2" ] || return 1
          [ "$(stat -c '%a' -- "$2")" = 600 ] || return 1
          openssl x509 -checkend 2592000 -noout -in "$1" > /dev/null || return 1
          openssl verify -CAfile "$wait/ca.pem" "$1" > /dev/null 2>&1 || return 1
          names=$(openssl x509 -noout -ext subjectAltName -in "$1" | tail -n +2 | tr ',' '\n' | sed 's/^ *//; s/ *$//')
          grep -qxF 'IP Address:{{ forge_address }}' <<< "$names" && grep -qxF 'DNS:{{ forge_name }}' <<< "$names" \
              || return 1
          cert_pub=$(openssl x509 -noout -pubkey -in "$1") && key_pub=$(openssl pkey -pubout -in "$2") || return 1
          [ -n "$cert_pub" ] && [ "$cert_pub" = "$key_pub" ]
      }
      cd /
      wait={{ __forge_ca_dir }}
      tls={{ __forge_home }}/tls
      # Written by the forge's account itself into its own directory, which root never writes into, each beside its name
      # and moved there; the waiting copies go only once both are in place, so an interrupted run keeps them.
      put() {
          runuser -u {{ forge_account }} -- sh -c 'set -e; umask 077; t=$(mktemp "$1/.forge.XXXXXX"); cat > "$t";
              chmod "$2" "$t"; mv -fT "$t" "$1/$3"' put "$tls" "$2" "$3" < "$1"
      }
      if holds "$wait/forge.pem" "$wait/forge.key"; then
          put "$wait/forge.key" 0600 forge.key
          put "$wait/forge.pem" 0644 forge.pem
          rm -f "$wait/forge.key" "$wait/forge.pem" "$wait/forge.csr"
          echo moved; exit 0
      fi
      if holds "$tls/forge.pem" "$tls/forge.key"; then
          echo unchanged; exit 0
      fi
      echo missing
    executable: /bin/bash
  register: __forge_certificate
  changed_when: __forge_certificate.stdout == 'moved'
  notify: Restart Forgejo

- name: tls | Stop where no certificate signed by the person's CA holds for the forge
  ansible.builtin.assert:
    that: __forge_certificate.stdout != 'missing'
    fail_msg: >-
      forge-certificate: no certificate for {{ forge_name }} signed by the CA in {{ __forge_ca_dir }}/ca.pem holds;
      give it with porelo-host-stop --stdin forge-certificate and run up again
    quiet: true

# One bundle, the system's CAs and the host's, which Forgejo's Go and its git both read whole; a directory of
# certificates would need OpenSSL's hashed names for git.
- name: tls | Put the system's CAs and the host's into one bundle the forge trusts
  ansible.builtin.copy:
    content: |
      {{ lookup('ansible.builtin.file', '/etc/ssl/certs/ca-certificates.crt') }}
      {{ lookup('ansible.builtin.file', __forge_ca_dir ~ '/ca.pem') }}
    dest: "{{ __forge_home }}/tls/ca-bundle.pem"
    owner: "{{ forge_account }}"
    group: "{{ forge_account }}"
    mode: "0644"
  notify: Restart Forgejo
