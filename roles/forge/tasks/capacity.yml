---
- name: capacity | Read the host's processors and memory before the runner's capacity is written
  ansible.builtin.slurp:
    src: "{{ item }}"
  loop: ["{{ __forge_cpuinfo }}", "{{ __forge_meminfo }}"]
  register: __forge_capacity_host
  check_mode: false

# One budget with the VM pool: what the jobs may take at once and the pool's VMs together stay within half the host,
# so Forgejo, the runner and Porelo's own tasks keep the other half. The pool is read as vm_pool reads it; vm_pool runs
# after the forge, so its VM size default, 1536 MiB, is repeated here.
- name: capacity | Fit unset job bounds beside the VM pool within half the host
  vars:
    __forge_host_cpus: >-
      {{ __forge_capacity_host.results[0].content | b64decode | regex_findall('(?m)^processor\s*:') | length }}
    __forge_host_kib: >-
      {{ (__forge_capacity_host.results[1].content | b64decode | regex_findall('(?m)^MemTotal:\s+([0-9]+) kB$')
          + ['0']) | first }}
    __forge_job_kib: "{{ (__forge_fit.stdout | from_json).job_kib if __forge_fit is defined else 0 }}"
    __forge_pool_kib: >-
      {{ (vm_pool_systems | default((porelo_host_vm_pool | default({})).systems | default([])) | length)
         * (vm_pool_accounts | default((porelo_host_vm_pool | default({})).accounts | default(0)) | int)
         * (vm_pool_memory | default(1536) | int) * 1024 }}
  block:
    - name: capacity | Remember whether any job bound was explicit
      ansible.builtin.set_fact:
        __forge_capacity_explicit: >-
          {{ forge_runner_capacity is defined or forge_job_cpus is defined or forge_job_memory is defined }}

    # The one formula, the check's own, so what the check promised is what is written here.
    - name: capacity | Ask what this host carries
      ansible.builtin.script:
        cmd: >-
          {{ (role_path ~ '/../check/files/porelo-host-check') | quote }}
          --limits {{ __forge_fit_limits | from_json | to_json | quote }}
          --fit {{ __forge_fit_request | to_json | quote }}
        executable: python3
      vars:
        __forge_fit_limits: "{{ lookup('ansible.builtin.file', role_path ~ '/../check/files/limits.json') }}"
        __forge_fit_request:
          host_cpus: "{{ __forge_host_cpus | int }}"
          host_kib: "{{ __forge_host_kib | int }}"
          pool_kib: "{{ __forge_pool_kib | int }}"
          capacity: "{{ forge_runner_capacity | int if forge_runner_capacity is defined else none }}"
          job_cpus: "{{ forge_job_cpus | int if forge_job_cpus is defined else none }}"
          job_memory: "{{ forge_job_memory | string if forge_job_memory is defined else none }}"
      register: __forge_fit
      changed_when: false
      failed_when: __forge_fit.rc not in [0, 1]
      check_mode: false

    # Each by itself, so a bound that was asked for never becomes a fact, which would outrank a later play's.
    - name: capacity | Take the number of jobs from the answer, unless asked for
      ansible.builtin.set_fact:
        forge_runner_capacity: "{{ (__forge_fit.stdout | from_json).capacity }}"
      when: forge_runner_capacity is not defined

    - name: capacity | Take each job's processors from the answer, unless asked for
      ansible.builtin.set_fact:
        forge_job_cpus: "{{ (__forge_fit.stdout | from_json).job_cpus }}"
      when: forge_job_cpus is not defined

    - name: capacity | Take each job's memory from the answer, unless asked for
      ansible.builtin.set_fact:
        forge_job_memory: "{{ (__forge_fit.stdout | from_json).job_memory }}"
      when: forge_job_memory is not defined

    - name: capacity | Stop when the runner's jobs and the VM pool would take more than half the host
      ansible.builtin.assert:
        that: (__forge_fit.stdout | from_json).ok
        fail_msg: >-
          {% if not (__forge_capacity_explicit | bool) %}
          this machine cannot carry one job of 1 CPU and 768m beside the VM pool of {{ __forge_pool_kib }} KiB:
          {{ __forge_host_cpus }} processors and {{ __forge_host_kib }} KiB total
          {% else %}
          asked for {{ forge_runner_capacity }} jobs of {{ forge_job_cpus }} CPUs and {{ forge_job_memory }}
          ({{ __forge_job_kib }} KiB each) beside a VM pool of {{ __forge_pool_kib }} KiB within half the host:
          {{ (__forge_host_cpus | int) // 2 }} of {{ __forge_host_cpus }} processors and
          {{ (__forge_host_kib | int) // 2 }} of {{ __forge_host_kib }} KiB;
          lower forge_runner_capacity or the job bounds
          {% endif %}
        quiet: true
