---
# The account every build publishes its snapshots with, an unreviewed task branch's too: a member of the owner's
# organization through a team that may write its packages and nothing else, its write:package token made by Forgejo's
# command line and piped straight into the organization's Actions secret. The token is never read out: it stays in
# Forgejo and the runner's jobs, and reaches no task. A run's own token cannot do it, Forgejo refusing it the
# organization's registry.
- name: publisher | Ask Forgejo which users it has
  ansible.builtin.command:
    argv: [podman, exec, forgejo, forgejo, admin, user, list]
  become: true
  become_user: "{{ forge_account }}"
  environment: "{{ __forge_environment }}"
  register: __forge_users_listed
  changed_when: false
  check_mode: false

- name: publisher | Make the publisher, its password generated and discarded
  ansible.builtin.shell:
    cmd: >-
      podman exec forgejo forgejo admin user create --username {{ __forge_publisher }}
      --email {{ __forge_publisher }}@{{ forge_name }} --random-password --must-change-password=false > /dev/null
  become: true
  become_user: "{{ forge_account }}"
  environment: "{{ __forge_environment }}"
  when: __forge_publisher not in (__forge_users_listed.stdout_lines[1:] | map('split') | map(attribute=1) | list)
  changed_when: true
  no_log: true

- name: publisher | Let the publisher write the organization's packages, through a team of its own
  ansible.builtin.shell:
    cmd: |
      set -euo pipefail
      api() { curl -sS --cacert {{ __forge_ca_dir }}/ca.pem -H @<(printf 'Authorization: token %s\n' \
          "$(cat {{ __forge_token }})") -H 'Content-Type: application/json' "$@"; }
      base=https://{{ forge_address }}:{{ forge_http_port }}/api/v1
      answer=$(mktemp) && trap 'rm -f "$answer"' EXIT
      changed=
      code=$(api -o "$answer" -w '%{http_code}' \
          "$base/orgs/{{ forge_owner }}/teams/search?q={{ __forge_publisher_team }}")
      [ "$code" = 200 ] || { echo "Forgejo answered $code searching the organization's teams" >&2; exit 1; }
      team=$(python3 -I -c 'import json,sys; print(next((t["id"] for t in json.load(open(sys.argv[1]))["data"] \
          if t["name"] == sys.argv[2]), ""))' "$answer" {{ __forge_publisher_team }})
      if [ -z "$team" ]; then
          code=$(api -o "$answer" -w '%{http_code}' -X POST "$base/orgs/{{ forge_owner }}/teams" \
              -d '{"name": "{{ __forge_publisher_team }}", "permission": "write", "units": ["repo.packages"],
                   "units_map": {"repo.packages": "write"}, "includes_all_repositories": false,
                   "can_create_org_repo": false}')
          [ "$code" = 201 ] \
              || { echo "Forgejo answered $code making the team {{ __forge_publisher_team }}" >&2; exit 1; }
          team=$(python3 -I -c 'import json,sys; print(json.load(open(sys.argv[1]))["id"])' "$answer")
          changed=yes
      fi
      code=$(api -o /dev/null -w '%{http_code}' "$base/teams/$team/members/{{ __forge_publisher }}")
      if [ "$code" = 404 ]; then
          code=$(api -o /dev/null -w '%{http_code}' -X PUT "$base/teams/$team/members/{{ __forge_publisher }}")
          [ "$code" = 204 ] || { echo "Forgejo answered $code adding {{ __forge_publisher }} to its team" >&2; exit 1; }
          changed=yes
      elif [ "$code" != 200 ]; then
          echo "Forgejo answered $code for {{ __forge_publisher }} in its team" >&2; exit 1
      fi
      echo "${changed:-unchanged}"
    executable: /bin/bash
  register: __forge_publisher_team_made
  changed_when: __forge_publisher_team_made.stdout == 'yes'

# Once per forge: the token's name carries the time it was made, since Forgejo refuses a second token of one name, and
# a run cut off between the token and the secret leaves an unused one, never a secret without its token. Down takes
# the volume that holds both.
- name: publisher | Pipe a new write:package token of the publisher into the organization's Actions secret
  ansible.builtin.shell:
    cmd: |
      set -euo pipefail
      cd /
      secret=https://{{ forge_address }}:{{ forge_http_port }}/api/v1/orgs/{{ forge_owner }}/actions/secrets
      code=$(runuser -u {{ forge_account }} -- env XDG_RUNTIME_DIR=/run/user/{{ __forge_uid }} \
          podman exec forgejo forgejo admin user generate-access-token --username {{ __forge_publisher }} \
          --token-name publish-$(date -u +%Y%m%dT%H%M%SZ) --scopes write:package --raw \
          | python3 -I -c 'import json,sys; print(json.dumps({"data": sys.stdin.read().strip()}))' \
          | curl -sS -o /dev/null -w '%{http_code}' --cacert {{ __forge_ca_dir }}/ca.pem \
              -H @<(printf 'Authorization: token %s\n' "$(cat {{ __forge_token }})") \
              -H 'Content-Type: application/json' -X PUT "$secret/{{ __forge_publisher_secret }}" --data @-)
      [ "$code" = 201 ] || [ "$code" = 204 ] \
          || { echo "Forgejo answered $code setting the secret {{ __forge_publisher_secret }}" >&2; exit 1; }
      touch {{ __forge_publisher_set }}
    creates: "{{ __forge_publisher_set }}"
    executable: /bin/bash
  register: __forge_publisher_secret_set
  failed_when: false
  no_log: true

# The task above hides its output, the token having passed through it; what it said on a refusal holds none of it.
- name: publisher | Stop when Forgejo would not take the publisher's secret, with its answer
  ansible.builtin.assert:
    that: __forge_publisher_secret_set.rc | default(0) == 0
    fail_msg: "{{ __forge_publisher_secret_set.stderr | default('') }}"
    quiet: true

- name: publisher | Check the organization's variable names and values before they reach the API
  ansible.builtin.assert:
    that:
      - item.key is match('^[A-Z_][A-Z0-9_]*$')
      - item.value is string
      - item.value | length > 0
    fail_msg: "asked for an uppercase variable name and a nonempty string value, got {{ item }}"
    quiet: true
  loop: "{{ forge_variables | dict2items }}"
  loop_control:
    label: "{{ item.key }}"

- name: publisher | Set each organization Actions variable only when absent or different
  ansible.builtin.shell:
    cmd: |
      set -euo pipefail
      api() { curl -sS --max-time 10 --cacert {{ __forge_ca_dir }}/ca.pem \
          -H @<(printf 'Authorization: token %s\n' "$(cat {{ __forge_token }})") \
          -H 'Content-Type: application/json' "$@"; }
      base=https://{{ forge_address }}:{{ forge_http_port }}/api/v1/orgs/{{ forge_owner }}/actions/variables
      variable=$base/{{ item.key }}
      body={{ {'value': item.value} | to_json | quote }}
      answer=$(mktemp) && trap 'rm -f "$answer"' EXIT
      code=$(api -o "$answer" -w '%{http_code}' "$variable")
      method=POST
      if [ "$code" = 200 ]; then
          same=$(python3 -I -c 'import json,sys; actual=json.load(open(sys.argv[1])); wanted=json.loads(sys.argv[2]);
      print("yes" if actual["data"] == wanted["value"] else "no")' "$answer" "$body")
          [ "$same" != yes ] || { echo unchanged; exit 0; }
          method=PUT
      elif [ "$code" != 404 ]; then
          echo "asked for variable {{ item.key }} or 404, got HTTP $code" >&2; exit 1
      fi
      code=$(api -o /dev/null -w '%{http_code}' -X "$method" "$variable" --data "$body")
      [ "$code" = 204 ] \
          || { echo "asked for $method of variable {{ item.key }} to return 204, got HTTP $code" >&2; exit 1; }
      code=$(api -o "$answer" -w '%{http_code}' "$variable")
      [ "$code" = 200 ] \
          || { echo "asked to read variable {{ item.key }} after $method, got HTTP $code" >&2; exit 1; }
      python3 -I -c 'import json,sys; actual=json.load(open(sys.argv[1])); wanted=json.loads(sys.argv[2])["value"];
      if actual["data"] != wanted:
          sys.exit("asked for variable {{ item.key }}=" + repr(wanted) + ", got " + repr(actual["data"]))' \
          "$answer" "$body"
      echo yes
    executable: /bin/bash
  loop: "{{ forge_variables | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  register: __forge_variables_set
  changed_when: __forge_variables_set.stdout | default('') == 'yes'
  failed_when: false
  no_log: true

- name: publisher | Stop when Forgejo would not take a variable, with its answer
  ansible.builtin.assert:
    that: __forge_variables_set.results | rejectattr('rc', 'equalto', 0) | list | length == 0
    fail_msg: >-
      {{ __forge_variables_set.results | rejectattr('rc', 'equalto', 0) | map(attribute='stderr') | join('; ') }}
    quiet: true

- name: publisher | Check the placeholder secret names before they reach the API
  ansible.builtin.assert:
    that: item is match('^[A-Z_][A-Z0-9_]*$')
    fail_msg: "asked for an uppercase placeholder secret name, got {{ item }}"
    quiet: true
  loop: "{{ forge_placeholder_secrets }}"

# The Actions secrets API requires nonempty data, so missing names get a fixed nonsecret value.
- name: publisher | Create each placeholder secret only when its name is absent
  ansible.builtin.shell:
    cmd: |
      set -euo pipefail
      api() { curl -sS --max-time 10 --cacert {{ __forge_ca_dir }}/ca.pem \
          -H @<(printf 'Authorization: token %s\n' "$(cat {{ __forge_token }})") \
          -H 'Content-Type: application/json' "$@"; }
      base=https://{{ forge_address }}:{{ forge_http_port }}/api/v1/orgs/{{ forge_owner }}/actions/secrets
      answer=$(mktemp) && trap 'rm -f "$answer"' EXIT
      has_secret() {
          local page code state previous= digest
          for page in $(seq 1 100); do
              code=$(api -o "$answer" -w '%{http_code}' "$base?limit=50&page=$page") || return 2
              [ "$code" = 200 ] \
                  || { echo "asked for secret names on page $page, got HTTP $code" >&2; return 2; }
              state=$(python3 -I -c 'import json,sys; names=[s["name"] for s in json.load(open(sys.argv[1]))];
      print("found" if sys.argv[2] in names else "next" if names else "absent")' \
                  "$answer" {{ item | quote }}) || return 2
              case "$state" in found) return 0 ;; absent) return 1 ;; esac
              digest=$(sha256sum "$answer" | cut -d' ' -f1) || return 2
              [ "$digest" != "$previous" ] \
                  || { echo "asked for the next page of secret names, got the same page again" >&2; return 2; }
              previous=$digest
          done
          echo "asked to finish listing secret names within 100 pages, got more pages" >&2; return 2
      }
      rc=0
      has_secret || rc=$?
      [ "$rc" != 0 ] || { echo unchanged; exit 0; }
      [ "$rc" = 1 ] || exit 1
      code=$(printf '%s\n' '{"data":"porelo-host-placeholder"}' \
          | api -o /dev/null -w '%{http_code}' -X PUT "$base/{{ item }}" --data @-)
      [ "$code" = 201 ] \
          || { echo "asked to create secret {{ item }} with HTTP 201, got HTTP $code" >&2; exit 1; }
      has_secret || { echo "asked for secret {{ item }} after creation, got no confirmed name" >&2; exit 1; }
      echo yes
    executable: /bin/bash
  loop: "{{ forge_placeholder_secrets }}"
  register: __forge_placeholder_secrets_set
  changed_when: __forge_placeholder_secrets_set.stdout | default('') == 'yes'
  failed_when: false
  no_log: true

- name: publisher | Stop when Forgejo would not take a placeholder secret, with its answer
  ansible.builtin.assert:
    that: __forge_placeholder_secrets_set.results | rejectattr('rc', 'equalto', 0) | list | length == 0
    fail_msg: >-
      {{ __forge_placeholder_secrets_set.results | rejectattr('rc', 'equalto', 0)
      | map(attribute='stderr') | join('; ') }}
    quiet: true
