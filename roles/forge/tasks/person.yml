---
- name: person | Check the person's name before it reaches a command
  ansible.builtin.assert:
    that: forge_person is string and forge_person is match('^[a-z][a-z0-9-]{0,30}\Z')
    fail_msg: "asked for a lower case person name matching ^[a-z][a-z0-9-]{0,30}$, got {{ forge_person }}"
    quiet: true

- name: person | Ask Forgejo which users it has
  ansible.builtin.command:
    argv: [podman, exec, forgejo, forgejo, admin, user, list]
  become: true
  become_user: "{{ forge_account }}"
  environment: "{{ __forge_environment }}"
  register: __forge_person_users_listed
  changed_when: false
  check_mode: false
  no_log: true

# The person's password is theirs, kept in their secrets file and set on each new forge by porelo-host-forge-password
# over ssh; the one Forgejo generates here goes nowhere, so no password of the person's is ever in a host file.
- name: person | Make the person's account, its generated password discarded
  ansible.builtin.shell:
    cmd: >-
      podman exec forgejo forgejo admin user create --username {{ forge_person }}
      --email {{ forge_person }}@{{ forge_name }} --random-password --must-change-password=false > /dev/null
  become: true
  become_user: "{{ forge_account }}"
  environment: "{{ __forge_environment }}"
  when: forge_person not in
    (__forge_person_users_listed.stdout_lines[1:] | map('split') | map(attribute=1) | list)
  changed_when: true
  no_log: true

- name: person | Install the script that sets the person's lasting password, root's alone
  ansible.builtin.copy:
    src: "{{ role_path }}/files/porelo-host-forge-password"
    dest: /usr/local/sbin/porelo-host-forge-password
    owner: root
    group: root
    mode: "0700"

- name: person | Install the project registration helper, root's alone
  ansible.builtin.copy:
    src: "{{ role_path }}/files/porelo-host-project"
    dest: /usr/local/sbin/porelo-host-project
    owner: root
    group: root
    mode: "0700"
