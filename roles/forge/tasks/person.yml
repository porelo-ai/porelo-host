---
- name: person | Check the person's name before it reaches a command
  ansible.builtin.assert:
    that: forge_person is string and forge_person is match('^[a-z][a-z0-9-]{0,30}\Z')
    fail_msg: "asked for a lower case person name matching ^[a-z][a-z0-9-]{0,30}$, got {{ forge_person }}"
    quiet: true

- name: person | Ask Forgejo which users it has
  ansible.builtin.command:
    argv: [podman, exec, forgejo, forgejo, admin, user, list]
  become: true
  become_user: "{{ forge_account }}"
  environment: "{{ __forge_environment }}"
  register: __forge_person_users_listed
  changed_when: false
  check_mode: false
  no_log: true

# The person's password is theirs, kept in their secrets file and set on each new forge by porelo-host-forge-password
# over ssh; the one Forgejo generates here goes nowhere, so no password of the person's is ever in a host file.
- name: person | Make the person's account, its generated password discarded
  ansible.builtin.shell:
    cmd: >-
      podman exec forgejo forgejo admin user create --username {{ forge_person }}
      --email {{ forge_person }}@{{ forge_name }} --random-password --must-change-password=false > /dev/null
  become: true
  become_user: "{{ forge_account }}"
  environment: "{{ __forge_environment }}"
  when: forge_person not in
    (__forge_person_users_listed.stdout_lines[1:] | map('split') | map(attribute=1) | list)
  changed_when: true
  no_log: true

- name: person | Install the script that sets the person's lasting password, root's alone
  ansible.builtin.copy:
    src: "{{ role_path }}/files/porelo-host-forge-password"
    dest: /usr/local/sbin/porelo-host-forge-password
    owner: root
    group: root
    mode: "0700"

- name: person | Let the person own the organization's repositories through its Owners team
  ansible.builtin.shell:
    cmd: |
      set -euo pipefail
      api() { curl -sS --max-time 10 --cacert {{ __forge_ca_dir }}/ca.pem \
          -H @<(sed 's/^/Authorization: token /' {{ __forge_token }}) \
          -H 'Content-Type: application/json' "$@"; }
      base=https://{{ forge_address }}:{{ forge_http_port }}/api/v1
      answer=$(mktemp) && trap 'rm -f "$answer"' EXIT
      changed=
      code=$(api -o "$answer" -w '%{http_code}' "$base/orgs/{{ forge_owner }}/teams/search?q=Owners")
      [ "$code" = 200 ] \
          || { echo "asked to search {{ forge_owner }}'s teams with HTTP 200, got HTTP $code" >&2; exit 1; }
      team=$(python3 -I -c 'import json,sys; print(next((int(t["id"]) \
          for t in json.load(open(sys.argv[1]))["data"] if t["name"] == "Owners"), ""))' "$answer")
      [ -n "$team" ] || { echo "asked for {{ forge_owner }}'s Owners team, got no team" >&2; exit 1; }
      member="$base/teams/$team/members/{{ forge_person }}"
      code=$(api -o /dev/null -w '%{http_code}' "$member")
      if [ "$code" = 404 ]; then
          code=$(api -o /dev/null -w '%{http_code}' -X PUT "$member")
          [ "$code" = 204 ] \
              || { echo "asked to add {{ forge_person }} to Owners with HTTP 204, got HTTP $code" >&2; exit 1; }
          code=$(api -o /dev/null -w '%{http_code}' "$member")
          changed=yes
      fi
      [ "$code" = 200 ] \
          || { echo "asked for {{ forge_person }} in Owners with HTTP 200, got HTTP $code" >&2; exit 1; }
      echo "${changed:-unchanged}"
    executable: /bin/bash
  register: __forge_person_team_made
  changed_when: __forge_person_team_made.stdout | default('') == 'yes'
  failed_when: false
  no_log: true

- name: person | Stop when Forgejo would not take the person as an owner, with its answer
  ansible.builtin.assert:
    that: __forge_person_team_made.rc | default(0) == 0
    fail_msg: "{{ __forge_person_team_made.stderr | default('') }}"
    quiet: true
