---
- name: Make the forge's accounts
  ansible.builtin.include_tasks: "{{ role_path }}/tasks/accounts.yml"

# Base runs before these accounts exist, so their managers are checked here before either container starts.
- name: Check the controllers of the forge's accounts
  ansible.builtin.include_role:
    name: porelo.host.base
    tasks_from: controllers
  vars:
    base_account: "{{ __forge_controller_account }}"
  loop: ["{{ forge_account }}", "{{ forge_runner_account }}"]
  loop_control:
    loop_var: __forge_controller_account

- name: Take the forge's certificate, signed by the person's CA
  ansible.builtin.include_tasks: "{{ role_path }}/tasks/tls.yml"

- name: Run Forgejo on the VPN's address
  ansible.builtin.include_tasks: "{{ role_path }}/tasks/service.yml"

- name: Register and run Forgejo's runner
  ansible.builtin.include_tasks: "{{ role_path }}/tasks/runner.yml"

- name: Make the forge's admin and its API token
  ansible.builtin.include_tasks: "{{ role_path }}/tasks/admin.yml"

- name: Migrate the repositories once from the central forge
  ansible.builtin.include_tasks: "{{ role_path }}/tasks/repositories.yml"
  when: forge_repositories | length > 0

- name: Make the person's web login an owner of the organization
  ansible.builtin.include_tasks: "{{ role_path }}/tasks/person.yml"
  when: forge_repositories | length > 0

- name: Give Porelo's gate its forge identity and put its token into the account's vault
  ansible.builtin.include_tasks: "{{ role_path }}/tasks/gate.yml"
  when: forge_repositories | length > 0

- name: Protect main so only the person's approved pull request reaches it
  ansible.builtin.include_tasks: "{{ role_path }}/tasks/protection.yml"
  when: forge_repositories | length > 0

- name: Let every build publish into the registry with the publisher's secret
  ansible.builtin.include_tasks: "{{ role_path }}/tasks/publisher.yml"
  when: forge_repositories | length > 0

- name: Make the agents' forge accounts and their credentials on the host
  ansible.builtin.include_tasks: "{{ role_path }}/tasks/agents.yml"
  when: forge_repositories | length > 0

- name: Give the person the gathered push of the repositories to the central forge
  ansible.builtin.include_tasks: "{{ role_path }}/tasks/push.yml"
  when: forge_repositories | length > 0
