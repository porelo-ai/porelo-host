---
# The gathered push runs in each developer's own account from ~/.config/porelo-host/push/<project>.conf and asks for
# the central token each time, so no credential is installed with it. Root runs --check at project removal, trusting
# the central forge authority recorded here.
- name: push | Check the central forge's CA is one absolute path before it reaches the settings
  ansible.builtin.assert:
    that: forge_central_ca is string and forge_central_ca is match('^/[^\s]+\Z')
    fail_msg: "asked for one absolute path without blanks as the central forge's CA, got {{ forge_central_ca }}"
    quiet: true

- name: push | Install the gathered push for every developer and root's removal check
  ansible.builtin.copy:
    src: "{{ role_path }}/files/porelo-host-push"
    dest: /usr/local/sbin/porelo-host-push
    owner: root
    group: root
    mode: "0755"

- name: push | Write which authority root's removal check trusts for the central forge
  ansible.builtin.copy:
    dest: "{{ __forge_state_dir }}/central-ca.conf"
    owner: root
    group: root
    mode: "0644"
    content: "{{ forge_central_ca }}\n"

# A host prepared before Git reached the forge on loopback had the push and pull run as root.
- name: push | Remove the rule that ran the push and pull as root
  ansible.builtin.file:
    path: /etc/sudoers.d/porelo-host-push
    state: absent
