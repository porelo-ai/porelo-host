---
# up's first play, before the stop: the forge's and the homeserver's certificates are signed on the person's desktop by
# the host's lasting CA, whose key never reaches the host. Where either certificate does not hold, the host makes keys
# and requests for both, which the stop's --request prints and whose answer forge-certificate brings back; each key
# stays root's alone until its role moves it.
- name: request | Make the forge's directory of root's
  ansible.builtin.file:
    path: "{{ __forge_ca_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: request | Check each agent's name before it reaches the host's settings
  ansible.builtin.assert:
    that: forge_agents is sequence and forge_agents is not string
      and forge_agents | select('match', '^[a-z][a-z0-9-]{0,30}\Z') | unique | list | length == forge_agents | length
    fail_msg: "asked for a list of unique lower case agent names, got {{ forge_agents }}"
    quiet: true

# The stop checks both certificates against these; none of them is a secret. Only a host whose forge is on names its
# account and agents, which is how porelo-host-person tells whether people get forge identities.
- name: request | Name the host, the forge and the homeserver to the stop
  ansible.builtin.copy:
    dest: /etc/porelo-host/forge.conf
    content: |
      address={{ forge_address }}
      host={{ forge_host }}
      name={{ forge_name }}
      matrix_name={{ forge_matrix_name }}
      port={{ forge_http_port }}
      {% if porelo_host_forge | default(false) | bool %}
      account={{ forge_account }}
      agents={{ forge_agents | join(',') }}
      {% endif %}
    owner: root
    group: root
    mode: "0644"

- name: request | Read the host's accounts, for the forge's and the homeserver's homes
  ansible.builtin.getent:
    database: passwd

# A certificate holds where it ends in more than 30 days, names the host's VPN address and the service's name, and
# matches its key. One need, forge-certificate, covers both the forge and the homeserver.
- name: request | Make keys and requests for the forge and the homeserver unless both certificates hold or wait
  ansible.builtin.shell:
    cmd: |
      set -euo pipefail
      wait={{ __forge_ca_dir }}
      # A certificate holds where it ends in more than 30 days, verifies under the host's CA, names the host's VPN
      # address and the service's DNS name, and is for its key; each public key read on its own, so none compares empty.
      holds() {
          [ -f "$1" ] && [ -f "$2" ] && [ -f "$wait/ca.pem" ] && [ ! -L "$1" ] && [ ! -L "$2" ] || return 1
          [ "$(stat -c '%a' -- "$2")" = 600 ] || return 1
          openssl x509 -checkend 2592000 -noout -in "$1" > /dev/null || return 1
          openssl verify -CAfile "$wait/ca.pem" "$1" > /dev/null 2>&1 || return 1
          names=$(openssl x509 -noout -ext subjectAltName -in "$1" | tail -n +2 | tr ',' '\n' | sed 's/^ *//; s/ *$//')
          grep -qxF 'IP Address:{{ forge_address }}' <<< "$names" && grep -qxF "DNS:$3" <<< "$names" \
              || return 1
          cert_pub=$(openssl x509 -noout -pubkey -in "$1") && key_pub=$(openssl pkey -pubout -in "$2") || return 1
          [ -n "$cert_pub" ] && [ "$cert_pub" = "$key_pub" ]
      }
      forge_home={{ __forge_request_home | quote }}
      matrix_home={{ __forge_matrix_home | quote }}
      forge_holds=false
      if holds "$wait/forge.pem" "$wait/forge.key" {{ forge_name | quote }} \
          || { [ -n "$forge_home" ] \
              && holds "$forge_home/tls/forge.pem" "$forge_home/tls/forge.key" {{ forge_name | quote }}; }; then
          forge_holds=true
      fi
      matrix_holds=false
      if holds "$wait/matrix.pem" "$wait/matrix.key" {{ forge_matrix_name | quote }} \
          || { [ -n "$matrix_home" ] \
              && holds "$matrix_home/.config/porelo/matrix/tls/server.crt" \
                  "$matrix_home/.config/porelo/matrix/tls/server.key" {{ forge_matrix_name | quote }}; }; then
          matrix_holds=true
      fi
      if "$forge_holds" && "$matrix_holds"; then
          echo holds
          exit 0
      fi
      tmp_key=
      trap 'rm -f -- ${tmp_key:+"$tmp_key"} "$wait/forge.csr.new" "$wait/matrix.csr.new"' EXIT
      # A key from a run that stopped is kept only while it is a plain file of root's alone that can be read, so a
      # request already signed stays good; any other is replaced. A new key is made beside its name and moved there.
      request_one() {
          local stem=$1 dns=$2
          if ! holds "$wait/$stem.pem" "$wait/$stem.key" "$dns"; then
              rm -f -- "$wait/$stem.pem"
          fi
          if [ -L "$wait/$stem.key" ] || [ ! -f "$wait/$stem.key" ] \
              || [ "$(stat -c '%u %a' -- "$wait/$stem.key")" != '0 600' ] \
              || ! openssl pkey -noout -in "$wait/$stem.key" > /dev/null 2>&1; then
              rm -f -- "$wait/$stem.key"
              tmp_key=$(umask 077 && mktemp "$wait/.$stem.key.XXXXXX")
              openssl genpkey -algorithm EC -pkeyopt ec_paramgen_curve:P-256 -out "$tmp_key"
              mv -fT -- "$tmp_key" "$wait/$stem.key"
              tmp_key=
          fi
          openssl req -new -key "$wait/$stem.key" -subj "/CN=$dns" -out "$wait/$stem.csr.new"
          chmod 0644 "$wait/$stem.csr.new" && mv -f -- "$wait/$stem.csr.new" "$wait/$stem.csr"
      }
      request_one forge {{ forge_name | quote }}
      request_one matrix {{ forge_matrix_name | quote }}
      echo requested
    executable: /bin/bash
  vars:
    __forge_request_home: >-
      {{ (ansible_facts['getent_passwd'][forge_account] | default([], true))[4] | default('') }}
    __forge_matrix_home: >-
      {{ (ansible_facts['getent_passwd'][forge_matrix_account] | default([], true))[4] | default('') }}
  register: __forge_request
  changed_when: __forge_request.stdout == 'requested'

- name: request | Name the host's certificates as what the person must give
  ansible.builtin.set_fact:
    porelo_host_needs: "{{ porelo_host_needs | default([]) + __forge_need }}"  # noqa: var-naming[no-role-prefix]
  vars:
    __forge_need: [forge-certificate]
  when: __forge_request.stdout == 'requested'
