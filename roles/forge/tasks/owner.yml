---
# The organization exists only once repositories are migrated into it; the person owns them through its Owners team.
- name: owner | Let the person own the organization's repositories through its Owners team
  ansible.builtin.shell:
    cmd: |
      set -euo pipefail
      api() { curl -sS --max-time 10 --cacert {{ __forge_ca_dir }}/ca.pem \
          -H @<(sed 's/^/Authorization: token /' {{ __forge_token }}) \
          -H 'Content-Type: application/json' "$@"; }
      base=https://{{ forge_address }}:{{ forge_http_port }}/api/v1
      answer=$(mktemp) && trap 'rm -f "$answer"' EXIT
      changed=
      code=$(api -o "$answer" -w '%{http_code}' "$base/orgs/{{ forge_owner }}/teams/search?q=Owners")
      [ "$code" = 200 ] \
          || { echo "asked to search {{ forge_owner }}'s teams with HTTP 200, got HTTP $code" >&2; exit 1; }
      team=$(python3 -I -c 'import json,sys; print(next((int(t["id"]) \
          for t in json.load(open(sys.argv[1]))["data"] if t["name"] == "Owners"), ""))' "$answer")
      [ -n "$team" ] || { echo "asked for {{ forge_owner }}'s Owners team, got no team" >&2; exit 1; }
      member="$base/teams/$team/members/{{ forge_person }}"
      code=$(api -o /dev/null -w '%{http_code}' "$member")
      if [ "$code" = 404 ]; then
          code=$(api -o /dev/null -w '%{http_code}' -X PUT "$member")
          [ "$code" = 204 ] \
              || { echo "asked to add {{ forge_person }} to Owners with HTTP 204, got HTTP $code" >&2; exit 1; }
          code=$(api -o /dev/null -w '%{http_code}' "$member")
          changed=yes
      fi
      [ "$code" = 200 ] \
          || { echo "asked for {{ forge_person }} in Owners with HTTP 200, got HTTP $code" >&2; exit 1; }
      echo "${changed:-unchanged}"
    executable: /bin/bash
  register: __forge_person_team_made
  changed_when: __forge_person_team_made.stdout | default('') == 'yes'
  failed_when: false
  no_log: true

- name: owner | Stop when Forgejo would not take the person as an owner, with its answer
  ansible.builtin.assert:
    that: __forge_person_team_made.rc | default(0) == 0
    fail_msg: "{{ __forge_person_team_made.stderr | default('') }}"
    quiet: true
