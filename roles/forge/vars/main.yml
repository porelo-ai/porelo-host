---
# Where the capacity check reads the host's processors and memory; a test hands it others.
__forge_cpuinfo: /proc/cpuinfo
__forge_meminfo: /proc/meminfo

# Forgejo's rootless image, by version and digest: the newest release at least three days old when it was pinned.
__forge_image: >-
  codeberg.org/forgejo/forgejo:17.0.0-rootless@sha256:6554520f7574602100b7d6620c6ac5b18cec30325f823777497eac36234f5cf8

# Where the person's push config and the bring's list of repositories still to migrate lie, theirs alone.
__forge_push_dir: "{{ ansible_facts['getent_passwd'][porelo_account][4] }}/.config/porelo-host/push"
__forge_to_migrate: "{{ __forge_repositories_state.results | selectattr('stdout', 'equalto', 'missing')
  | map(attribute='item.name') | list }}"

# Root's nonpublic forge settings and agent tokens; no certificate authority.
__forge_state_dir: /etc/porelo-host/forge
__forge_socket: "/run/user/{{ __forge_uid }}/porelo-forge/http.sock"
__forge_environment:
  XDG_RUNTIME_DIR: "/run/user/{{ __forge_uid }}"

# The forge's admin, made by Forgejo's own command line, and the file its API token is kept in.
__forge_admin: porelo-admin
__forge_token: "{{ __forge_home }}/.config/porelo-forge/api.token"

# The account every build publishes with, its team in the owner's organization, the Actions secret that holds its
# token, and the file that says the secret was set, which down removes with the volume that holds the token.
__forge_publisher: porelo-publisher
__forge_publisher_team: publishers
__forge_publisher_secret: PORELO_PUBLISHER_TOKEN
__forge_publisher_set: "{{ __forge_home }}/.config/porelo-forge/publisher.set"

# Forgejo's runner, by version and digest, the newest release at least three days old when it was pinned.
__forge_runner_image: >-
  code.forgejo.org/forgejo/runner:13.2.0@sha256:ca3d5eea46004789a175d1369eec6829d3ea9bfbe2011a06625b4bdaa55f7552
# The runner's socket proxy, by version and digest, the newest release at least three days old when it was pinned.
__forge_runner_proxy_image: >-
  docker.io/alpine/socat:1.8.1.3@sha256:603174b77eebaba25ba8f8ebb15e1234d6600409554e95d6fb203fd106150287
__forge_runner_environment:
  XDG_RUNTIME_DIR: "/run/user/{{ __forge_runner_uid }}"

# Jobs get a pinned JDK without installing one in each job.
__forge_runner_jdk:
  version: 25.0.5+8
  url: "https://github.com/adoptium/temurin25-binaries/releases/download/jdk-25.0.5%2B8/\
    OpenJDK25U-jdk_x64_linux_hotspot_25.0.5_8.tar.gz"
  sha256: 68982529869257d0ee6b824ec5aa270ff8b118bb438670da0b97ebdab178d7fb
__forge_runner_jdk_dir: "/opt/porelo-host/jdk-{{ __forge_runner_jdk.version }}"
__forge_runner_jdk_job_dir: /opt/porelo-jdk-25

# The project's teams the bring makes in its organization, with no members: sync puts people into developers, and each
# task's gate and agent identity into gates and agents. Each writes every repository of the organization and creates
# none; Forgejo 17 reads the access from units_map alone.
__forge_teams:
  - name: developers
    includes_all_repositories: true
    can_create_org_repo: false
    units_map: {repo.code: write, repo.pulls: write, repo.issues: write, repo.actions: read, repo.packages: read}
  - name: gates
    includes_all_repositories: true
    can_create_org_repo: false
    units_map: {repo.code: write, repo.pulls: write, repo.actions: read}
  - name: agents
    includes_all_repositories: true
    can_create_org_repo: false
    units_map: {repo.code: write, repo.pulls: write, repo.issues: write, repo.actions: read, repo.packages: read}

# bring and join: the host's forge as /etc/porelo-host/forge.conf names it, and the person's runtime directory, where
# their stop leaves the central token and the play keeps their own forge token while it runs. Both role's vars, so the
# play's own settings never move a token's path.
__forge_own_settings: "{{ dict(__forge_own_conf.content | b64decode | split('\n') | select('match', '^[a-z_]+=')
  | map('split', '=', 1) | list) }}"
__forge_own_uid: "{{ ansible_facts['getent_passwd'][porelo_account][1] | int }}"
__forge_own_dir: "/run/user/{{ __forge_own_uid }}/porelo-host"
__forge_own_environment:
  XDG_RUNTIME_DIR: "/run/user/{{ __forge_own_uid }}"
