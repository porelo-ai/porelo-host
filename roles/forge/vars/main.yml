---
# Forgejo's rootless image, by version and digest: the newest release at least three days old when it was pinned.
__forge_image: >-
  codeberg.org/forgejo/forgejo:17.0.0-rootless@sha256:6554520f7574602100b7d6620c6ac5b18cec30325f823777497eac36234f5cf8

# The host's CA for the forge, made on the host and kept there; its certificate is what a client trusts.
__forge_ca_dir: /etc/porelo-host/forge
__forge_environment:
  XDG_RUNTIME_DIR: "/run/user/{{ __forge_uid }}"

# The forge's admin, made by Forgejo's own command line, and the file its API token is kept in.
__forge_admin: porelo-admin
__forge_token: "{{ __forge_home }}/.config/porelo-forge/api.token"

# The account every build publishes with, its team in the owner's organization, the Actions secret that holds its
# token, and the file that says the secret was set, which down removes with the volume that holds the token.
__forge_publisher: porelo-publisher
__forge_publisher_team: publishers
__forge_publisher_secret: PORELO_PUBLISHER_TOKEN
__forge_publisher_set: "{{ __forge_home }}/.config/porelo-forge/publisher.set"

# Forgejo's runner, by version and digest, the newest release at least three days old when it was pinned.
__forge_runner_image: >-
  code.forgejo.org/forgejo/runner:13.2.0@sha256:ca3d5eea46004789a175d1369eec6829d3ea9bfbe2011a06625b4bdaa55f7552
__forge_runner_environment:
  XDG_RUNTIME_DIR: "/run/user/{{ __forge_runner_uid }}"

# Jobs get a pinned JDK without installing one in each job.
__forge_runner_jdk:
  version: 25.0.5+8
  url: "https://github.com/adoptium/temurin25-binaries/releases/download/jdk-25.0.5%2B8/\
    OpenJDK25U-jdk_x64_linux_hotspot_25.0.5_8.tar.gz"
  sha256: 68982529869257d0ee6b824ec5aa270ff8b118bb438670da0b97ebdab178d7fb
__forge_runner_jdk_dir: "/opt/porelo-host/jdk-{{ __forge_runner_jdk.version }}"
__forge_runner_jdk_job_dir: /opt/porelo-jdk-25
