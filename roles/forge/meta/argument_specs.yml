---
argument_specs:
  main:
    short_description: Forgejo with its registry in rootless podman under accounts of its own, on the VPN's address.
    description:
      - Run in up's second play after the VPN, where the host setting porelo_host_forge is true.
    options:
      forge_account:
        type: str
        default: porelo-forge
        description: The account Forgejo runs as, never Porelo's.
      forge_runner_account:
        type: str
        default: porelo-runner
        description: The account Forgejo's runner runs as, never Porelo's nor the forge's.
      forge_address:
        type: str
        description: The host's address inside the VPN, the only one the forge listens on; the vpn role's by default.
      forge_name:
        type: str
        default: forge.porelo.internal
        description: The name the forge's certificate carries beside that address.
      forge_http_port:
        type: int
        default: 3000
        description: The port Forgejo serves HTTPS on.
      forge_ssh_port:
        type: int
        default: 2222
        description: The port Forgejo serves git over ssh on.
      forge_runner_name:
        type: str
        default: porelo-host
        description: The runner's name on the forge.
      forge_cpus:
        type: int
        default: 2
        description: Forgejo's CPU time quota in cores, for serving requests and repositories.
      forge_memory:
        type: str
        default: 2G
        description: Forgejo's memory limit, in podman's size notation.
      forge_pids_limit:
        type: int
        default: 1024
        description: Forgejo's maximum number of processes and threads.
      forge_runner_cpus:
        type: int
        default: 1
        description: The runner daemon's CPU time quota in cores, for coordinating its jobs.
      forge_runner_memory:
        type: str
        default: 512M
        description: The runner daemon's memory limit, in podman's size notation.
      forge_runner_pids_limit:
        type: int
        default: 256
        description: The runner daemon's maximum number of processes and threads.
      forge_runner_capacity:
        type: int
        default: 4
        description: How many jobs the runner takes at once, each within the job bounds.
      forge_runner_cache_port:
        type: int
        default: 4000
        description: The port of the runner's cache server, published on the forge's address.
      forge_runner_cache_proxy_port:
        type: int
        default: 4001
        description: The port of the runner's cache proxy, the one a job's actions/cache is given.
      forge_job_cpus:
        type: int
        default: 4
        description: Each job container's CPU time quota in cores.
      forge_job_memory:
        type: str
        default: 8g
        description: Each job container's memory limit, in podman's size notation.
      forge_job_pids_limit:
        type: int
        default: 2048
        description: Each job container's maximum number of processes and threads.
      forge_job_omp_num_threads:
        type: int
        default: 4
        description: OMP_NUM_THREADS in each job container, so nproc reports its bounded core count.
      forge_runner_labels:
        type: list
        elements: str
        description: The labels the runner's jobs run on, each name:docker://image pinned by digest.
      forge_repositories:
        type: list
        elements: dict
        default: []
        description: >-
          The repositories migrated once from the central forge, with no push mirrors,
          from porelo_host_forge_repositories.
        options:
          name:
            type: str
            required: true
            description: The repository's name on the forge, letters, digits, '.', '_' or '-'.
          url:
            type: str
            required: true
            description: Its address on the central forge, https:// with no user in it.
      forge_owner:
        type: str
        default: porelo
        description: The organization the repositories are migrated into, from porelo_host_forge_owner.
      forge_central_ca:
        type: path
        default: /etc/ssl/certs/ca-certificates.crt
        description: >-
          The CA bundle the gathered push trusts for the central forge, from porelo_host_forge_central_ca; a root-owned
          file, the system's own by default.
      forge_person:
        type: str
        default: operator
        description: >-
          The person's web login matching ^[a-z][a-z0-9-]{0,30}$, made with every forge; with repositories, in the
          Owners team.
          Its generated password goes nowhere; porelo-host-forge-password sets the person's lasting one.
      forge_variables:
        type: dict
        default:
          PORELO_PUBLISH: "false"
          JF_URL: "https://jfrog.invalid"
          PORELO_DEPLOY_PROFILE: forge-release
          MAVEN_SNAPSHOTS_URL: "https://{{ forge_address }}:{{ forge_http_port }}/api/packages/{{ forge_owner }}/maven"
        description: >-
          Nonsecret organization Actions variables; uppercase names and nonempty string values, only with repositories.
      forge_porelo_account:
        type: str
        description: >-
          Porelo's account matching ^[a-z][a-z0-9-]{0,30}$, from porelo_host_account. Its forge user is porelo-<account>
          in the gates team; its vault holds git.token.forge.porelo.internal for the gate and build reader.
      forge_agents:
        type: list
        elements: str
        default: []
        description: >-
          Unique agent names matching ^[a-z][a-z0-9-]{0,30}$, from porelo_host_forge_agents, only with repositories.
          Each gets agent-<name> in the agents team and a root-only token at /etc/porelo-host/forge/agents/<name>.token.
      forge_placeholder_secrets:
        type: list
        elements: str
        default: [JF_ACCESS_TOKEN]
        description: >-
          Organization Actions secret names created with porelo-host-placeholder only when absent; existing values stay.
      forge_migrations_allow_local:
        type: bool
        default: false
        description: Lets Forgejo migrate from a private address, for a stand-in central forge on the host.
  request:
    short_description: >-
      Before the stop, a key and a request for the forge's certificate where none signed by the person's CA holds, and
      forge-certificate named as a need.
    options:
      forge_address:
        type: str
        description: The forge's address on the VPN, which the certificate must name.
      forge_name:
        type: str
        default: forge.porelo.internal
        description: The forge's name, which the certificate must name.
      forge_http_port:
        type: int
        default: 3000
        description: The forge's HTTPS port, named to the password script.
      forge_person:
        type: str
        default: operator
        description: The person's web login, named to the password script.
      forge_account:
        type: str
        default: porelo-forge
        description: The forge's account, whose tls/ holds the certificate once moved there.
  capacity:
    short_description: Refuse runner jobs that, with the VM pool, would take more than half the host.
    options:
      forge_runner_capacity:
        type: int
        default: 4
        description: How many jobs the runner takes at once, each within the job bounds.
      forge_job_cpus:
        type: int
        default: 4
        description: Each job container's CPU time quota in cores.
      forge_job_memory:
        type: str
        default: 8g
        description: Each job container's memory limit, in podman's size notation.
  down:
    short_description: The forge taken off the host before it is given back, its secrets and units with it.
    options:
      forge_account:
        type: str
        default: porelo-forge
        description: The account Forgejo runs as.
      forge_runner_account:
        type: str
        default: porelo-runner
        description: The account Forgejo's runner runs as.
