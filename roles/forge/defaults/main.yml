---
# The accounts Forgejo and its runner run as, never Porelo's: a task's container must not share a user namespace with
# what holds the forge's admin, and a job's code must reach neither.
forge_account: porelo-forge
forge_runner_account: porelo-runner

# The host's address inside the VPN, which the forge alone listens on; the vpn role's own, without its prefix.
forge_address: "{{ (vpn_address | default('10.73.0.1/24')).split('/') | first }}"

# The name the forge's certificate carries beside that address, and the ports it serves HTTPS and git over ssh on.
forge_name: forge.porelo.internal
forge_http_port: 3000
forge_ssh_port: 2222

# Forgejo serves requests and repositories on two CPUs; the runner daemon coordinates one separately bounded job.
forge_cpus: 2
forge_memory: 2G
forge_pids_limit: 1024
forge_runner_cpus: 1
forge_runner_memory: 512M
forge_runner_pids_limit: 256

# A job gets the same fixed bounds as a Porelo task, whichever host runs it.
forge_job_cpus: 4
forge_job_memory: 8g
forge_job_pids_limit: 2048
forge_job_omp_num_threads: 4

# The repositories migrated once from the central forge into the owner's organization, each {name, url}, and that
# owner; from porelo-frontend's first inventory. No push mirrors are configured. A url is https:// with no user in it.
forge_repositories: "{{ porelo_host_forge_repositories | default([]) }}"
forge_owner: "{{ porelo_host_forge_owner | default('porelo') }}"

# The authority the gathered push trusts for the central forge: the system's own, never the host's.
forge_central_ca: "{{ porelo_host_forge_central_ca | default('/etc/ssl/certs/ca-certificates.crt') }}"

# Each agent gets a forge account and a token kept on the host, only where the owner's repositories are configured.
forge_agents: "{{ porelo_host_forge_agents | default([]) }}"

# Workflows differ between the forges only by variables; GitHub enables publishing with the same variable set true.
forge_variables:
  PORELO_PUBLISH: "false"
  # The Actions variables API requires a nonempty value, so this URL cannot name a real service.
  JF_URL: https://jfrog.invalid
  # Snapshots go to the forge's own Maven registry, at the address a job reaches; GitHub's names Sonatype's.
  PORELO_DEPLOY_PROFILE: forge-release
  MAVEN_SNAPSHOTS_URL: "https://{{ forge_address }}:{{ forge_http_port }}/api/packages/{{ forge_owner }}/maven"

forge_placeholder_secrets: [JF_ACCESS_TOKEN]

# The person's token for migration from the central forge, on their drive; only the shell reads it into the request.
forge_central_token_path: /srv/porelo-host/drive/porelo-host/forge-central.token

# Forgejo refuses to migrate from a private address; a stand-in for the central forge on the host itself needs it.
forge_migrations_allow_local: false

# The runner's name on the forge, and the labels its jobs run on, each name:docker://image pinned by digest; the
# repositories' own labels come with their workflows.
forge_runner_name: porelo-host
forge_runner_labels:
  - porelo-host:docker://docker.io/curlimages/curl:8.22.0@sha256:58adaa4e8dca9c988bae2aba4ab3434a0bb2da16bbe3f92dec39ec7785166777
  - "ubuntu-24.04:docker://ghcr.io/catthehacker/ubuntu:act-24.04-20260815@sha256:\
      62d572b92f9f32d3427b6d220ad1f9dca9c7b6ffad37d295425037dbff78abaf"
  # No 26.04 image exists, so both GitHub labels use the pinned 24.04 image.
  - "ubuntu-26.04:docker://ghcr.io/catthehacker/ubuntu:act-24.04-20260815@sha256:\
      62d572b92f9f32d3427b6d220ad1f9dca9c7b6ffad37d295425037dbff78abaf"
