---
# The VPN's interface, and the UDP port it listens on at the public address.
vpn_interface: wg-porelo
vpn_port: 51820

# The host's address inside the VPN with its prefix, such as 10.73.0.1/24; from the inventory Porelo writes.
# vpn_address:

# The person's peers, each with its public key and the addresses it is allowed, from the inventory Porelo writes; a
# public key is no secret.
# vpn_peers:
#   - public_key: <base64>
#     allowed_ips: 10.73.0.2/32

# The file holding the host's private key, on the person's drive; the role names it to wg and checks it is there,
# never reads it.
# vpn_private_key_path:

# The TCP port ssh listens on, which the public address keeps beside the VPN's port.
vpn_ssh_port: 22
