---
# The VPN's interface, and the UDP port it listens on at the public address.
vpn_interface: wg-porelo
vpn_port: 51820

# The host's address inside the VPN with its prefix; the person's peer has an address in the same network.
vpn_address: 10.73.0.1/24

# The person's peers, each with its public key and the addresses it is allowed inside the VPN; by default the one
# peer porelo-frontend's inventory names in porelo_host_vpn_peer_public_key and porelo_host_vpn_peer_address. A
# public key is no secret.
vpn_peers:
  - public_key: "{{ porelo_host_vpn_peer_public_key }}"
    allowed_ips: "{{ porelo_host_vpn_peer_address }}"

# The file holding the host's private key, on the person's drive: `porelo-host/wireguard.key` in the person's tresor,
# synced into the drive's folder. The role names it to wg and checks it is there, never reads it.
vpn_private_key_path: /srv/porelo-host/drive/porelo-host/wireguard.key

# The TCP port ssh listens on, which the public address keeps beside the VPN's port.
vpn_ssh_port: 22
