---
# Only the file's kind and owner are read, never its content: wg itself reads the key when the interface comes up.
- name: key | Read whether the host's key file is there
  ansible.builtin.stat:
    path: "{{ vpn_private_key_path }}"
    get_checksum: false
    get_mime: false
  register: __vpn_key

- name: key | Stop if the host's key file is missing or not root's alone
  ansible.builtin.assert:
    that:
      - __vpn_key.stat.exists and __vpn_key.stat.isreg
      - __vpn_key.stat.uid == 0 and __vpn_key.stat.mode == '0600'
    fail_msg: >-
      wireguard: no key file of root's alone, mode 0600, at {{ vpn_private_key_path }}; give it with
      porelo-host-stop --stdin wireguard and run up again
    quiet: true
