---
# up's first play, before the stop: the host's key is the person's to give while neither its file nor the running
# interface is there, so a resumed up does not stop for it again. The stop's --stdin, run as root, reads the key's
# path from vpn.conf, which holds no secret.
- name: needs | Make the directory of the host's settings
  ansible.builtin.file:
    path: /etc/porelo-host
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: needs | Name the key's path to the person's stop
  ansible.builtin.copy:
    dest: /etc/porelo-host/vpn.conf
    content: |
      key={{ vpn_private_key_path }}
      admin_address={{ ((vpn_peers | first).allowed_ips.split(',') | first).split('/') | first | trim }}
    owner: root
    group: root
    mode: "0644"

- name: needs | Read whether the host's key file is there
  ansible.builtin.stat:
    path: "{{ vpn_private_key_path }}"
    get_checksum: false
    get_mime: false
  register: __vpn_key

# iproute2 is there before install brings wireguard-tools.
- name: needs | Read whether the VPN's interface runs
  ansible.builtin.command:
    cmd: ip link show {{ vpn_interface }}
  register: __vpn_link
  changed_when: false
  failed_when: false
  check_mode: false

- name: needs | Name the host's key as what the person must give
  ansible.builtin.set_fact:
    porelo_host_needs: "{{ porelo_host_needs | default([]) + ['wireguard'] }}"  # noqa: var-naming[no-role-prefix]
  when:
    - not __vpn_key.stat.exists
    - __vpn_link.rc != 0
