---
# The interface is stopped and its file removed, so the next up writes it again; the person's peer stays theirs. A
# failed up may have stopped before the file was written, and down then has nothing of the VPN to take.
- name: down | Read whether up wrote the interface's file
  ansible.builtin.stat:
    path: "/etc/wireguard/{{ vpn_interface }}.conf"
  register: __vpn_conf

- name: down | Stop the VPN
  ansible.builtin.systemd_service:
    name: "wg-quick@{{ vpn_interface }}.service"
    state: stopped
    enabled: false
  when: __vpn_conf.stat.exists

- name: down | Remove the interface's file
  ansible.builtin.file:
    path: "/etc/wireguard/{{ vpn_interface }}.conf"
    state: absent
