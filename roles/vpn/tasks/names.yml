---
# Each address is four decimal octets of 0 to 255 without a leading zero, the room's a host address of the VPN's /24
# other than the host's own.
- name: names | Check the room's name and address before they reach /etc/hosts
  ansible.builtin.assert:
    that:
      - vpn_address is match('^[0-9.]+/24$')
      - __vpn_host_octets | length == 4
      - __vpn_room_octets | length == 4
      - (__vpn_host_octets + __vpn_room_octets) | select('match', '^(0|[1-9][0-9]{0,2})$') | list | length == 8
      - (__vpn_host_octets + __vpn_room_octets) | map('int') | select('le', 255) | list | length == 8
      - __vpn_room_octets[:3] == __vpn_host_octets[:3]
      - __vpn_room_octets[3] | int >= 1 and __vpn_room_octets[3] | int <= 254
      - vpn_room_address != (vpn_address.split('/') | first)
      - vpn_room_name is match('^[a-z0-9]([a-z0-9.-]{0,251}[a-z0-9])?$')
    fail_msg: >-
      the room's name and address must be a DNS name and a host address in {{ vpn_address }} other than the host's
      own; got {{ vpn_room_name }} {{ vpn_room_address }}
    quiet: true
  vars:
    __vpn_host_octets: "{{ (vpn_address.split('/') | first).split('.') }}"
    __vpn_room_octets: "{{ vpn_room_address.split('.') }}"

- name: names | Resolve the room's name to the person's computer through the VPN
  ansible.builtin.blockinfile:
    path: /etc/hosts
    marker: "# {mark} porelo-host room name"
    block: "{{ vpn_room_address }} {{ vpn_room_name }}"
