---
argument_specs:
  main:
    short_description: WireGuard to the person's peers, and a firewall leaving only ssh and the VPN public.
    options:
      vpn_interface:
        type: str
        default: wg-porelo
        description: The VPN's interface, and the name of its file under /etc/wireguard.
      vpn_port:
        type: int
        default: 51820
        description: The UDP port the VPN listens on.
      vpn_address:
        type: str
        default: 10.73.0.1/24
        description: The host's address inside the VPN with its prefix.
      vpn_peers:
        type: list
        elements: dict
        description: >-
          The person's peers; by default the one named by porelo_host_vpn_peer_public_key and
          porelo_host_vpn_peer_address.
        options:
          public_key:
            type: str
            required: true
            description: The peer's public key, base64 as wg prints it.
          allowed_ips:
            type: str
            required: true
            description: The addresses the peer is allowed inside the VPN.
      vpn_private_key_path:
        type: path
        default: /etc/wireguard/porelo-host.key
        description: >-
          The file holding the host's private key, root's alone, written by the person's stop; named to wg, never read
          here.
      vpn_ssh_port:
        type: int
        default: 22
        description: The TCP port ssh listens on, kept open on the public address.
  needs:
    short_description: >-
      Before the stop, the key's path named to the person's stop, and the key named as a need while neither its file
      nor the interface is there.
    options:
      vpn_interface:
        type: str
        default: wg-porelo
        description: The VPN's interface.
      vpn_private_key_path:
        type: path
        default: /etc/wireguard/porelo-host.key
        description: The file the person's stop writes the host's private key into.
  down:
    short_description: The VPN stopped, and its file, the host's key and the key's path for the stop removed.
    options:
      vpn_interface:
        type: str
        default: wg-porelo
        description: The VPN's interface.
      vpn_private_key_path:
        type: path
        default: /etc/wireguard/porelo-host.key
        description: The file holding the host's private key.
