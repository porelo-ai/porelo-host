---
- name: Mount the drive again
  ansible.builtin.systemd_service:
    name: "{{ __drive_unit.stdout }}"
    state: restarted
    daemon_reload: true

- name: Restart Tresorit's daemon
  ansible.builtin.systemd_service:
    name: tresorit-daemon.service
    scope: user
    state: restarted
    daemon_reload: true
  become: true
  become_user: "{{ drive_account }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ ansible_facts['getent_passwd'][drive_account][1] }}"
