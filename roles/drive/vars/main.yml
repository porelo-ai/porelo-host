---
__drive_installer: /var/cache/porelo-host/tresorit_installer.run
__drive_client_dir: "{{ ansible_facts['getent_passwd'][drive_account][4] }}/.local/share/tresorit"
__drive_user_units: "{{ ansible_facts['getent_passwd'][drive_account][4] }}/.config/systemd/user"
__drive_user_environment:
  XDG_RUNTIME_DIR: "/run/user/{{ ansible_facts['getent_passwd'][drive_account][1] }}"
__drive_logged_in: "{{ (__drive_status.stdout_lines | select('match', 'Logged in as:\t') | first
  | regex_replace('^Logged in as:\t', '')) not in ['', '-'] }}"
__drive_tresor_paths: "{{ dict(__drive_tresors.stdout_lines | select | map('split', '\t')
  | map('batch', 2) | map('first') | list) }}"
