---
argument_specs:
  main:
    short_description: The drive's folder on a filesystem of its own, mounted noexec, nosuid and nodev.
    options:
      drive_account:
        type: str
        required: true
        description: The account the folder belongs to, from the collection-wide variable porelo_host_account.
      drive_path:
        type: path
        default: /srv/porelo-host/drive
        description: Where the folder is.
      drive_image:
        type: path
        default: /var/lib/porelo-host/drive.img
        description: The sparse file the folder's filesystem lives in.
      drive_size:
        type: str
        default: 20G
        description: How large that file may grow, as truncate reads a size.
      drive_client:
        type: bool
        default: true
        description: Whether Tresorit's client syncs the person's tresor into the folder.
      drive_installer_url:
        type: str
        default: https://installerstorage.blob.core.windows.net/public/install/tresorit_installer.run
        description: Tresorit's Linux installer, as Tresorit's site serves it.
      drive_installer_ca_sha256:
        type: str
        default: AC:46:31:BC:C9:81:CA:10:06:35:14:FB:42:FD:47:4A:9C:94:BB:8E:50:38:9C:4D:F4:2E:E2:01:09:3D:D2:42
        description: The SHA-256 fingerprint of the CA that issues the installer's signing certificate.
  down:
    short_description: The drive unmounted, last at down.
    options:
      drive_path:
        type: path
        default: /srv/porelo-host/drive
        description: Where the folder is.
