---
# Synced is `idle` with no file left and no error, read twice in a row: a write just made shows `indexing` first.
- name: synced | Wait until the tresor reads idle, with nothing left and no error
  ansible.builtin.command:
    cmd: "{{ __drive_client_dir }}/tresorit-cli -p transfers --tresor {{ drive_tresor | quote }}"
  become: true
  become_user: "{{ drive_account }}"
  environment: "{{ __drive_user_environment }}"
  register: __drive_transfers
  until: __drive_transfers.rc == 0 and __drive_transfers.stdout.split('\t')[1:] == ['idle', '0', '0']
  retries: "{{ (drive_sync_wait / 5) | int }}"
  delay: 5
  changed_when: false
  check_mode: false
  loop: [first, again]
  loop_control:
    label: "{{ drive_tresor }}, {{ item }}"
