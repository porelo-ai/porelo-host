---
# The installer is downloaded and checked as root, in a directory only root writes, and only then run as the account:
# what runs is the file that was checked. A client already there is left to update itself, as Tresorit's does.
- name: install | Read the account's home
  ansible.builtin.getent:
    database: passwd
    key: "{{ drive_account }}"

- name: install | Read whether the client is there
  ansible.builtin.stat:
    path: "{{ __drive_client_dir }}/tresorit-cli"
  register: __drive_cli

- name: install | Download, check and run the installer
  when: not __drive_cli.stat.exists
  block:
    - name: install | Make the directory the installer is kept in
      ansible.builtin.file:
        path: "{{ __drive_installer | dirname }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: install | Download Tresorit's installer
      ansible.builtin.get_url:
        url: "{{ drive_installer_url }}"
        dest: "{{ __drive_installer }}"
        owner: root
        group: root
        mode: "0644"

    - name: install | Check the installer is signed under the pinned CA
      porelo.host.tresorit_installer:
        path: "{{ __drive_installer }}"
        ca_sha256: "{{ drive_installer_ca_sha256 }}"

    - name: install | Install Tresorit's client for the account, asking nothing
      ansible.builtin.command:
        cmd: sh {{ __drive_installer }} --update-v2 {{ __drive_client_dir }}
        creates: "{{ __drive_client_dir }}/tresorit-cli"
      become: true
      become_user: "{{ drive_account }}"

# porelo-host logs the drive in over ssh as the account, whose non-interactive shell has no ~/.local on its PATH, and
# calls the client by name; one fixed name finds it there. A wrapper rather than a link, so the client runs from its
# own path, as Tresorit's installer put it, and finds what lies beside it.
- name: install | Give the client a name every shell of the account finds
  ansible.builtin.copy:
    dest: /usr/local/bin/tresorit-cli
    content: |
      #!/bin/sh
      # Written by porelo.host.drive: the account's Tresorit client, by one fixed name.
      exec {{ __drive_client_dir }}/tresorit-cli "$@"
    owner: root
    group: root
    mode: "0755"
