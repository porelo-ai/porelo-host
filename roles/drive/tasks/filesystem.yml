---
- name: filesystem | Read the mount unit's name for the drive's path
  ansible.builtin.command:
    cmd: systemd-escape --path --suffix=mount {{ drive_path }}
  register: __drive_unit
  changed_when: false
  check_mode: false

- name: filesystem | Make the directory the image lives in
  ansible.builtin.file:
    path: "{{ drive_image | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: filesystem | Make the image, sparse, with an ext4 filesystem
  ansible.builtin.shell:
    cmd: truncate -s {{ drive_size | quote }} {{ drive_image | quote }} && mkfs.ext4 -q -F {{ drive_image | quote }}
    creates: "{{ drive_image }}"

# Made only while missing: once mounted, the same path is the filesystem's own root, which the account gets below.
# The directory beneath stays root's, so with the drive unmounted the account cannot write onto the root filesystem.
- name: filesystem | Read whether the mount point is there
  ansible.builtin.stat:
    path: "{{ drive_path }}"
  register: __drive_mount_point

- name: filesystem | Make the mount point
  ansible.builtin.file:
    path: "{{ drive_path }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: not __drive_mount_point.stat.exists

- name: filesystem | Write the mount unit, noexec, nosuid and nodev
  ansible.builtin.template:
    src: "{{ role_path }}/templates/drive.mount.j2"
    dest: "/etc/systemd/system/{{ __drive_unit.stdout }}"
    owner: root
    group: root
    mode: "0644"
    backup: true
  notify: Mount the drive again

- name: filesystem | Mount the drive now and at every boot
  ansible.builtin.systemd_service:
    name: "{{ __drive_unit.stdout }}"
    state: started
    enabled: true
    daemon_reload: true

- name: filesystem | Give the mounted folder to the account
  ansible.builtin.file:
    path: "{{ drive_path }}"
    state: directory
    owner: "{{ drive_account }}"
    group: "{{ drive_account }}"
    mode: "0700"

# ext4's lost+found, root's alone, would stand in the tresor's folder for the client to sync; fsck makes it again if
# it ever needs one.
- name: filesystem | Remove the filesystem's lost+found from the drive's folder
  ansible.builtin.file:
    path: "{{ drive_path }}/lost+found"
    state: absent
