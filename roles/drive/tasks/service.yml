---
# A user unit of the account, which the linger Porelo's setup script gives it keeps running without a login.
# Each level made as the account's, so ~/.config stays the account's own to write.
- name: service | Make the account's directory for user units
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ drive_account }}"
    group: "{{ drive_account }}"
    mode: "0755"
  loop:
    - "{{ __drive_user_units | dirname | dirname }}"
    - "{{ __drive_user_units | dirname }}"
    - "{{ __drive_user_units }}"

- name: service | Write the daemon's user unit
  ansible.builtin.template:
    src: "{{ role_path }}/templates/tresorit-daemon.service.j2"
    dest: "{{ __drive_user_units }}/tresorit-daemon.service"
    owner: "{{ drive_account }}"
    group: "{{ drive_account }}"
    mode: "0644"
  notify: Restart Tresorit's daemon

- name: service | Run the daemon now and whenever the account's services start
  ansible.builtin.systemd_service:
    name: tresorit-daemon.service
    scope: user
    state: started
    enabled: true
    daemon_reload: true
  become: true
  become_user: "{{ drive_account }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ ansible_facts['getent_passwd'][drive_account][1] }}"
