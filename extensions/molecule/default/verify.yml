---
# What a host has after `up`, read on the host. Each role's issue adds what its role promises.
- name: Verify
  hosts: all
  gather_facts: false
  become: true
  vars:
    verify_version: "{{ lookup('ansible.builtin.env', 'PORELO_HOST_VERSION') }}"
    verify_account: porelo-test
    verify_vault_passphrase: converge-passphrase
    verify_setup_script: "{{ (lookup('ansible.builtin.file', playbook_dir
      ~ '/../../../roles/porelo/defaults/main.yml') | from_yaml).porelo_setup_script }}"
    verify_drive: /srv/porelo-host/drive
    verify_vm_pool: "{{ lookup('ansible.builtin.env', 'PORELO_HOST_MOLECULE_POOL', default='on') }}"
  tasks:
    - name: Read the account's id for the person's steps
      ansible.builtin.getent:
        database: passwd
        key: "{{ verify_account }}"

    - name: Read the person's stop command and its permissions
      ansible.builtin.stat:
        path: /usr/local/bin/porelo-host-stop
      register: verify_host_stop

    # A malformed call must refuse before it can ask for credentials.
    - name: Ask the stop command to refuse an unknown need as the account
      ansible.builtin.command:
        argv: [/usr/local/bin/porelo-host-stop, nonsense]
      become: true
      become_user: "{{ verify_account }}"
      register: verify_host_stop_refusal
      changed_when: false
      failed_when: false

    - name: Assert the stop command is root's executable and refuses the unknown need
      ansible.builtin.assert:
        that:
          - verify_host_stop.stat.exists
          - verify_host_stop.stat.isreg | default(false)
          - verify_host_stop.stat.uid | default(-1) == 0
          - verify_host_stop.stat.mode | default('') == '0755'
          - verify_host_stop_refusal.rc == 64
          - "'nonsense' in verify_host_stop_refusal.stderr"
        fail_msg: >-
          asked for /usr/local/bin/porelo-host-stop as root's regular file with mode 0755 and nonsense refused with 64;
          got stat {{ verify_host_stop.stat }}, rc {{ verify_host_stop_refusal.rc }}:
          {{ verify_host_stop_refusal.stdout }} {{ verify_host_stop_refusal.stderr }}

    - name: Install the stub explicitly as the person does
      ansible.builtin.command:
        argv: [sh, "{{ verify_setup_script }}", --user, "{{ verify_account }}",
               --distribution, snapshots, --with, porelo-agent-stub]
      changed_when: true

    - name: Sign the stub's provider in, as the person's step does
      ansible.builtin.shell:
        cmd: >-
          set -o pipefail && printf 'converge-not-a-key\n' | XDG_RUNTIME_DIR=/run/user/$(id -u)
          porelo vault put anthropic
        executable: /bin/bash
      become: true
      become_user: "{{ verify_account }}"
      changed_when: true
      no_log: true

    - name: Start the task by hand as the account
      ansible.builtin.command:
        cmd: porelo task start converge-1 -p converge -r code --agent stub --detach --no-input
      become: true
      become_user: "{{ verify_account }}"
      environment:
        XDG_RUNTIME_DIR: "/run/user/{{ ansible_facts['getent_passwd'][verify_account][1] }}"
      changed_when: true

    - name: Read the task after the person's start
      ansible.builtin.command:
        cmd: porelo task status porelo-converge-converge-1 --json
      become: true
      become_user: "{{ verify_account }}"
      environment:
        XDG_RUNTIME_DIR: "/run/user/{{ ansible_facts['getent_passwd'][verify_account][1] }}"
      register: verify_person_task
      changed_when: false

    - name: Assert the task started by hand is running
      ansible.builtin.assert:
        that: (verify_person_task.stdout | from_json).running
        fail_msg: "asked for the task running after the person's start, got {{ verify_person_task.stdout }}"

    - name: Read which collections the host has
      ansible.builtin.command:
        cmd: ansible-galaxy collection list porelo.host --format json
      register: verify_collections
      changed_when: false

    - name: Assert the host has the collection in the version under test
      ansible.builtin.assert:
        that:
          - verify_found | length == 1
          - verify_found[0].version == verify_version
        fail_msg: "asked for porelo.host {{ verify_version }}, found {{ verify_found }}"
      vars:
        # Keyed by the name with its dot, which an attribute lookup would read as two levels.
        verify_found: "{{ verify_collections.stdout | from_json | dict2items | map(attribute='value')
          | map('dict2items') | flatten | selectattr('key', 'equalto', 'porelo.host') | map(attribute='value')
          | list }}"

    - name: Read whether ansible-core is Ubuntu's own package
      ansible.builtin.command:
        cmd: dpkg-query -W -f=${Status} ansible-core
      register: verify_ansible_core
      changed_when: false

    - name: Assert ansible-core came from Ubuntu
      ansible.builtin.assert:
        that: verify_ansible_core.stdout == 'install ok installed'
        fail_msg: "asked for Ubuntu's ansible-core, dpkg says {{ verify_ansible_core.stdout }}"

    # Asked of KVM itself: Ubuntu makes /dev/kvm as a static node even where no CPU extension stands behind it.
    - name: Ask KVM for its API version through /dev/kvm
      ansible.builtin.command:
        cmd: python3 -c "import fcntl, os; print(fcntl.ioctl(os.open('/dev/kvm', os.O_RDWR), 0xAE00))"
      register: verify_kvm
      changed_when: false
      failed_when: false

    - name: Assert KVM answers, as on a rented host
      ansible.builtin.assert:
        that: verify_kvm.rc == 0 and verify_kvm.stdout == '12'
        fail_msg: >-
          asked KVM_GET_API_VERSION for 12, got rc {{ verify_kvm.rc }}: {{ verify_kvm.stdout }} {{ verify_kvm.stderr }}

    # The base role: the account itself uses KVM, libvirt and rootless podman.
    - name: Ask KVM for its API version as the account
      ansible.builtin.command:
        cmd: python3 -c "import fcntl, os; print(fcntl.ioctl(os.open('/dev/kvm', os.O_RDWR), 0xAE00))"
      become: true
      become_user: "{{ verify_account }}"
      register: verify_account_kvm
      changed_when: false
      failed_when: false

    - name: Assert the account opens KVM
      ansible.builtin.assert:
        that: verify_account_kvm.rc == 0 and verify_account_kvm.stdout == '12'
        fail_msg: >-
          {{ verify_account }} asked KVM_GET_API_VERSION for 12, got rc {{ verify_account_kvm.rc }}:
          {{ verify_account_kvm.stdout }} {{ verify_account_kvm.stderr }}

    - name: Ask libvirt for its domains as the account
      ansible.builtin.command:
        cmd: virsh -c qemu:///system list --all --name
      become: true
      become_user: "{{ verify_account }}"
      register: verify_account_libvirt
      changed_when: false
      failed_when: false

    - name: Assert the account reaches libvirt
      ansible.builtin.assert:
        that: verify_account_libvirt.rc == 0
        fail_msg: "{{ verify_account }} could not reach libvirt: {{ verify_account_libvirt.stderr }}"

    - name: Read the account's id
      ansible.builtin.getent:
        database: passwd
        key: "{{ verify_account }}"

    - name: Map the account's subordinate ids in rootless podman
      ansible.builtin.command:
        cmd: podman unshare cat /proc/self/uid_map
      become: true
      become_user: "{{ verify_account }}"
      environment:
        XDG_RUNTIME_DIR: "/run/user/{{ ansible_facts['getent_passwd'][verify_account][1] }}"
      register: verify_account_podman
      changed_when: false
      failed_when: false

    - name: Assert rootless podman maps more than the account's own id
      ansible.builtin.assert:
        that: verify_account_podman.rc == 0 and verify_account_podman.stdout_lines | length > 1
        fail_msg: >-
          {{ verify_account }}'s rootless podman mapped {{ verify_account_podman.stdout_lines }}
          (rc {{ verify_account_podman.rc }}: {{ verify_account_podman.stderr }})

    # The drive role, with a local folder in the tresor's place: its own filesystem, nothing run from it.
    - name: Read how the drive's folder is mounted
      ansible.builtin.command:
        cmd: findmnt --noheadings --output OPTIONS --mountpoint {{ verify_drive }}
      register: verify_drive_mount
      changed_when: false
      failed_when: false

    - name: Assert the drive's folder is a filesystem of its own, mounted noexec, nosuid and nodev
      ansible.builtin.assert:
        that:
          - verify_drive_mount.rc == 0
          - verify_drive_mount.stdout.split(',') is superset(['noexec', 'nosuid', 'nodev'])
        fail_msg: >-
          {{ verify_drive }} is mounted with '{{ verify_drive_mount.stdout }}' (rc {{ verify_drive_mount.rc }})

    - name: Put a script into the drive as the account
      ansible.builtin.copy:
        dest: "{{ verify_drive }}/verify-noexec.sh"
        content: "#!/bin/sh\necho ran\n"
        mode: "0755"
      become: true
      become_user: "{{ verify_account }}"

    - name: Run that script as the account
      ansible.builtin.command:
        cmd: "{{ verify_drive }}/verify-noexec.sh"
      become: true
      become_user: "{{ verify_account }}"
      register: verify_drive_run
      changed_when: false
      failed_when: false

    - name: Remove the script again
      ansible.builtin.file:
        path: "{{ verify_drive }}/verify-noexec.sh"
        state: absent

    - name: Assert the script was refused
      ansible.builtin.assert:
        that: verify_drive_run.rc != 0 and verify_drive_run.stdout != 'ran'
        fail_msg: "a script in {{ verify_drive }} ran: rc {{ verify_drive_run.rc }}, {{ verify_drive_run.stdout }}"

    # The vpn role: a service bound to every address is reached through the VPN, from a peer in a network namespace of
    # its own, and refused on the public address, from where Molecule itself connects.
    - name: Start a service bound to every address
      ansible.builtin.command:
        argv: [systemd-run, --unit, verify-listener, --collect, python3, -m, http.server, --bind, "::", "8080"]
        creates: /run/systemd/transient/verify-listener.service

    - name: Make the test peer in a network namespace of its own, linked to the host
      ansible.builtin.shell:
        cmd: |
          set -eu
          ip netns add verify-peer
          ip link add verify-host type veth peer name verify-ns netns verify-peer
          ip address add 10.250.0.1/30 dev verify-host && ip link set verify-host up
          ip -n verify-peer address add 10.250.0.2/30 dev verify-ns
          ip -n verify-peer link set verify-ns up && ip -n verify-peer link set lo up
          ip -n verify-peer link add wg0 type wireguard
          ip netns exec verify-peer wg set wg0 private-key /etc/wireguard/verify-peer.key \
              peer "$(cat /root/vpn-host.pub)" endpoint 10.250.0.1:51820 allowed-ips 10.73.0.1/32
          ip -n verify-peer address add 10.73.0.2/24 dev wg0 && ip -n verify-peer link set wg0 up
        executable: /bin/bash
        creates: /run/netns/verify-peer

    - name: Reach the service through the VPN from the test peer
      ansible.builtin.command:
        cmd: ip netns exec verify-peer curl -fsS --max-time 10 -o /dev/null -w '%{http_code}' http://10.73.0.1:8080/
      register: verify_vpn_reach
      changed_when: false
      failed_when: false

    - name: Assert the service answers through the VPN
      ansible.builtin.assert:
        that: verify_vpn_reach.rc == 0 and verify_vpn_reach.stdout == '200'
        fail_msg: >-
          through the VPN: rc {{ verify_vpn_reach.rc }}, {{ verify_vpn_reach.stdout }} {{ verify_vpn_reach.stderr }}

    # The forge role: Forgejo's API through the VPN over TLS, trusting the host's CA alone, and nothing of it listening
    # anywhere but on the VPN's address - the firewall would hide a wider binding from the public side.
    - name: Reach Forgejo's API through the VPN over TLS, trusting only the host's CA
      ansible.builtin.command:
        cmd: >-
          ip netns exec verify-peer curl -fsS --max-time 10 --cacert /etc/porelo-host/forge/ca.pem
          https://10.73.0.1:3000/api/v1/version
      register: verify_forge_api
      changed_when: false
      failed_when: false

    - name: Assert Forgejo answers through the VPN with the host's certificate
      ansible.builtin.assert:
        that: verify_forge_api.rc == 0 and (verify_forge_api.stdout | from_json).version is defined
        fail_msg: "Forgejo through the VPN: rc {{ verify_forge_api.rc }}, {{ verify_forge_api.stdout }}
          {{ verify_forge_api.stderr }}"

    - name: Read where Forgejo's ports listen
      ansible.builtin.command:
        cmd: ss -Hltn '( sport = :3000 or sport = :2222 )'
      register: verify_forge_listen
      changed_when: false

    - name: Assert Forgejo's ports listen on the VPN's address alone
      ansible.builtin.assert:
        that:
          - verify_forge_ports | length == 2
          - verify_forge_ports | reject('match', '^10\.73\.0\.1:') | list | length == 0
        fail_msg: "Forgejo listens on: {{ verify_forge_listen.stdout_lines }}"
      vars:
        verify_forge_ports: "{{ verify_forge_listen.stdout_lines | map('split') | map(attribute=3) | list }}"

    - name: Reach ssh on the public address, from where Molecule connects
      ansible.builtin.wait_for:
        host: "{{ ansible_host }}"
        port: 22
        timeout: 10
      delegate_to: localhost
      become: false

    - name: Reach the same service on the public address, from where Molecule connects
      ansible.builtin.wait_for:
        host: "{{ ansible_host }}"
        port: 8080
        timeout: 5
      delegate_to: localhost
      become: false
      register: verify_public_reach
      failed_when: false

    - name: Assert the public address refuses the service
      ansible.builtin.assert:
        that: verify_public_reach.msg is defined and verify_public_reach.msg is search('Timeout')
        fail_msg: "{{ ansible_host }}:8080 answered on the public address: {{ verify_public_reach }}"

    - name: Read the host's private key's value, only to search the run's lines for it
      ansible.builtin.slurp:
        src: /root/vpn-host.key
      register: verify_host_key
      no_log: true

    - name: Read the lines of the last up, to search for the key
      ansible.builtin.slurp:
        src: /root/porelo-host-up.lines
      register: verify_key_lines

    - name: Assert the host's private key appears in no line of up
      ansible.builtin.assert:
        that: (verify_host_key.content | b64decode | trim) not in (verify_key_lines.content | b64decode)
        fail_msg: the host's private VPN key appears in up's lines
      no_log: true

    # The drive's client, the stub in its place: the person's tresor syncs into the drive's folder, nothing else does.
    - name: Read where the client syncs each tresor to
      ansible.builtin.command:
        cmd: /home/{{ verify_account }}/.local/share/tresorit/tresorit-cli -p tresors
      become: true
      become_user: "{{ verify_account }}"
      register: verify_tresors
      changed_when: false

    - name: Assert only the person's tresor syncs, into the drive's folder
      ansible.builtin.assert:
        that: verify_tresors.stdout_lines | map('split', '\t') | map('batch', 2) | map('first') | list
          == [['porelo-test-drive', verify_drive], ['porelo-test-other', '-']]
        fail_msg: "the client syncs: {{ verify_tresors.stdout_lines }}"

    - name: Read the client's daemon's user unit
      ansible.builtin.systemd_service:
        name: tresorit-daemon.service
        scope: user
      become: true
      become_user: "{{ verify_account }}"
      environment:
        XDG_RUNTIME_DIR: "/run/user/{{ ansible_facts['getent_passwd'][verify_account][1] }}"
      register: verify_daemon

    - name: Assert the daemon runs
      ansible.builtin.assert:
        that: verify_daemon.status.ActiveState == 'active'
        fail_msg: "tresorit-daemon.service is {{ verify_daemon.status.ActiveState | default(verify_daemon) }}"

    # Up made the publisher's token once; forgetting that it did makes the -vvv run below make it again, so that run's
    # output is searched for a token it handled.
    - name: Forget that the publisher's secret was set, so up with -vvv makes its token again
      ansible.builtin.file:
        path: /home/porelo-forge/.config/porelo-forge/publisher.set
        state: absent

    # Removing the drive's key before up with -vvv makes that run put it back while its output is searched.
    - name: Remove the drive's key from the vault before up with -vvv
      ansible.builtin.command:
        cmd: porelo vault remove converge-key
      become: true
      become_user: "{{ verify_account }}"
      environment:
        XDG_RUNTIME_DIR: "/run/user/{{ ansible_facts['getent_passwd'][verify_account][1] }}"
      changed_when: true

    - name: Ask Porelo what the vault holds before up with -vvv
      ansible.builtin.command:
        cmd: porelo vault list
      become: true
      become_user: "{{ verify_account }}"
      environment:
        XDG_RUNTIME_DIR: "/run/user/{{ ansible_facts['getent_passwd'][verify_account][1] }}"
      register: verify_vault_before_vvv
      changed_when: false

    - name: Assert the drive's key is not in the vault before up with -vvv
      ansible.builtin.assert:
        that: verify_vault_before_vvv.stdout is not search('^converge-key ', multiline=True)
        fail_msg: "asked for converge-key to be absent from the vault, got: {{ verify_vault_before_vvv.stdout }}"

    # Ansible's own most talkative output of a whole up, searched for the host's and the pool's private keys and tokens.
    - name: Run up again with Ansible's -vvv and its own output
      ansible.builtin.shell:
        cmd: |
          set -euo pipefail
          umask 077
          ansible-playbook -vvv -c local -i /root/porelo-host-inventory.yml -i /root/porelo-host-forge.yml \
              porelo.host.up 2>&1 | tee /root/porelo-host-vvv.out
        executable: /bin/bash
      environment:
        LC_ALL: C.UTF-8
      register: verify_vvv
      changed_when: false
      no_log: true

    - name: Read the person's token for the central forge, only to search the run's output for it
      ansible.builtin.slurp:
        src: /srv/porelo-host/drive/porelo-host/forge-central.token
      register: verify_central_token
      no_log: true

    - name: Read the forge's API token, only to search the run's output for it
      ansible.builtin.slurp:
        src: /home/porelo-forge/.config/porelo-forge/api.token
      register: verify_forge_token
      no_log: true

    - name: Assert up with -vvv ran, and its output holds no trace of the host's private key or either token
      ansible.builtin.assert:
        that:
          - verify_vvv.rc == 0
          - (verify_host_key.content | b64decode | trim) not in (verify_vvv.stdout + verify_vvv.stderr)
          - (verify_central_token.content | b64decode | trim) | length > 20
          - (verify_central_token.content | b64decode | trim) not in (verify_vvv.stdout + verify_vvv.stderr)
          - (verify_forge_token.content | b64decode | trim) | length > 20
          - (verify_forge_token.content | b64decode | trim) not in (verify_vvv.stdout + verify_vvv.stderr)
        fail_msg: "up with -vvv gave rc {{ verify_vvv.rc }}, or its output holds the host's private VPN key, the
          person's token for the central forge or the forge's API token"
      no_log: true

    - name: Search the -vvv output for every body line of the pool's private keys
      ansible.builtin.shell:
        cmd: |
          set -euo pipefail
          trap 'rm -f /root/porelo-host-vvv.out' EXIT
          [ -s /root/porelo-host-vvv.out ] || { echo "no -vvv output at /root/porelo-host-vvv.out" >&2; exit 1; }
          for key in /var/lib/porelo-host/pool/run-key /var/lib/porelo-host/pool/porelo-pool-ubuntu-1/host; do
              [ "$(sed '1d;$d' "$key" | wc -l)" -gt 0 ] || { echo "no key body in $key" >&2; exit 1; }
              if sed '1d;$d' "$key" | grep -Fq -f - /root/porelo-host-vvv.out; then
                  echo "$key appears in up -vvv output" >&2
                  exit 1
              fi
          done
        executable: /bin/bash
      register: verify_pool_keys_vvv
      changed_when: false
      failed_when: false
      no_log: true
      when: verify_vm_pool == 'on'

    - name: Assert the -vvv output holds no body line of the pool's private keys
      ansible.builtin.assert:
        that: verify_pool_keys_vvv.rc == 0
        fail_msg: "{{ verify_pool_keys_vvv.stderr }}"
      when: verify_vm_pool == 'on'

    # The drive's key put by up with -vvv is in no output, journal or ~/.ansible file (no fact cache is configured).
    - name: Ask Porelo what the vault holds after up with -vvv
      ansible.builtin.command:
        cmd: porelo vault list
      become: true
      become_user: "{{ verify_account }}"
      environment:
        XDG_RUNTIME_DIR: "/run/user/{{ ansible_facts['getent_passwd'][verify_account][1] }}"
      register: verify_vault_after_vvv
      changed_when: false

    - name: Read the drive's key, only to search the run's output for it
      ansible.builtin.slurp:
        src: /srv/porelo-host/drive/porelo-host/keys/converge-key
      register: verify_drive_key
      no_log: true

    - name: Search the journal and Ansible's directories for the drive's key
      ansible.builtin.shell:
        cmd: |
          set -euo pipefail
          umask 077
          key=$(mktemp) journal=$(mktemp)
          trap 'rm -f "$key" "$journal"' EXIT
          tr -d '\r\n' < /srv/porelo-host/drive/porelo-host/keys/converge-key > "$key"
          echo >> "$key"
          [ "$(wc -c < "$key")" -gt 21 ] || { echo "key file too short" >&2; exit 1; }
          journalctl -o cat --no-pager > "$journal"
          # grep's 2 is a search that could not run, which must never read as clean.
          search() {
              rc=0
              grep "$@" || rc=$?
              case $rc in 0) echo found ;; 1) echo clean ;; *) echo "grep ended $rc" >&2; return 1 ;; esac
          }
          found=$(search -Fq -f "$key" "$journal")
          echo "journal: $found"
          for dir in /root/.ansible /home/{{ verify_account }}/.ansible; do
              if [ ! -d "$dir" ]; then
                  echo "$dir: absent"
              else
                  found=$(search -rFq -f "$key" "$dir")
                  echo "$dir: $found"
              fi
          done
        executable: /bin/bash
      register: verify_drive_key_search
      changed_when: false
      no_log: true

    - name: Assert up with -vvv put the drive's key back and left its value in no output, journal or Ansible file
      ansible.builtin.assert:
        that:
          - verify_vault_after_vvv.stdout is search('^converge-key ', multiline=True)
          - (verify_drive_key.content | b64decode | trim) | length > 20
          - (verify_drive_key.content | b64decode | trim) not in (verify_vvv.stdout + verify_vvv.stderr)
          - verify_drive_key_search.stdout_lines | length == 3
          - verify_drive_key_search.stdout_lines[0] is match('journal')
          - verify_drive_key_search.stdout_lines | reject('search', ' (clean|absent)$') | list | length == 0
        fail_msg: >-
          asked for converge-key in the vault and its value in no -vvv output, journal or ~/.ansible file;
          vault list gave '{{ verify_vault_after_vvv.stdout }}',
          in -vvv: {{ (verify_drive_key.content | b64decode | trim) in (verify_vvv.stdout + verify_vvv.stderr) }},
          search gave {{ verify_drive_key_search.stdout_lines }}
      no_log: true

    # A vault passphrase leaked by up must be caught in its output, the whole journal and persistent host files.
    - name: Search for the vault passphrase with protected temporary files
      vars:
        verify_account_home: "{{ ansible_facts['getent_passwd'][verify_account][4] }}"
      block:
        - name: Create a private directory for the passphrase search
          ansible.builtin.tempfile:
            state: directory
            prefix: porelo-passphrase-search-
          register: verify_passphrase_files

        - name: Write the passphrase search pattern privately
          ansible.builtin.copy:
            content: "{{ verify_vault_passphrase }}\n"
            dest: "{{ verify_passphrase_files.path }}/pattern"
            mode: '0600'
          no_log: true

        - name: Write the registered verbose output privately for the search
          ansible.builtin.copy:
            content: "{{ verify_vvv.stdout }}\n{{ verify_vvv.stderr }}"
            dest: "{{ verify_passphrase_files.path }}/verbose"
            mode: '0600'
          no_log: true

        - name: Search the verbose output, journal and host files for the passphrase
          ansible.builtin.shell:
            cmd: |
              set -euo pipefail
              umask 077
              work={{ verify_passphrase_files.path | quote }}
              pattern="$work/pattern"
              [ -s "$pattern" ] || { echo "empty passphrase pattern" >&2; exit 1; }
              journalctl -o cat --no-pager > "$work/journal"
              search() {
                  rc=0
                  grep -rFq -f "$pattern" -- "$1" || rc=$?
                  case $rc in 0) echo found ;; 1) echo clean ;; *) echo "grep ended $rc" >&2; return 1 ;; esac
              }
              echo "/root/.ansible/tmp: excluded"
              echo "{{ verify_account_home }}/.ansible/tmp: excluded"
              result=$(search "$work/verbose")
              echo "up -vvv: $result"
              result=$(search "$work/journal")
              echo "journal: $result"
              # One grep per batch of files, not per file: the account's container storage holds very many.
              for dir in /root /home /srv/porelo-host /etc /var/log; do
                  : > "$work/hits"; : > "$work/errors"
                  find "$dir" \( -path /root/.ansible/tmp \
                      -o -path {{ (verify_account_home ~ '/.ansible/tmp') | quote }} \) \
                      -prune -o -type f -print0 2> "$work/find-errors" |
                      xargs -0 -r grep -lF -D skip -f "$pattern" -- > "$work/hits" 2> "$work/errors" || true
                  # A file grep could not read is a search that did not run, never a clean one.
                  [ ! -s "$work/errors" ] && [ ! -s "$work/find-errors" ] ||
                      { echo "grep or find could not read under $dir" >&2; exit 1; }
                  if [ -s "$work/hits" ]; then echo "$dir: found"; else echo "$dir: clean"; fi
              done
            executable: /bin/bash
          register: verify_passphrase_search
          changed_when: false
          failed_when: false
          no_log: true
      always:
        - name: Remove the passphrase search's private directory
          ansible.builtin.file:
            path: "{{ verify_passphrase_files.path }}"
            state: absent
          when: verify_passphrase_files.path is defined

    - name: Assert the passphrase appears in no verbose output, journal or persistent host file
      ansible.builtin.assert:
        that:
          - verify_passphrase_search.rc == 0
          - verify_passphrase_search.stdout_lines == verify_passphrase_expected
        fail_msg: >-
          passphrase search expected every place clean; found in
          {{ verify_passphrase_search.stdout_lines | select('search', ': found$') | list }};
          search rc {{ verify_passphrase_search.rc }}, places checked {{ verify_passphrase_search.stdout_lines }}
        success_msg: "{{ verify_passphrase_search.stdout_lines }}"
      vars:
        verify_passphrase_expected:
          - '/root/.ansible/tmp: excluded'
          - "{{ ansible_facts['getent_passwd'][verify_account][4] }}/.ansible/tmp: excluded"
          - 'up -vvv: clean'
          - 'journal: clean'
          - '/root: clean'
          - '/home: clean'
          - '/srv/porelo-host: clean'
          - '/etc: clean'
          - '/var/log: clean'

    # A shut vault stops up with needs: ["vault"] before any key from the drive is deposited into the vault.
    - name: Remove the drive's key from the vault and lock the vault
      ansible.builtin.command:
        cmd: "{{ item }}"
      loop: [porelo vault remove converge-key, porelo vault lock]
      become: true
      become_user: "{{ verify_account }}"
      environment:
        XDG_RUNTIME_DIR: "/run/user/{{ ansible_facts['getent_passwd'][verify_account][1] }}"
      changed_when: true

    - name: Ask Porelo whether the vault is shut
      ansible.builtin.command:
        cmd: porelo vault status
      become: true
      become_user: "{{ verify_account }}"
      environment:
        XDG_RUNTIME_DIR: "/run/user/{{ ansible_facts['getent_passwd'][verify_account][1] }}"
      register: verify_vault_locked
      changed_when: false
      failed_when: false

    - name: Assert the vault is shut
      ansible.builtin.assert:
        that: verify_vault_locked.rc == 3
        fail_msg: "asked porelo vault status for 3 (shut), got {{ verify_vault_locked.rc }}"

    - name: Run up while the vault is shut, its steps as JSON lines
      ansible.builtin.command:
        cmd: ansible-playbook -c local -i /root/porelo-host-inventory.yml -i /root/porelo-host-forge.yml porelo.host.up
      environment:
        ANSIBLE_STDOUT_CALLBACK: porelo.host.lines
        LC_ALL: C.UTF-8
      register: verify_locked_up
      changed_when: false
      failed_when: false

    - name: Unlock the vault again as the account
      ansible.builtin.command:
        cmd: porelo vault unlock --passphrase-stdin
        stdin: "{{ verify_vault_passphrase }}"
      become: true
      become_user: "{{ verify_account }}"
      environment:
        XDG_RUNTIME_DIR: "/run/user/{{ ansible_facts['getent_passwd'][verify_account][1] }}"
      changed_when: true
      no_log: true

    - name: Ask Porelo for the vault's status and entries after up on the shut vault
      ansible.builtin.command:
        cmd: "{{ item }}"
      loop: [porelo vault status, porelo vault list]
      become: true
      become_user: "{{ verify_account }}"
      environment:
        XDG_RUNTIME_DIR: "/run/user/{{ ansible_facts['getent_passwd'][verify_account][1] }}"
      register: verify_after_locked_up
      changed_when: false
      failed_when: false

    - name: Assert up stopped for the vault alone without depositing the key, and unlock opened the vault
      ansible.builtin.assert:
        that:
          - verify_locked_up.rc == 2
          - verify_locked_waiting | length == 1
          - verify_locked_waiting[0].needs == ['vault']
          - verify_locked_failed | length == 0
          - verify_after_locked_up.results[0].rc == 0
          - verify_after_locked_up.results[1].stdout is not search('^converge-key ', multiline=True)
        fail_msg: >-
          up on shut vault gave rc {{ verify_locked_up.rc }} and lines {{ verify_locked_up.stdout }};
          after unlock, vault status rc {{ verify_after_locked_up.results[0].rc }},
          vault list '{{ verify_after_locked_up.results[1].stdout }}'
      vars:
        verify_locked_lines: "{{ verify_locked_up.stdout_lines | select | map('from_json') | list }}"
        verify_locked_waiting: "{{ verify_locked_lines | selectattr('state', 'equalto', 'waiting') | list }}"
        verify_locked_failed: "{{ verify_locked_lines | selectattr('state', 'equalto', 'failed') | list }}"

    - name: Run up after unlocking the vault, its steps as JSON lines
      ansible.builtin.command:
        cmd: ansible-playbook -c local -i /root/porelo-host-inventory.yml -i /root/porelo-host-forge.yml porelo.host.up
      environment:
        ANSIBLE_STDOUT_CALLBACK: porelo.host.lines
        LC_ALL: C.UTF-8
      register: verify_unlocked_up
      changed_when: >-
        verify_unlocked_up.stdout is search('"state": "changed"')

    - name: Ask Porelo what the vault holds after up on the unlocked vault
      ansible.builtin.command:
        cmd: porelo vault list
      become: true
      become_user: "{{ verify_account }}"
      environment:
        XDG_RUNTIME_DIR: "/run/user/{{ ansible_facts['getent_passwd'][verify_account][1] }}"
      register: verify_vault_restored
      changed_when: false

    - name: Assert up after unlocking the vault put the drive's key back
      ansible.builtin.assert:
        that:
          - verify_unlocked_up.rc == 0
          - verify_vault_restored.stdout is search('^converge-key ', multiline=True)
        fail_msg: >-
          up after unlock gave rc {{ verify_unlocked_up.rc }};
          asked vault list for converge-key, got '{{ verify_vault_restored.stdout }}'

    # A machine file whose signature does not check stops up with Porelo's refusal, and starts no task.
    - name: Stop the task started by hand before testing a refused signature
      ansible.builtin.command:
        cmd: porelo task stop porelo-converge-converge-1
      become: true
      become_user: "{{ verify_account }}"
      environment:
        XDG_RUNTIME_DIR: "/run/user/{{ ansible_facts['getent_passwd'][verify_account][1] }}"
      changed_when: true

    - name: Ask Porelo whether the task runs after stopping it
      ansible.builtin.command:
        cmd: porelo task status porelo-converge-converge-1 --json
      become: true
      become_user: "{{ verify_account }}"
      environment:
        XDG_RUNTIME_DIR: "/run/user/{{ ansible_facts['getent_passwd'][verify_account][1] }}"
      register: verify_stopped_task
      changed_when: false

    - name: Assert the task is not running before testing a refused signature
      ansible.builtin.assert:
        that: not (verify_stopped_task.stdout | from_json).running
        fail_msg: "asked for porelo-converge-converge-1 to be stopped, got: {{ verify_stopped_task.stdout }}"

    - name: Refuse a machine file whose signature does not check, and always restore the original
      block:
        - name: Keep the original machine file as a backup
          ansible.builtin.copy:
            src: /srv/porelo-host/drive/porelo-host/machine.yml
            dest: /root/machine.yml.bak
            remote_src: true
            owner: root
            group: root
            mode: "0600"

        - name: Replace signed_by in a copy of the machine file with a throwaway ed25519 key's fingerprint
          ansible.builtin.shell:
            cmd: |
              set -euo pipefail
              tmp=$(mktemp -d)
              trap 'rm -rf "$tmp"' EXIT
              ssh-keygen -q -t ed25519 -N "" -C throwaway -f "$tmp/key"
              other=$(ssh-keygen -lf "$tmp/key.pub" | cut -d' ' -f2)
              sed "s|^  signed_by: .*|  signed_by: \"$other\"|" /root/machine.yml.bak \
                  > /srv/porelo-host/drive/porelo-host/machine.yml
              printf '%s\n' "$other"
            executable: /bin/bash
          register: verify_other_signer
          changed_when: true

        - name: Run up with the machine file naming the wrong signing key
          ansible.builtin.command:
            cmd: >-
              ansible-playbook -c local -i /root/porelo-host-inventory.yml -i /root/porelo-host-forge.yml
              porelo.host.up
          environment:
            ANSIBLE_STDOUT_CALLBACK: porelo.host.lines
            LC_ALL: C.UTF-8
          register: verify_wrong_key_up
          changed_when: false
          failed_when: false

        - name: Ask Porelo whether the task runs after the refused machine file
          ansible.builtin.command:
            cmd: porelo task status porelo-converge-converge-1 --json
          become: true
          become_user: "{{ verify_account }}"
          environment:
            XDG_RUNTIME_DIR: "/run/user/{{ ansible_facts['getent_passwd'][verify_account][1] }}"
          register: verify_wrong_key_task
          changed_when: false

        - name: Assert up failed with Porelo's signature refusal and started no task
          ansible.builtin.assert:
            that:
              - verify_wrong_key_up.rc != 0
              - verify_wrong_key_waiting | length == 0
              - verify_wrong_key_failed | length == 1
              - verify_wrong_key_failed[0].msg is search('refused .* with 65 ')
              - verify_wrong_key_failed[0].msg is search('signed by SHA256:\S+, not by '
                ~ (verify_other_signer.stdout | trim | regex_escape)
                ~ '\. Nothing was pinned\. No inventory was written\.')
              - not (verify_wrong_key_task.stdout | from_json).running
            fail_msg: >-
              asked for up to fail with 65 and 'signed by ..., not by {{ verify_other_signer.stdout | trim }}.
              Nothing was pinned.' and no running task; got rc {{ verify_wrong_key_up.rc }},
              lines {{ verify_wrong_key_up.stdout }}, task {{ verify_wrong_key_task.stdout }}
          vars:
            verify_wrong_key_lines: "{{ verify_wrong_key_up.stdout_lines | select | map('from_json') | list }}"
            verify_wrong_key_waiting: >-
              {{ verify_wrong_key_lines | selectattr('state', 'equalto', 'waiting') | list }}
            verify_wrong_key_failed: >-
              {{ verify_wrong_key_lines | selectattr('state', 'equalto', 'failed') | list }}
      always:
        - name: Restore the original machine file on the drive
          ansible.builtin.copy:
            src: /root/machine.yml.bak
            dest: /srv/porelo-host/drive/porelo-host/machine.yml
            remote_src: true
            owner: "{{ verify_account }}"
            group: "{{ verify_account }}"
            mode: "0644"

        - name: Remove the backup of the machine file
          ansible.builtin.file:
            path: /root/machine.yml.bak
            state: absent

    - name: Run up again after restoring the machine file
      ansible.builtin.command:
        cmd: ansible-playbook -c local -i /root/porelo-host-inventory.yml -i /root/porelo-host-forge.yml porelo.host.up
      environment:
        ANSIBLE_STDOUT_CALLBACK: porelo.host.lines
        LC_ALL: C.UTF-8
      register: verify_restored_up
      changed_when: >-
        verify_restored_up.stdout is search('"state": "changed"')

    - name: Ask Porelo whether up left the task stopped after restoring the machine file
      ansible.builtin.command:
        cmd: porelo task status porelo-converge-converge-1 --json
      become: true
      become_user: "{{ verify_account }}"
      environment:
        XDG_RUNTIME_DIR: "/run/user/{{ ansible_facts['getent_passwd'][verify_account][1] }}"
      register: verify_restored_task
      changed_when: false

    - name: Assert up after restoring the machine file ended 0 and left the task stopped
      ansible.builtin.assert:
        that:
          - verify_restored_up.rc == 0
          - not (verify_restored_task.stdout | from_json).running
        fail_msg: >-
          asked for up rc 0 and porelo-converge-converge-1 stopped;
          got rc {{ verify_restored_up.rc }} ({{ verify_restored_up.stdout }}),
          task {{ verify_restored_task.stdout }}

    - name: Start the task again by hand after up left it stopped
      ansible.builtin.command:
        cmd: porelo task start converge-1 -p converge -r code --agent stub --detach --no-input
      become: true
      become_user: "{{ verify_account }}"
      environment:
        XDG_RUNTIME_DIR: "/run/user/{{ ansible_facts['getent_passwd'][verify_account][1] }}"
      changed_when: true

    # The forge role: the repository migrated from the stand-in for the central forge, with its push mirror back.
    - name: Ask the forge for the migrated repository and its push mirrors
      ansible.builtin.shell:
        cmd: |
          set -euo pipefail
          api() { curl -fsS --cacert /etc/porelo-host/forge/ca.pem -H @<(printf 'Authorization: token %s\n' \
              "$(cat /home/porelo-forge/.config/porelo-forge/api.token)") "$@"; }
          base=https://10.73.0.1:3000/api/v1/repos/porelo/stand-in
          api "$base" && echo && api "$base/push_mirrors" && echo && api "$base/contents/README.md"
        executable: /bin/bash
      register: verify_forge_repo
      changed_when: false
      failed_when: false

    - name: Assert the repository was migrated with its content, as no mirror, its push mirror back on no interval
      ansible.builtin.assert:
        that:
          - verify_forge_repo.rc == 0
          - not verify_forge_lines[0].mirror
          - verify_forge_lines[1] | length == 1
          - verify_forge_lines[1][0].remote_address == 'https://10.73.0.1:3000/central/stand-in.git'
          - verify_forge_lines[1][0].interval in ['0s', '0']
          - not verify_forge_lines[1][0].sync_on_commit
          - verify_forge_lines[2].name == 'README.md'
        fail_msg: "the forge's repository: rc {{ verify_forge_repo.rc }}, {{ verify_forge_repo.stdout }}
          {{ verify_forge_repo.stderr }}"
      vars:
        verify_forge_lines: "{{ verify_forge_repo.stdout_lines | select | map('from_json') | list }}"

    # The forge role's runner and registry: the workflow converge committed to the unreviewed branch runs again for a
    # second commit there, after the -vvv run made the publisher's token anew, so that run publishes with the new one.
    - name: Commit again to the unreviewed branch, which runs the workflow with the publisher's new token
      ansible.builtin.shell:
        cmd: |
          set -euo pipefail
          curl -fsS --cacert /etc/porelo-host/forge/ca.pem -H 'Content-Type: application/json' \
              -H @<(printf 'Authorization: token %s\n' "$(cat /home/porelo-forge/.config/porelo-forge/api.token)") \
              -X POST https://10.73.0.1:3000/api/v1/repos/porelo/stand-in/contents/again \
              -d '{"content": "YWdhaW4K", "message": "Run again", "branch": "task-probe"}'
        executable: /bin/bash
      register: verify_forge_again
      changed_when: true

    - name: Wait until both of the branch's runs have ended on the host's runner
      ansible.builtin.shell:
        cmd: |
          set -euo pipefail
          curl -fsS --cacert /etc/porelo-host/forge/ca.pem \
              -H @<(printf 'Authorization: token %s\n' "$(cat /home/porelo-forge/.config/porelo-forge/api.token)") \
              https://10.73.0.1:3000/api/v1/repos/porelo/stand-in/actions/tasks
        executable: /bin/bash
      register: verify_forge_runs
      until: >-
        verify_forge_runs.rc == 0
        and (verify_forge_runs.stdout | from_json).workflow_runs | selectattr('status', 'in', ['success', 'failure'])
        | list | length >= 2
      retries: 40
      delay: 15
      changed_when: false
      failed_when: false

    # Read only when a job did not succeed: the runner's journal on this VM says why.
    - name: Read the runner's journal, to say why a job failed
      ansible.builtin.shell:
        cmd: >-
          set -o pipefail && journalctl --no-pager -n 60 _UID="$(id -u porelo-runner)"
          | grep -e 'exited with status' -e 'level=' -e "the run's own token"
        executable: /bin/bash
      register: verify_forge_job_log
      changed_when: false
      failed_when: false
      when: verify_forge_failed | length > 0
      vars:
        verify_forge_failed: >-
          {{ (verify_forge_runs.stdout | default('{}') | from_json).workflow_runs | default([])
          | rejectattr('status', 'equalto', 'success') | list }}

    - name: >-
        Assert both runs on the unreviewed branch reached the forge over TLS, were refused with the run's own token
        and published with the publisher's
      ansible.builtin.assert:
        that:
          - verify_forge_branch | length == 2
          - verify_forge_branch | rejectattr('status', 'equalto', 'success') | list | length == 0
          - verify_forge_branch | selectattr('head_sha', 'equalto', verify_forge_again_sha) | list | length == 1
        fail_msg: >-
          the runs: {{ verify_forge_runs.stdout }}; the runner: {{ verify_forge_job_log.stdout | default('') }}
      vars:
        verify_forge_branch: >-
          {{ (verify_forge_runs.stdout | from_json).workflow_runs | selectattr('head_branch', 'equalto', 'task-probe')
          | list }}
        verify_forge_again_sha: "{{ (verify_forge_again.stdout | from_json).commit.sha }}"

    # The second run's package holds the digests of the publisher's token the -vvv run made and of the pool's run key;
    # neither secret is read here. The forge's API token may not read packages, so verify pipes a read:package token of
    # the admin's straight into curl's header.
    - name: Read the digests of the publisher's token and the pool's run key from the package the second run published
      ansible.builtin.shell:
        cmd: |
          set -euo pipefail
          cd /
          probe=https://10.73.0.1:3000/api/packages/porelo/generic/probe/{{ verify_forge_again_run }}
          curl -fsS --cacert /etc/porelo-host/forge/ca.pem \
              -H @<(runuser -u porelo-forge -- env XDG_RUNTIME_DIR=/run/user/$(id -u porelo-forge) \
                  podman exec forgejo forgejo admin user generate-access-token --username porelo-admin \
                  --token-name verify-$(date -u +%Y%m%dT%H%M%SZ) --scopes read:package --raw \
                  | sed 's/^/Authorization: token /') \
              "$probe/digest"{% if verify_vm_pool == 'on' %} "$probe/pool-key-digest"{% endif %}
        executable: /bin/bash
      register: verify_publisher_digest
      changed_when: false
      failed_when: false
      no_log: true
      vars:
        verify_forge_again_run: >-
          {{ ((verify_forge_runs.stdout | from_json).workflow_runs
          | selectattr('head_sha', 'equalto', (verify_forge_again.stdout | from_json).commit.sha) | first).run_number }}

    - name: Stop when the second run's package digests could not be read, with curl's answer
      ansible.builtin.assert:
        that:
          - verify_publisher_digest.rc == 0
          - verify_publisher_digest.stdout_lines | length == (2 if verify_vm_pool == 'on' else 1)
        fail_msg: "{{ verify_publisher_digest.stderr }}"

    - name: Read every 40-digit hex string in the journal, the form of Forgejo's tokens
      ansible.builtin.shell:
        cmd: set -o pipefail && journalctl -o cat --no-pager | grep -oE '[0-9a-f]{40}' | sort -u || true
        executable: /bin/bash
      register: verify_journal_hex
      changed_when: false
      no_log: true

    - name: Read every 40-digit hex string in the environment of the account's task containers
      ansible.builtin.shell:
        cmd: >-
          set -o pipefail && podman ps -aq | xargs -r podman inspect --format {% raw %}'{{.Config.Env}}'{% endraw %}
          | grep -oE '[0-9a-f]{40}' | sort -u || true
        executable: /bin/bash
      become: true
      become_user: "{{ verify_account }}"
      environment:
        XDG_RUNTIME_DIR: "/run/user/{{ ansible_facts['getent_passwd'][verify_account][1] }}"
      register: verify_task_hex
      changed_when: false
      no_log: true

    # A string is the token only if its digest is the package's; a token in any other form would be no 40-digit hex.
    - name: Assert the publisher's token is in no output of up with -vvv, in no journal line and in no task's container
      ansible.builtin.assert:
        that:
          - verify_forge_token.content | b64decode | trim is match('^[0-9a-f]{40}$')
          - verify_publisher_digest.stdout_lines[0] is match('^[0-9a-f]{64}$')
          - verify_publisher_digest.stdout_lines[0] not in verify_hex_digests
        fail_msg: >-
          the publisher's token is in the -vvv output, the journal or a task's container, or Forgejo's tokens are not
          the 40-digit hex this search looks for
      vars:
        verify_hex_digests: >-
          {{ ((verify_vvv.stdout + verify_vvv.stderr) | regex_findall('[0-9a-f]{40}')
          + verify_journal_hex.stdout_lines + verify_task_hex.stdout_lines) | unique | map('hash', 'sha256') | list }}
      no_log: true

    # A key file missing on the drive stops the vpn role before the firewall's rules are written again.

    # The VM pool: one VM per run account, its file for porelo-machines holding no key, its run key on the host alone
    # and reaching jobs as the forge organization's Actions secret, and a give-back that leaves nothing of the run on
    # the VM, what the run wrote as root included.
    - name: Read the pool file porelo-machines reads
      ansible.builtin.slurp:
        src: /etc/porelo-host/pool/pool.json
      register: verify_pool_file
      when: verify_vm_pool == 'on'

    - name: Read the pool file's owner and mode
      ansible.builtin.stat:
        path: /etc/porelo-host/pool/pool.json
      register: verify_pool_file_stat
      when: verify_vm_pool == 'on'

    - name: Read the pool's run key's owner and mode
      ansible.builtin.stat:
        path: /var/lib/porelo-host/pool/run-key
      register: verify_pool_key
      when: verify_vm_pool == 'on'

    - name: Compute the digest of the pool's run key on the host
      ansible.builtin.shell:
        cmd: |
          set -euo pipefail
          printf '%s' "$(cat /var/lib/porelo-host/pool/run-key)" | sha256sum | cut -d' ' -f1
        executable: /bin/bash
      register: verify_pool_key_digest
      changed_when: false
      no_log: true
      when: verify_vm_pool == 'on'

    - name: >-
        Assert the pool file names one VM with one account and no key, is mode 0644, and the run key stays root's on
        the host and reached the job as the organization's Actions secret
      ansible.builtin.assert:
        that:
          - verify_pool.format == 'porelo-machines-pool/1'
          - verify_pool.vms | length == 1
          - verify_pool.vms[0].os == 'ubuntu'
          - verify_pool.vms[0].accounts == ['run']
          - verify_pool.vms[0].hostKey is match('^ssh-ed25519 ')
          - "'admin' not in verify_pool"
          - "'runKey' not in verify_pool"
          - verify_pool_file_stat.stat.pw_name == 'root'
          - verify_pool_file_stat.stat.gr_name == 'root'
          - verify_pool_file_stat.stat.mode == '0644'
          - verify_pool_key.stat.pw_name == 'root'
          - verify_pool_key.stat.gr_name == 'root'
          - verify_pool_key.stat.mode == '0600'
          - verify_pool_key_digest.stdout is match('^[0-9a-f]{64}$')
          - verify_publisher_digest.stdout_lines[1] == verify_pool_key_digest.stdout
        fail_msg: >-
          the pool file: {{ verify_pool }} ({{ verify_pool_file_stat.stat }});
          the run key: {{ verify_pool_key.stat }};
          digest {{ verify_publisher_digest.stdout_lines[1] }} vs {{ verify_pool_key_digest.stdout }}
      vars:
        verify_pool: "{{ verify_pool_file.content | b64decode | from_json }}"
      when: verify_vm_pool == 'on'

    - name: Ask libvirt for the pool's seed volumes and the pool VM's cdrom media
      ansible.builtin.shell:
        cmd: |
          set -euo pipefail
          virsh -c qemu:///system vol-list images | awk '{print $1}' | grep '^porelo-pool-.*-seed\.iso$' || true
          virsh -c qemu:///system domblklist porelo-pool-ubuntu-1 --details | awk '$2 == "cdrom" && $4 != "-"'
        executable: /bin/bash
      environment:
        LC_ALL: C
      register: verify_pool_seed
      changed_when: false
      when: verify_vm_pool == 'on'

    - name: Assert no seed volume stays in libvirt's pool and the pool VM has no cdrom media
      ansible.builtin.assert:
        that: verify_pool_seed.stdout | trim == ''
        fail_msg: "seed left in libvirt: {{ verify_pool_seed.stdout_lines }}"
      when: verify_vm_pool == 'on'

    - name: Give the pool VM's account back after a run that left something, as itself and as root
      ansible.builtin.shell:
        cmd: |
          set -euo pipefail
          address={{ verify_pool_vm.address }}
          printf '%s %s\n' "$address" '{{ verify_pool_vm.hostKey }}' > /root/pool-known-hosts
          on() { ssh -n -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=5 -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile=/root/pool-known-hosts -i /var/lib/porelo-host/pool/run-key run@"$address" "$@"; }
          on 'echo a-run > ~/left-by-a-run && sudo sh -c "echo a-run > /etc/left-by-a-run"'
          on 'sudo -n porelo-pool-give-back'
          echo "gave back at $(date +%s)"
          for i in $(seq 1 60); do
              said=$(on 'cat /var/lib/porelo-pool/run' 2>/dev/null || true)
              if [ "$said" = ready ]; then
                  echo "ready again at $(date +%s)"
                  on 'test -e ~/left-by-a-run && echo home: left || echo home: clean'
                  on 'test -e /etc/left-by-a-run && echo etc: left || echo etc: clean'
                  exit 0
              fi
              sleep 2
          done
          echo "never ready again; it last said: $said"
          exit 1
        executable: /bin/bash
      register: verify_pool_given_back
      changed_when: true
      failed_when: false
      vars:
        verify_pool_vm: "{{ (verify_pool_file.content | b64decode | from_json).vms[0] }}"
      when: verify_vm_pool == 'on'

    # The revert must have watched for the VM's stop, not been started again and again: a service that exits at once
    # and restarts every few seconds still reverts, by its first loop, and would hide a watch that never ran.
    - name: Ask systemd how often the revert was started again
      ansible.builtin.systemd_service:
        name: porelo-pool-revert.service
      register: verify_pool_restarts
      when: verify_vm_pool == 'on'

    - name: Assert the revert ran once, watching
      ansible.builtin.assert:
        that: verify_pool_restarts.status.NRestarts == '0'
        fail_msg: "porelo-pool-revert.service was started again {{ verify_pool_restarts.status.NRestarts }} times"
      when: verify_vm_pool == 'on'

    - name: Read the revert's journal, to say why the VM did not come back
      ansible.builtin.command:
        cmd: journalctl --no-pager -n 20 -u porelo-pool-revert.service
      register: verify_pool_revert_log
      changed_when: false
      when: verify_vm_pool == 'on' and verify_pool_given_back.rc != 0

    - name: Assert the VM went back to its snapshot, ready, with nothing of the run on it
      ansible.builtin.assert:
        that:
          - verify_pool_given_back.rc == 0
          - "'home: clean' in verify_pool_given_back.stdout_lines"
          - "'etc: clean' in verify_pool_given_back.stdout_lines"
        fail_msg: >-
          the give-back: {{ verify_pool_given_back.stdout }} {{ verify_pool_given_back.stderr }};
          the revert: {{ verify_pool_revert_log.stdout | default('') }}
      when: verify_vm_pool == 'on'

    - name: Read the firewall's rules before an up without the key
      ansible.builtin.stat:
        path: /etc/porelo-host/firewall.nft
      register: verify_rules_before

    - name: Run up with a key path where no file is
      ansible.builtin.command:
        cmd: >-
          ansible-playbook -c local -i /root/porelo-host-inventory.yml porelo.host.up
          -e vpn_private_key_path=/srv/porelo-host/drive/porelo-host/no-such.key -e vpn_ssh_port=2222
      environment:
        ANSIBLE_STDOUT_CALLBACK: porelo.host.lines
        LC_ALL: C.UTF-8
      register: verify_no_key
      changed_when: false
      failed_when: false

    - name: Read the firewall's rules after it
      ansible.builtin.stat:
        path: /etc/porelo-host/firewall.nft
      register: verify_rules_after

    - name: Assert up stopped on the missing key, naming its path, and left the firewall's rules as they were
      ansible.builtin.assert:
        that:
          - verify_no_key.rc == 2
          - verify_no_key.stdout is search('no key file at /srv/porelo-host/drive/porelo-host/no-such.key')
          - verify_rules_after.stat.checksum == verify_rules_before.stat.checksum
        fail_msg: "up without the key gave rc {{ verify_no_key.rc }}: {{ verify_no_key.stdout_lines | select('search',
          'failed') | list }}; rules {{ verify_rules_before.stat.checksum }} -> {{ verify_rules_after.stat.checksum }}"

    # The porelo role: Porelo itself says the account can run tasks.
    - name: Ask porelo doctor as the account
      ansible.builtin.command:
        cmd: porelo doctor
      become: true
      become_user: "{{ verify_account }}"
      environment:
        XDG_RUNTIME_DIR: "/run/user/{{ ansible_facts['getent_passwd'][verify_account][1] }}"
      register: verify_doctor
      changed_when: false
      failed_when: false

    - name: Assert porelo doctor passes, with the vault there and the daemon running
      ansible.builtin.assert:
        that:
          - verify_doctor.rc == 0
          - verify_doctor.stdout is search('^vault +there', multiline=True)
          - verify_doctor.stdout is search('^daemon +running', multiline=True)
        fail_msg: "porelo doctor gave rc {{ verify_doctor.rc }}: {{ verify_doctor.stdout_lines }}"

    - name: Ask Porelo which projects the account follows, and what its vault holds
      ansible.builtin.command:
        cmd: "{{ item }}"
      loop: [porelo project following --json, porelo vault list]
      become: true
      become_user: "{{ verify_account }}"
      environment:
        XDG_RUNTIME_DIR: "/run/user/{{ ansible_facts['getent_passwd'][verify_account][1] }}"
      register: verify_project
      changed_when: false

    - name: Assert the machine file's project is followed with its signature checked, and its key is in the vault
      ansible.builtin.assert:
        that:
          - verify_follows | length == 1
          - verify_follows[0].verified and verify_follows[0].outcome == 'applied'
          - verify_project.results[1].stdout is search('^converge-key ', multiline=True)
        fail_msg: "following: {{ verify_project.results[0].stdout }}; vault: {{ verify_project.results[1].stdout }}"
      vars:
        verify_follows: "{{ (verify_project.results[0].stdout | from_json).follows
          | selectattr('name', 'equalto', 'converge') | list }}"

    - name: Ask Porelo for the task started by hand, and which agents are signed in
      ansible.builtin.command:
        cmd: "{{ item }}"
      loop: [porelo task status porelo-converge-converge-1 --json, porelo agents --json]
      become: true
      become_user: "{{ verify_account }}"
      environment:
        XDG_RUNTIME_DIR: "/run/user/{{ ansible_facts['getent_passwd'][verify_account][1] }}"
      register: verify_tasks
      changed_when: false

    - name: Assert the task started by hand runs on its repository, with the stub signed in
      ansible.builtin.assert:
        that:
          - verify_task.running
          - verify_task.project == 'converge' and verify_task.repository == 'code'
          - verify_stub | length == 1 and verify_stub[0].signed_in
        fail_msg: "task: {{ verify_tasks.results[0].stdout }}; agents: {{ verify_tasks.results[1].stdout }}"
      vars:
        verify_task: "{{ verify_tasks.results[0].stdout | from_json }}"
        verify_stub: "{{ (verify_tasks.results[1].stdout | from_json).agents | selectattr('name', 'equalto', 'stub')
          | list }}"

    # The first task start of a project naming the Matrix transport enabled and started the account's homeserver.
    - name: Ask systemd whether the homeserver unit is enabled and active after the task started
      ansible.builtin.command:
        argv: [systemctl, --user, "{{ item }}", porelo-matrix-homeserver]
      loop: [is-enabled, is-active]
      become: true
      become_user: "{{ verify_account }}"
      environment:
        XDG_RUNTIME_DIR: "/run/user/{{ ansible_facts['getent_passwd'][verify_account][1] }}"
      register: verify_homeserver_unit
      changed_when: false
      failed_when: false

    - name: Read the homeserver's port from the configuration the transport wrote
      ansible.builtin.slurp:
        src: /home/{{ verify_account }}/.config/porelo/matrix/homeserver.conf
      register: verify_homeserver_conf

    - name: Ask the homeserver on loopback for the Matrix client versions it serves
      ansible.builtin.uri:
        url: http://127.0.0.1:{{ verify_homeserver_port }}/_matrix/client/versions
        return_content: true
      become: true
      become_user: "{{ verify_account }}"
      register: verify_homeserver_versions
      until: >-
        verify_homeserver_versions.status | default(0) == 200
        and verify_homeserver_versions.json is defined
        and verify_homeserver_versions.json.versions is defined
      retries: 60
      delay: 3
      changed_when: false
      failed_when: false
      vars:
        verify_homeserver_port: >-
          {{ (verify_homeserver_conf.content | b64decode).splitlines()
          | select('match', '^PORELO_MATRIX_PORT=[0-9]+$') | map('split', '=') | map('last') | first | default('') }}

    - name: Assert the homeserver unit is enabled and active and answers with Matrix's versions on its port
      ansible.builtin.assert:
        that:
          - verify_homeserver_unit.results[0].stdout == 'enabled'
          - verify_homeserver_unit.results[1].stdout == 'active'
          - verify_homeserver_port is match('^[0-9]+$')
          - verify_homeserver_versions.status | default(0) == 200
          - verify_homeserver_versions.json is defined
          - verify_homeserver_versions.json.versions | default([]) | length > 0
        fail_msg: >-
          asked for porelo-matrix-homeserver enabled and active and 200 with versions from
          http://127.0.0.1:{{ verify_homeserver_port }}/_matrix/client/versions;
          got is-enabled '{{ verify_homeserver_unit.results[0].stdout }}',
          is-active '{{ verify_homeserver_unit.results[1].stdout }}',
          uri status {{ verify_homeserver_versions.status | default('none') }}:
          {{ verify_homeserver_versions.content | default(verify_homeserver_versions.msg | default('')) }}
      vars:
        verify_homeserver_port: >-
          {{ (verify_homeserver_conf.content | b64decode).splitlines()
          | select('match', '^PORELO_MATRIX_PORT=[0-9]+$') | map('split', '=') | map('last') | first | default('') }}

    # base: the person reaches the account itself over ssh, as porelo-host does for the drive's login and the vault.
    - name: Log in over ssh as the account with the person's key, and ask Porelo for the vault
      ansible.builtin.command:
        argv: [ssh, -o, BatchMode=yes, -o, IdentitiesOnly=yes, -o, StrictHostKeyChecking=accept-new,
               -o, UserKnownHostsFile=/root/person-known-hosts, -i, /root/person-ssh, "{{ verify_account }}@127.0.0.1",
               "cd /tmp && XDG_RUNTIME_DIR=/run/user/$(id -u) porelo vault status"]
      register: verify_person_ssh
      changed_when: false
      failed_when: false

    - name: Assert the person's key logs in as the account
      ansible.builtin.assert:
        that: verify_person_ssh.rc == 0 and verify_person_ssh.stdout is search('^open', multiline=True)
        fail_msg: "ssh as {{ verify_account }}: rc {{ verify_person_ssh.rc }}, {{ verify_person_ssh.stderr }}"

    # The drive's login, as porelo-host runs it: over ssh as the account, the client by name, the account's daemon.
    - name: Ask the drive's client by name over ssh as the account, as porelo-host's drive step does
      ansible.builtin.command:
        argv: [ssh, -o, BatchMode=yes, -o, IdentitiesOnly=yes, -o, StrictHostKeyChecking=accept-new,
               -o, UserKnownHostsFile=/root/person-known-hosts, -i, /root/person-ssh, "{{ verify_account }}@127.0.0.1",
               "XDG_RUNTIME_DIR=/run/user/$(id -u) tresorit-cli -p status"]
      register: verify_person_client
      changed_when: false
      failed_when: false

    - name: Assert the client is found by name and reaches the account's daemon
      ansible.builtin.assert:
        that:
          - verify_person_client.rc == 0
          - verify_person_client.stdout is search('^Tresorit daemon:\trunning', multiline=True)
          - verify_person_client.stdout is search('^Logged in as:\t', multiline=True)
        fail_msg: >-
          tresorit-cli over ssh as {{ verify_account }}: rc {{ verify_person_client.rc }},
          {{ verify_person_client.stdout }} {{ verify_person_client.stderr }}

    # The lines callback, as porelo-frontend's host command reads it from a real up on the host.
    - name: Read the lines of the last up
      ansible.builtin.slurp:
        src: /root/porelo-host-up.lines
      register: verify_lines_file

    - name: Assert every line is the contract's JSON, every task ends, and nothing failed or waits
      ansible.builtin.assert:
        that:
          - verify_lines | length > 0
          - verify_lines | map(attribute='v') | unique == [1]
          - verify_lines | selectattr('state', 'equalto', 'started') | list | length
            == verify_lines | selectattr('state', 'in', ['ok', 'changed', 'skipped']) | list | length
          - verify_lines | selectattr('state', 'in', ['failed', 'waiting']) | list | length == 0
          - verify_lines | selectattr('state', 'equalto', 'started') | map(attribute='task') | list
            == verify_lines | selectattr('state', 'in', ['ok', 'changed', 'skipped']) | map(attribute='task') | list
        fail_msg: "the last up's lines: {{ verify_lines }}"
      vars:
        verify_lines: "{{ (verify_lines_file.content | b64decode).splitlines() | select | map('from_json') | list }}"
