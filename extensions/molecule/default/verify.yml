---
# What a host prepared by `up` with no project and no person has, read on the host itself.
- name: Verify
  hosts: all
  gather_facts: false
  become: true
  vars:
    verify_version: "{{ lookup('ansible.builtin.env', 'PORELO_HOST_VERSION') }}"
    verify_vm_pool: "{{ lookup('ansible.builtin.env', 'PORELO_HOST_MOLECULE_POOL', default='on') }}"
    verify_forge: "{{ lookup('ansible.builtin.env', 'PORELO_HOST_MOLECULE_FORGE', default='on') }}"
    verify_container_bounds:
      - {account: porelo-forge, container: forgejo, pids: 1024, memory: 2G, bytes: 2147483648, cpus: 2}
      - {account: porelo-runner, container: forgejo-runner, pids: 256, memory: 512M, bytes: 536870912, cpus: 1}
  tasks:
    - name: Read every account on the host from getent passwd
      ansible.builtin.getent:
        database: passwd

    # The VM's own login user comes from Molecule's inventory (ansible_user, set to molecule by build/molecule.sh);
    # Debian/Ubuntu's unmapped overflow account nobody sits at uid 65534 and is excluded by name and uid pair.
    - name: List every account in getent passwd with uid >= 1000 aside from nobody (65534)
      ansible.builtin.shell:
        cmd: >-
          set -o pipefail && getent passwd
          | awk -F: '$3 >= 1000 && !($1 == "nobody" && $3 == 65534) {print $1}' | sort
        executable: /bin/bash
      register: verify_regular_accounts
      changed_when: false

    - name: Assert getent passwd lists only the VM login user from inventory and the host's service accounts
      ansible.builtin.assert:
        that: verify_regular_accounts.stdout_lines == verify_expected_accounts
        fail_msg: >-
          asked getent passwd (uid >= 1000, excluding nobody=65534) for only the inventory login user
          '{{ ansible_user }}' and host service accounts {{ verify_expected_accounts }};
          got {{ verify_regular_accounts.stdout_lines }}
      vars:
        verify_expected_accounts: >-
          {{ ([ansible_user, 'porelo-matrix']
          + (['porelo-forge', 'porelo-runner'] if verify_forge == 'on' else [])) | unique | sort }}

    - name: Read whether stop.conf or a person's setup directory exists on the host
      ansible.builtin.stat:
        path: "{{ item }}"
      loop: [/etc/porelo-host/stop.conf, /etc/porelo-host/setup]
      register: verify_person_paths

    - name: Assert neither /etc/porelo-host/stop.conf nor /etc/porelo-host/setup exists
      ansible.builtin.assert:
        that: verify_person_paths.results | selectattr('stat.exists') | list | length == 0
        fail_msg: >-
          asked for neither /etc/porelo-host/stop.conf nor /etc/porelo-host/setup on a host with no person;
          found {{ verify_person_paths.results | selectattr('stat.exists') | map(attribute='item') | list }}

    - name: Search user systemd directories and running user managers for any porelo user unit outside porelo-matrix
      ansible.builtin.shell:
        cmd: |
          set -euo pipefail
          for root in /etc/systemd/user /root/.config/systemd/user /home/*/.config/systemd/user; do
              [ -e "$root" ] || continue
              find "$root" -iname '*porelo*' | while IFS= read -r path; do
                  case "$path" in
                      /home/porelo-matrix/.config/systemd/user/*/porelo-matrix-homeserver*|\
                      /home/porelo-matrix/.config/systemd/user/porelo-matrix-homeserver*)
                          continue ;;
                  esac
                  printf 'file: %s\n' "$path"
              done
          done
          for runtime in /run/user/*; do
              [ -d "$runtime" ] || continue
              uid=${runtime##*/}
              account=$(getent passwd "$uid" | cut -d: -f1)
              [ -n "$account" ] || continue
              units=$(runuser -u "$account" -- env XDG_RUNTIME_DIR="$runtime" \
                  systemctl --user list-units --plain --no-legend 'porelo*' 2>/dev/null || true)
              [ -n "$units" ] || continue
              while IFS= read -r line; do
                  [ -n "$line" ] || continue
                  unit=${line%% *}
                  if [ "$account" = porelo-matrix ]; then
                      case "$unit" in porelo-matrix-homeserver*) continue ;; esac
                  fi
                  printf 'active(%s): %s\n' "$account" "$line"
              done <<< "$units"
          done
        executable: /bin/bash
      register: verify_porelo_user_units
      changed_when: false

    - name: Assert no porelo user units are enabled or loaded outside porelo-matrix's homeserver
      ansible.builtin.assert:
        that: verify_porelo_user_units.stdout_lines | length == 0
        fail_msg: >-
          asked for no porelo user units outside porelo-matrix's homeserver;
          found {{ verify_porelo_user_units.stdout_lines }}

    - name: Verify a host without the forge holds none of it
      ansible.builtin.include_tasks: "{{ playbook_dir }}/tasks/forge_absent.yml"
      when: verify_forge == 'off'

    - name: Start with no absence check refusal observed
      ansible.builtin.set_fact:
        verify_forge_absence_refused: false
      when: verify_forge == 'on'

    - name: Prove the absence check refuses a host that has the forge
      when: verify_forge == 'on'
      block:
        - name: Run the absence check against the running forge
          ansible.builtin.include_tasks: "{{ playbook_dir }}/tasks/forge_absent.yml"
      rescue:
        - name: Assert the absence assertion itself refused the installed forge
          ansible.builtin.assert:
            that: ansible_failed_task.name == 'Assert the host holds none of the forge'
            fail_msg: >-
              asked for the forge absence assertion to fail, got {{ ansible_failed_task.name }}:
              {{ ansible_failed_result }}

        - name: Keep the absence check refusal observed
          ansible.builtin.set_fact:
            verify_forge_absence_refused: true

    - name: Assert the absence check went red with the forge installed
      ansible.builtin.assert:
        that: verify_forge_absence_refused
        fail_msg: asked the absence check to refuse an installed forge, got no refusal
      when: verify_forge == 'on'

    - name: Verify the containers' resource bounds and the host's refusals
      ansible.builtin.include_tasks: "{{ playbook_dir }}/tasks/resources.yml"

    - name: Read the stop command and its permissions
      ansible.builtin.stat:
        path: /usr/local/bin/porelo-host-stop
      register: verify_host_stop

    # A malformed call must refuse before it can ask for credentials.
    - name: Ask the stop command to refuse an unknown need as an unprivileged user
      ansible.builtin.command:
        argv: [/usr/local/bin/porelo-host-stop, nonsense]
      become: true
      become_user: "{{ ansible_user }}"
      register: verify_host_stop_refusal
      changed_when: false
      failed_when: false

    - name: Assert the stop command is root's executable and refuses the unknown need
      ansible.builtin.assert:
        that:
          - verify_host_stop.stat.exists
          - verify_host_stop.stat.isreg | default(false)
          - verify_host_stop.stat.uid | default(-1) == 0
          - verify_host_stop.stat.mode | default('') == '0755'
          - verify_host_stop_refusal.rc == 64
          - "'nonsense' in verify_host_stop_refusal.stderr"
        fail_msg: >-
          asked for /usr/local/bin/porelo-host-stop as root's regular file with mode 0755 and nonsense refused with 64;
          got stat {{ verify_host_stop.stat }}, rc {{ verify_host_stop_refusal.rc }}:
          {{ verify_host_stop_refusal.stdout }} {{ verify_host_stop_refusal.stderr }}

    - name: Read which collections the host has
      ansible.builtin.command:
        cmd: ansible-galaxy collection list porelo.host --format json
      register: verify_collections
      changed_when: false

    - name: Assert the host has the collection in the version under test
      ansible.builtin.assert:
        that:
          - verify_found | length == 1
          - verify_found[0].version == verify_version
        fail_msg: "asked for porelo.host {{ verify_version }}, found {{ verify_found }}"
      vars:
        # Keyed by the name with its dot, which an attribute lookup would read as two levels.
        verify_found: "{{ verify_collections.stdout | from_json | dict2items | map(attribute='value')
          | map('dict2items') | flatten | selectattr('key', 'equalto', 'porelo.host') | map(attribute='value')
          | list }}"

    - name: Ask dpkg whether ansible-core, Porelo and the Matrix packages are installed
      ansible.builtin.command:
        argv: "{{ ['dpkg-query', '-W', '-f=${Package} ${Status}\n'] + verify_expected_packages }}"
      register: verify_packages
      changed_when: false
      failed_when: false
      vars:
        verify_expected_packages: >-
          {{ ['ansible-core', 'porelo', 'porelo-matrix-homeserver', 'porelo-message-transport-matrix']
          + (['porelo-adapter-forgejo'] if verify_forge == 'on' else []) }}

    - name: Assert ansible-core, Porelo and the Matrix packages are installed
      ansible.builtin.assert:
        that:
          - verify_packages.rc == 0
          - verify_packages.stdout_lines | sort
            == verify_expected_packages | map('regex_replace', '$', ' install ok installed') | sort
        fail_msg: >-
          asked dpkg for {{ verify_expected_packages }} installed;
          got rc {{ verify_packages.rc }}: {{ verify_packages.stdout_lines }} ({{ verify_packages.stderr }})
      vars:
        verify_expected_packages: >-
          {{ ['ansible-core', 'porelo', 'porelo-matrix-homeserver', 'porelo-message-transport-matrix']
          + (['porelo-adapter-forgejo'] if verify_forge == 'on' else []) }}

    # Asked of KVM itself: Ubuntu makes /dev/kvm as a static node even where no CPU extension stands behind it.
    - name: Ask KVM for its API version through /dev/kvm
      ansible.builtin.command:
        cmd: python3 -c "import fcntl, os; print(fcntl.ioctl(os.open('/dev/kvm', os.O_RDWR), 0xAE00))"
      register: verify_kvm
      changed_when: false
      failed_when: false

    - name: Assert KVM answers, as on a rented host
      ansible.builtin.assert:
        that: verify_kvm.rc == 0 and verify_kvm.stdout == '12'
        fail_msg: >-
          asked KVM_GET_API_VERSION for 12, got rc {{ verify_kvm.rc }}: {{ verify_kvm.stdout }} {{ verify_kvm.stderr }}

    # Nothing of Tresorit or a drive is on a host.
    - name: Read whether anything of Tresorit or a drive is on the host
      ansible.builtin.shell:
        cmd: |
          set -uo pipefail
          command -v tresorit-cli && echo "client on PATH"
          find /etc/systemd /usr/lib/systemd /home \
              \( -iname '*tresorit*' -o -iname '*drive*.mount' \) 2>/dev/null | sed 's/^/unit: /'
          findmnt --noheadings --output TARGET | grep -F /srv/porelo-host | sed 's/^/mount: /'
          [ -e /srv/porelo-host/drive ] && echo "folder: /srv/porelo-host/drive"
          [ -e /var/lib/porelo-host/drive.img ] && echo "image: /var/lib/porelo-host/drive.img"
          exit 0
        executable: /bin/bash
      register: verify_tresorit
      changed_when: false

    - name: Assert nothing of Tresorit or a drive is on the host
      ansible.builtin.assert:
        that: verify_tresorit.stdout_lines | length == 0
        fail_msg: "asked for nothing of Tresorit or a drive on the host, found {{ verify_tresorit.stdout_lines }}"

    # The vpn role: a service bound to every address is reached through the VPN on 10.73.7.1, from a peer at 10.73.7.2
    # in a network namespace of its own, and refused on the public address, from where Molecule itself connects.
    - name: Start a service bound to every address
      ansible.builtin.command:
        argv: [systemd-run, --unit, verify-listener, --collect, python3, -m, http.server, --bind, "::", "8080"]
        creates: /run/systemd/transient/verify-listener.service

    - name: Make the test peer in a network namespace of its own, linked to the host on 10.73.7.0/24
      ansible.builtin.shell:
        cmd: |
          set -eu
          ip netns add verify-peer
          ip link add verify-host type veth peer name verify-ns netns verify-peer
          ip address add 10.250.0.1/30 dev verify-host && ip link set verify-host up
          ip -n verify-peer address add 10.250.0.2/30 dev verify-ns
          ip -n verify-peer link set verify-ns up && ip -n verify-peer link set lo up
          ip -n verify-peer link add wg0 type wireguard
          ip netns exec verify-peer wg set wg0 private-key /etc/wireguard/verify-peer.key \
              peer "$(cat /root/vpn-host.pub)" endpoint 10.250.0.1:51820 allowed-ips 10.73.7.1/32
          ip -n verify-peer address add 10.73.7.2/24 dev wg0 && ip -n verify-peer link set wg0 up
        executable: /bin/bash
        creates: /run/netns/verify-peer

    - name: Reach the service through the VPN from the test peer
      ansible.builtin.command:
        cmd: ip netns exec verify-peer curl -fsS --max-time 10 -o /dev/null -w '%{http_code}' http://10.73.7.1:8080/
      register: verify_vpn_reach
      changed_when: false
      failed_when: false

    - name: Assert the service answers through the VPN on 10.73.7.1
      ansible.builtin.assert:
        that: verify_vpn_reach.rc == 0 and verify_vpn_reach.stdout == '200'
        fail_msg: >-
          asked http://10.73.7.1:8080/ through the VPN for 200;
          got rc {{ verify_vpn_reach.rc }}, {{ verify_vpn_reach.stdout }} {{ verify_vpn_reach.stderr }}

    - name: Reach Forgejo by name on VPN port 3000 with the stand-in CA
      ansible.builtin.command:  # noqa: command-instead-of-module
        cmd: >-
          curl -fsS --max-time 10 --noproxy '*' --cacert /root/desktop-ca/ca.pem
          --resolve forge.alpha.porelo.internal:3000:10.73.7.1 -w '\n%{http_code}'
          https://forge.alpha.porelo.internal:3000/api/v1/version
      register: verify_forge_vpn_port_3000
      changed_when: false
      failed_when: false
      when: verify_forge == 'on'

    - name: Assert Forgejo answers 200 on forge.alpha.porelo.internal:3000 at 10.73.7.1 under the host CA
      ansible.builtin.assert:
        that:
          - verify_forge_vpn_port_3000.rc == 0
          - verify_forge_vpn_port_3000.stdout_lines | last == '200'
          - (verify_forge_vpn_port_3000.stdout_lines[:-1] | join('\n') | from_json).version is defined
        fail_msg: >-
          asked https://forge.alpha.porelo.internal:3000/api/v1/version at 10.73.7.1 for HTTP 200 and JSON version;
          got rc {{ verify_forge_vpn_port_3000.rc }}, {{ verify_forge_vpn_port_3000.stdout }}
          {{ verify_forge_vpn_port_3000.stderr }}
      when: verify_forge == 'on'

    - name: Reach Forgejo by name on loopback port 443, trusting only the host's CA
      ansible.builtin.command:  # noqa: command-instead-of-module
        cmd: >-
          curl -fsS --max-time 10 --noproxy '*' --cacert /etc/porelo-host/forge/ca.pem
          --resolve forge.alpha.porelo.internal:443:127.0.0.1 -o /dev/null -w '%{http_code}'
          https://forge.alpha.porelo.internal/api/v1/version
      register: verify_forge_loopback
      changed_when: false
      failed_when: false
      when: verify_forge == 'on'

    - name: Assert Forgejo answers by name on loopback port 443 with the host's certificate
      ansible.builtin.assert:
        that: verify_forge_loopback['rc'] == 0 and verify_forge_loopback['stdout'] == '200'
        fail_msg: >-
          asked https://forge.alpha.porelo.internal/api/v1/version through 127.0.0.1:443 for 200;
          got rc {{ verify_forge_loopback['rc'] }}, {{ verify_forge_loopback['stdout'] }}
          {{ verify_forge_loopback['stderr'] }}
      when: verify_forge == 'on'

    - name: Reach Forgejo by name on VPN port 443 and port 3000 from the test peer
      ansible.builtin.command:
        cmd: >-
          ip netns exec verify-peer curl -fsS --max-time 10 --noproxy '*'
          --cacert /etc/porelo-host/forge/ca.pem
          --resolve forge.alpha.porelo.internal:{{ item }}:10.73.7.1
          -o /dev/null -w '%{http_code}'
          https://forge.alpha.porelo.internal:{{ item }}/api/v1/version
      loop: [443, 3000]
      register: verify_forge_https_peer
      changed_when: false
      failed_when: false
      when: verify_forge == 'on'

    - name: Assert Forgejo answers by name on VPN ports 443 and 3000 from the test peer
      ansible.builtin.assert:
        that: item['rc'] == 0 and item['stdout'] == '200'
        fail_msg: >-
          asked https://forge.alpha.porelo.internal:{{ item['item'] }}/api/v1/version through the test peer's VPN for
          200; got rc {{ item['rc'] }}, {{ item['stdout'] }} {{ item['stderr'] }}
      loop: "{{ verify_forge_https_peer['results'] }}"
      loop_control:
        label: "{{ item['item'] }}"
      when: verify_forge == 'on'

    - name: Read where Forgejo's ports listen
      ansible.builtin.command:
        cmd: ss -Hltn '( sport = :443 or sport = :3000 or sport = :2222 )'
      register: verify_forge_listen
      changed_when: false
      when: verify_forge == 'on'

    - name: Assert Forgejo listens on loopback and VPN port 443 and keeps its VPN ports on 10.73.7.1
      ansible.builtin.assert:
        that:
          - verify_forge_ports | sort == ['10.73.7.1:2222', '10.73.7.1:3000', '10.73.7.1:443', '127.0.0.1:443']
        fail_msg: >-
          asked Forgejo to listen on 10.73.7.1:{2222,3000,443} and 127.0.0.1:443;
          got {{ verify_forge_listen.stdout_lines }}
      vars:
        verify_forge_ports: "{{ verify_forge_listen.stdout_lines | map('split') | map(attribute=3) | list }}"
      when: verify_forge == 'on'

    # The shared Matrix homeserver under porelo-matrix: linger enabled, user unit active, TLS files owned by the
    # account alone with no CA key, and HTTPS answering on matrix.alpha.porelo.internal:8448 at 10.73.7.1.
    - name: Read porelo-matrix's linger file and TLS paths
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - /var/lib/systemd/linger/porelo-matrix
        - /home/porelo-matrix/.config/porelo/matrix/ca.crt
        - /home/porelo-matrix/.config/porelo/matrix/tls
        - /home/porelo-matrix/.config/porelo/matrix/tls/server.crt
        - /home/porelo-matrix/.config/porelo/matrix/tls/server.key
        - /home/porelo-matrix/.config/porelo/matrix/ca.key
        - /home/porelo-matrix/.config/porelo/matrix/tls/ca.key
      register: verify_matrix_paths

    - name: Assert porelo-matrix has its linger file and TLS files with mode 0644/0700/0600 and no CA key
      ansible.builtin.assert:
        that:
          - verify_matrix_paths.results[0].stat.exists
          - verify_matrix_paths.results[1].stat.exists
          - verify_matrix_paths.results[1].stat.pw_name | default('') == 'porelo-matrix'
          - verify_matrix_paths.results[1].stat.mode | default('') == '0644'
          - verify_matrix_paths.results[2].stat.isdir | default(false)
          - verify_matrix_paths.results[2].stat.pw_name | default('') == 'porelo-matrix'
          - verify_matrix_paths.results[2].stat.mode | default('') == '0700'
          - verify_matrix_paths.results[3].stat.exists
          - verify_matrix_paths.results[3].stat.pw_name | default('') == 'porelo-matrix'
          - verify_matrix_paths.results[3].stat.mode | default('') == '0600'
          - verify_matrix_paths.results[4].stat.exists
          - verify_matrix_paths.results[4].stat.pw_name | default('') == 'porelo-matrix'
          - verify_matrix_paths.results[4].stat.mode | default('') == '0600'
          - not verify_matrix_paths.results[5].stat.exists
          - not verify_matrix_paths.results[6].stat.exists
        fail_msg: >-
          asked for /var/lib/systemd/linger/porelo-matrix, ca.crt (0644), tls/ (0700), server.crt and server.key (0600)
          owned by porelo-matrix with no ca.key; got {{ verify_matrix_paths.results | map(attribute='stat') | list }}

    - name: Ask systemd whether porelo-matrix-homeserver.service is enabled and active for porelo-matrix
      ansible.builtin.command:
        argv: [systemctl, --user, "{{ item }}", porelo-matrix-homeserver.service]
      loop: [is-enabled, is-active]
      become: true
      become_user: porelo-matrix
      environment:
        XDG_RUNTIME_DIR: "/run/user/{{ ansible_facts['getent_passwd']['porelo-matrix'][1] }}"
      register: verify_homeserver_unit
      changed_when: false
      failed_when: false

    - name: Assert porelo-matrix-homeserver.service is enabled and active for porelo-matrix
      ansible.builtin.assert:
        that:
          - verify_homeserver_unit.results[0].stdout == 'enabled'
          - verify_homeserver_unit.results[1].stdout == 'active'
        fail_msg: >-
          asked porelo-matrix's user manager for porelo-matrix-homeserver.service enabled and active;
          got is-enabled '{{ verify_homeserver_unit.results[0].stdout }}'
          ({{ verify_homeserver_unit.results[0].stderr }}),
          is-active '{{ verify_homeserver_unit.results[1].stdout }}'
          ({{ verify_homeserver_unit.results[1].stderr }})

    - name: Reach the Matrix homeserver by name on 10.73.7.1:8448 with the stand-in CA
      ansible.builtin.command:  # noqa: command-instead-of-module
        cmd: >-
          curl -fsS --max-time 10 --noproxy '*' --cacert /root/desktop-ca/ca.pem
          --resolve matrix.alpha.porelo.internal:8448:10.73.7.1 -w '\n%{http_code}'
          https://matrix.alpha.porelo.internal:8448/_matrix/client/versions
      register: verify_homeserver_https
      until: >-
        verify_homeserver_https.rc == 0
        and (verify_homeserver_https.stdout_lines | last | default('')) == '200'
      retries: 30
      delay: 2
      changed_when: false
      failed_when: false

    - name: Reach the Matrix homeserver through the VPN from the test peer
      ansible.builtin.command:
        cmd: >-
          ip netns exec verify-peer curl -fsS --max-time 10 --noproxy '*'
          --cacert /etc/porelo-host/forge/ca.pem
          --resolve matrix.alpha.porelo.internal:8448:10.73.7.1 -o /dev/null -w '%{http_code}'
          https://matrix.alpha.porelo.internal:8448/_matrix/client/versions
      register: verify_homeserver_peer
      changed_when: false
      failed_when: false

    - name: Assert the Matrix homeserver answers 200 with versions on matrix.alpha.porelo.internal:8448
      ansible.builtin.assert:
        that:
          - verify_homeserver_https.rc == 0
          - verify_homeserver_https.stdout_lines | last == '200'
          - (verify_homeserver_https.stdout_lines[:-1] | join('\n') | from_json).versions | default([]) | length > 0
          - verify_homeserver_peer.rc == 0
          - verify_homeserver_peer.stdout == '200'
        fail_msg: >-
          asked https://matrix.alpha.porelo.internal:8448/_matrix/client/versions at 10.73.7.1 for HTTP 200 with
          Matrix versions on the host and through the VPN; got host rc {{ verify_homeserver_https.rc }}
          '{{ verify_homeserver_https.stdout }}' ({{ verify_homeserver_https.stderr }}),
          peer rc {{ verify_homeserver_peer.rc }} '{{ verify_homeserver_peer.stdout }}'
          ({{ verify_homeserver_peer.stderr }})

    # The host admin's CA is constrained critically to alpha.porelo.internal and 10.73.7.0/24, so a certificate signed
    # by that same CA for another host's name must fail verification.
    - name: Verify a certificate signed by the same CA for forge.beta.porelo.internal fails openssl verify
      block:
        - name: Make a temporary directory for the cross-host certificate check
          ansible.builtin.tempfile:
            state: directory
            prefix: porelo-beta-cert-
          register: verify_beta_dir

        - name: Sign a certificate for forge.beta.porelo.internal with the stand-in host CA
          ansible.builtin.shell:
            cmd: |
              set -euo pipefail
              umask 077
              work={{ verify_beta_dir.path | quote }}
              openssl req -new -newkey ec -pkeyopt ec_paramgen_curve:P-256 -nodes \
                  -subj "/CN=forge.beta.porelo.internal" -keyout "$work/beta.key" -out "$work/beta.csr" 2> /dev/null
              {
                  printf 'subjectAltName=DNS:forge.beta.porelo.internal,IP:10.73.7.1\n'
                  printf 'basicConstraints=critical,CA:FALSE\n'
                  printf 'keyUsage=critical,digitalSignature\n'
                  printf 'extendedKeyUsage=serverAuth\n'
              } > "$work/ext"
              openssl x509 -req -in "$work/beta.csr" -CA /root/desktop-ca/ca.pem -CAkey /root/desktop-ca/ca.key \
                  -CAcreateserial -days 365 -extfile "$work/ext" -out "$work/beta.pem" 2> /dev/null
            executable: /bin/bash
          changed_when: true
          no_log: true

        - name: Run openssl verify on forge.beta.porelo.internal against the host's CA
          ansible.builtin.command:
            argv: [openssl, verify, -CAfile, /etc/porelo-host/forge/ca.pem, "{{ verify_beta_dir.path }}/beta.pem"]
          register: verify_beta_cert
          changed_when: false
          failed_when: false

        - name: Assert openssl verify rejects forge.beta.porelo.internal for violating the CA's name constraints
          ansible.builtin.assert:
            that:
              - verify_beta_cert.rc != 0
              - (verify_beta_cert.stdout ~ verify_beta_cert.stderr) is search('permitted subtree violation')
            fail_msg: >-
              asked openssl verify -CAfile /etc/porelo-host/forge/ca.pem to reject forge.beta.porelo.internal for a
              permitted subtree violation; got rc {{ verify_beta_cert.rc }}:
              {{ verify_beta_cert.stdout }} {{ verify_beta_cert.stderr }}
      always:
        - name: Remove the temporary directory of the cross-host certificate check
          ansible.builtin.file:
            path: "{{ verify_beta_dir.path }}"
            state: absent
          when: verify_beta_dir.path is defined

    - name: Reach ssh on the public address, from where Molecule connects
      ansible.builtin.wait_for:
        host: "{{ ansible_host }}"
        port: 22
        timeout: 10
      delegate_to: localhost
      become: false

    - name: Try the test listener, homeserver and forge ports on the public address, from where Molecule connects
      ansible.builtin.wait_for:
        host: "{{ ansible_host }}"
        port: "{{ item }}"
        timeout: 5
      loop: "{{ [8080, 8448, 3000, 2222, 443] if verify_forge == 'on' else [8080, 8448] }}"
      delegate_to: localhost
      become: false
      register: verify_public_reach
      failed_when: false

    - name: Assert the public address refuses the test listener, the homeserver and every forge port
      ansible.builtin.assert:
        that: item['msg'] is defined and item['msg'] is search('Timeout')
        fail_msg: "asked {{ ansible_host }}:{{ item['item'] }} to refuse public connections; got {{ item }}"
      loop: "{{ verify_public_reach['results'] }}"
      loop_control:
        label: "{{ item['item'] }}"

    - name: Verify the person's forge login and password script after idempotence
      ansible.builtin.include_tasks: "{{ playbook_dir }}/tasks/forge_person.yml"
      when: verify_forge == 'on'

    # Recreating the person makes the verbose run make the person again, whose password script is checked anew.
    - name: Remove the person's forge login before up with -vvv
      ansible.builtin.shell:
        cmd: |
          set -euo pipefail
          cd /
          as_forge() { runuser -u porelo-forge -- env XDG_RUNTIME_DIR="/run/user/$(id -u porelo-forge)" "$@"; }
          as_forge podman exec forgejo forgejo admin user delete --username operator --purge
          users=$(as_forge podman exec forgejo forgejo admin user list)
          rc=0
          printf '%s\n' "$users" | awk 'NR > 1 {print $2}' | grep -Fx operator > /dev/null || rc=$?
          [ "$rc" = 1 ] || { echo "asked for operator absent before up -vvv, got search rc $rc" >&2; exit 1; }
        executable: /bin/bash
      changed_when: true
      when: verify_forge == 'on'

    # Ansible's own most talkative output of a whole up, searched for the host's, CA's and pool's private keys and the
    # forge's API token without reading any secret into an Ansible variable.
    - name: Run up again with Ansible's -vvv and search up's lines, -vvv output and the journal for any secret
      block:
        - name: Run up with Ansible's -vvv into a root-only file
          ansible.builtin.shell:
            cmd: |
              set -euo pipefail
              umask 077
              ansible-playbook -vvv -c local -i /root/porelo-host-inventory.yml porelo.host.up \
                  > /root/porelo-host-vvv.out 2>&1
            executable: /bin/bash
          environment:
            LC_ALL: C.UTF-8
          changed_when: false
          no_log: true

        - name: Search up's lines, -vvv output and the journal for private keys and tokens, with a planted control
          ansible.builtin.shell:
            cmd: |
              set -euo pipefail
              umask 077
              work=$(mktemp -d)
              trap 'rm -rf "$work"' EXIT
              [ -s /root/porelo-host-up.lines ] || { echo "missing /root/porelo-host-up.lines" >&2; exit 1; }
              [ -s /root/porelo-host-vvv.out ] || { echo "missing /root/porelo-host-vvv.out" >&2; exit 1; }
              journalctl -o cat --no-pager > "$work/journal"
              check_absent() {
                  local label=$1 patterns=$2 target_name=$3 target_file=$4 rc=0
                  [ -s "$patterns" ] || { echo "empty pattern file for $label" >&2; exit 1; }
                  grep -Fq -f "$patterns" -- "$target_file" || rc=$?
                  case $rc in
                      0) echo "$label appears in $target_name" >&2; exit 1 ;;
                      1) ;;
                      *) echo "grep ended $rc for $label in $target_name" >&2; exit 1 ;;
                  esac
              }
              tr -d '\r\n' < /root/vpn-host.key > "$work/vpn.pat"
              echo >> "$work/vpn.pat"
              [ "$(wc -c < "$work/vpn.pat")" -gt 20 ] || { echo "VPN key too short" >&2; exit 1; }
              cat "$work/vpn.pat" > "$work/planted"
              if ! grep -Fq -f "$work/vpn.pat" -- "$work/planted"; then
                  echo "planted control did not match" >&2; exit 1
              fi
              sed '1d;$d' /root/desktop-ca/ca.key > "$work/ca.pat"
              for target in "up.lines:/root/porelo-host-up.lines" "up-vvv:/root/porelo-host-vvv.out" \
                  "journal:$work/journal"; do
                  tname=${target%%:*}
                  tfile=${target#*:}
                  check_absent "host VPN key" "$work/vpn.pat" "$tname" "$tfile"
                  check_absent "desktop CA key" "$work/ca.pat" "$tname" "$tfile"
              done
              {% if verify_forge == 'on' %}
              tr -d '\r\n' < /home/porelo-forge/.config/porelo-forge/api.token > "$work/forge.pat"
              echo >> "$work/forge.pat"
              grep -Eqx '[0-9a-f]{40}' "$work/forge.pat" || { echo "unexpected forge token form" >&2; exit 1; }
              for target in "up.lines:/root/porelo-host-up.lines" "up-vvv:/root/porelo-host-vvv.out" \
                  "journal:$work/journal"; do
                  check_absent "forge API token" "$work/forge.pat" "${target%%:*}" "${target#*:}"
              done
              {% endif %}
              {% if verify_vm_pool == 'on' %}
              for key in /var/lib/porelo-host/pool/run-key /var/lib/porelo-host/pool/porelo-pool-ubuntu-1/host; do
                  base=$(basename "$key")
                  sed '1d;$d' "$key" > "$work/pool-$base.pat"
                  for target in "up.lines:/root/porelo-host-up.lines" "up-vvv:/root/porelo-host-vvv.out" \
                      "journal:$work/journal"; do
                      check_absent "pool key $base" "$work/pool-$base.pat" "${target%%:*}" "${target#*:}"
                  done
              done
              {% endif %}
              echo clean
            executable: /bin/bash
          register: verify_secret_search
          changed_when: false
          failed_when: false
          no_log: true

        - name: Assert no private key or forge token appeared in up's lines, -vvv output or the journal
          ansible.builtin.assert:
            that:
              - verify_secret_search.rc == 0
              - verify_secret_search.stdout == 'clean'
            fail_msg: >-
              asked for no private key or forge API token in up's lines, up -vvv output or the journal;
              got rc {{ verify_secret_search.rc }}: {{ verify_secret_search.stderr }}
      always:
        - name: Remove the -vvv output file
          ansible.builtin.file:
            path: /root/porelo-host-vvv.out
            state: absent

    - name: Verify up with -vvv recreated the person's forge login and password sign-in still holds
      ansible.builtin.include_tasks: "{{ playbook_dir }}/tasks/forge_person.yml"
      when: verify_forge == 'on'

    # The VM pool: one VM per run account, its file for porelo-machines holding no key, its run key root's alone on the
    # host, and a give-back that leaves nothing of the run on the VM, what the run wrote as root included.
    - name: Read the pool file porelo-machines reads
      ansible.builtin.slurp:
        src: /etc/porelo-host/pool/pool.json
      register: verify_pool_file
      when: verify_vm_pool == 'on'

    - name: Read the pool file's owner and mode
      ansible.builtin.stat:
        path: /etc/porelo-host/pool/pool.json
      register: verify_pool_file_stat
      when: verify_vm_pool == 'on'

    - name: Read the pool's run key's owner and mode
      ansible.builtin.stat:
        path: /var/lib/porelo-host/pool/run-key
      register: verify_pool_key
      when: verify_vm_pool == 'on'

    - name: Assert the pool file names one VM with one account and no key, mode 0644, and the run key stays root's 0600
      ansible.builtin.assert:
        that:
          - verify_pool.format == 'porelo-machines-pool/1'
          - verify_pool.vms | length == 1
          - verify_pool.vms[0].os == 'ubuntu'
          - verify_pool.vms[0].accounts == ['run']
          - verify_pool.vms[0].hostKey is match('^ssh-ed25519 ')
          - "'admin' not in verify_pool"
          - "'runKey' not in verify_pool"
          - verify_pool_file_stat.stat.pw_name == 'root'
          - verify_pool_file_stat.stat.gr_name == 'root'
          - verify_pool_file_stat.stat.mode == '0644'
          - verify_pool_key.stat.pw_name == 'root'
          - verify_pool_key.stat.gr_name == 'root'
          - verify_pool_key.stat.mode == '0600'
        fail_msg: >-
          asked for pool.json (root:root 0644) naming one Ubuntu VM with account run and no key, and run-key (root:root
          0600); got pool {{ verify_pool }} ({{ verify_pool_file_stat.stat }}), key {{ verify_pool_key.stat }}
      vars:
        verify_pool: "{{ verify_pool_file.content | b64decode | from_json }}"
      when: verify_vm_pool == 'on'

    - name: Ask libvirt for the pool's seed volumes and the pool VM's cdrom media
      ansible.builtin.shell:
        cmd: |
          set -euo pipefail
          virsh -c qemu:///system vol-list images | awk '{print $1}' | grep '^porelo-pool-.*-seed\.iso$' || true
          virsh -c qemu:///system domblklist porelo-pool-ubuntu-1 --details | awk '$2 == "cdrom" && $4 != "-"'
        executable: /bin/bash
      environment:
        LC_ALL: C
      register: verify_pool_seed
      changed_when: false
      when: verify_vm_pool == 'on'

    - name: Assert no seed volume stays in libvirt's pool and the pool VM has no cdrom media
      ansible.builtin.assert:
        that: verify_pool_seed.stdout | trim == ''
        fail_msg: "asked for no seed ISO or attached cdrom in libvirt, found {{ verify_pool_seed.stdout_lines }}"
      when: verify_vm_pool == 'on'

    - name: Verify the pool through porelo-machines, including a forcibly killed renter
      ansible.builtin.include_tasks: "{{ playbook_dir }}/tasks/pool.yml"
      when: verify_vm_pool == 'on'

    # The revert must have watched for the VM's stop, not been started again and again: a service that exits at once
    # and restarts every few seconds still reverts, by its first loop, and would hide a watch that never ran.
    - name: Ask systemd how often the revert was started again
      ansible.builtin.systemd_service:
        name: porelo-pool-revert.service
      register: verify_pool_restarts
      when: verify_vm_pool == 'on'

    - name: Assert the revert ran once, watching
      ansible.builtin.assert:
        that: verify_pool_restarts.status.NRestarts == '0'
        fail_msg: "porelo-pool-revert.service was started again {{ verify_pool_restarts.status.NRestarts }} times"
      when: verify_vm_pool == 'on'

    - name: Read the revert's journal, to say why the VM did not come back
      ansible.builtin.command:
        cmd: journalctl --no-pager -n 20 -u porelo-pool-revert.service
      register: verify_pool_revert_log
      changed_when: false
      when: verify_vm_pool == 'on' and verify_pool_given_back.rc != 0

    - name: Assert normal and killed renters leave nothing, and the real acceptance leg passes and is removed
      ansible.builtin.assert:
        that:
          - verify_pool_given_back.rc == 0
          - "'normal return: home and /etc clean in the next rental' in verify_pool_given_back.stdout_lines"
          - "'killed renter: home and /etc clean in the next rental' in verify_pool_given_back.stdout_lines"
          - "'pool acceptance leg passed' in verify_pool_given_back.stdout_lines"
          - "'CLI leg returned: acceptance account and run data absent' in verify_pool_given_back.stdout_lines"
        fail_msg: >-
          the give-back: {{ verify_pool_given_back.stdout }} {{ verify_pool_given_back.stderr }};
          the revert: {{ verify_pool_revert_log.stdout | default('') }}
      when: verify_vm_pool == 'on'

    # A key file missing stops the vpn role before the firewall's rules are written again.
    - name: Read the firewall's rules before an up without the key
      ansible.builtin.stat:
        path: /etc/porelo-host/firewall.nft
      register: verify_rules_before

    - name: Run up with a key path where no file is
      ansible.builtin.command:
        cmd: >-
          ansible-playbook -c local -i /root/porelo-host-inventory.yml porelo.host.up
          -e vpn_private_key_path=/etc/wireguard/no-such.key -e vpn_ssh_port=2222
      environment:
        ANSIBLE_STDOUT_CALLBACK: porelo.host.lines
        LC_ALL: C.UTF-8
      register: verify_no_key
      changed_when: false
      failed_when: false

    - name: Read the firewall's rules after it
      ansible.builtin.stat:
        path: /etc/porelo-host/firewall.nft
      register: verify_rules_after

    - name: Assert up stopped on the missing key, naming its path, and left the firewall's rules as they were
      ansible.builtin.assert:
        that:
          - verify_no_key.rc == 2
          - >-
            verify_no_key.stdout is search('wireguard: no key file of root.s alone, mode 0600, at
            /etc/wireguard/no-such.key')
          - verify_rules_after.stat.checksum == verify_rules_before.stat.checksum
        fail_msg: >-
          up without the key gave rc {{ verify_no_key.rc }}:
          {{ verify_no_key.stdout_lines | select('search', 'failed') | list }};
          rules {{ verify_rules_before.stat.checksum }} -> {{ verify_rules_after.stat.checksum }}

    # The lines callback and /etc/porelo-host/host.json: one state=="host" line matching host.json and the live host.
    - name: Read the lines of the last up and /etc/porelo-host/host.json
      ansible.builtin.slurp:
        src: "{{ item }}"
      loop:
        - /root/porelo-host-up.lines
        - /etc/porelo-host/host.json
        - /etc/ssh/ssh_host_ed25519_key.pub
        - /root/desktop-ca/ca.pem
        - /etc/porelo-host/forge/ca.pem
      register: verify_summary_files

    - name: Read /etc/porelo-host/host.json's owner and mode
      ansible.builtin.stat:
        path: /etc/porelo-host/host.json
      register: verify_host_json_stat

    - name: Read the live WireGuard public key from wg-porelo
      ansible.builtin.command:
        argv: [wg, show, wg-porelo, public-key]
      register: verify_wg_public_key
      changed_when: false

    - name: Compute the SHA-256 digest of the stand-in CA's DER certificate
      ansible.builtin.shell:
        cmd: >-
          set -euo pipefail
          && openssl x509 -in /root/desktop-ca/ca.pem -outform DER | sha256sum | cut -d' ' -f1
        executable: /bin/bash
      register: verify_ca_der_sha256
      changed_when: false

    - name: Read the host's global IPv4 addresses
      ansible.builtin.command:
        argv: [ip, -o, "-4", addr, show, scope, global]
      register: verify_global_ipv4
      changed_when: false

    - name: Assert every line of up is valid JSON of version 1, every task ended, and nothing failed or waits
      ansible.builtin.assert:
        that:
          - verify_lines | length > 0
          - verify_lines | map(attribute='v') | unique == [1]
          - verify_lines | selectattr('state', 'equalto', 'started') | list | length
            == verify_lines | selectattr('state', 'in', ['ok', 'changed', 'skipped']) | list | length
          - verify_lines | selectattr('state', 'in', ['failed', 'waiting']) | list | length == 0
          - verify_lines | selectattr('state', 'equalto', 'started') | map(attribute='task') | list
            == verify_lines | selectattr('state', 'in', ['ok', 'changed', 'skipped']) | map(attribute='task') | list
        fail_msg: >-
          asked every line of up to carry v=1 with matching started and ended tasks and no failed or waiting line;
          got {{ verify_lines }}
      vars:
        verify_lines: >-
          {{ (verify_summary_files.results[0].content | b64decode).splitlines() | select | map('from_json') | list }}

    - name: >-
        Assert up printed one state==host object equal to /etc/porelo-host/host.json (root 0644) and matching the live
        host's keys, CA digest, network, homeserver and endpoint
      ansible.builtin.assert:
        that:
          - verify_host_lines | length == 1
          - verify_host_lines[0] | dict2items | map(attribute='key') | sort == ['host', 'state', 'v']
          - verify_host_lines[0].v == 1
          - verify_host_json_stat.stat.exists
          - verify_host_json_stat.stat.isreg | default(false)
          - verify_host_json_stat.stat.uid | default(-1) == 0
          - verify_host_json_stat.stat.gid | default(-1) == 0
          - verify_host_json_stat.stat.mode | default('') == '0644'
          - verify_host_lines[0].host == verify_host_json
          - verify_host_json | dict2items | map(attribute='key') | sort
            == ['address', 'ca_sha256', 'endpoint', 'homeserver', 'network', 'ssh_host_key', 'wireguard_public_key']
          - verify_summary_files.results[3].content == verify_summary_files.results[4].content
          - verify_host_json.wireguard_public_key == (verify_wg_public_key.stdout | trim)
          - verify_host_json.ssh_host_key == verify_expected_ssh_key
          - verify_host_json.ca_sha256 == (verify_ca_der_sha256.stdout | trim)
          - verify_host_json.network == '10.73.7.0/24'
          - verify_host_json.homeserver == 'matrix.alpha.porelo.internal'
          - verify_host_json.address is match('^[0-9]{1,3}(\.[0-9]{1,3}){3}$')
          - verify_host_json.address != '10.73.7.1'
          - verify_host_json.address in verify_global_addresses
          - verify_host_json.endpoint == (verify_host_json.address ~ ':51820')
        fail_msg: >-
          asked for one {"v":1,"state":"host","host":{...}} line matching /etc/porelo-host/host.json (root:root 0644)
          and live wg key '{{ verify_wg_public_key.stdout | trim }}', ssh key '{{ verify_expected_ssh_key }}',
          CA DER SHA-256 '{{ verify_ca_der_sha256.stdout | trim }}', network 10.73.7.0/24,
          homeserver matrix.alpha.porelo.internal and endpoint <address>:51820;
          got host lines {{ verify_host_lines }}, stat {{ verify_host_json_stat.stat }}, json {{ verify_host_json }},
          global IPv4s {{ verify_global_addresses }}
      vars:
        verify_lines: >-
          {{ (verify_summary_files.results[0].content | b64decode).splitlines() | select | map('from_json') | list }}
        verify_host_lines: "{{ verify_lines | selectattr('state', 'equalto', 'host') | list }}"
        verify_host_json: "{{ verify_summary_files.results[1].content | b64decode | from_json }}"
        verify_expected_ssh_key: >-
          {{ (verify_summary_files.results[2].content | b64decode | trim).split()[:2] | join(' ') }}
        verify_global_addresses: >-
          {{ verify_global_ipv4.stdout_lines | map('split') | map(attribute=3) | map('split', '/') | map('first')
          | list }}

    - name: Verify that the host comes back from a reboot with its firewall, VPN, homeserver and forge
      ansible.builtin.include_tasks: "{{ playbook_dir }}/tasks/reboot.yml"

    - name: Verify project admins admitted, checked, locked and purged on the prepared host
      ansible.builtin.include_tasks: "{{ playbook_dir }}/tasks/people.yml"

    - name: Verify projects registered, isolated and removed on the prepared host's forge
      ansible.builtin.include_tasks: "{{ playbook_dir }}/tasks/projects.yml"
      when: verify_forge == 'on'
