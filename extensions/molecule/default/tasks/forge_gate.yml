---
# A gate that can bypass review or cannot read the branch's build breaks the acceptance boundary.
- name: Read the host's marked forge name mapping
  ansible.builtin.slurp:
    src: /etc/hosts
  register: verify_gate_hosts

- name: Assert the forge's marked name maps to the host's loopback HTTPS socket
  ansible.builtin.assert:
    that:
      - verify_gate_host_blocks == ['127.0.0.1 forge.porelo.internal\n']
    fail_msg: "asked for one marked loopback forge mapping, got {{ verify_gate_host_blocks }}"
  vars:
    verify_gate_host_blocks: >-
      {{ verify_gate_hosts.content | b64decode
      | regex_findall('(?ms)^# BEGIN porelo-host forge name\n(.*?)^# END porelo-host forge name$') }}

- name: Ask Porelo which entries the vault holds after the verbose up
  ansible.builtin.command:
    argv: [porelo, vault, list]
  become: true
  become_user: "{{ verify_account }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ ansible_facts['getent_passwd'][verify_account][1] }}"
  register: verify_gate_entries
  changed_when: false
  no_log: true

- name: Assert the verbose up deposited the gate's token
  ansible.builtin.assert:
    that: "'git.token.forge.porelo.internal' in (verify_gate_entries.stdout_lines | map('split') | map('first'))"
    fail_msg: "asked for git.token.forge.porelo.internal in the vault, got {{ verify_gate_entries.stdout }}"

# Git's helper reads the vault into its own pipe; neither Ansible nor the shell holds the token.
- name: Read the forge by name as Porelo's account, refuse main and accept the probe branch with the same credential
  ansible.builtin.shell:
    cmd: |
      set -euo pipefail
      umask 077
      work=$(mktemp -d)
      trap 'rm -rf "$work"' EXIT
      export XDG_RUNTIME_DIR=/run/user/$(id -u)
      export GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_NOSYSTEM=1 GIT_TERMINAL_PROMPT=0
      git_gate() {
          helper='!porelo vault credential --entry git.token.forge.porelo.internal'
          git -c credential.helper= -c http.followRedirects=false \
              -c "credential.https://forge.porelo.internal.helper=$helper --username porelo-{{ verify_account }}" "$@"
      }
      url=https://forge.porelo.internal/porelo/stand-in.git
      before=$(git_gate ls-remote --exit-code "$url" refs/heads/main | cut -f1)
      git_gate clone --quiet --branch task-probe --single-branch "$url" "$work/repo" > /dev/null 2>&1
      git -C "$work/repo" -c user.name=probe -c user.email=probe@example.invalid \
          commit --quiet --allow-empty -m 'Read the gate branch build'
      head=$(git -C "$work/repo" rev-parse HEAD)
      # The matcher consumes stderr without retaining a possible credential in a file or registered output.
      set +e
      git_gate -C "$work/repo" push origin HEAD:refs/heads/main 2>&1 \
          | grep -Eqi 'protected|not allowed|not permitted|permission denied'
      status=("${PIPESTATUS[@]}")
      set -e
      refused=false
      if [ "${status[0]}" -ne 0 ] && [ "${status[1]}" -eq 0 ]; then refused=true; fi
      git_gate -C "$work/repo" push --quiet origin HEAD:refs/heads/porelo/probe > /dev/null 2>&1
      branch=$(git_gate ls-remote --exit-code "$url" refs/heads/porelo/probe | cut -f1)
      after=$(git_gate ls-remote --exit-code "$url" refs/heads/main | cut -f1)
      same=false
      [ "$head" != "$branch" ] || same=true
      kept=false
      [ "$before" != "$after" ] || kept=true
      printf '{"main_refused": %s, "main_kept": %s, "probe_matches": %s, "commit": "%s"}\n' \
          "$refused" "$kept" "$same" "$head"
    executable: /bin/bash
  become: true
  become_user: "{{ verify_account }}"
  environment:
    GIT_SSL_CAINFO: "{{ verify_porelo_config }}/ca-certificates.pem"
    LC_ALL: C
  register: verify_gate_push
  changed_when: true
  failed_when: false
  no_log: true

- name: Assert the gate reads the named forge, cannot push main and can push its branch
  ansible.builtin.assert:
    that:
      - verify_gate_push.rc == 0
      - verify_gate_pushed.main_refused | default(false)
      - verify_gate_pushed.main_kept | default(false)
      - verify_gate_pushed.probe_matches | default(false)
      - verify_gate_pushed.commit | default('') is match('^[0-9a-f]{40}$')
    fail_msg: >-
      asked for ls-remote over the named TLS forge, a protected-main refusal with main kept and porelo/probe accepted;
      got exit {{ verify_gate_push.rc }} and {{ verify_gate_push.stdout | default('no measurement', true) }}
  vars:
    verify_gate_pushed: "{{ verify_gate_push.stdout | default('{}', true) | from_json }}"

# The installed executable speaks Build2, not a one-shot CLI taking a token argument.
- name: Ask the installed reader for the probe branch's verdict and logs with the vault token on a pipe
  ansible.builtin.shell:
    cmd: |
      set -euo pipefail
      export XDG_RUNTIME_DIR=/run/user/$(id -u)
      printf 'protocol=https\nhost=forge.porelo.internal\n\n' \
          | porelo vault credential --entry git.token.forge.porelo.internal get \
          | python3 -I -c '
      import base64, json, re, select, socket, subprocess, sys, tempfile, time
      fields = dict(line.rstrip("\n").split("=", 1) for line in sys.stdin if "=" in line)
      if not re.fullmatch("[0-9a-f]{40}", fields.get("password", "")):
          sys.exit("asked for a 40-digit vault token on the pipe, got another form")
      target = {"upstream": "https://forge.porelo.internal/porelo/stand-in.git",
                "api": "https://forge.porelo.internal/api/v1", "token": fields["password"]}
      with tempfile.TemporaryDirectory(prefix="reader-") as work:
          path = work + "/build.sock"
          reader = subprocess.Popen(["/usr/libexec/porelo/builds/forgejo", "serve", path],
                                    stdout=subprocess.PIPE, stderr=subprocess.DEVNULL)
          try:
              ready = select.select([reader.stdout], [], [], 10)[0]
              if not ready or not reader.stdout.readline().startswith(b"ready "):
                  sys.exit("asked the installed forgejo reader to become ready, got no ready answer")
              def call(method, parameters):
                  with socket.socket(socket.AF_UNIX) as link:
                      link.settimeout(30)
                      link.connect(path)
                      request = {"method": "org.fuin.porelo.Build2." + method, "parameters": parameters}
                      link.sendall(json.dumps(request).encode() + b"\0")
                      response = bytearray()
                      while b"\0" not in response:
                          chunk = link.recv(65536)
                          if not chunk or len(response) > 8 * 1024 * 1024:
                              sys.exit("asked Build2 for a complete bounded reply, got EOF or an oversized reply")
                          response.extend(chunk)
                      answer = json.loads(response.split(b"\0", 1)[0])
                      if "error" in answer:
                          error = answer["error"].rsplit(".", 1)[-1]
                          known = {"CredentialRefused", "NoSuchRepository", "Unreachable", "RateLimited"}
                          sys.exit("asked Build2 for a verdict and logs, got " + (error if error in known else "error"))
                      return answer["parameters"]
              head = call("Head", dict(target, branch="porelo/probe"))["commit"]
              if head != sys.argv[1]:
                  sys.exit("asked the reader for the probe commit " + sys.argv[1] + ", got " + head)
              for attempt in range(80):
                  build = call("Build", dict(target, commit=head, logs="all"))
                  verdict = build.get("verdict", "missing")
                  if verdict not in ("queued", "running", "unknown"):
                      break
                  if verdict == "unknown" and not build.get("detail", "").startswith("no build of "):
                      sys.exit("asked for the probe build, got an unknown verdict other than no build yet")
                  time.sleep(15)
              jobs = build.get("jobs", [])
              logs = [base64.b64decode(job.get("log", "")).decode(errors="replace") for job in jobs]
              if verdict != "success" or len(jobs) != 2 or not all(logs):
                  got = (verdict, len(jobs), bool(all(logs)))
                  sys.exit("asked for success, two jobs and both logs; got " + str(got))
              if not any("OMP_NUM_THREADS=1" in log for log in logs):
                  sys.exit("asked for the real probe job log marker, got no marker")
              print(json.dumps({"verdict": verdict, "jobs": len(jobs), "logs_read": True, "head_matches": True}))
          finally:
              reader.terminate()
              try:
                  reader.wait(timeout=10)
              except subprocess.TimeoutExpired:
                  reader.kill()
                  reader.wait()' {{ (verify_gate_push.stdout | from_json).commit | quote }}
    executable: /bin/bash
  become: true
  become_user: "{{ verify_account }}"
  register: verify_gate_reader
  changed_when: false
  failed_when: false
  no_log: true

- name: Assert the real build reader answered the probe's verdict and read its logs through the named TLS forge
  ansible.builtin.assert:
    that:
      - verify_gate_reader.rc == 0
      - >-
        verify_gate_build == {'verdict': 'success', 'jobs': 2, 'logs_read': true, 'head_matches': true}
    fail_msg: >-
      asked the installed forgejo reader for the probe head, success and two real job logs using the vault token;
      got exit {{ verify_gate_reader.rc }}: {{ verify_gate_reader.stdout }} {{ verify_gate_reader.stderr }}
  vars:
    verify_gate_build: "{{ verify_gate_reader.stdout | default('{}', true) | from_json }}"

# The forced-change sign-in was checked first; this fixture unlocks Basic authentication for the API-only PR checks.
# Forgejo's command line, since the role's admin token holds no write:admin scope (the admin API answers 403).
- name: Allow the test person's first password to authenticate the approval API after checking its forced change
  ansible.builtin.shell:
    cmd: >-
      runuser -u porelo-forge -- env XDG_RUNTIME_DIR="/run/user/$(id -u porelo-forge)"
      podman exec forgejo forgejo admin user must-change-password --unset operator
    chdir: /
    executable: /bin/bash
  register: verify_gate_person_ready
  changed_when: true
  failed_when: false

- name: Assert the test person's API authentication was enabled
  ansible.builtin.assert:
    that: verify_gate_person_ready.rc == 0 and verify_gate_person_ready.stdout is search('^Updated 1 users')
    fail_msg: >-
      asked Forgejo to clear operator's forced password change and say it updated 1 user,
      got exit {{ verify_gate_person_ready.rc }}: {{ verify_gate_person_ready.stdout }}
      {{ verify_gate_person_ready.stderr }}

- name: Refuse the person's unapproved merge and accept it only after the person's approval
  ansible.builtin.shell:
    cmd: |
      set -euo pipefail
      umask 077
      answer=$(mktemp) && trap 'rm -f "$answer"' EXIT
      api() { curl -sS --max-time 10 --cacert /etc/porelo-host/forge/ca.pem \
          -H @<(sed 's/^/Authorization: token /' /home/porelo-forge/.config/porelo-forge/api.token) \
          -H 'Content-Type: application/json' "$@"; }
      person() { curl -sS --max-time 10 --cacert /etc/porelo-host/forge/ca.pem \
          -H @<({ printf 'operator:'; tr -d '\r\n' < /etc/porelo-host/forge/person.password; } \
              | base64 -w0 | sed 's/^/Authorization: Basic /') -H 'Content-Type: application/json' "$@"; }
      base=https://forge.porelo.internal/api/v1/repos/porelo/stand-in
      code=$(api -o "$answer" -w '%{http_code}' -X POST "$base/pulls" \
          -d '{"head": "porelo/probe", "base": "main", "title": "Approve the gate probe"}')
      [ "$code" = 201 ] || { echo "asked to create the probe PR with HTTP 201, got HTTP $code" >&2; exit 1; }
      pull=$(python3 -I -c 'import json,sys; print(int(json.load(open(sys.argv[1]))["number"]))' "$answer")
      # A merge still being checked could refuse for a reason other than the missing person's approval.
      ready=false
      for attempt in {1..10}; do
          code=$(api -o "$answer" -w '%{http_code}' "$base/pulls/$pull")
          [ "$code" = 200 ] || { echo "asked for the probe PR with HTTP 200, got HTTP $code" >&2; exit 1; }
          ready=$(python3 -I -c 'import json,sys
      print(str(json.load(open(sys.argv[1])).get("mergeable") is True).lower())' "$answer")
          [ "$ready" != true ] || break
          sleep 1
      done
      [ "$ready" = true ] || { echo "asked for a mergeable probe PR before approval, got $ready" >&2; exit 1; }
      uid=$(id -u {{ verify_account }})
      gate_review=$(printf 'protocol=https\nhost=forge.porelo.internal\n\n' \
          | runuser -u {{ verify_account }} -- env XDG_RUNTIME_DIR=/run/user/$uid \
              porelo vault credential --entry git.token.forge.porelo.internal get \
          | sed -n 's/^password=/Authorization: token /p' \
          | curl -sS --max-time 10 --cacert /etc/porelo-host/forge/ca.pem -H @- \
              -H 'Content-Type: application/json' -o /dev/null -w '%{http_code}' \
              -X POST "$base/pulls/$pull/reviews" -d '{"event": "APPROVED", "body": "Gate review cannot accept"}')
      refused=$(person -o /dev/null -w '%{http_code}' -X POST "$base/pulls/$pull/merge" \
          -d '{"Do": "fast-forward-only"}')
      code=$(api -o "$answer" -w '%{http_code}' "$base/pulls/$pull")
      [ "$code" = 200 ] || { echo "asked to read the refused PR with HTTP 200, got HTTP $code" >&2; exit 1; }
      open=$(python3 -I -c 'import json,sys; p=json.load(open(sys.argv[1]));
      print(str(p["state"] == "open" and not p["merged"]).lower())' "$answer")
      approved=$(person -o /dev/null -w '%{http_code}' -X POST "$base/pulls/$pull/reviews" \
          -d '{"event": "APPROVED", "body": "Accept the probe"}')
      admin_refused=$(api -o /dev/null -w '%{http_code}' -X POST "$base/pulls/$pull/merge" \
          -d '{"Do": "fast-forward-only"}')
      # A merge commit would be the forge's own, authored by the person's forge account; only fast-forward is open.
      merge_commit=$(person -o /dev/null -w '%{http_code}' -X POST "$base/pulls/$pull/merge" -d '{"Do": "merge"}')
      merged=$(person -o /dev/null -w '%{http_code}' -X POST "$base/pulls/$pull/merge" \
          -d '{"Do": "fast-forward-only"}')
      code=$(api -o /dev/null -w '%{http_code}' "$base/compare/main...porelo/probe")
      [ "$code" = 200 ] || { echo "asked to compare the merged probe with HTTP 200, got HTTP $code" >&2; exit 1; }
      api -f "$base/compare/main...porelo/probe" > "$answer"
      reached=$(python3 -I -c 'import json,sys
      print(str(json.load(open(sys.argv[1]))["total_commits"] == 0).lower())' \
          "$answer")
      api -f "$base/branches/main" > "$answer"
      main_head=$(python3 -I -c 'import json,sys; print(json.load(open(sys.argv[1]))["commit"]["id"])' "$answer")
      api -f "$base/branches/porelo/probe" > "$answer"
      probe_head=$(python3 -I -c 'import json,sys; print(json.load(open(sys.argv[1]))["commit"]["id"])' "$answer")
      [ "$main_head" = "$probe_head" ] && unchanged=true || unchanged=false
      printf '{"gate_review_http": %s, "unapproved_http": %s, "kept_open": %s, "approved_http": %s,
          "admin_merge_http": %s, "merge_commit_http": %s, "merged_http": %s, "reached": %s,
          "main_is_probe": %s}\n' \
          "$gate_review" "$refused" "$open" "$approved" "$admin_refused" "$merge_commit" "$merged" "$reached" \
          "$unchanged"
    executable: /bin/bash
  register: verify_gate_review
  changed_when: true
  failed_when: false
  no_log: true

- name: Assert an unapproved PR cannot merge and the person's approval reaches main
  ansible.builtin.assert:
    that:
      - verify_gate_review.rc == 0
      - verify_gate_reviewed.gate_review_http | default(0) in [200, 403]
      - verify_gate_reviewed.unapproved_http | default(0) in [403, 405]
      - verify_gate_reviewed.kept_open | default(false)
      - verify_gate_reviewed.approved_http | default(0) == 200
      - verify_gate_reviewed.admin_merge_http | default(0) in [403, 405]
      - verify_gate_reviewed.merge_commit_http | default(0) in [403, 405]
      - verify_gate_reviewed.merged_http | default(0) == 200
      - verify_gate_reviewed.reached | default(false)
      - verify_gate_reviewed.main_is_probe | default(false)
    fail_msg: >-
      asked for a gate review accepted or refused (200 or 403), a merge without the person's approval refused
      (403 or 405) with the PR open, then the person's approval (200), an admin merge refused (403 or 405),
      the person's merge commit refused (403 or 405), the person's fast-forward (200), the probe contained in main
      and main's head the probe's own commit; got exit {{ verify_gate_review.rc }}:
      {{ verify_gate_review.stdout }} {{ verify_gate_review.stderr }}
  vars:
    verify_gate_reviewed: "{{ verify_gate_review.stdout | default('{}', true) | from_json }}"
