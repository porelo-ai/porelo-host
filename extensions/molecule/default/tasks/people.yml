        that:
          - verify_people_lock_ada_again.rc == 0
          - verify_people_lock_ada_again.stdout_lines | length == 1
          - "(verify_people_lock_ada_again.stdout | from_json) == {'person': 'ada', 'locked': true}"
        fail_msg: >-
          asked a second 'porelo-host-person lock ada' for rc 0 and {"person":"ada","locked":true};
          got rc {{ verify_people_lock_ada_again.rc }}: {{ verify_people_lock_ada_again.stdout }}
          ({{ verify_people_lock_ada_again.stderr }})

    - name: Read ada's person record after lock ada
      ansible.builtin.slurp:
        src: /etc/porelo-host/people/ada.conf
      register: verify_people_locked_record

    - name: Assert lock ada keeps member=hand on the locked record
      ansible.builtin.assert:
        that:
          - (verify_people_locked_record.content | b64decode)
            == ('member=hand\nlocked=true\nlaptop=ada-laptop ' ~ verify_people_ada_ssh ~ ' '
                ~ verify_people_ada_wg ~ ' 10.73.7.3\n')
        fail_msg: >-
          asked lock ada to keep member=hand with locked=true;
          got '{{ verify_people_locked_record.content | b64decode }}'
      vars:
        verify_people_ada_ssh: "{{ verify_people_public_inputs.results[0].content | b64decode | trim }}"
        verify_people_ada_wg: "{{ verify_people_public_inputs.results[1].content | b64decode | trim }}"

    - name: Run down while locked ada and unlocked bo still hold memberships
      ansible.builtin.command:
        argv: [ansible-playbook, -c, local, -i, /root/porelo-host-inventory.yml, porelo.host.down]
      environment:
        ANSIBLE_STDOUT_CALLBACK: porelo.host.lines
        LC_ALL: C.UTF-8
      register: verify_people_down_refused
      changed_when: false
      failed_when: false

    - name: Check that wg-porelo and porelo-matrix still exist after the refused down
      ansible.builtin.command:
        argv: "{{ item }}"
      loop:
        - [ip, link, show, wg-porelo]
        - [getent, passwd, porelo-matrix]
      register: verify_people_down_untouched
      changed_when: false
      failed_when: false

    - name: Assert down refuses before stopping anything, naming locked ada, unlocked bo and the ways back
      ansible.builtin.assert:
        that:
          - verify_people_down_refused.rc == 2
          - verify_people_down_failed | length == 1
          - "'ada (hand)' in verify_people_down_failed[0].msg"
          - "'bo (hand)' in verify_people_down_failed[0].msg"
          - "'Take the project off' in verify_people_down_failed[0].msg"
          - "'Purge' in verify_people_down_failed[0].msg"
          - verify_people_ada_ssh not in verify_people_down_refused.stdout
          - verify_people_bo_ssh not in verify_people_down_refused.stdout
          - verify_people_down_tasks | intersect(verify_people_teardown_tasks) | length == 0
          - verify_people_down_untouched.results | map(attribute='rc') | list == [0, 0]
        fail_msg: >-
          asked down to refuse with rc 2 naming ada (hand), bo (hand), Take the project off and Purge without stopping
          Matrix or the VPN; got rc {{ verify_people_down_refused.rc }}, lines {{ verify_people_down_lines }},
          untouched rcs {{ verify_people_down_untouched.results | map(attribute='rc') | list }}
      vars:
        verify_people_ada_ssh: "{{ verify_people_public_inputs.results[0].content | b64decode | trim }}"
        verify_people_bo_ssh: "{{ verify_people_public_inputs.results[2].content | b64decode | trim }}"
        verify_people_down_lines: "{{ verify_people_down_refused.stdout_lines | select | map('from_json') | list }}"
        verify_people_down_failed: "{{ verify_people_down_lines | selectattr('state', 'equalto', 'failed') | list }}"
        verify_people_down_tasks: >-
          {{ verify_people_down_lines | selectattr('task', 'defined') | map(attribute='task') | list }}
        verify_people_teardown_tasks:
          - Stop the host's Matrix homeserver and remove its account
          - Take the host's VM pool off it, before the forge whose runner rents from it
          - Stop the host's forge, keeping nothing
          - Take the VPN down

    - name: Purge ada with /usr/local/sbin/porelo-host-person purge ada
      ansible.builtin.shell:
        cmd: |
          set -euo pipefail
          out=$(mktemp)
          err=$(mktemp)
          trap 'rm -f "$out" "$err"' EXIT
          rc=0
          /usr/local/sbin/porelo-host-person purge ada < /dev/null > "$out" 2> "$err" || rc=$?
          cat "$out" "$err" >> /root/verify-people/helper.out
          cat "$err" >&2
          cat "$out"
          exit "$rc"
        executable: /bin/bash
