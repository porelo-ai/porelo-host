          {{ verify_people_locked_ssh.stderr }}
          {{ verify_people_locked_peers.stdout }}
          {{ verify_people_locked_peers.stderr }}
          {{ (verify_people_locked_forge | default({})).stdout | default('') }}
          {{ (verify_people_locked_forge | default({})).stderr | default('') }}
          {{ verify_people_lock_ada_again.stdout }}
          {{ verify_people_lock_ada_again.stderr }}
          {{ verify_people_down_refused.stdout }}
          {{ verify_people_down_refused.stderr }}
          {{ verify_people_purge_ada.stdout }}
          {{ verify_people_purge_ada.stderr }}
          {{ verify_people_purged_account.stdout }}
          {{ verify_people_purged_account.stderr }}
          {{ verify_people_purge_ada_again.stdout }}
          {{ verify_people_purge_ada_again.stderr }}
      changed_when: false
      no_log: true

    - name: Search registered outputs, helper outputs and journalctl -b for Matrix and identity tokens with a control
      ansible.builtin.shell:
        cmd: |
          set -euo pipefail
          umask 077
          work=$(mktemp -d)
          trap 'rm -rf "$work"' EXIT
          expected_min={{ 8 if verify_forge == 'on' else 2 }}
          count=$(wc -l < /root/verify-people/tokens.pat)
          [ "$count" -ge "$expected_min" ] || {
              echo "asked for at least $expected_min recorded tokens, got $count" >&2
              exit 1
          }
          awk 'length($0) < 8 { exit 1 }' /root/verify-people/tokens.pat || {
              echo "recorded token pattern file holds a short or empty line" >&2
              exit 1
          }
          sort -u /root/verify-people/tokens.pat > "$work/tokens.pat"
          head -n 1 "$work/tokens.pat" > "$work/planted"
          if ! grep -Fq -f "$work/tokens.pat" -- "$work/planted"; then
              echo "planted control token did not match" >&2
              exit 1
          fi
          echo "planted: refused"
          journalctl -b -o cat --no-pager > "$work/journal"
          check_clean() {
              local label=$1 target=$2 rc=0
              [ -s "$target" ] || { echo "empty scan target for $label" >&2; exit 1; }
              grep -Fq -f "$work/tokens.pat" -- "$target" || rc=$?
              case $rc in
                  0) echo "a secret token appeared in $label" >&2; exit 1 ;;
                  1) echo "$label: clean" ;;
                  *) echo "grep ended $rc scanning $label" >&2; exit 1 ;;
              esac
          }
          check_clean registered /root/verify-people/registered.out
          check_clean helper /root/verify-people/helper.out
          check_clean journal "$work/journal"
        executable: /bin/bash
      register: verify_people_leak_scan
      changed_when: false
      failed_when: false
      no_log: true

    - name: Assert the planted token control matched and no token leaked to output or journal
      ansible.builtin.assert:
        that:
          - verify_people_leak_scan.rc == 0
          - >-
            verify_people_leak_scan.stdout_lines
            == ['planted: refused', 'registered: clean', 'helper: clean', 'journal: clean']
        fail_msg: >-
          asked for no Matrix or Forgejo identity token in registered stdout/stderr, helper output or journalctl -b;
          got rc {{ verify_people_leak_scan.rc }}: {{ verify_people_leak_scan.stderr }}

    - name: Purge bo before side_effect runs down when the forge project tasks are skipped
      ansible.builtin.command:
        argv: [/usr/local/sbin/porelo-host-person, purge, bo]
        stdin: ""
      register: verify_people_purge_bo
      changed_when: true
      when: verify_forge != 'on'

    - name: Assert purging bo answers purged true when the forge is off
      ansible.builtin.assert:
        that:
          - verify_people_purge_bo.rc == 0
          - verify_people_purge_bo.stdout_lines | length == 1
          - "(verify_people_purge_bo.stdout | from_json) == {'person': 'bo', 'purged': true}"
        fail_msg: >-
          asked 'porelo-host-person purge bo' for {"person":"bo","purged":true};
          got rc {{ verify_people_purge_bo.rc }}: {{ verify_people_purge_bo.stdout }}
          ({{ verify_people_purge_bo.stderr }})
      when: verify_forge != 'on'
  always:
    - name: Remove ada's temporary WireGuard peer namespace and veth interface
      ansible.builtin.shell:
        cmd: |
          set -euo pipefail
          if [ -e /run/netns/verify-ada ]; then
              ip netns del verify-ada
          fi
          if [ -e /sys/class/net/verify-ada0 ]; then
              ip link del verify-ada0
          fi
          rm -f /etc/wireguard/verify-ada.key
        executable: /bin/bash
      changed_when: false
      failed_when: false

    - name: Remove the temporary people test key and scan directory
      ansible.builtin.file:
        path: /root/verify-people
        state: absent
