          got rc {{ verify_people_purge_ada.rc }}: {{ verify_people_purge_ada.stdout }}
          ({{ verify_people_purge_ada.stderr }})

    - name: Check getent passwd ada and ada's home and record paths after purge ada
      ansible.builtin.command:
        argv: [getent, passwd, ada]
      register: verify_people_purged_account
      changed_when: false
      failed_when: false

    - name: Read whether /home/ada or /etc/porelo-host/people/ada.conf remains after purge ada
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - /home/ada
        - /etc/porelo-host/people/ada.conf
      register: verify_people_purged_paths

    - name: Run /usr/local/sbin/porelo-host-person purge ada a second time
      ansible.builtin.shell:
        cmd: |
          set -uo pipefail
          out=$(mktemp)
          err=$(mktemp)
          trap 'rm -f "$out" "$err"' EXIT
          rc=0
