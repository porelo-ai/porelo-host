          {{ verify_people_accounts.stderr }}
          {{ verify_people_sshd_test.stdout }}
          {{ verify_people_sshd_test.stderr }}
          {{ verify_people_wg_peers.stdout }}
          {{ verify_people_wg_peers.stderr }}
          {{ verify_people_vpn_ssh.stdout }}
          {{ verify_people_vpn_ssh.stderr }}
