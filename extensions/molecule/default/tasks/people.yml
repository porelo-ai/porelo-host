          - verify_people_purged_paths.results | selectattr('stat.exists') | list | length == 0
          - verify_people_purge_ada_again.rc == 65
          - verify_people_purge_ada_again.stdout == ''
          - "verify_people_purge_ada_again.stderr is match('^porelo-host-person: ')"
          - "'the person is unknown to the people records' in verify_people_purge_ada_again.stderr"
        fail_msg: >-
          asked purge ada to delete the account (getent rc 2), /home/ada and /etc/porelo-host/people/ada.conf, and
          refuse a second purge with 65; got getent rc {{ verify_people_purged_account.rc }},
          paths {{ verify_people_purged_paths.results | selectattr('stat.exists') | map(attribute='item') | list }},
