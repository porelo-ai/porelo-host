---
# Persons taken from the registry, admitted, reached, locked and purged through /usr/local/sbin/porelo-host-person as
# root. The host admin's registry is Molecule's own (files/registry-bundle.sh, fixture keys), brought by root as `host
# up` brings it; add takes a person only when that verified registry names them. A person reaches the host over SSH
# with their key alone, and through it the sockets that are theirs: the homeserver's gate and their daemon's link, never
# a service's own socket. Refusals leave accounts and records untouched, the forge holds the person's two logins and a
# token only the person's own forge-token makes, down refuses while any record holds a membership, and bo stays
# admitted for the project tasks when the forge is on or is purged first when it is off.
- name: Verify persons taken from the registry, admitted, reached, locked and purged by the root helper
  block:
    - name: Make the root-only workspace, the persons' fixture keys and the helper's run script
      ansible.builtin.shell:
        cmd: |
          set -euo pipefail
          umask 077
          d=/root/verify-people
          r=/root/verify-registry
          rm -rf "$d" "$r"
          mkdir -p "$d" "$r"
          : > "$d/helper.out"
          : > "$d/tokens.pat"
          for who in hostadmin ada bo cy di operator other; do
              ssh-keygen -q -t ed25519 -N "" -C "" -f "$r/$who"
          done
          # Every call of the helper is kept for the leak scan; its answer goes back to the task as it came. Molecule
          # becomes root through sudo, so the call drops SUDO_USER and runs as root itself, as up and root's SSH do.
          cat > "$d/run.sh" <<'EOF'
          #!/bin/bash
          set -uo pipefail
          out=$(mktemp)
          err=$(mktemp)
          trap 'rm -f "$out" "$err"' EXIT
          rc=0
          env -u SUDO_USER /usr/local/sbin/porelo-host-person "$@" < /dev/null > "$out" 2> "$err" || rc=$?
          cat "$out" "$err" >> /root/verify-people/helper.out
          cat "$err" >&2
          cat "$out"
          exit "$rc"
          EOF
          chmod 0700 "$d/run.sh"
          sed -n 's/^host=//p' /etc/porelo-host/forge.conf > "$r/host"
          python3 -c "import json; print(json.load(open('/etc/porelo-host/host.json'))['address'])" > "$r/address"
          printf '127.0.0.1 %s\n' "$(cut -d' ' -f1,2 /etc/ssh/ssh_host_ed25519_key.pub)" > "$d/known_hosts"
        executable: /bin/bash
      changed_when: true
      no_log: true

    - name: Install Molecule's registry script
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/files/registry-bundle.sh"
        dest: /root/verify-registry/registry-bundle.sh
        owner: root
        group: root
        mode: "0700"

    - name: Read the persons' public keys
      ansible.builtin.slurp:
        src: "/root/verify-registry/{{ item }}.pub"
      loop: [hostadmin, ada, bo, other]
      register: verify_people_keys

    - name: Run pre-admission refusals against porelo-host-person and compare passwd and records before and after
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - |
            import hashlib, json, pathlib, subprocess, sys
            args = json.loads(sys.argv[1])
            def state():
                passwd = subprocess.check_output(["getent", "passwd"], text=True)
                root = pathlib.Path("/etc/porelo-host/people")
                records = (
                    sorted((p.name, p.read_text(encoding="utf-8")) for p in root.iterdir())
                    if root.exists() else None
                )
                raw = json.dumps({"passwd": sorted(passwd.splitlines()), "records": records}, sort_keys=True)
                return hashlib.sha256(raw.encode("utf-8")).hexdigest()
            before = state()
            run = subprocess.run(["/root/verify-people/run.sh", *args], capture_output=True, text=True)
            print(json.dumps({
                "rc": run.returncode, "stdout": run.stdout, "stderr": run.stderr, "unchanged": before == state(),
            }))
          - "{{ item.argv | to_json }}"
      loop:
        - label: no host admin pinned
          argv: [registry]
          rc: 69
          words: no host admin is pinned
        - label: account name outside pattern
          argv: [add, Ada, --role, project-admin]
          rc: 64
          words: "the person name must match [a-z][a-z0-9-]{0,30}"
        - label: a person before any registry
          argv: [add, ada, --role, project-admin]
          rc: 65
          words: the registry names no current card for this person
        - label: lock unknown person
          argv: [lock, ghost]
          rc: 65
          words: the person is unknown to the people records
        - label: purge unknown person
          argv: [purge, ghost]
          rc: 65
          words: the person is unknown to the people records
      loop_control:
        label: "{{ item.label }}"
      register: verify_people_pre_refusals
      changed_when: false

    - name: Assert every pre-admission refusal exits with its code and words and changes neither passwd nor records
      ansible.builtin.assert:
        that:
          - verify_people_refusal.rc == item.item.rc
          - verify_people_refusal.stdout == ''
          - "verify_people_refusal.stderr is match('^porelo-host-person: ')"
          - item.item.words in verify_people_refusal.stderr
          - verify_people_refusal.unchanged
        fail_msg: >-
          asked '{{ item.item.label }}' for rc {{ item.item.rc }}, empty stdout, '{{ item.item.words }}' on stderr and
          unchanged passwd/records; got {{ verify_people_refusal }}
      vars:
        verify_people_refusal: "{{ item.stdout | from_json }}"
      loop: "{{ verify_people_pre_refusals.results }}"
      loop_control:
        label: "{{ item.item.label }}"

    - name: Pin Molecule's host admin, as up pins the key of the host admin's card
      ansible.builtin.command:
        argv:
          - /root/verify-people/run.sh
          - registry
          - pin
          - hostadmin
          - "{{ (verify_people_keys.results[0].content | b64decode).split(' ')[:2] | join(' ') }}"
      register: verify_people_pin
      changed_when: true

    - name: Make the host admin's registry naming ada and bo, and bring it as root as up brings the first one
      ansible.builtin.shell:
        cmd: |
          set -euo pipefail
          r=/root/verify-registry
          /root/verify-registry/registry-bundle.sh "$r" "$(cat "$r/host")" "$(cat "$r/address")" \
              /etc/ssh/ssh_host_ed25519_key.pub hostadmin ada bo operator > "$r/head"
          env -u SUDO_USER /usr/local/sbin/porelo-host-person registry --stdin < "$r/registry.bundle"
        executable: /bin/bash
      register: verify_people_registry
      changed_when: true

    - name: Read the applied registry and the head it was made at
      ansible.builtin.slurp:
        src: "{{ item }}"
      loop: [/etc/porelo-host/registry/applied.json, /root/verify-registry/head]
      register: verify_people_applied

    - name: Assert the host pinned hostadmin and applied the registry with ada and bo current
      ansible.builtin.assert:
        that:
          - verify_people_pin.rc == 0
          - (verify_people_pin.stdout | from_json).admin == 'hostadmin'
          - verify_people_registry.rc == 0
          - (verify_people_registry.stdout | from_json).commit == verify_people_head
          - (verify_people_registry.stdout | from_json).refused == []
          - verify_people_registry_state.commit == verify_people_head
          - verify_people_registry_state.persons | map(attribute='login') | sort == ['ada', 'bo', 'operator']
          - verify_people_registry_state.persons | selectattr('revoked') | list == []
          - (verify_people_registry_state.persons | selectattr('login', 'equalto', 'ada') | first).ssh
            == verify_people_ada_key
        fail_msg: >-
          asked registry pin hostadmin and registry --stdin to apply head {{ verify_people_head }} with ada and bo;
          got pin {{ verify_people_pin.stdout }} ({{ verify_people_pin.stderr }}), registry rc
          {{ verify_people_registry.rc }}: {{ verify_people_registry.stdout }} ({{ verify_people_registry.stderr }}),
          applied {{ verify_people_registry_state }}
      vars:
        verify_people_registry_state: "{{ verify_people_applied.results[0].content | b64decode | from_json }}"
        verify_people_head: "{{ verify_people_applied.results[1].content | b64decode | trim }}"
        verify_people_ada_key: "{{ (verify_people_keys.results[1].content | b64decode).split(' ')[:2] | join(' ') }}"

    - name: Admit ada and bo as project admins, their cards taken from the registry
      ansible.builtin.command:
        argv: [/root/verify-people/run.sh, add, "{{ item }}", --role, project-admin]
      loop: [ada, bo]
      register: verify_people_add
      changed_when: true

    - name: Ask porelo-host-person to refuse what the registry does not name, and a key on add's standard input
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - |
            import json, os, subprocess, sys
            args = json.loads(sys.argv[1])
            env = {key: value for key, value in os.environ.items() if key != "SUDO_USER"}
            run = subprocess.run(
                ["/usr/local/sbin/porelo-host-person", *args], input=sys.argv[2].encode(), capture_output=True, env=env
            )
            with open("/root/verify-people/helper.out", "ab") as log:
                log.write(run.stdout + run.stderr)
            print(json.dumps({"rc": run.returncode, "stdout": run.stdout.decode(), "stderr": run.stderr.decode()}))
          - "{{ item.argv | to_json }}"
          - "{{ item.stdin }}"
      loop:
        - label: a login the registry does not name
          argv: [add, eli, --role, project-admin]
          stdin: ""
        - label: a key on add's stdin
          argv: [add, ada, --role, project-admin]
          stdin: "{{ verify_people_keys.results[3].content | b64decode }}"
        # The registry names operator; Ubuntu's system group holds the name, so no account or forge login is made.
        - label: a login Ubuntu's system group holds
          argv: [add, operator, --role, project-admin]
          stdin: ""
      loop_control:
        label: "{{ item.label }}"
      register: verify_people_post_refusals
      changed_when: false

    - name: Read whether anything of an operator person was made
      ansible.builtin.shell:
        cmd: |
          set -euo pipefail
          getent passwd operator > /dev/null && echo account || true
          [ -e /etc/porelo-host/people/operator.conf ] && echo record || true
          if [ -e /etc/porelo-host/forge.conf ] && getent passwd porelo-forge > /dev/null; then
              cd / && runuser -u porelo-forge -- env XDG_RUNTIME_DIR="/run/user/$(id -u porelo-forge)" \
                  podman exec forgejo forgejo admin user list | awk 'NR > 1 && $2 ~ /operator$/ {print "forge " $2}'
          fi
        executable: /bin/bash
      register: verify_people_operator_left
      changed_when: false

    - name: Assert ada and bo are admitted and every later refusal exits with its code and words
      ansible.builtin.assert:
        that:
          - verify_people_add.results | map(attribute='rc') | list == [0, 0]
          - >-
            verify_people_add.results | map(attribute='stdout') | map('from_json') | list
            == [{'person': 'ada', 'role': 'project-admin'}, {'person': 'bo', 'role': 'project-admin'}]
          - verify_people_later | map(attribute='rc') | list == [65, 64, 65]
          - verify_people_later | map(attribute='stdout') | list == ['', '', '']
          - "'the registry names no current card for this person' in verify_people_later[0].stderr"
          - "'add accepts no credential input' in verify_people_later[1].stderr"
          - "'existing group' in verify_people_later[2].stderr"
          - verify_people_operator_left.stdout == ''
        fail_msg: >-
          asked add ada and add bo for their JSON lines, refusals 65, 64 and 65 for operator's group with nothing of
          operator made; got {{ verify_people_add.results | map(attribute='stdout') | list }},
          {{ verify_people_later }}, left {{ verify_people_operator_left.stdout }}
      vars:
        verify_people_later: "{{ verify_people_post_refusals.results | map(attribute='stdout') | map('from_json') }}"

    - name: Read ada's and bo's records, keys, groups and daemon links after admission
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - |
            import grp, json, os, pathlib, pwd, stat
            answer = {}
            for person in ("ada", "bo"):
                key = pathlib.Path(f"/etc/ssh/authorized_keys/{person}")
                link = pathlib.Path(f"/run/porelo-host/people/{person}/porelod.sock")
                uid = pwd.getpwnam(person).pw_uid
                answer[person] = {
                    "record": pathlib.Path(f"/etc/porelo-host/people/{person}.conf").read_text().splitlines(),
                    "key": key.read_text().strip(),
                    "key_mode": oct(stat.S_IMODE(key.stat().st_mode)),
                    "groups": sorted(g.gr_name for g in grp.getgrall() if person in g.gr_mem),
                    "link": os.readlink(link) if link.is_symlink() else None,
                    "daemon": f"/run/user/{uid}/porelo/porelod.sock",
                }
            print(json.dumps(answer))
      register: verify_people_admitted
      changed_when: false

    - name: Validate the SSH daemon's configuration with sshd -t
      ansible.builtin.command:
        argv: [sshd, -t]
      register: verify_people_sshd_test
      changed_when: false

    - name: Assert ada's and bo's records hold hand, their registry key and their daemon's link
      ansible.builtin.assert:
        that:
          - verify_people_state[item.0].record[:2] == ['member=hand', 'locked=false']
          - ('ssh=' ~ verify_people_key) in verify_people_state[item.0].record
          - verify_people_state[item.0].key.endswith(verify_people_key)
          - verify_people_state[item.0].key_mode == '0o644'
          - "'porelo-people' in verify_people_state[item.0].groups"
          - verify_people_state[item.0].link == verify_people_state[item.0].daemon
          - verify_people_sshd_test.rc == 0
        fail_msg: >-
          asked {{ item.0 }}'s record for member=hand, locked=false and the registry's key, authorized_keys 0644 with
          that key, porelo-people and the daemon link; got {{ verify_people_state[item.0] }},
          sshd -t rc {{ verify_people_sshd_test.rc }} ({{ verify_people_sshd_test.stderr }})
      vars:
        verify_people_state: "{{ verify_people_admitted.stdout | from_json }}"
        verify_people_key: "{{ (item.1.content | b64decode).split(' ')[:2] | join(' ') }}"
      loop: "{{ ['ada', 'bo'] | zip(verify_people_keys.results[1:3]) | list }}"
      loop_control:
        label: "{{ item.0 }}"

    - name: Reach the host as ada with her key, and try it with another key
      ansible.builtin.command:
        argv:
          - ssh
          - -o
          - BatchMode=yes
          - -o
          - ConnectTimeout=10
          - -o
          - IdentitiesOnly=yes
          - -o
          - StrictHostKeyChecking=yes
          - -o
          - UserKnownHostsFile=/root/verify-people/known_hosts
          - -i
          - "/root/verify-registry/{{ item }}"
          - ada@127.0.0.1
          - id -un
      loop: [ada, other]
      register: verify_people_ssh
      changed_when: false
      failed_when: false

    # The person's tunnel as a person's Porelo opens it: one socket of theirs on each end, never a service's own.
    - name: Forward the homeserver's gate and the homeserver's own socket through ada's SSH, and ask both
      ansible.builtin.shell:
        cmd: |
          set -uo pipefail
          d=/root/verify-people
          rm -f "$d/client.sock" "$d/own.sock" "$d/cm"
          ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="$d/known_hosts" -o ExitOnForwardFailure=yes \
              -o ControlMaster=yes -o ControlPath="$d/cm" -i /root/verify-registry/ada -fN \
              -L "$d/client.sock:/run/porelo-matrix/client.sock" \
              -L "$d/own.sock:/run/user/$(id -u porelo-matrix)/porelo-matrix-gate/homeserver.sock" \
              ada@127.0.0.1 || exit 3
          gate=$(curl -sS --max-time 10 --unix-socket "$d/client.sock" -o /dev/null -w '%{http_code}' \
              http://localhost/_matrix/client/versions 2>/dev/null)
          own_rc=0
          curl -sS --max-time 10 --unix-socket "$d/own.sock" -o /dev/null \
              http://localhost/_matrix/client/versions 2>/dev/null || own_rc=$?
          ssh -o ControlPath="$d/cm" -O exit ada@127.0.0.1 2>/dev/null
          printf 'gate %s\nown %s\n' "$gate" "$own_rc"
        executable: /bin/bash
      register: verify_people_tunnel
      changed_when: false
      failed_when: false

    - name: Assert ada's key alone reaches her shell, and her tunnel reaches the gate but not the homeserver itself
      ansible.builtin.assert:
        that:
          - verify_people_ssh.results[0].rc == 0
          - verify_people_ssh.results[0].stdout == 'ada'
          - verify_people_ssh.results[1].rc != 0
          - verify_people_tunnel.rc == 0
          - verify_people_tunnel.stdout_lines[0] == 'gate 200'
          - verify_people_tunnel.stdout_lines[1] is match('own [1-9]')
        fail_msg: >-
          asked ssh as ada with ada's key for 'ada' and with another key for a refusal, and ada's tunnel for 200 at the
          gate and no answer from the homeserver's own socket; got {{ verify_people_ssh.results
          | map(attribute='rc') | list }} {{ verify_people_ssh.results[0].stdout }}, tunnel rc
          {{ verify_people_tunnel.rc }}: {{ verify_people_tunnel.stdout_lines }} ({{ verify_people_tunnel.stderr }})

    - name: Verify ada's forge logins and the token her own forge-token makes when the forge is on
      when: verify_forge == 'on'
      block:
        - name: List every Forgejo user after ada and bo are admitted
          ansible.builtin.shell:
            cmd: >-
              set -o pipefail && cd / && runuser -u porelo-forge --
              env XDG_RUNTIME_DIR="/run/user/$(id -u porelo-forge)"
              podman exec forgejo forgejo admin user list
            executable: /bin/bash
          register: verify_people_forge_users
          changed_when: false
          no_log: true

        - name: Make ada's forge token through sudo as ada, and keep it for the leak scan
          ansible.builtin.shell:
            cmd: |
              set -euo pipefail
              cd /
              token=$(sudo -u ada sudo -n /usr/local/sbin/porelo-host-person forge-token)
              printf '%s\n' "$token" >> /root/verify-people/tokens.pat
              [[ $token =~ ^[0-9a-f]{40}$ ]] && echo made
            executable: /bin/bash
          register: verify_people_forge_token
          changed_when: true
          no_log: true

        - name: Assert Forgejo holds ada, porelo-ada, bo and porelo-bo, and ada's forge-token made one token
          ansible.builtin.assert:
            that:
              - "['ada', 'porelo-ada', 'bo', 'porelo-bo'] | difference(verify_people_listed_users) == []"
              - verify_people_forge_token.rc == 0
              - verify_people_forge_token.stdout == 'made'
            fail_msg: >-
              asked for Forgejo users ada, porelo-ada, bo and porelo-bo and a 40-hex token from ada's forge-token;
              got {{ verify_people_listed_users }}, forge-token rc {{ verify_people_forge_token.rc }}
          vars:
            verify_people_listed_users: >-
              {{ verify_people_forge_users.stdout_lines[1:] | map('split') | map(attribute=1) | list }}

    - name: Read whether Matrix machine and registration credentials are absent
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - /home/ada/.config/porelo/matrix/host-registration-token
        - /home/bo/.config/porelo/matrix/host-registration-token
        - /etc/porelo-host/matrix-admin.token
      register: verify_people_matrix_stats

    - name: Assert Matrix admission stores no machine or registration credentials
      ansible.builtin.assert:
        that:
          - verify_people_matrix_stats.results | selectattr('stat.exists') | list | length == 0
        fail_msg: >-
          asked for no registration token for ada or bo and no host Matrix admin token;
          got {{ verify_people_matrix_stats.results | map(attribute='stat') | list }}

    - name: Ask sudo -n as ada to refuse what her rules do not name
      ansible.builtin.command:
        chdir: /
        argv: "{{ item.argv }}"
      loop:
        - label: /usr/bin/id
          argv: [sudo, -u, ada, sudo, -n, /usr/bin/id]
        - label: porelo-host-person lock bo
          argv: [sudo, -u, ada, sudo, -n, /usr/local/sbin/porelo-host-person, lock, bo]
        - label: forge-token with an argument
          argv: [sudo, -u, ada, sudo, -n, /usr/local/sbin/porelo-host-person, forge-token, bo]
      loop_control:
        label: "{{ item.label }}"
      register: verify_people_sudo_refusals
      changed_when: false
      failed_when: false

    - name: Assert sudo -n as ada refuses every command her rules do not name
      ansible.builtin.assert:
        that:
          # sudo itself refuses, so the command never runs: its words differ between sudo and Ubuntu's sudo-rs.
          - item.rc != 0
          - item.stdout == ''
          - "item.stderr is match('sudo(-rs)?: ')"
        fail_msg: >-
          asked sudo -n as ada for '{{ item.item.label }}' to fail without privilege;
          got rc {{ item.rc }}: {{ item.stdout }} ({{ item.stderr }})
      loop: "{{ verify_people_sudo_refusals.results }}"
      loop_control:
        label: "{{ item.item.label }}"

    - name: Lock ada twice
      ansible.builtin.command:
        argv: [/root/verify-people/run.sh, lock, ada]
      loop: [first, second]
      register: verify_people_lock
      changed_when: item == 'first'

    - name: Try SSH as ada after lock ada
      ansible.builtin.command:
        argv:
          - ssh
          - -o
          - BatchMode=yes
          - -o
          - ConnectTimeout=10
          - -o
          - IdentitiesOnly=yes
          - -o
          - StrictHostKeyChecking=yes
          - -o
          - UserKnownHostsFile=/root/verify-people/known_hosts
          - -i
          - /root/verify-registry/ada
          - ada@127.0.0.1
          - "true"
      register: verify_people_locked_ssh
      changed_when: false
      failed_when: false

    - name: Read ada's record, SSH key and Matrix token paths after lock ada
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - |
            import json, pathlib
            paths = ["/etc/ssh/authorized_keys/ada", "/home/ada/.config/porelo/matrix/host-registration-token"]
            print(json.dumps({
                "record": pathlib.Path("/etc/porelo-host/people/ada.conf").read_text().splitlines(),
                "left": [path for path in paths if pathlib.Path(path).exists()],
            }))
      register: verify_people_locked_state
      changed_when: false

    - name: Assert lock ada answers locked twice, ends her SSH, keeps member=hand and removes her key
      ansible.builtin.assert:
        that:
          - verify_people_lock.results | map(attribute='rc') | list == [0, 0]
          - >-
            verify_people_lock.results | map(attribute='stdout') | map('from_json') | unique | list
            == [{'person': 'ada', 'locked': true}]
          - verify_people_locked_ssh.rc != 0
          - verify_people_locked.record[:2] == ['member=hand', 'locked=true']
          - verify_people_locked.left == []
        fail_msg: >-
          asked lock ada twice for {"person":"ada","locked":true}, ssh refused, member=hand with locked=true and no
          SSH key or Matrix token left; got {{ verify_people_lock.results | map(attribute='stdout') | list }},
          ssh rc {{ verify_people_locked_ssh.rc }}, {{ verify_people_locked }}
      vars:
        verify_people_locked: "{{ verify_people_locked_state.stdout | from_json }}"

    - name: Read prohibit_login and remaining tokens on ada's Forgejo logins after lock ada
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - |
            import http.client, json, pathlib, secrets, socket, subprocess
            conf = dict(
                line.split("=", 1)
                for line in pathlib.Path("/etc/porelo-host/forge.conf").read_text(encoding="utf-8").splitlines()
                if "=" in line
            )
            account = conf["account"]
            uid = subprocess.check_output(["/usr/bin/id", "-u", account], text=True).strip()
            tname = "verify-lock-check-" + secrets.token_hex(12)
            token = subprocess.check_output(
                [
                    "/usr/sbin/runuser", "-u", account, "--",
                    "/usr/bin/env", f"XDG_RUNTIME_DIR=/run/user/{uid}",
                    "/usr/bin/podman", "exec", "forgejo", "forgejo", "admin", "user",
                    "generate-access-token", "--username", "porelo-admin",
                    "--token-name", tname, "--scopes", "write:admin,read:user", "--raw",
                ],
                text=True,
                cwd="/",
            ).strip()
            class Unix(http.client.HTTPConnection):
                def connect(self):
                    self.sock = socket.socket(socket.AF_UNIX)
                    self.sock.settimeout(30)
                    self.sock.connect(f"/run/user/{uid}/porelo-forge/http.sock")
            def call(method, path):
                connection = Unix("localhost")
                connection.request(method, "/api/v1" + path, headers={"Authorization": "token " + token})
                response = connection.getresponse()
                body = response.read()
                connection.close()
                return response.status, (json.loads(body) if body else None)
            cleaned = False
            try:
                prohibited, token_counts = {}, {}
                for identity in ("ada", "porelo-ada"):
                    _, user = call("GET", f"/users/{identity}")
                    _, tokens = call("GET", f"/admin/users/{identity}/tokens?limit=50&page=1")
                    prohibited[identity] = bool(user.get("prohibit_login"))
                    token_counts[identity] = len(tokens)
            finally:
                _, admin_tokens = call("GET", "/admin/users/porelo-admin/tokens?limit=50&page=1")
                for entry in admin_tokens:
                    if entry.get("name") == tname:
                        status, _ = call("DELETE", f"/admin/users/porelo-admin/tokens/{entry['id']}")
                        cleaned = status == 204
            print(json.dumps({"prohibited": prohibited, "token_counts": token_counts, "cleaned": cleaned}))
      register: verify_people_locked_forge
      changed_when: false
      no_log: true
      when: verify_forge == 'on'

    - name: Assert every Forgejo login of ada is disabled (prohibit_login) and holds zero tokens after lock ada
      ansible.builtin.assert:
        that:
          - verify_people_forge_lock.cleaned
          - verify_people_forge_lock.prohibited | dict2items | rejectattr('value') | list | length == 0
          - verify_people_forge_lock.token_counts | dict2items
            | rejectattr('value', 'equalto', 0) | list | length == 0
        fail_msg: >-
          asked every Forgejo login of ada to carry prohibit_login=true and zero tokens, with the probe token
          deleted; got {{ verify_people_forge_lock }}
      vars:
        verify_people_forge_lock: "{{ verify_people_locked_forge.stdout | from_json }}"
      when: verify_forge == 'on'

    - name: Run down while locked ada and unlocked bo still hold memberships
      ansible.builtin.command:
        argv: [ansible-playbook, -c, local, -i, /root/porelo-host-inventory.yml, porelo.host.down]
      environment:
        ANSIBLE_STDOUT_CALLBACK: porelo.host.lines
        LC_ALL: C.UTF-8
      register: verify_people_down_refused
      changed_when: false
      failed_when: false

    - name: Check that porelo-matrix still exists after the refused down
      ansible.builtin.command:
        argv: [getent, passwd, porelo-matrix]
      register: verify_people_down_untouched
      changed_when: false
      failed_when: false

    - name: Assert down refuses before stopping anything, naming locked ada, unlocked bo and the ways back
      ansible.builtin.assert:
        that:
          - verify_people_down_refused.rc == 2
          - verify_people_down_failed | length == 1
          - "'ada (hand)' in verify_people_down_failed[0].msg"
          - "'bo (hand)' in verify_people_down_failed[0].msg"
          - "'Take the project off' in verify_people_down_failed[0].msg"
          - "'Purge' in verify_people_down_failed[0].msg"
          - verify_people_down_tasks | intersect(verify_people_teardown_tasks) | length == 0
          - verify_people_down_untouched.rc == 0
        fail_msg: >-
          asked down to refuse with rc 2 naming ada (hand), bo (hand), Take the project off and Purge without stopping
          Matrix; got rc {{ verify_people_down_refused.rc }}, lines {{ verify_people_down_lines }},
          porelo-matrix rc {{ verify_people_down_untouched.rc }}
      vars:
        verify_people_down_lines: "{{ verify_people_down_refused.stdout_lines | select | map('from_json') | list }}"
        verify_people_down_failed: "{{ verify_people_down_lines | selectattr('state', 'equalto', 'failed') | list }}"
        verify_people_down_tasks: >-
          {{ verify_people_down_lines | selectattr('task', 'defined') | map(attribute='task') | list }}
        verify_people_teardown_tasks:
          - Stop the host's Matrix homeserver and remove its account
          - Take the host's VM pool off it, before the forge whose runner rents from it
          - Stop the host's forge, keeping nothing

    - name: Purge ada twice
      ansible.builtin.command:
        argv: [/root/verify-people/run.sh, purge, ada]
      loop: [first, second]
      register: verify_people_purge
      changed_when: item == 'first'
      failed_when: false

    - name: Read whether ada's account, home and record remain after purge ada
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - |
            import json, pathlib, pwd
            try:
                pwd.getpwnam("ada")
                account = True
            except KeyError:
                account = False
            paths = ["/home/ada", "/etc/porelo-host/people/ada.conf", "/run/porelo-host/people/ada"]
            print(json.dumps({"account": account, "left": [p for p in paths if pathlib.Path(p).exists()]}))
      register: verify_people_purged
      changed_when: false

    - name: Assert ada's account, home and record are gone and a second purge ada refuses with 65
      ansible.builtin.assert:
        that:
          - verify_people_purge.results[0].rc == 0
          - "(verify_people_purge.results[0].stdout | from_json) == {'person': 'ada', 'purged': true}"
          - not (verify_people_purged.stdout | from_json).account
          - (verify_people_purged.stdout | from_json).left == []
          - verify_people_purge.results[1].rc == 65
          - verify_people_purge.results[1].stdout == ''
          - "'the person is unknown to the people records' in verify_people_purge.results[1].stderr"
        fail_msg: >-
          asked purge ada to answer purged, delete her account, home, record and runtime directory, and refuse a
          second purge with 65; got {{ verify_people_purge.results | map(attribute='rc') | list }}
          {{ verify_people_purge.results | map(attribute='stdout') | list }}, {{ verify_people_purged.stdout }}

    - name: Write every registered stdout and stderr from the people tasks into a root-only file for the leak scan
      ansible.builtin.copy:
        dest: /root/verify-people/registered.out
        owner: root
        group: root
        mode: "0600"
        content: |
          {% for registered in [verify_people_pre_refusals, verify_people_add, verify_people_post_refusals,
                                verify_people_ssh, verify_people_sudo_refusals, verify_people_lock,
                                verify_people_purge] %}
          {% for result in registered.results %}
          {{ result.stdout | default('') }}
          {{ result.stderr | default('') }}
          {% endfor %}
          {% endfor %}
          {% for registered in [verify_people_pin, verify_people_registry, verify_people_admitted,
                                verify_people_tunnel, verify_people_sshd_test, verify_people_locked_ssh,
                                verify_people_locked_state, verify_people_down_refused, verify_people_purged,
                                verify_people_forge_users | default({}), verify_people_locked_forge | default({})] %}
          {{ registered.stdout | default('') }}
          {{ registered.stderr | default('') }}
          {% endfor %}
      changed_when: false
      no_log: true

    - name: Search registered outputs, helper outputs and journalctl -b for ada's token with a control
      ansible.builtin.shell:
        cmd: |
          set -euo pipefail
          umask 077
          work=$(mktemp -d)
          trap 'rm -rf "$work"' EXIT
          count=$(wc -l < /root/verify-people/tokens.pat)
          [ "$count" -ge 1 ] || { echo "asked for at least 1 recorded token, got $count" >&2; exit 1; }
          awk 'length($0) < 8 { exit 1 }' /root/verify-people/tokens.pat || {
              echo "recorded token pattern file holds a short or empty line" >&2
              exit 1
          }
          sort -u /root/verify-people/tokens.pat > "$work/tokens.pat"
          head -n 1 "$work/tokens.pat" > "$work/planted"
          if ! grep -Fq -f "$work/tokens.pat" -- "$work/planted"; then
              echo "planted control token did not match" >&2
              exit 1
          fi
          echo "planted: refused"
          journalctl -b -o cat --no-pager > "$work/journal"
          check_clean() {
              local label=$1 target=$2 rc=0
              [ -s "$target" ] || { echo "empty scan target for $label" >&2; exit 1; }
              grep -Fq -f "$work/tokens.pat" -- "$target" || rc=$?
              case $rc in
                  0) echo "a secret token appeared in $label" >&2; exit 1 ;;
                  1) echo "$label: clean" ;;
                  *) echo "grep ended $rc scanning $label" >&2; exit 1 ;;
              esac
          }
          check_clean registered /root/verify-people/registered.out
          check_clean helper /root/verify-people/helper.out
          check_clean journal "$work/journal"
        executable: /bin/bash
      register: verify_people_leak_scan
      changed_when: false
      failed_when: false
      no_log: true
      when: verify_forge == 'on'

    - name: Assert the planted token control matched and no token leaked to output or journal
      ansible.builtin.assert:
        that:
          - verify_people_leak_scan.rc == 0
          - >-
            verify_people_leak_scan.stdout_lines
            == ['planted: refused', 'registered: clean', 'helper: clean', 'journal: clean']
        fail_msg: >-
          asked for no forge token in registered stdout/stderr, helper output or journalctl -b;
          got rc {{ verify_people_leak_scan.rc }}: {{ verify_people_leak_scan.stderr }}
      when: verify_forge == 'on'

    - name: Purge bo before side_effect runs down when the forge project tasks are skipped
      ansible.builtin.command:
        argv: [env, -u, SUDO_USER, /usr/local/sbin/porelo-host-person, purge, bo]
        stdin: ""
      register: verify_people_purge_bo
      changed_when: true
      when: verify_forge != 'on'

    - name: Assert purging bo answers purged true when the forge is off
      ansible.builtin.assert:
        that:
          - verify_people_purge_bo.rc == 0
          - verify_people_purge_bo.stdout_lines | length == 1
          - "(verify_people_purge_bo.stdout | from_json) == {'person': 'bo', 'purged': true}"
        fail_msg: >-
          asked 'porelo-host-person purge bo' for {"person":"bo","purged":true};
          got rc {{ verify_people_purge_bo.rc }}: {{ verify_people_purge_bo.stdout }}
          ({{ verify_people_purge_bo.stderr }})
      when: verify_forge != 'on'
  always:
    - name: Remove the temporary people workspace, keeping the registry for the project tasks
      ansible.builtin.file:
        path: /root/verify-people
        state: absent
