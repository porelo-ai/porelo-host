---
# The person signs a newer commit of the project and the interface uploads its bundle at the same path: up follows
# that commit, although the bundle's path and the key the machine file names stay as they were.
- name: Sign a newer commit of the run's project and bundle it at the desktop's path again
  ansible.builtin.shell:
    cmd: |
      set -euo pipefail
      cd ~/converge-project
      git -c user.name=verify -c user.email=verify@example.invalid -c gpg.format=ssh \
          -c user.signingkey="$HOME/.ssh/converge-signer.pub" commit -q -S --allow-empty -m "The run's project, again"
      git bundle create -q ~/converge-desktop/converge.bundle --all
      git rev-parse HEAD
    executable: /bin/bash
  become: true
  become_user: "{{ verify_account }}"
  register: verify_refollow_head
  changed_when: true

- name: Upload the newer bundle over the one in the setup's directory, root's and the account's to read
  ansible.builtin.command:
    argv: [install, -m, "0640", -o, root, -g, "{{ verify_account }}",
           "/home/{{ verify_account }}/converge-desktop/converge.bundle", /etc/porelo-host/setup/converge.bundle]
  changed_when: true

- name: Write a play running the role's project step alone
  ansible.builtin.copy:
    dest: /root/refollow-project-step.yml
    content: |
      - name: The project step alone
        hosts: localhost
        connection: local
        gather_facts: false
        tasks:
          - name: Check and follow the project
            ansible.builtin.include_role:
              name: porelo.host.porelo
              tasks_from: project
    mode: "0600"

- name: Run the project step with the newer bundle
  ansible.builtin.command:
    argv: [ansible-playbook, -i, /root/porelo-host-inventory.yml, /root/refollow-project-step.yml]
  register: verify_refollow_step
  changed_when: false

- name: Ask Porelo which commit of the run's project the account follows
  ansible.builtin.shell:
    cmd: XDG_RUNTIME_DIR=/run/user/$(id -u) porelo project following --json
  become: true
  become_user: "{{ verify_account }}"
  register: verify_refollow_following
  changed_when: false

- name: Take the play off the host
  ansible.builtin.file:
    path: /root/refollow-project-step.yml
    state: absent

- name: Assert the account follows the newer commit
  ansible.builtin.assert:
    that: >-
      (verify_refollow_following.stdout | from_json).follows | selectattr('name', 'equalto', 'converge')
      | map(attribute='commit') | list == [verify_refollow_head.stdout]
    fail_msg: >-
      the bundle's head is {{ verify_refollow_head.stdout }}, the account follows
      {{ (verify_refollow_following.stdout | from_json).follows | selectattr('name', 'equalto', 'converge')
      | map(attribute='commit') | list }}
