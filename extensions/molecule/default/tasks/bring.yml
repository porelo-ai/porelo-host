    - name: Read bo's push config, runtime token files, sync timer and followed projects after bring
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - |
            import json, os, pathlib, pwd, stat, subprocess
            pw = pwd.getpwnam("bo")
            push_dir = pathlib.Path(f"{pw.pw_dir}/.config/porelo-host/push")
            push_file = push_dir / "alpha-one.conf"
            dir_st = push_dir.lstat()
            file_st = push_file.lstat()
            runtime_dir = pathlib.Path(f"/run/user/{pw.pw_uid}/porelo-host")
            forge_tok = runtime_dir / "forge.token"
            central_tok = runtime_dir / "forge-central-token"
            env = {
                "HOME": pw.pw_dir,
                "USER": "bo",
                "LOGNAME": "bo",
                "XDG_RUNTIME_DIR": f"/run/user/{pw.pw_uid}",
                "PATH": "/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin",
                "LC_ALL": "C.UTF-8",
            }
            def as_bo(args):
                env_args = [f"{k}={v}" for k, v in env.items()]
                res = subprocess.run(
                    ["/usr/sbin/runuser", "-u", "bo", "--", "/usr/bin/env", *env_args, *args],
                    capture_output=True,
                    text=True,
                    cwd=pw.pw_dir,
                )
                with open("/root/verify-bring/act.out", "a", encoding="utf-8") as out_file:
                    out_file.write(res.stdout + res.stderr)
                return res
            enabled = as_bo(["systemctl", "--user", "is-enabled", "porelo-host-sync-alpha-one.timer"])
            active = as_bo(["systemctl", "--user", "is-active", "porelo-host-sync-alpha-one.timer"])
            following = as_bo(["porelo", "project", "following", "--json"])
            print(
                json.dumps(
                    {
                        "dir_is_dir": stat.S_ISDIR(dir_st.st_mode),
                        "dir_uid": dir_st.st_uid,
                        "dir_mode": f"{stat.S_IMODE(dir_st.st_mode):04o}",
                        "file_is_reg": stat.S_ISREG(file_st.st_mode),
                        "file_uid": file_st.st_uid,
                        "file_mode": f"{stat.S_IMODE(file_st.st_mode):04o}",
                        "push_lines": push_file.read_text(encoding="utf-8").splitlines(),
                        "bo_uid": pw.pw_uid,
                        "forge_token_exists": os.path.lexists(forge_tok),
                        "central_token_exists": os.path.lexists(central_tok),
                        "timer_enabled": enabled.stdout.strip(),
                        "timer_active": active.stdout.strip(),
                        "following_rc": following.returncode,
                        "following": json.loads(following.stdout) if following.returncode == 0 else {},
                    }
                )
            )
      register: verify_bring_bo_local
      changed_when: false

    - name: Assert bo's push config, empty runtime token paths, active sync timer and Porelo follow of alpha-one
      ansible.builtin.assert:
        that:
          - verify_bring_bo_state.dir_is_dir
          - verify_bring_bo_state.dir_uid == verify_bring_bo_state.bo_uid
