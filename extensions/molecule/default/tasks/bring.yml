    - name: Run porelo.host.bring a second time as bo to verify idempotence
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - |
            import json, pathlib, pwd, re, subprocess
            pw = pwd.getpwnam("bo")
            patterns = [
                line for line in pathlib.Path("/root/verify-people/tokens.pat").read_text(encoding="utf-8").splitlines()
                if line
            ]
            run = subprocess.run(
                [
                    "/usr/sbin/runuser", "-u", "bo", "--",
                    "/usr/bin/env", f"HOME={pw.pw_dir}", "USER=bo", "LOGNAME=bo",
                    f"XDG_RUNTIME_DIR=/run/user/{pw.pw_uid}",
                    "ANSIBLE_NOCOLOR=1",
                    "ANSIBLE_STDOUT_CALLBACK=default",
                    "LC_ALL=C.UTF-8",
                    "ansible-playbook", "-c", "local", "porelo.host.bring", "-e", "porelo_project=alpha-one",
                ],
                capture_output=True,
                text=True,
                cwd=pw.pw_dir,
            )
            with open("/root/verify-bring/act.out", "a", encoding="utf-8") as out_file:
                out_file.write(run.stdout + run.stderr)
            changed_tasks = []
            current_task = ""
            for line in run.stdout.splitlines():
                task_match = re.match(r"^TASK \[(.+)\]\s*\*", line)
                if task_match:
                    current_task = task_match.group(1)
                elif line.startswith("changed: "):
                    changed_tasks.append(current_task)
            recap = {}
            recap_match = re.search(r"(?m)^localhost\s*:\s*(.+)$", run.stdout)
            if recap_match:
                for pair in recap_match.group(1).split():
                    if "=" in pair:
                        k, v = pair.split("=", 1)
                        recap[k] = int(v)
            def redact(text):
                for item in patterns:
                    text = text.replace(item, "<redacted>")
                return text
            print(
                json.dumps(
                    {
                        "rc": run.returncode,
                        "recap": recap,
                        "changed_tasks": changed_tasks,
                        "tail": redact((run.stdout + "\n" + run.stderr)[-2000:]),
                    }
                )
            )
      register: verify_bring_second_run
      changed_when: false
      no_log: true

    # roles/forge/tasks/own.yml stages forge.token with changed_when: false and deletes it in always: with
    # ansible.builtin.file (state: absent), so that single cleanup task reports changed=1 on purpose.
    - name: Assert the second bring changes nothing beyond removing the per-run runtime forge.token
      ansible.builtin.assert:
        that:
          - verify_bring_second.rc == 0
          - verify_bring_second.recap.failed | default(-1) == 0
          - verify_bring_second.recap.unreachable | default(-1) == 0
          - >-
            (verify_bring_second.recap.changed | default(-1) == 0 and verify_bring_second.changed_tasks == [])
            or (verify_bring_second.recap.changed | default(-1) == 1
                and verify_bring_second.changed_tasks
                == ["porelo.host.forge : own | Remove the person's forge token from the runtime directory"])
        fail_msg: >-
          asked second porelo.host.bring run for rc 0 and changed=0 (or changed=1 solely from
          "porelo.host.forge : own | Remove the person's forge token from the runtime directory");
          got {{ verify_bring_second }}
      vars:
        verify_bring_second: "{{ verify_bring_second_run.stdout | from_json }}"

    - name: Ask porelo.host.bring to refuse a 0644 machine.yml, a symlinked access.bundle and a user-bearing forge URL
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - |
            import hashlib, json, os, pathlib, pwd, shutil, ssl, subprocess, sys, urllib.request
            probe = sys.argv[1]
            bad_url = sys.argv[2]
            pw = pwd.getpwnam("bo")
            setup = pathlib.Path(f"{pw.pw_dir}/.local/share/porelo-host/setup/alpha-one")
            machine = setup / "machine.yml"
            access = setup / "access.bundle"
            saved_machine = machine.read_bytes()
            saved_access = pathlib.Path("/root/verify-bring/access.bundle.saved")
            token = pathlib.Path("/home/porelo-forge/.config/porelo-forge/api.token").read_text(
                encoding="utf-8"
            ).strip()
            conf = dict(
                line.split("=", 1)
                for line in pathlib.Path("/etc/porelo-host/forge.conf").read_text(encoding="utf-8").splitlines()
                if "=" in line
            )
            ctx = ssl.create_default_context(cafile="/etc/porelo-host/forge/ca.pem")
            opener = urllib.request.build_opener(
                urllib.request.ProxyHandler({}),
                urllib.request.HTTPSHandler(context=ctx),
            )
            def snapshot():
                req = urllib.request.Request(
                    f"https://{conf['address']}:{conf['port']}/api/v1/orgs/alpha-one/repos?limit=50&page=1",
                    headers={"Authorization": "token " + token},
                )
                with opener.open(req, timeout=30) as resp:
                    repos = sorted((r["name"], r.get("original_url")) for r in json.load(resp))
                follow = subprocess.check_output(
                    [
                        "/usr/sbin/runuser", "-u", "bo", "--",
                        "/usr/bin/env", f"HOME={pw.pw_dir}", "USER=bo", "LOGNAME=bo",
                        f"XDG_RUNTIME_DIR=/run/user/{pw.pw_uid}",
                        "LC_ALL=C.UTF-8",
                        "porelo", "project", "following", "--json",
                    ],
                    text=True,
                    cwd=pw.pw_dir,
                )
                push_bytes = pathlib.Path(f"{pw.pw_dir}/.config/porelo-host/push/alpha-one.conf").read_text(
                    encoding="utf-8"
                )
                cy_conf = pathlib.Path("/etc/porelo-host/people/cy.conf").read_text(encoding="utf-8")
                blob = json.dumps(
                    {"repos": repos, "follow": json.loads(follow), "push": push_bytes, "cy": cy_conf},
                    sort_keys=True,
                )
                return hashlib.sha256(blob.encode("utf-8")).hexdigest()
            before = snapshot()
            try:
                if probe == "mode_0644":
                    os.chmod(machine, 0o644)
                elif probe == "access_link":
                    shutil.copyfile(access, saved_access)
                    os.chmod(saved_access, 0o600)
                    link_target = pathlib.Path(f"{pw.pw_dir}/.local/share/porelo-host/access.bundle.target")
                    shutil.copyfile(access, link_target)
                    os.chown(link_target, pw.pw_uid, pw.pw_gid)
                    os.chmod(link_target, 0o600)
                    access.unlink()
                    os.symlink(str(link_target), str(access))
                    os.lchown(access, pw.pw_uid, pw.pw_gid)
                elif probe == "url_with_user":
                    text = saved_machine.decode("utf-8").splitlines()
                    replaced = []
                    for line in text:
                        if line.lstrip().startswith("url: ") and "central-alpha-one/app.git" in line:
                            indent = line[: len(line) - len(line.lstrip())]
                            replaced.append(f"{indent}url: {json.dumps(bad_url)}")
                        else:
                            replaced.append(line)
                    machine.write_text("\n".join(replaced) + "\n", encoding="utf-8")
                    os.chown(machine, pw.pw_uid, pw.pw_gid)
                    os.chmod(machine, 0o600)
                else:
                    raise SystemExit(f"unknown probe {probe}")
                run = subprocess.run(
                    [
                        "/usr/sbin/runuser", "-u", "bo", "--",
                        "/usr/bin/env", f"HOME={pw.pw_dir}", "USER=bo", "LOGNAME=bo",
                        f"XDG_RUNTIME_DIR=/run/user/{pw.pw_uid}",
                        "ANSIBLE_STDOUT_CALLBACK=porelo.host.lines",
                        "LC_ALL=C.UTF-8",
                        "ansible-playbook", "-c", "local", "porelo.host.bring", "-e", "porelo_project=alpha-one",
                    ],
                    capture_output=True,
                    text=True,
                    cwd=pw.pw_dir,
                )
                with open("/root/verify-bring/act.out", "a", encoding="utf-8") as out_file:
                    out_file.write(run.stdout + run.stderr)
            finally:
                if os.path.lexists(access) and os.path.islink(access):
                    access.unlink()
                if not access.exists() and saved_access.exists():
                    shutil.copyfile(saved_access, access)
                    os.chown(access, pw.pw_uid, pw.pw_gid)
                    os.chmod(access, 0o600)
                if saved_access.exists():
                    saved_access.unlink()
                extra_target = pathlib.Path(f"{pw.pw_dir}/.local/share/porelo-host/access.bundle.target")
                if os.path.lexists(extra_target):
                    extra_target.unlink()
                machine.write_bytes(saved_machine)
                os.chown(machine, pw.pw_uid, pw.pw_gid)
                os.chmod(machine, 0o600)
            after = snapshot()
            lines = [json.loads(line) for line in run.stdout.splitlines() if line.strip().startswith("{")]
            failed = [line.get("msg", "") for line in lines if line.get("state") == "failed"]
            changed = [line.get("task", "") for line in lines if line.get("state") == "changed"]
            print(
                json.dumps(
                    {
                        "rc": run.returncode,
                        "failed": failed,
                        "changed": changed,
                        "unchanged": before == after,
                    }
                )
            )
          - "{{ item.probe }}"
          - "https://user@{{ verify_bring_central.forge_address }}:{{
            verify_bring_central.forge_port }}/central-alpha-one/app.git"
      loop:
        - probe: mode_0644
          words:
            - /home/bo/.local/share/porelo-host/setup/alpha-one/machine.yml
            - mode 0644
        - probe: access_link
          words:
            - /home/bo/.local/share/porelo-host/setup/alpha-one/access.bundle
            - link
        - probe: url_with_user
          words:
            - "forge:"
            - https://user@
      loop_control:
        label: "{{ item.probe }}"
      register: verify_bring_refusals
      changed_when: false
      no_log: true

    - name: Assert every bring refusal names what was wrong and leaves follow, push, people and forge state unchanged
      ansible.builtin.assert:
        that:
          - verify_bring_refusal.rc == 2
          - verify_bring_refusal.failed | length == 1
          - verify_bring_refusal.changed == []
          - verify_bring_refusal.unchanged
          - item.item.words | reject('in', verify_bring_refusal.failed[0]) | list | length == 0
        fail_msg: >-
          asked bring refusal '{{ item.item.probe }}' for rc 2, zero changed tasks, unchanged state and
          {{ item.item.words }} in failed message; got {{ verify_bring_refusal }}
      vars:
        verify_bring_refusal: "{{ item.stdout | from_json }}"
      loop: "{{ verify_bring_refusals.results }}"
      loop_control:
        label: "{{ item.item.probe }}"

    - name: Create cy's private setup directory hierarchy under /home/cy/.local/share/porelo-host/setup/alpha-one
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: cy
        group: cy
        mode: "0700"
      loop:
        - /home/cy/.local
        - /home/cy/.local/share
        - /home/cy/.local/share/porelo-host
        - /home/cy/.local/share/porelo-host/setup
        - /home/cy/.local/share/porelo-host/setup/alpha-one

    - name: Upload project.bundle and access.bundle into cy's setup directory with mode 0600
      ansible.builtin.copy:
        src: "/root/verify-bring/{{ item }}"
        dest: "/home/cy/.local/share/porelo-host/setup/alpha-one/{{ item }}"
        remote_src: true
        owner: cy
        group: cy
        mode: "0600"
      loop:
        - project.bundle
        - access.bundle

    - name: Write cy's 0600 machine.yml without a forge section
      ansible.builtin.copy:
        dest: /home/cy/.local/share/porelo-host/setup/alpha-one/machine.yml
        owner: cy
        group: cy
