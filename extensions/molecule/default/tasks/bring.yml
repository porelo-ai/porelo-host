            passwd = subprocess.check_output(["/usr/bin/getent", "passwd"], text=True).splitlines()
            cy_accounts = [line.split(":", 1)[0] for line in passwd if line.split(":", 1)[0].startswith("cy")]
            print(json.dumps({"cy_conf": cy_conf, "cy_accounts": cy_accounts}))
      register: verify_bring_cy_after_sync
