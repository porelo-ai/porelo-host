---
- name: Verify a project brought in the project admin's account and joined in a developer's account
  block:
    - name: Read whether /root/verify-people already exists before bring's leak scan records its secrets
      ansible.builtin.stat:
        path: /root/verify-people
      register: verify_bring_people_dir_before

    - name: Create private scratch and pattern directories for the bring and join verification acts
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: "0700"
      loop:
        - /root/verify-people
        - /root/verify-bring

    - name: Record the forge token and bo's and cy's waiting identity tokens in tokens.pat before their stops run
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - |
            import json, os, pathlib, re
            pat_path = pathlib.Path("/root/verify-people/tokens.pat")
            existing = (
                [line for line in pat_path.read_text(encoding="utf-8").splitlines() if line]
                if pat_path.exists()
                else []
            )
            seen = list(dict.fromkeys(existing))
            def add_secret(value):
                if value and value not in seen:
                    seen.append(value)
            forge_tok = pathlib.Path("/home/porelo-forge/.config/porelo-forge/api.token").read_text(
                encoding="utf-8"
            ).strip()
            if not re.fullmatch(r"[0-9a-f]{40}", forge_tok):
                raise SystemExit("unexpected forge api.token format")
            add_secret(forge_tok)
            counts = {}
            for user in ("bo", "cy"):
                lines = pathlib.Path(f"/run/porelo-host/people/{user}/identities.tokens").read_text(
                    encoding="utf-8"
                ).splitlines()
                user_tokens = []
                for line in lines:
                    parts = line.split(" ")
                    if len(parts) != 2 or not re.fullmatch(r"[0-9a-f]{40}", parts[1]):
                        raise SystemExit(f"unexpected identities.tokens line for {user}")
                    user_tokens.append(parts[1])
                    add_secret(parts[1])
                counts[user] = len(user_tokens)
            fd = os.open(str(pat_path), os.O_WRONLY | os.O_CREAT | os.O_TRUNC, 0o600)
            with os.fdopen(fd, "w", encoding="utf-8") as handle:
                os.fchmod(handle.fileno(), 0o600)
                handle.write("".join(item + "\n" for item in seen))
            out_fd = os.open("/root/verify-bring/act.out", os.O_WRONLY | os.O_CREAT | os.O_TRUNC, 0o600)
            os.close(out_fd)
            print(json.dumps({"bo_tokens": counts["bo"], "cy_tokens": counts["cy"], "patterns": len(seen)}))
      register: verify_bring_seed_patterns
      changed_when: true
      no_log: true

    - name: Assert waiting identity tokens for bo and cy were recorded in /root/verify-people/tokens.pat
      ansible.builtin.assert:
        that:
          - verify_bring_seeded.bo_tokens == 2
          - verify_bring_seeded.cy_tokens == 2
          - verify_bring_seeded.patterns >= 5
        fail_msg: >-
          asked /run/porelo-host/people/{bo,cy}/identities.tokens for 2 tokens each and >=5 patterns in tokens.pat;
          got {{ verify_bring_seeded }}
      vars:
        verify_bring_seeded: "{{ verify_bring_seed_patterns.stdout | from_json }}"

    # converge installs the collection into /root/.ansible/collections; give bo and cy each their own copy from the
    # host's tarball so their unprivileged ansible-playbook runs resolve porelo.host without root paths.
    - name: Stage the collection tarball for bo and cy, install it into each account's ~/.ansible and remove the copy
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - |
            import json, os, pwd, shutil, subprocess, sys
            user = sys.argv[1]
            pw = pwd.getpwnam(user)
            staged = f"{pw.pw_dir}/.porelo-host-install.tar.gz"
            shutil.copyfile("/root/porelo-host.tar.gz", staged)
            os.chown(staged, pw.pw_uid, pw.pw_gid)
            os.chmod(staged, 0o600)
            try:
                install = subprocess.run(
                    [
                        "/usr/sbin/runuser", "-u", user, "--",
                        "/usr/bin/env", f"HOME={pw.pw_dir}", f"USER={user}", f"LOGNAME={user}",
                        "LC_ALL=C.UTF-8",
                        "ansible-galaxy", "collection", "install", "--force", staged,
                    ],
                    capture_output=True,
                    text=True,
                    cwd=pw.pw_dir,
                )
            finally:
                if os.path.lexists(staged):
                    os.unlink(staged)
            listed = subprocess.run(
                [
                    "/usr/sbin/runuser", "-u", user, "--",
                    "/usr/bin/env", f"HOME={pw.pw_dir}", f"USER={user}", f"LOGNAME={user}",
                    "LC_ALL=C.UTF-8",
                    "ansible-galaxy", "collection", "list", "porelo.host", "--format", "json",
                ],
                capture_output=True,
                text=True,
                cwd=pw.pw_dir,
            )
            versions = []
            if listed.returncode == 0 and listed.stdout.strip():
                for mapping in json.loads(listed.stdout).values():
                    if "porelo.host" in mapping:
                        versions.append(mapping["porelo.host"].get("version"))
            print(
                json.dumps(
                    {
                        "install_rc": install.returncode,
                        "install_err": install.stderr,
                        "list_rc": listed.returncode,
                        "versions": versions,
                    }
                )
            )
          - "{{ item }}"
      loop: [bo, cy]
      register: verify_bring_collection_install
      changed_when: true

    - name: Assert bo and cy each have the collection under test in ~/.ansible/collections
      ansible.builtin.assert:
        that:
          - verify_bring_col.install_rc == 0
          - verify_bring_col.list_rc == 0
          - verify_bring_col.versions == [verify_version]
        fail_msg: >-
          asked {{ item.item }}'s ~/.ansible/collections for porelo.host {{ verify_version }};
          got {{ verify_bring_col }}
      vars:
        verify_bring_col: "{{ item.stdout | from_json }}"
      loop: "{{ verify_bring_collection_install.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Create stand-in central organization central-alpha-one with repository app and mint bo's central token
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - |
            import base64, json, os, pathlib, re, secrets, ssl, subprocess, urllib.request
            conf = dict(
                line.split("=", 1)
                for line in pathlib.Path("/etc/porelo-host/forge.conf").read_text(encoding="utf-8").splitlines()
                if "=" in line
            )
            address = conf["address"]
            port = conf["port"]
            forge_name = conf["name"]
            account = conf["account"]
            admin_token = pathlib.Path("/home/porelo-forge/.config/porelo-forge/api.token").read_text(
                encoding="utf-8"
            ).strip()
            ctx = ssl.create_default_context(cafile="/etc/porelo-host/forge/ca.pem")
            opener = urllib.request.build_opener(
                urllib.request.ProxyHandler({}),
                urllib.request.HTTPSHandler(context=ctx),
            )
            base = f"https://{address}:{port}/api/v1"
            def api(method, path, body=None):
                req = urllib.request.Request(
                    base + path,
                    data=json.dumps(body).encode("utf-8") if body is not None else None,
                    method=method,
                    headers={"Authorization": "token " + admin_token, "Content-Type": "application/json"},
                )
                with opener.open(req, timeout=30) as resp:
                    raw = resp.read()
                    return resp.status, (json.loads(raw) if raw else None)
            org_status, _ = api("POST", "/orgs", {"username": "central-alpha-one", "visibility": "private"})
            repo_status, _ = api(
                "POST",
                "/orgs/central-alpha-one/repos",
                {"name": "app", "private": True, "auto_init": False, "default_branch": "main"},
            )
            readme = base64.b64encode(b"# central-alpha-one app\n").decode("ascii")
            commit_status, _ = api(
                "POST",
                "/repos/central-alpha-one/app/contents/README.md",
                {"branch": "main", "content": readme, "message": "Add README on main"},
            )
            branch_status, branch_body = api("GET", "/repos/central-alpha-one/app/branches/main")
            central_sha = ((branch_body or {}).get("commit") or {}).get("id", "")
            uid = subprocess.check_output(["/usr/bin/id", "-u", account], text=True).strip()
            tok_name = "verify-bring-central-" + secrets.token_hex(12)
            central_tok = subprocess.check_output(
                [
                    "/usr/sbin/runuser", "-u", account, "--",
                    "/usr/bin/env", f"XDG_RUNTIME_DIR=/run/user/{uid}",
                    "/usr/bin/podman", "exec", "forgejo", "forgejo", "admin", "user",
                    "generate-access-token", "--username", "porelo-admin",
                    "--token-name", tok_name, "--scopes", "read:repository", "--raw",
                ],
                text=True,
                cwd="/",
            ).strip()
            if not re.fullmatch(r"[0-9a-f]{40}", central_tok):
                raise SystemExit("unexpected minted central token format")
            for target, value in (
                ("/root/verify-bring/central-token.name", tok_name + "\n"),
                ("/root/verify-bring/bo-central.token", central_tok + "\n"),
            ):
                fd = os.open(target, os.O_WRONLY | os.O_CREAT | os.O_TRUNC, 0o600)
                with os.fdopen(fd, "w", encoding="utf-8") as handle:
                    os.fchmod(handle.fileno(), 0o600)
                    handle.write(value)
            with open("/root/verify-people/tokens.pat", "a", encoding="utf-8") as pat_file:
                pat_file.write(central_tok + "\n")
            print(
                json.dumps(
                    {
                        "forge_address": address,
                        "forge_port": port,
                        "forge_name": forge_name,
                        "central_url": f"https://{address}:{port}/central-alpha-one/app.git",
                        "org_status": org_status,
                        "repo_status": repo_status,
                        "commit_status": commit_status,
                        "branch_status": branch_status,
                        "central_sha": central_sha,
                        "token_recorded": True,
                    }
                )
            )
      register: verify_bring_central_setup
      changed_when: true
      no_log: true

    - name: Keep the central forge stand-in's non-secret metadata
      ansible.builtin.set_fact:
        verify_bring_central: "{{ verify_bring_central_setup.stdout | from_json }}"

    - name: Assert central-alpha-one/app holds one commit on main and bo's central token is recorded
      ansible.builtin.assert:
        that:
          - verify_bring_central.forge_port == '3000'
          - verify_bring_central.org_status == 201
          - verify_bring_central.repo_status == 201
          - verify_bring_central.commit_status == 201
          - verify_bring_central.branch_status == 200
          - verify_bring_central.central_sha is match('^[0-9a-f]{40}$')
          - verify_bring_central.central_url
            == ('https://' ~ verify_bring_central.forge_address ~ ':3000/central-alpha-one/app.git')
          - verify_bring_central.token_recorded
        fail_msg: >-
          asked central-alpha-one/app for 201 org/repo/commit, 200 main branch with 40-hex SHA and central URL on port
          3000; got {{ verify_bring_central }}

    - name: Build and bundle alpha-one's signed project and access repositories
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - |
            import json, os, pathlib, subprocess
            host = json.loads(pathlib.Path("/etc/porelo-host/host.json").read_text(encoding="utf-8"))
            signer_pub = pathlib.Path("/root/verify-projects/signer1.line").read_text(encoding="utf-8").strip()
            signer_key = "/root/verify-projects/signer1"
            cy_lines = pathlib.Path("/etc/porelo-host/people/cy.conf").read_text(encoding="utf-8").splitlines()
            laptops = [line[7:].split(" ") for line in cy_lines if line.startswith("laptop=")]
            if len(laptops) != 1 or len(laptops[0]) != 5:
                raise SystemExit(f"expected one 5-field laptop line in cy.conf, got {len(laptops)}")
            _, ssh_kind, ssh_b64, cy_wg, cy_ip = laptops[0]
            cy_ssh = f"{ssh_kind} {ssh_b64}"
            project_yml = (
                "project:\n"
                "  name: alpha-one\n"
                "  security_class: guarded\n"
                "  signers:\n"
                f"    - {json.dumps(signer_pub)}\n"
                "image:\n"
                "  base_image: ubuntu:24.04\n"
                "access:\n"
                "  repository: https://forge.invalid/alpha-one/access.git\n"
            )
            access_yml = (
                "host:\n"
                f"  address: {json.dumps(host['address'])}\n"
                f"  endpoint: {json.dumps(host['endpoint'])}\n"
                f"  wireguard_public_key: {json.dumps(host['wireguard_public_key'])}\n"
                f"  network: {json.dumps(host['network'])}\n"
                f"  ssh_host_key: {json.dumps(host['ssh_host_key'])}\n"
                f"  ca_sha256: {json.dumps(host['ca_sha256'])}\n"
                "developers:\n"
                "  cy:\n"
                "    laptops:\n"
                f"      - ssh_public_key: {json.dumps(cy_ssh)}\n"
                f"        wireguard_public_key: {json.dumps(cy_wg)}\n"
                f"        vpn_address: {json.dumps(cy_ip)}\n"
            )
            git_env = {
                "PATH": "/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin",
                "LC_ALL": "C.UTF-8",
                "GIT_CONFIG_GLOBAL": "/dev/null",
                "GIT_CONFIG_NOSYSTEM": "1",
            }
            def build_bundle(repo_dir, filename, content, bundle_path):
                subprocess.run(["git", "init", "-q", "-b", "main", repo_dir], env=git_env, check=True, cwd="/")
                target = pathlib.Path(repo_dir) / filename
                target.write_text(content, encoding="utf-8")
                subprocess.run(["git", "-C", repo_dir, "add", filename], env=git_env, check=True, cwd="/")
                subprocess.run(
                    [
                        "git", "-C", repo_dir,
                        "-c", "user.name=Alpha One Signer",
                        "-c", "user.email=signer@example.org",
                        "-c", "gpg.format=ssh",
                        "-c", f"user.signingkey={signer_key}",
                        "commit", "-q", "-S", "-m", f"Sign {filename}",
                    ],
                    env=git_env,
                    check=True,
                    cwd="/",
                )
                commit = subprocess.check_output(
                    ["git", "-C", repo_dir, "rev-parse", "HEAD"], env=git_env, text=True, cwd="/"
                ).strip()
                subprocess.run(
                    ["git", "-C", repo_dir, "bundle", "create", bundle_path, "--all"],
                    env=git_env,
                    check=True,
                    cwd="/",
                )
                os.chmod(bundle_path, 0o600)
                heads = subprocess.check_output(
                    ["git", "bundle", "list-heads", bundle_path], env=git_env, text=True, cwd="/"
                ).splitlines()
                return commit, heads
            proj_commit, proj_heads = build_bundle(
                "/root/verify-bring/project-repo",
                "project.yml",
                project_yml,
                "/root/verify-bring/project.bundle",
            )
            acc_commit, acc_heads = build_bundle(
                "/root/verify-bring/access-repo",
                "access.yml",
                access_yml,
                "/root/verify-bring/access.bundle",
            )
            print(
                json.dumps(
                    {
                        "signer": signer_pub,
                        "host_network": host["network"],
                        "cy_vpn_address": cy_ip,
                        "project_commit": proj_commit,
                        "access_commit": acc_commit,
                        "project_heads": proj_heads,
                        "access_heads": acc_heads,
                    }
                )
            )
      register: verify_bring_make_bundles
      changed_when: true
      no_log: true

    - name: Keep the signed bundles' non-secret commit metadata
      ansible.builtin.set_fact:
        verify_bring_bundles: "{{ verify_bring_make_bundles.stdout | from_json }}"

    - name: Assert both signed bundles carry main heads on this host's network and cy's admitted VPN address
      ansible.builtin.assert:
        that:
          - verify_bring_bundles.host_network == '10.73.7.0/24'
          - verify_bring_bundles.cy_vpn_address == '10.73.7.3'
          - verify_bring_bundles.project_commit is match('^[0-9a-f]{40}$')
          - verify_bring_bundles.access_commit is match('^[0-9a-f]{40}$')
          - (verify_bring_bundles.project_commit ~ ' refs/heads/main') in verify_bring_bundles.project_heads
          - (verify_bring_bundles.access_commit ~ ' refs/heads/main') in verify_bring_bundles.access_heads
        fail_msg: >-
          asked signed project.bundle and access.bundle for 40-hex main heads with host network 10.73.7.0/24 and cy at
          10.73.7.3; got {{ verify_bring_bundles }}

    - name: Create bo's private setup directory hierarchy under /home/bo/.local/share/porelo-host/setup/alpha-one
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: bo
        group: bo
        mode: "0700"
      loop:
        - /home/bo/.local
        - /home/bo/.local/share
        - /home/bo/.local/share/porelo-host
        - /home/bo/.local/share/porelo-host/setup
        - /home/bo/.local/share/porelo-host/setup/alpha-one

    - name: Upload project.bundle and access.bundle into bo's setup directory with mode 0600
      ansible.builtin.copy:
        src: "/root/verify-bring/{{ item }}"
        dest: "/home/bo/.local/share/porelo-host/setup/alpha-one/{{ item }}"
        remote_src: true
        owner: bo
        group: bo
        mode: "0600"
      loop:
        - project.bundle
        - access.bundle

    - name: Write bo's 0600 machine.yml naming project.bundle, access.bundle and central-alpha-one/app
      ansible.builtin.copy:
        dest: /home/bo/.local/share/porelo-host/setup/alpha-one/machine.yml
        owner: bo
        group: bo
        mode: "0600"
        content: |
          project:
            name: alpha-one
            url: /home/bo/.local/share/porelo-host/setup/alpha-one/project.bundle
            signed_by: {{ verify_bring_bundles.signer | to_json }}
          keys: []
          access:
            bundle: access.bundle
          forge:
            repositories:
              - name: app
                url: {{ verify_bring_central.central_url | to_json }}

    - name: Read bo's uploaded setup directory and files
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - /home/bo/.local/share/porelo-host/setup/alpha-one
        - /home/bo/.local/share/porelo-host/setup/alpha-one/machine.yml
        - /home/bo/.local/share/porelo-host/setup/alpha-one/project.bundle
        - /home/bo/.local/share/porelo-host/setup/alpha-one/access.bundle
      register: verify_bring_bo_upload

    - name: Assert bo's setup directory is 0700 and its machine.yml and bundles are bo's 0600 plain files
      ansible.builtin.assert:
        that:
          - verify_bring_bo_upload.results[0].stat.isdir | default(false)
          - verify_bring_bo_upload.results[0].stat.pw_name | default('') == 'bo'
          - verify_bring_bo_upload.results[0].stat.gr_name | default('') == 'bo'
          - verify_bring_bo_upload.results[0].stat.mode | default('') == '0700'
          - verify_bring_bo_upload.results[1:] | rejectattr('stat.isreg') | list | length == 0
          - verify_bring_bo_upload.results[1:] | map(attribute='stat.pw_name') | unique | list == ['bo']
          - verify_bring_bo_upload.results[1:] | map(attribute='stat.gr_name') | unique | list == ['bo']
          - verify_bring_bo_upload.results[1:] | map(attribute='stat.mode') | unique | list == ['0600']
        fail_msg: >-
          asked /home/bo/.local/share/porelo-host/setup/alpha-one for bo:bo 0700 holding bo:bo 0600 plain files;
          got {{ verify_bring_bo_upload.results | map(attribute='stat') | list }}

    - name: Run bo's own stop as bo with no sudo for vault-new, forge-central-token and identities
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - |
            import base64, json, pathlib, pwd, secrets, subprocess
            pw = pwd.getpwnam("bo")
            passphrase = "bo-vault-passphrase-" + secrets.token_hex(20)
            central_tok = pathlib.Path("/root/verify-bring/bo-central.token").read_text(encoding="utf-8").strip()
            pat_path = pathlib.Path("/root/verify-people/tokens.pat")
            with pat_path.open("a", encoding="utf-8") as handle:
                handle.write(passphrase + "\n")
            patterns = [line for line in pat_path.read_text(encoding="utf-8").splitlines() if line]
            b64_pass = base64.b64encode(passphrase.encode("utf-8")).decode("ascii")
            b64_tok = base64.b64encode(central_tok.encode("utf-8")).decode("ascii")
            payload = f"vault-new {b64_pass}\nforge-central-token {b64_tok}\n"
            run = subprocess.run(
                [
                    "/usr/sbin/runuser", "-u", "bo", "--",
                    "/usr/bin/env", f"HOME={pw.pw_dir}", "USER=bo", "LOGNAME=bo",
                    f"XDG_RUNTIME_DIR=/run/user/{pw.pw_uid}",
                    "PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin",
                    "LC_ALL=C.UTF-8",
                    "/usr/local/bin/porelo-host-stop", "--stdin",
                    "vault-new", "forge-central-token", "identities",
                ],
                input=payload,
                capture_output=True,
                text=True,
                cwd=pw.pw_dir,
            )
            with open("/root/verify-bring/act.out", "a", encoding="utf-8") as out_file:
                out_file.write(run.stdout + run.stderr)
            def redact(text):
                for item in patterns:
                    text = text.replace(item, "<redacted>")
                return text
            print(
                json.dumps(
                    {
                        "uid": pw.pw_uid,
                        "rc": run.returncode,
                        "stdout": redact(run.stdout),
                        "stderr": redact(run.stderr),
                    }
                )
            )
      register: verify_bring_bo_stop
      changed_when: true
      no_log: true

    - name: List bo's vault entries as bo and check whether bo's waiting identities.tokens is gone
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - |
            import json, pathlib, pwd, subprocess
            pw = pwd.getpwnam("bo")
            listed = subprocess.run(
                [
                    "/usr/sbin/runuser", "-u", "bo", "--",
                    "/usr/bin/env", f"HOME={pw.pw_dir}", "USER=bo", "LOGNAME=bo",
                    f"XDG_RUNTIME_DIR=/run/user/{pw.pw_uid}",
                    "LC_ALL=C.UTF-8",
                    "porelo", "vault", "list",
                ],
                capture_output=True,
                text=True,
                cwd=pw.pw_dir,
            )
            with open("/root/verify-bring/act.out", "a", encoding="utf-8") as out_file:
                out_file.write(listed.stdout + listed.stderr)
            entries = [line.split()[0] for line in listed.stdout.splitlines() if line.split()]
            tokens_path = pathlib.Path("/run/porelo-host/people/bo/identities.tokens")
            print(
                json.dumps(
                    {
                        "rc": listed.returncode,
                        "entries": entries,
                        "identities_exists": tokens_path.exists() or tokens_path.is_symlink(),
                    }
                )
            )
      register: verify_bring_bo_vault
      changed_when: false

    - name: Assert bo's own stop succeeded, filled bo's vault with both forge entries and removed identities.tokens
      ansible.builtin.assert:
        that:
          - verify_bring_stop_out.rc == 0
          - verify_bring_stop_out.stdout.endswith('Your stop is done.\n')
          # Porelo names a stored credential no provider declares; nothing else may reach stderr.
          - >-
            verify_bring_stop_out.stderr
            | regex_replace("(?m)^porelo: no provider '[^'\\n]+' is declared [^\\n]*\\n", '') == ''
          - verify_bring_vault_out.rc == 0
          - (verify_bring_central.forge_name ~ '.person') in verify_bring_vault_out.entries
          - ('git.token.' ~ verify_bring_central.forge_name) in verify_bring_vault_out.entries
          - not verify_bring_vault_out.identities_exists
        fail_msg: >-
          asked bo's own stop for rc 0 ('Your stop is done.'), vault entries {{ verify_bring_central.forge_name
          }}.person and git.token.{{ verify_bring_central.forge_name }}, and identities.tokens gone;
          got stop {{ verify_bring_stop_out }}, vault {{ verify_bring_vault_out }}
      vars:
        verify_bring_stop_out: "{{ verify_bring_bo_stop.stdout | from_json }}"
        verify_bring_vault_out: "{{ verify_bring_bo_vault.stdout | from_json }}"

    - name: Run porelo.host.bring as bo with no sudo to bring alpha-one onto the host
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - |
            import json, pathlib, pwd, re, subprocess
            pw = pwd.getpwnam("bo")
            patterns = [
                line for line in pathlib.Path("/root/verify-people/tokens.pat").read_text(encoding="utf-8").splitlines()
                if line
            ]
            run = subprocess.run(
                [
                    "/usr/sbin/runuser", "-u", "bo", "--",
                    "/usr/bin/env", f"HOME={pw.pw_dir}", "USER=bo", "LOGNAME=bo",
                    f"XDG_RUNTIME_DIR=/run/user/{pw.pw_uid}",
                    "ANSIBLE_NOCOLOR=1",
                    "ANSIBLE_STDOUT_CALLBACK=default",
                    "LC_ALL=C.UTF-8",
                    "ansible-playbook", "-v", "-c", "local", "porelo.host.bring", "-e", "porelo_project=alpha-one",
                ],
                capture_output=True,
                text=True,
                cwd=pw.pw_dir,
            )
            with open("/root/verify-bring/act.out", "a", encoding="utf-8") as out_file:
                out_file.write(run.stdout + run.stderr)
            sync_answer = None
            marker = "own_sync | Keep the host's developers to the signed access file, through root's sync]"
            pos = run.stdout.find(marker)
            if pos != -1:
                next_task = run.stdout.find("\nTASK [", pos)
                recap_pos = run.stdout.find("\nPLAY RECAP", pos)
                ends = [idx for idx in (next_task, recap_pos) if idx != -1]
                section = run.stdout[pos : min(ends)] if ends else run.stdout[pos:]
                arrow = section.find("=> ")
                if arrow != -1:
                    task_obj, _ = json.JSONDecoder().raw_decode(section[arrow + 3 :].lstrip())
                    if isinstance(task_obj, dict) and task_obj.get("stdout"):
                        sync_answer = json.loads(task_obj["stdout"])
            def redact(text):
                for item in patterns:
                    text = text.replace(item, "<redacted>")
                return text
            recap_match = re.search(r"(?m)^localhost\s*:\s*(.+)$", run.stdout)
            print(
                json.dumps(
                    {
                        "rc": run.returncode,
                        "recap": recap_match.group(1) if recap_match else "",
                        "sync": sync_answer,
                        "tail": redact((run.stdout + "\n" + run.stderr)[-3000:]),
                    }
                )
            )
      register: verify_bring_first_run
      changed_when: true
      no_log: true

    - name: Read cy's person record and getent passwd entries after bring's sync
