    - name: Read alpha-one/app, main's protection, teams and Actions variables and secrets from Forgejo
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - |
            import json, pathlib, ssl, urllib.request
            token = pathlib.Path("/home/porelo-forge/.config/porelo-forge/api.token").read_text(
                encoding="utf-8"
            ).strip()
            conf = dict(
                line.split("=", 1)
                for line in pathlib.Path("/etc/porelo-host/forge.conf").read_text(encoding="utf-8").splitlines()
                if "=" in line
            )
            ctx = ssl.create_default_context(cafile="/etc/porelo-host/forge/ca.pem")
            opener = urllib.request.build_opener(
                urllib.request.ProxyHandler({}),
                urllib.request.HTTPSHandler(context=ctx),
            )
            base = f"https://{conf['address']}:{conf['port']}/api/v1"
            def get_json(path):
                req = urllib.request.Request(base + path, headers={"Authorization": "token " + token})
                with opener.open(req, timeout=30) as resp:
                    return json.load(resp)
            repo = get_json("/repos/alpha-one/app")
            branch = get_json("/repos/alpha-one/app/branches/main")
            protection = get_json("/repos/alpha-one/app/branch_protections/main")
            teams_raw = get_json("/orgs/alpha-one/teams?limit=50&page=1")
            teams = {}
            for entry in teams_raw:
                detail = get_json(f"/teams/{entry['id']}")
                members = [m["login"] for m in get_json(f"/teams/{entry['id']}/members?limit=50&page=1")]
                teams[entry["name"]] = {
                    "includes_all_repositories": detail.get("includes_all_repositories"),
                    "can_create_org_repo": detail.get("can_create_org_repo"),
                    "units_map": detail.get("units_map"),
                    "members": sorted(members),
                }
            variables = {}
            for key in ("PORELO_PUBLISH", "JF_URL", "PORELO_DEPLOY_PROFILE", "MAVEN_SNAPSHOTS_URL"):
                variables[key] = get_json(f"/orgs/alpha-one/actions/variables/{key}").get("data")
            secret_names = [row["name"] for row in get_json("/orgs/alpha-one/actions/secrets?limit=50&page=1")]
            print(
                json.dumps(
                    {
                        "original_url": repo.get("original_url"),
                        "mirror": repo.get("mirror"),
                        "private": repo.get("private"),
                        "merge": {
                            "allow_fast_forward_only_merge": repo.get("allow_fast_forward_only_merge"),
                            "default_merge_style": repo.get("default_merge_style"),
                            "allow_merge_commits": repo.get("allow_merge_commits"),
                            "allow_rebase": repo.get("allow_rebase"),
                            "allow_rebase_explicit": repo.get("allow_rebase_explicit"),
                            "allow_squash_merge": repo.get("allow_squash_merge"),
                        },
                        "main_sha": (branch.get("commit") or {}).get("id"),
                        "protection": {
                            "rule_name": protection.get("rule_name"),
                            "enable_push": protection.get("enable_push"),
                            "enable_push_whitelist": protection.get("enable_push_whitelist"),
                            "required_approvals": protection.get("required_approvals"),
                            "enable_approvals_whitelist": protection.get("enable_approvals_whitelist"),
                            "approvals_whitelist_teams": sorted(protection.get("approvals_whitelist_teams") or []),
                            "enable_merge_whitelist": protection.get("enable_merge_whitelist"),
                            "merge_whitelist_teams": sorted(protection.get("merge_whitelist_teams") or []),
                            "enable_status_check": protection.get("enable_status_check"),
                            "apply_to_admins": protection.get("apply_to_admins"),
                        },
                        "teams": teams,
                        "variables": variables,
                        "secrets": secret_names,
                    }
                )
            )
      register: verify_bring_forge_state
      changed_when: false
      no_log: true

    - name: Assert Forgejo holds migrated alpha-one/app, fast-forward main protection, teams with cy, and Actions vars
