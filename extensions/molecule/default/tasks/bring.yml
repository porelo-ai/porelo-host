            signed_by: {{ verify_bring_bundles.signer | to_json }}
          keys: []
          access:
            bundle: access.bundle

    - name: Run cy's own stop as cy with no sudo for vault-new and identities
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - |
            import base64, json, pathlib, pwd, secrets, subprocess
            pw = pwd.getpwnam("cy")
            passphrase = "cy-vault-passphrase-" + secrets.token_hex(20)
            pat_path = pathlib.Path("/root/verify-people/tokens.pat")
            with pat_path.open("a", encoding="utf-8") as handle:
                handle.write(passphrase + "\n")
            patterns = [line for line in pat_path.read_text(encoding="utf-8").splitlines() if line]
            b64_pass = base64.b64encode(passphrase.encode("utf-8")).decode("ascii")
            run = subprocess.run(
                [
                    "/usr/sbin/runuser", "-u", "cy", "--",
                    "/usr/bin/env", f"HOME={pw.pw_dir}", "USER=cy", "LOGNAME=cy",
                    f"XDG_RUNTIME_DIR=/run/user/{pw.pw_uid}",
                    "PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin",
                    "LC_ALL=C.UTF-8",
                    "/usr/local/bin/porelo-host-stop", "--stdin", "vault-new", "identities",
                ],
                input=f"vault-new {b64_pass}\n",
                capture_output=True,
                text=True,
                cwd=pw.pw_dir,
            )
            listed = subprocess.run(
                [
                    "/usr/sbin/runuser", "-u", "cy", "--",
                    "/usr/bin/env", f"HOME={pw.pw_dir}", "USER=cy", "LOGNAME=cy",
                    f"XDG_RUNTIME_DIR=/run/user/{pw.pw_uid}",
                    "LC_ALL=C.UTF-8",
                    "porelo", "vault", "list",
                ],
                capture_output=True,
                text=True,
                cwd=pw.pw_dir,
            )
            with open("/root/verify-bring/act.out", "a", encoding="utf-8") as out_file:
                out_file.write(run.stdout + run.stderr + listed.stdout + listed.stderr)
            def redact(text):
                for item in patterns:
                    text = text.replace(item, "<redacted>")
                return text
            entries = [line.split()[0] for line in listed.stdout.splitlines() if line.split()]
            tokens_path = pathlib.Path("/run/porelo-host/people/cy/identities.tokens")
            print(
                json.dumps(
                    {
                        "rc": run.returncode,
                        "stdout": redact(run.stdout),
                        "stderr": redact(run.stderr),
                        "vault_rc": listed.returncode,
                        "entries": entries,
                        "identities_exists": tokens_path.exists() or tokens_path.is_symlink(),
                    }
                )
            )
      register: verify_bring_cy_stop
      changed_when: true
      no_log: true

    - name: Assert cy's own stop succeeded, filled cy's vault and removed cy's identities.tokens
      ansible.builtin.assert:
        that:
          - verify_bring_cy_stop_out.rc == 0
          - verify_bring_cy_stop_out.stdout.endswith('Your stop is done.\n')
          # Porelo names a stored credential no provider declares; nothing else may reach stderr.
          - >-
            verify_bring_cy_stop_out.stderr
            | regex_replace("(?m)^porelo: no provider '[^'\\n]+' is declared [^\\n]*\\n", '') == ''
          - verify_bring_cy_stop_out.vault_rc == 0
          - (verify_bring_central.forge_name ~ '.person') in verify_bring_cy_stop_out.entries
          - ('git.token.' ~ verify_bring_central.forge_name) in verify_bring_cy_stop_out.entries
          - not verify_bring_cy_stop_out.identities_exists
        fail_msg: >-
          asked cy's own stop for rc 0 ('Your stop is done.'), vault entries {{ verify_bring_central.forge_name
          }}.person and git.token.{{ verify_bring_central.forge_name }}, and cy's identities.tokens gone;
          got {{ verify_bring_cy_stop_out }}
      vars:
        verify_bring_cy_stop_out: "{{ verify_bring_cy_stop.stdout | from_json }}"

    - name: Run porelo.host.join as cy with no sudo and inspect cy's push config, runtime directory and follow state
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - |
            import json, os, pathlib, pwd, stat, subprocess
            pw = pwd.getpwnam("cy")
            patterns = [
                line for line in pathlib.Path("/root/verify-people/tokens.pat").read_text(encoding="utf-8").splitlines()
                if line
            ]
            run = subprocess.run(
                [
                    "/usr/sbin/runuser", "-u", "cy", "--",
                    "/usr/bin/env", f"HOME={pw.pw_dir}", "USER=cy", "LOGNAME=cy",
                    f"XDG_RUNTIME_DIR=/run/user/{pw.pw_uid}",
                    "ANSIBLE_NOCOLOR=1",
                    "LC_ALL=C.UTF-8",
                    "ansible-playbook", "-c", "local", "porelo.host.join", "-e", "porelo_project=alpha-one",
                ],
                capture_output=True,
                text=True,
                cwd=pw.pw_dir,
            )
            following = subprocess.run(
                [
                    "/usr/sbin/runuser", "-u", "cy", "--",
                    "/usr/bin/env", f"HOME={pw.pw_dir}", "USER=cy", "LOGNAME=cy",
                    f"XDG_RUNTIME_DIR=/run/user/{pw.pw_uid}",
                    "LC_ALL=C.UTF-8",
                    "porelo", "project", "following", "--json",
                ],
                capture_output=True,
                text=True,
                cwd=pw.pw_dir,
            )
            with open("/root/verify-bring/act.out", "a", encoding="utf-8") as out_file:
                out_file.write(run.stdout + run.stderr + following.stdout + following.stderr)
            push_dir = pathlib.Path(f"{pw.pw_dir}/.config/porelo-host/push")
            push_file = push_dir / "alpha-one.conf"
            runtime_dir = pathlib.Path(f"/run/user/{pw.pw_uid}/porelo-host")
            runtime_entries = sorted(p.name for p in runtime_dir.iterdir()) if runtime_dir.exists() else []
            def redact(text):
                for item in patterns:
                    text = text.replace(item, "<redacted>")
                return text
            result = {
                "rc": run.returncode,
                "cy_uid": pw.pw_uid,
                "push_exists": push_file.exists(),
                "runtime_entries": runtime_entries,
                "forge_token_exists": os.path.lexists(runtime_dir / "forge.token"),
                "central_token_exists": os.path.lexists(runtime_dir / "forge-central-token"),
                "following_rc": following.returncode,
                "following": json.loads(following.stdout) if following.returncode == 0 else {},
                "tail": redact((run.stdout + "\n" + run.stderr)[-2000:]),
            }
            if push_file.exists():
                dir_st = push_dir.lstat()
                file_st = push_file.lstat()
                result.update(
                    {
                        "dir_uid": dir_st.st_uid,
                        "dir_mode": f"{stat.S_IMODE(dir_st.st_mode):04o}",
                        "file_uid": file_st.st_uid,
                        "file_mode": f"{stat.S_IMODE(file_st.st_mode):04o}",
                        "push_lines": push_file.read_text(encoding="utf-8").splitlines(),
                    }
                )
            print(json.dumps(result))
      register: verify_bring_cy_join
      changed_when: true
      no_log: true

    - name: Assert porelo.host.join wrote cy's 0600 push config naming app, followed alpha-one and left no runtime token
      ansible.builtin.assert:
        that:
          - verify_bring_join.rc == 0
          - verify_bring_join.push_exists
          - verify_bring_join.dir_uid == verify_bring_join.cy_uid
          - verify_bring_join.dir_mode == '0700'
          - verify_bring_join.file_uid == verify_bring_join.cy_uid
          - verify_bring_join.file_mode == '0600'
          - ('repository app ' ~ verify_bring_central.central_url) in verify_bring_join.push_lines
          - not verify_bring_join.forge_token_exists
          - not verify_bring_join.central_token_exists
          - verify_bring_join.runtime_entries == []
          - verify_bring_join.following_rc == 0
          - verify_bring_cy_alpha | length == 1
          - verify_bring_cy_alpha[0].verified
          - verify_bring_cy_alpha[0].commit == verify_bring_bundles.project_commit
        fail_msg: >-
          asked porelo.host.join as cy for rc 0, cy:cy 0700/0600 push/alpha-one.conf naming 'repository app {{
          verify_bring_central.central_url }}', empty runtime token directory and followed alpha-one;
          got {{ verify_bring_join }}
      vars:
        verify_bring_join: "{{ verify_bring_cy_join.stdout | from_json }}"
        verify_bring_cy_alpha: >-
          {{ (verify_bring_join.following.follows | default([]))
          | selectattr('name', 'equalto', 'alpha-one') | list }}

    - name: Ask porelo.host.join as cy to refuse a machine.yml carrying a forge section
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - |
            import hashlib, json, os, pathlib, pwd, subprocess, sys
            central_url = sys.argv[1]
            pw = pwd.getpwnam("cy")
            machine = pathlib.Path(f"{pw.pw_dir}/.local/share/porelo-host/setup/alpha-one/machine.yml")
            push_file = pathlib.Path(f"{pw.pw_dir}/.config/porelo-host/push/alpha-one.conf")
            saved = machine.read_bytes()
            before = hashlib.sha256(push_file.read_bytes()).hexdigest()
            try:
                with_forge = (
                    saved.decode("utf-8")
                    + "forge:\n"
                    + "  repositories:\n"
                    + "    - name: app\n"
                    + f"      url: {json.dumps(central_url)}\n"
                )
                machine.write_text(with_forge, encoding="utf-8")
                os.chown(machine, pw.pw_uid, pw.pw_gid)
                os.chmod(machine, 0o600)
                run = subprocess.run(
                    [
                        "/usr/sbin/runuser", "-u", "cy", "--",
                        "/usr/bin/env", f"HOME={pw.pw_dir}", "USER=cy", "LOGNAME=cy",
                        f"XDG_RUNTIME_DIR=/run/user/{pw.pw_uid}",
                        "ANSIBLE_STDOUT_CALLBACK=porelo.host.lines",
                        "LC_ALL=C.UTF-8",
                        "ansible-playbook", "-c", "local", "porelo.host.join", "-e", "porelo_project=alpha-one",
                    ],
                    capture_output=True,
                    text=True,
                    cwd=pw.pw_dir,
                )
                with open("/root/verify-bring/act.out", "a", encoding="utf-8") as out_file:
                    out_file.write(run.stdout + run.stderr)
            finally:
                machine.write_bytes(saved)
                os.chown(machine, pw.pw_uid, pw.pw_gid)
                os.chmod(machine, 0o600)
            after = hashlib.sha256(push_file.read_bytes()).hexdigest()
            lines = [json.loads(line) for line in run.stdout.splitlines() if line.strip().startswith("{")]
            failed = [line.get("msg", "") for line in lines if line.get("state") == "failed"]
            changed = [line.get("task", "") for line in lines if line.get("state") == "changed"]
            print(
                json.dumps(
                    {
                        "rc": run.returncode,
                        "failed": failed,
                        "changed": changed,
                        "unchanged": before == after,
                    }
                )
            )
          - "{{ verify_bring_central.central_url }}"
      register: verify_bring_join_refusal
      changed_when: false
      no_log: true

    - name: Assert porelo.host.join refuses a machine.yml with a forge section naming forge and changes nothing
      ansible.builtin.assert:
        that:
          - verify_bring_join_refused.rc == 2
          - verify_bring_join_refused.failed | length == 1
          - verify_bring_join_refused.changed == []
          - verify_bring_join_refused.unchanged
          - "'a join reads no forge section' in verify_bring_join_refused.failed[0]"
        fail_msg: >-
          asked porelo.host.join with a forge: section for rc 2, 'a join reads no forge section', zero changed tasks
          and unchanged push config; got {{ verify_bring_join_refused }}
      vars:
        verify_bring_join_refused: "{{ verify_bring_join_refusal.stdout | from_json }}"

    - name: Scan all captured bring/join outputs and the journal against /root/verify-people/tokens.pat with a control
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - |
            import json, pathlib, subprocess
            pat_path = pathlib.Path("/root/verify-people/tokens.pat")
            patterns = [line for line in pat_path.read_text(encoding="utf-8").splitlines() if line]
            if len(patterns) < 8 or min(len(item) for item in patterns) < 20:
                raise SystemExit(f"expected >=8 patterns of len >=20, got {len(patterns)}")
            planted = "\n".join(patterns) + "\n"
            planted_matched = all(item in planted for item in patterns)
            act_out = pathlib.Path("/root/verify-bring/act.out").read_text(encoding="utf-8")
            journal = subprocess.check_output(["/usr/bin/journalctl", "-b", "-o", "cat", "--no-pager"], text=True)
            grep_act = subprocess.run(
                ["/usr/bin/grep", "-Fq", "-f", str(pat_path), "--", "/root/verify-bring/act.out"],
                capture_output=True,
                text=True,
            )
            journal_path = pathlib.Path("/root/verify-bring/journal.out")
            journal_path.write_text(journal, encoding="utf-8")
            try:
                grep_journal = subprocess.run(
                    ["/usr/bin/grep", "-Fq", "-f", str(pat_path), "--", str(journal_path)],
                    capture_output=True,
                    text=True,
                )
            finally:
                journal_path.unlink(missing_ok=True)
            print(
                json.dumps(
                    {
                        "pattern_count": len(patterns),
                        "min_len": min(len(item) for item in patterns),
                        "planted_matched": planted_matched,
                        "act_bytes": len(act_out),
                        "act_clean": (not any(item in act_out for item in patterns)) and grep_act.returncode == 1,
                        "journal_clean": (
                            (not any(item in journal for item in patterns)) and grep_journal.returncode == 1
                        ),
                    }
                )
            )
      register: verify_bring_leak_scan
      changed_when: false
      no_log: true

    - name: Assert no token or vault passphrase appeared in the act's outputs or the journal
      ansible.builtin.assert:
        that:
          - verify_bring_leaks.pattern_count >= 8
          - verify_bring_leaks.min_len >= 20
          - verify_bring_leaks.planted_matched
          - verify_bring_leaks.act_bytes > 0
          - verify_bring_leaks.act_clean
          - verify_bring_leaks.journal_clean
        fail_msg: >-
          asked /root/verify-people/tokens.pat (>=8 patterns, planted control matching) for zero matches in act.out and
          the journal; got {{ verify_bring_leaks }}
      vars:
        verify_bring_leaks: "{{ verify_bring_leak_scan.stdout | from_json }}"

    - name: Remove bo's and cy's setup directories and timers, central-alpha-one and bo's minted central token
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - |
            import json, os, pathlib, pwd, secrets, shutil, ssl, subprocess, urllib.error, urllib.request
            for user in ("bo", "cy"):
                pw = pwd.getpwnam(user)
                env = [
                    f"HOME={pw.pw_dir}",
                    f"USER={user}",
                    f"LOGNAME={user}",
                    f"XDG_RUNTIME_DIR=/run/user/{pw.pw_uid}",
                    "LC_ALL=C.UTF-8",
                ]
                unit_dir = pathlib.Path(f"{pw.pw_dir}/.config/systemd/user")
                timer_file = unit_dir / "porelo-host-sync-alpha-one.timer"
                service_file = unit_dir / "porelo-host-sync-alpha-one.service"
                wants_link = unit_dir / "timers.target.wants" / "porelo-host-sync-alpha-one.timer"
                if timer_file.exists() or service_file.exists() or os.path.lexists(wants_link):
                    subprocess.run(
                        [
                            "/usr/sbin/runuser", "-u", user, "--", "/usr/bin/env", *env,
                            "systemctl", "--user", "disable", "--now", "porelo-host-sync-alpha-one.timer",
                        ],
                        capture_output=True,
                        text=True,
                        cwd=pw.pw_dir,
                    )
                    subprocess.run(
                        [
                            "/usr/sbin/runuser", "-u", user, "--", "/usr/bin/env", *env,
                            "systemctl", "--user", "stop", "porelo-host-sync-alpha-one.service",
                        ],
                        capture_output=True,
                        text=True,
                        cwd=pw.pw_dir,
                    )
                    for target in (wants_link, timer_file, service_file):
                        if os.path.lexists(target):
                            os.unlink(target)
                    subprocess.run(
                        [
                            "/usr/sbin/runuser", "-u", user, "--", "/usr/bin/env", *env,
                            "systemctl", "--user", "daemon-reload",
                        ],
                        capture_output=True,
                        text=True,
                        cwd=pw.pw_dir,
                    )
                for rel in (".local/share/porelo-host", ".ansible"):
                    target_dir = pathlib.Path(pw.pw_dir) / rel
                    if target_dir.exists():
                        shutil.rmtree(target_dir)
            conf = dict(
                line.split("=", 1)
                for line in pathlib.Path("/etc/porelo-host/forge.conf").read_text(encoding="utf-8").splitlines()
                if "=" in line
            )
            api_token = pathlib.Path("/home/porelo-forge/.config/porelo-forge/api.token").read_text(
                encoding="utf-8"
            ).strip()
            ctx = ssl.create_default_context(cafile="/etc/porelo-host/forge/ca.pem")
            opener = urllib.request.build_opener(
                urllib.request.ProxyHandler({}),
                urllib.request.HTTPSHandler(context=ctx),
            )
            base = f"https://{conf['address']}:{conf['port']}/api/v1"
            def call(method, path, tok):
                req = urllib.request.Request(
                    base + path,
                    method=method,
                    headers={"Authorization": "token " + tok, "Content-Type": "application/json"},
                )
                try:
                    with opener.open(req, timeout=30) as resp:
                        raw = resp.read()
                        return resp.status, (json.loads(raw) if raw else None)
                except urllib.error.HTTPError as err:
                    err.close()
                    return err.code, None
            del_repo, _ = call("DELETE", "/repos/central-alpha-one/app", api_token)
            del_org, _ = call("DELETE", "/orgs/central-alpha-one", api_token)
            central_after, _ = call("GET", "/orgs/central-alpha-one", api_token)
            alpha_app_after, _ = call("GET", "/repos/alpha-one/app", api_token)
            central_name = pathlib.Path("/root/verify-bring/central-token.name").read_text(encoding="utf-8").strip()
            uid = subprocess.check_output(["/usr/bin/id", "-u", conf["account"]], text=True).strip()
            cleanup_name = "verify-bring-cleanup-" + secrets.token_hex(12)
            cleanup_tok = subprocess.check_output(
                [
                    "/usr/sbin/runuser", "-u", conf["account"], "--",
                    "/usr/bin/env", f"XDG_RUNTIME_DIR=/run/user/{uid}",
                    "/usr/bin/podman", "exec", "forgejo", "forgejo", "admin", "user",
                    "generate-access-token", "--username", "porelo-admin",
                    "--token-name", cleanup_name, "--scopes", "write:admin", "--raw",
                ],
                text=True,
                cwd="/",
            ).strip()
            central_tok_deleted = False
            cleanup_tok_deleted = False
            try:
                _, rows = call("GET", "/admin/users/porelo-admin/tokens?limit=50&page=1", cleanup_tok)
                for row in rows or []:
                    if row.get("name") == central_name:
                        code, _ = call("DELETE", f"/admin/users/porelo-admin/tokens/{row['id']}", cleanup_tok)
                        central_tok_deleted = code == 204
            finally:
                _, rows = call("GET", "/admin/users/porelo-admin/tokens?limit=50&page=1", cleanup_tok)
                for row in rows or []:
                    if row.get("name") == cleanup_name:
                        code, _ = call("DELETE", f"/admin/users/porelo-admin/tokens/{row['id']}", cleanup_tok)
                        cleanup_tok_deleted = code == 204
            pathlib.Path("/root/verify-bring/central-token.name").unlink(missing_ok=True)
            bo_pw = pwd.getpwnam("bo")
            timer_state = subprocess.run(
                [
                    "/usr/sbin/runuser", "-u", "bo", "--",
                    "/usr/bin/env", f"HOME={bo_pw.pw_dir}", "USER=bo", "LOGNAME=bo",
                    f"XDG_RUNTIME_DIR=/run/user/{bo_pw.pw_uid}",
                    "systemctl", "--user", "is-active", "porelo-host-sync-alpha-one.timer",
                ],
                capture_output=True,
                text=True,
                cwd=bo_pw.pw_dir,
            )
            print(
                json.dumps(
                    {
                        "del_repo": del_repo,
                        "del_org": del_org,
                        "central_after": central_after,
                        "alpha_app_after": alpha_app_after,
                        "central_tok_deleted": central_tok_deleted,
                        "cleanup_tok_deleted": cleanup_tok_deleted,
                        "bo_setup_exists": pathlib.Path("/home/bo/.local/share/porelo-host").exists(),
                        "cy_setup_exists": pathlib.Path("/home/cy/.local/share/porelo-host").exists(),
                        "bo_timer_active": timer_state.stdout.strip(),
                    }
                )
            )
      register: verify_bring_cleanup
      changed_when: true
      no_log: true

    - name: Assert central-alpha-one, setup directories and timers are removed while alpha-one/app stays for removal
      ansible.builtin.assert:
        that:
          - verify_bring_cleaned.del_repo == 204
          - verify_bring_cleaned.del_org == 204
          - verify_bring_cleaned.central_after == 404
          - verify_bring_cleaned.alpha_app_after == 200
          - verify_bring_cleaned.central_tok_deleted
          - verify_bring_cleaned.cleanup_tok_deleted
          - not verify_bring_cleaned.bo_setup_exists
          - not verify_bring_cleaned.cy_setup_exists
          - verify_bring_cleaned.bo_timer_active != 'active'
        fail_msg: >-
          asked cleanup to delete central-alpha-one (404), minted admin tokens, setup directories and bo's sync timer
          while leaving alpha-one/app (200) for projects.yml; got {{ verify_bring_cleaned }}
      vars:
        verify_bring_cleaned: "{{ verify_bring_cleanup.stdout | from_json }}"
  always:
    - name: Ensure timers, setup directories, central-alpha-one and minted tokens are gone after any failure
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - |
            import json, os, pathlib, pwd, secrets, shutil, ssl, subprocess, urllib.error, urllib.request
            for user in ("bo", "cy"):
                try:
                    pw = pwd.getpwnam(user)
                except KeyError:
                    continue
                env = [
                    f"HOME={pw.pw_dir}",
                    f"USER={user}",
                    f"LOGNAME={user}",
                    f"XDG_RUNTIME_DIR=/run/user/{pw.pw_uid}",
                    "LC_ALL=C.UTF-8",
                ]
                unit_dir = pathlib.Path(f"{pw.pw_dir}/.config/systemd/user")
                timer_file = unit_dir / "porelo-host-sync-alpha-one.timer"
                service_file = unit_dir / "porelo-host-sync-alpha-one.service"
                wants_link = unit_dir / "timers.target.wants" / "porelo-host-sync-alpha-one.timer"
                if timer_file.exists() or service_file.exists() or os.path.lexists(wants_link):
                    subprocess.run(
                        [
                            "/usr/sbin/runuser", "-u", user, "--", "/usr/bin/env", *env,
                            "systemctl", "--user", "disable", "--now", "porelo-host-sync-alpha-one.timer",
                        ],
                        capture_output=True,
                        text=True,
                        cwd=pw.pw_dir,
                    )
                    for target in (wants_link, timer_file, service_file):
                        if os.path.lexists(target):
                            os.unlink(target)
                    subprocess.run(
                        [
                            "/usr/sbin/runuser", "-u", user, "--", "/usr/bin/env", *env,
                            "systemctl", "--user", "daemon-reload",
                        ],
                        capture_output=True,
                        text=True,
                        cwd=pw.pw_dir,
                    )
                for rel in (".local/share/porelo-host", ".ansible"):
                    target_dir = pathlib.Path(pw.pw_dir) / rel
                    if target_dir.exists():
                        shutil.rmtree(target_dir)
            forge_conf = pathlib.Path("/etc/porelo-host/forge.conf")
            api_tok_path = pathlib.Path("/home/porelo-forge/.config/porelo-forge/api.token")
            ca_path = pathlib.Path("/etc/porelo-host/forge/ca.pem")
            if forge_conf.exists() and api_tok_path.exists() and ca_path.exists():
                conf = dict(
                    line.split("=", 1)
                    for line in forge_conf.read_text(encoding="utf-8").splitlines()
                    if "=" in line
                )
                api_token = api_tok_path.read_text(encoding="utf-8").strip()
                ctx = ssl.create_default_context(cafile=str(ca_path))
                opener = urllib.request.build_opener(
                    urllib.request.ProxyHandler({}),
                    urllib.request.HTTPSHandler(context=ctx),
                )
                base = f"https://{conf['address']}:{conf['port']}/api/v1"
                def call(method, path, tok):
                    req = urllib.request.Request(
                        base + path,
                        method=method,
                        headers={"Authorization": "token " + tok, "Content-Type": "application/json"},
                    )
                    try:
                        with opener.open(req, timeout=30) as resp:
                            raw = resp.read()
                            return resp.status, (json.loads(raw) if raw else None)
                    except urllib.error.HTTPError as err:
                        err.close()
                        return err.code, None
                call("DELETE", "/repos/central-alpha-one/app", api_token)
                call("DELETE", "/orgs/central-alpha-one", api_token)
                name_file = pathlib.Path("/root/verify-bring/central-token.name")
                if name_file.exists() and conf.get("account"):
                    central_name = name_file.read_text(encoding="utf-8").strip()
                    uid = subprocess.check_output(["/usr/bin/id", "-u", conf["account"]], text=True).strip()
                    cleanup_name = "verify-bring-always-" + secrets.token_hex(12)
                    cleanup_tok = subprocess.check_output(
                        [
                            "/usr/sbin/runuser", "-u", conf["account"], "--",
                            "/usr/bin/env", f"XDG_RUNTIME_DIR=/run/user/{uid}",
                            "/usr/bin/podman", "exec", "forgejo", "forgejo", "admin", "user",
                            "generate-access-token", "--username", "porelo-admin",
                            "--token-name", cleanup_name, "--scopes", "write:admin", "--raw",
                        ],
                        text=True,
                        cwd="/",
                    ).strip()
                    try:
                        _, rows = call("GET", "/admin/users/porelo-admin/tokens?limit=50&page=1", cleanup_tok)
                        for row in rows or []:
                            if row.get("name") == central_name:
                                call("DELETE", f"/admin/users/porelo-admin/tokens/{row['id']}", cleanup_tok)
                    finally:
                        _, rows = call("GET", "/admin/users/porelo-admin/tokens?limit=50&page=1", cleanup_tok)
                        for row in rows or []:
                            if row.get("name") == cleanup_name:
                                call("DELETE", f"/admin/users/porelo-admin/tokens/{row['id']}", cleanup_tok)
      changed_when: false
      failed_when: false
      no_log: true

    - name: Remove the temporary bring verification scratch directory
      ansible.builtin.file:
        path: /root/verify-bring
        state: absent

    - name: Remove /root/verify-people when bring created it
      ansible.builtin.file:
        path: /root/verify-people
        state: absent
      when: not (verify_bring_people_dir_before.stat.exists | default(false))
