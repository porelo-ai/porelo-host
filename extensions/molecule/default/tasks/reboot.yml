---
# A reboot of a host set up by up, with the ordering Scaleway's Ubuntu image has and the test image lacks: cloud-init's
# network stage after networkd's wait-online and before sysinit.target. A firewall unit after sysinit.target and before
# network-pre.target closes a cycle with it (networkd starts after network-pre.target); systemd then drops a job to
# break it, which on Scaleway left the boot hanging, and here at least says so in the journal.
# Afterwards the host is as down expects it: the homeserver and the forge answering again under linger.
- name: Reboot the host with Scaleway's ordering, and always take that ordering back
  block:
    - name: Make the drop-in directory of cloud-init's network stage
      ansible.builtin.file:
        path: /etc/systemd/system/cloud-init-network.service.d
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Order cloud-init's network stage after networkd and before sysinit.target, as Scaleway's image does
      ansible.builtin.copy:
        dest: /etc/systemd/system/cloud-init-network.service.d/before-sysinit.conf
        content: |
          [Unit]
          After=systemd-networkd-wait-online.service
          Before=sysinit.target
        owner: root
        group: root
        mode: "0644"

    - name: Read the changed ordering before the reboot
      ansible.builtin.systemd_service:
        daemon_reload: true

    - name: Reboot the host and wait for its ssh
      ansible.builtin.reboot:
        reboot_timeout: 600
        msg: Molecule reboots the host to see it come back

    - name: Read the firewall's state after the reboot
      ansible.builtin.command:
        cmd: "{{ item }}"
      loop:
        - systemctl is-active porelo-host-firewall.service
        - nft list table inet porelo_host
        - journalctl --boot _PID=1 --grep 'ordering cycle' --no-pager --quiet
      register: verify_reboot_state
      changed_when: false
      # systemd's own lines alone, not this command's in the journal; its grep ends with 1 when nothing matches.
      failed_when: verify_reboot_state.rc not in [0, 1]

    - name: Assert the reboot brought the firewall back
      ansible.builtin.assert:
        that:
          - verify_reboot_state.results[0].stdout_lines == ['active']
          - verify_reboot_state.results[1].stdout is search('tcp dport 22 accept')
          - verify_reboot_state.results[2].stdout == ''
        fail_msg: >-
          after the reboot: {{ verify_reboot_state.results[0].stdout_lines }};
          table: {{ verify_reboot_state.results[1].stdout }};
          cycles: {{ verify_reboot_state.results[2].stdout }}
  always:
    - name: Take the image's ordering back, so down runs as on the test image
      ansible.builtin.file:
        path: /etc/systemd/system/cloud-init-network.service.d
        state: absent

    - name: Read the ordering without it
      ansible.builtin.systemd_service:
        daemon_reload: true

- name: Wait until the Matrix homeserver answers again on the VPN address after the reboot
  ansible.builtin.command:  # noqa: command-instead-of-module
    cmd: >-
      curl -fsS --max-time 10 --noproxy '*' --cacert /etc/porelo-host/forge/ca.pem
      --resolve matrix.alpha.porelo.internal:8448:10.73.7.1 -o /dev/null -w '%{http_code}'
      https://matrix.alpha.porelo.internal:8448/_matrix/client/versions
  register: verify_reboot_homeserver
  until: verify_reboot_homeserver.rc == 0 and verify_reboot_homeserver.stdout == '200'
  retries: 30
  delay: 2
  changed_when: false
  failed_when: false

- name: Read whether the homeserver's user unit is active under porelo-matrix after the reboot
  ansible.builtin.shell:
    cmd: XDG_RUNTIME_DIR=/run/user/$(id -u) systemctl --user is-active porelo-matrix-homeserver.service
  become: true
  become_user: porelo-matrix
  register: verify_reboot_homeserver_unit
  changed_when: false
  failed_when: false

- name: Assert the Matrix homeserver survived the reboot under linger and answers 200
  ansible.builtin.assert:
    that:
      - verify_reboot_homeserver_unit.stdout == 'active'
      - verify_reboot_homeserver.rc == 0
      - verify_reboot_homeserver.stdout == '200'
    fail_msg: >-
      after the reboot, porelo-matrix-homeserver.service is '{{ verify_reboot_homeserver_unit.stdout }}'
      ({{ verify_reboot_homeserver_unit.stderr }}) and curl gave rc {{ verify_reboot_homeserver.rc }}:
      {{ verify_reboot_homeserver.stdout }} {{ verify_reboot_homeserver.stderr }}

- name: Wait until the forge answers again on the VPN address after the reboot
  ansible.builtin.command:  # noqa: command-instead-of-module
    cmd: >-
      curl -fsS --max-time 10 --noproxy '*' --cacert /etc/porelo-host/forge/ca.pem
      --resolve forge.alpha.porelo.internal:3000:10.73.7.1 -o /dev/null -w '%{http_code}'
      https://forge.alpha.porelo.internal:3000/api/v1/version
  register: verify_reboot_forge
  until: verify_reboot_forge.rc == 0 and verify_reboot_forge.stdout == '200'
  retries: 30
  delay: 2
  changed_when: false
  failed_when: false
  when: verify_forge == 'on'

- name: Assert the forge survived the reboot under linger and answers 200
  ansible.builtin.assert:
    that:
      - verify_reboot_forge.rc == 0
      - verify_reboot_forge.stdout == '200'
    fail_msg: >-
      after the reboot, forge curl gave rc {{ verify_reboot_forge.rc }}:
      {{ verify_reboot_forge.stdout }} {{ verify_reboot_forge.stderr }}
  when: verify_forge == 'on'
