---
# The person signs in with their lasting password, kept in their secrets file and set by the root script; no password
# of theirs and no CA key lies on the host, so a stolen host gives neither away.
- name: Read whether a password file or a CA key of the person's is on the host
  ansible.builtin.stat:
    path: "{{ item }}"
    get_checksum: false
    get_mime: false
  loop: [/etc/porelo-host/forge/person.password, /etc/porelo-host/forge/ca.key]
  register: verify_person_files

- name: Assert neither a password file nor a CA key is on the host
  ansible.builtin.assert:
    that: verify_person_files.results | selectattr('stat.exists') | list | length == 0
    fail_msg: >-
      found {{ verify_person_files.results | selectattr('stat.exists') | map(attribute='item') | list }} on the host

- name: Ask Forgejo which users it has for the person's sign-in
  ansible.builtin.shell:
    cmd: >-
      cd / && runuser -u porelo-forge -- env XDG_RUNTIME_DIR="/run/user/$(id -u porelo-forge)"
      podman exec forgejo forgejo admin user list
    executable: /bin/bash
  register: verify_person_users
  changed_when: false
  no_log: true

- name: Assert the person's forge account exists
  ansible.builtin.assert:
    that: "'operator' in (verify_person_users.stdout_lines[1:] | map('split') | map(attribute=1) | list)"
    fail_msg: asked for operator in Forgejo's user list, got no such user

- name: Read the person's membership in the organization's Owners team
  ansible.builtin.shell:
    cmd: |
      set -euo pipefail
      api() { curl -sS --max-time 10 --cacert /etc/porelo-host/forge/ca.pem \
          -H @<(sed 's/^/Authorization: token /' /home/porelo-forge/.config/porelo-forge/api.token) "$@"; }
      base=https://10.73.0.1:3000/api/v1
      answer=$(mktemp) && trap 'rm -f "$answer"' EXIT
      code=$(api -o "$answer" -w '%{http_code}' "$base/orgs/porelo/teams/search?q=Owners")
      [ "$code" = 200 ] || { echo "asked for Owners with HTTP 200, got HTTP $code" >&2; exit 1; }
      team=$(python3 -I -c 'import json,sys; print(next((int(t["id"]) \
          for t in json.load(open(sys.argv[1]))["data"] if t["name"] == "Owners"), ""))' "$answer")
      [ -n "$team" ] || { echo "asked for porelo's Owners team, got no team" >&2; exit 1; }
      code=$(api -o /dev/null -w '%{http_code}' "$base/teams/$team/members/operator")
      [ "$code" = 200 ] || { echo "asked for operator in Owners with HTTP 200, got HTTP $code" >&2; exit 1; }
      echo member
    executable: /bin/bash
  register: verify_person_owner
  changed_when: false
  failed_when: false
  no_log: true

- name: Assert the person owns the organization
  ansible.builtin.assert:
    that: verify_person_owner.rc == 0 and verify_person_owner.stdout == 'member'
    fail_msg: "asked for operator in Owners, got rc {{ verify_person_owner.rc }}: {{ verify_person_owner.stderr }}"

- name: Sign in with the lasting password on standard input, and reach the dashboard with no change asked
  ansible.builtin.shell:
    cmd: |
      set -euo pipefail
      umask 077
      work=$(mktemp -d)
      trap 'rm -rf "$work"' EXIT
      request() { curl -sS --max-time 10 --noproxy '*' --cacert /etc/porelo-host/forge/ca.pem \
          --resolve forge.porelo.internal:443:127.0.0.1 --cookie "$work/cookies" --cookie-jar "$work/cookies" \
          -o "$work/page" -w '%{http_code}' "$@"; }
      base=https://forge.porelo.internal
      # Forgejo 17's sign-in form carries no CSRF token (measured).
      code=$(tr -d '\r\n' < /root/secrets/forge-person-password \
          | request "$base/user/login" --data-urlencode user_name=operator --data-urlencode password@-)
      [ "$code" = 303 ] || { echo "asked for a redirect after sign-in, got HTTP $code" >&2; exit 1; }
      # A user who must change the password is sent on from / instead (measured), so 200 says no change is asked.
      code=$(request "$base/")
      [ "$code" = 200 ] || { echo "asked for the dashboard with HTTP 200, got HTTP $code" >&2; exit 1; }
      echo 'signed in'
    executable: /bin/bash
  register: verify_person_login
  changed_when: false
  failed_when: false
  no_log: true

- name: Assert the lasting password signs in with no change asked
  ansible.builtin.assert:
    that: verify_person_login.rc == 0 and verify_person_login.stdout == 'signed in'
    fail_msg: >-
      asked for operator's lasting password to sign in, got rc {{ verify_person_login.rc }}:
      {{ verify_person_login.stderr }}
