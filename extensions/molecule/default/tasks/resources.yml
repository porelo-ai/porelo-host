---
# Without bounds, a forge or job can exhaust the host; checking files alone would miss ignored runtime options.
- name: Read the quadlets written for the forge and the runner
  ansible.builtin.slurp:
    src: "/home/{{ item.account }}/.config/containers/systemd/{{ item.container }}.container"
  loop: "{{ verify_container_bounds }}"
  loop_control:
    label: "{{ item.container }}"
  register: verify_quadlets
  when: verify_forge == 'on'

- name: Assert each quadlet sets its process, memory and CPU bounds
  ansible.builtin.assert:
    that:
      - "('PidsLimit=' ~ item.item.pids) in verify_quadlet_lines"
      - "('Memory=' ~ item.item.memory) in verify_quadlet_lines"
      - "('PodmanArgs=--cpus=' ~ item.item.cpus) in verify_quadlet_lines"
    fail_msg: >-
      asked {{ item.item.container }} for PidsLimit={{ item.item.pids }}, Memory={{ item.item.memory }}
      and --cpus={{ item.item.cpus }}; got {{ verify_quadlet_lines }}
  vars:
    verify_quadlet_lines: "{{ (item.content | b64decode).splitlines() }}"
  loop: "{{ verify_quadlets.results }}"
  loop_control:
    label: "{{ item.item.container }}"
  when: verify_forge == 'on'

# The shell finds the runtime directory as the container's account, without replacing Porelo's getent facts.
- name: Inspect the running forge and runner as their accounts
  ansible.builtin.shell:
    cmd: >-
      XDG_RUNTIME_DIR=/run/user/$(id -u) podman inspect --format
      {% raw %}'{"running":{{.State.Running}},"resources":{{json .HostConfig}}}'{% endraw %}
      {{ item.container | quote }}
  become: true
  become_user: "{{ item.account }}"
  loop: "{{ verify_container_bounds }}"
  loop_control:
    label: "{{ item.container }}"
  register: verify_container_inspect
  changed_when: false
  when: verify_forge == 'on'

- name: Assert the running containers enforce every quadlet bound
  ansible.builtin.assert:
    that:
      - verify_container.running
      - verify_container.resources.PidsLimit == item.item.pids
      - verify_container.resources.Memory == item.item.bytes
      - verify_container.resources.CpuPeriod > 0
      - verify_container.resources.CpuQuota == item.item.cpus * verify_container.resources.CpuPeriod
    fail_msg: >-
      asked running {{ item.item.container }} for {{ item.item.pids }} processes,
      {{ item.item.bytes }} bytes and {{ item.item.cpus }} CPUs; got {{ verify_container }}
  vars:
    verify_container: "{{ item.stdout | from_json }}"
  loop: "{{ verify_container_inspect.results }}"
  loop_control:
    label: "{{ item.item.container }}"
  when: verify_forge == 'on'

- name: Read the runner's written job configuration
  ansible.builtin.slurp:
    src: /home/porelo-runner/runner/config.yml
  register: verify_runner_config
  when: verify_forge == 'on'

- name: Assert jobs get the four resource options and the JDK exactly once
  ansible.builtin.assert:
    that:
      - verify_job_options | select('match', '^--(cpus=|memory=|pids-limit=|env=OMP_NUM_THREADS=)') | sort
        == ['--cpus=1', '--env=OMP_NUM_THREADS=1', '--memory=768m', '--pids-limit=2048']
      - (verify_runner_config.content | b64decode | from_yaml).runner.capacity == 1
      - verify_job_options | select('search', 'tls/|SSL_CERT_FILE|CURL_CA_BUNDLE|JAVA_TOOL_OPTIONS') | list == []
      - verify_job_configuration.network == 'container:forgejo-runner-proxy'
      - verify_job_options | select('match', '^--add-host') | list == []
      - "'--volume=/opt/porelo-host/runner-job-hosts:/etc/hosts:ro' in verify_job_options"
      - "'--hostname=localhost' in verify_job_options"
      - verify_job_options | select('match', '^--volume=/opt/porelo-host/jdk-') | list
        == ['--volume=' ~ verify_job_jdk_dir ~ ':/opt/porelo-jdk-25:ro']
      - verify_job_options | select('match', '^--env=JAVA_HOME_25_X64=') | list
        == ['--env=JAVA_HOME_25_X64=/opt/porelo-jdk-25']
      - verify_job_configuration.options.count('--env=JAVA_HOME_25_X64=') == 1
      - verify_job_configuration.valid_volumes | select('equalto', verify_job_jdk_dir) | list
        == [verify_job_jdk_dir]
      - "'/opt/porelo-host/runner-job-hosts' in verify_job_configuration.valid_volumes"
    fail_msg: >-
      asked for capacity 1, --cpus=1 --memory=768m --pids-limit=2048 --env=OMP_NUM_THREADS=1 (the test VM's job bounds)
      and the proxy's network with the forge name mapped to loopback in root's read-only name table, host name
      localhost, no forge trust overrides, and one read-only JDK mount allowed in valid_volumes at /opt/porelo-jdk-25
      with JAVA_HOME_25_X64 set to that path;
      got {{ verify_job_configuration }}
  vars:
    verify_job_configuration: "{{ (verify_runner_config.content | b64decode | from_yaml).container }}"
    verify_job_options: "{{ verify_job_configuration.options.split() }}"
    verify_job_jdk_dir: "/opt/porelo-host/jdk-{{ verify_job_jdk.version }}"
    verify_job_jdk: "{{ (lookup('ansible.builtin.file', playbook_dir
      ~ '/../../../roles/forge/vars/main.yml') | from_yaml).__forge_runner_jdk }}"
  when: verify_forge == 'on'

- name: Read the runner's unit
  ansible.builtin.slurp:
    src: /home/porelo-runner/.config/containers/systemd/forgejo-runner.container
  register: verify_runner_unit
  when: verify_forge == 'on'

# Loopback belongs to the proxy's namespace, shared by the runner and every job.
- name: Assert jobs reach the runner and cache through the proxy namespace without published ports
  ansible.builtin.assert:
    that:
      - verify_runner_cache.enabled
      - verify_runner_cache.dir == '/data/cache'
      - verify_runner_cache.host == '127.0.0.1'
      - verify_runner_cache.port == 4000
      - verify_runner_cache.proxy_port == 4001
      - verify_runner_published == []
      - "'Network=container:forgejo-runner-proxy' in (verify_runner_unit.content | b64decode).splitlines()"
    fail_msg: >-
      asked for the cache enabled in /data/cache on loopback, port 4000 and proxy port 4001, in the proxy namespace
      with no published ports; got {{ verify_runner_cache }} and {{ verify_runner_unit.content | b64decode }}
  vars:
    verify_runner_cache: "{{ (verify_runner_config.content | b64decode | from_yaml).cache | default({}) }}"
    verify_runner_published: >-
      {{ verify_runner_unit.content | b64decode | regex_findall('(?m)^PublishPort=.*$') | sort }}
  when: verify_forge == 'on'

# A separate account lets the test restart its manager without stopping the running forge or Porelo's tasks.
- name: Read whether the controller probe's account already exists
  ansible.builtin.command:
    argv: [id, -u, porelo-controller-probe]
  register: verify_controller_account_before
  changed_when: false
  failed_when: verify_controller_account_before.rc not in [0, 1]

- name: Refuse to replace an existing controller probe account
  ansible.builtin.assert:
    that: verify_controller_account_before.rc == 1
    fail_msg: asked for no porelo-controller-probe account before the test, but one already exists

- name: Refuse a missing delegated controller and restore the account's manager
  block:
    - name: Make the controller probe's account
      ansible.builtin.user:
        name: porelo-controller-probe
        create_home: true
        shell: /usr/sbin/nologin
      register: verify_controller_account

    - name: Start the probe account's manager with the normal delegation
      ansible.builtin.systemd_service:
        name: "user@{{ verify_controller_account.uid }}.service"
        state: started

    - name: Check the probe account accepts the normal delegation
      ansible.builtin.include_role:
        name: porelo.host.base
        tasks_from: controllers
      vars:
        base_account: porelo-controller-probe

    - name: Read whether the probe manager already has drop-ins
      ansible.builtin.stat:
        path: "/etc/systemd/system/user@{{ verify_controller_account.uid }}.service.d"
      register: verify_controller_dropins_before

    - name: Refuse to replace existing drop-ins of the probe manager
      ansible.builtin.assert:
        that: not verify_controller_dropins_before.stat.exists
        fail_msg: >-
          asked for no user@{{ verify_controller_account.uid }}.service.d before the test, but it already exists

    - name: Make the probe manager's drop-in directory
      ansible.builtin.file:
        path: "/etc/systemd/system/user@{{ verify_controller_account.uid }}.service.d"
        state: directory
        owner: root
        group: root
        mode: "0755"
      register: verify_controller_dropin_directory

    - name: Leave pids out of the probe manager's delegation
      ansible.builtin.copy:
        dest: "/etc/systemd/system/user@{{ verify_controller_account.uid }}.service.d/verify-controllers.conf"
        content: "[Service]\nDelegate=\nDelegate=cpu memory\n"
        owner: root
        group: root
        mode: "0644"

    - name: Restart the probe manager with the restricted delegation
      ansible.builtin.systemd_service:
        name: "user@{{ verify_controller_account.uid }}.service"
        state: restarted
        daemon_reload: true

    - name: Start with no controller refusal observed
      ansible.builtin.set_fact:
        verify_controller_refused: false

    - name: Run only the controller check against the restricted account
      block:
        - name: Check the account whose manager has no pids controller
          ansible.builtin.include_role:
            name: porelo.host.base
            tasks_from: controllers
          vars:
            base_account: porelo-controller-probe
      rescue:
        - name: Assert the refusal names the account and its missing controller
          ansible.builtin.assert:
            that:
              - "'porelo-controller-probe' in ansible_failed_result.msg"
              - "'missing delegated controllers: pids' in ansible_failed_result.msg"
            fail_msg: >-
              asked for porelo-controller-probe refused for missing pids; got {{ ansible_failed_result }}

        - name: Keep the controller refusal observed
          ansible.builtin.set_fact:
            verify_controller_refused: true

    - name: Assert the controller check refused the account
      ansible.builtin.assert:
        that: verify_controller_refused
        fail_msg: asked the controller check to refuse porelo-controller-probe without pids, but it accepted it
  always:
    # A handler would not run after a failure; the probe's drop-in must go whatever happened.
    - name: Remove the probe manager's drop-in directory  # noqa: no-handler
      ansible.builtin.file:
        path: "/etc/systemd/system/user@{{ verify_controller_account.uid }}.service.d"
        state: absent
      when: verify_controller_dropin_directory.changed | default(false)

    - name: Stop the probe manager and reload its normal definition
      ansible.builtin.systemd_service:
        name: "user@{{ verify_controller_account.uid }}.service"
        state: stopped
        daemon_reload: true
      when: verify_controller_account.uid is defined

    - name: Remove the probe account and its home
      ansible.builtin.user:
        name: porelo-controller-probe
        state: absent
        remove: true
      when: verify_controller_account.uid is defined

# The runner's jobs and the pool share half the host; checked alone, as the role checks before writing the runner's
# configuration, with no pool on this host's inventory for the entry point.
- name: Read the test host's processors for the runner's capacity
  ansible.builtin.slurp:
    src: /proc/cpuinfo
  register: verify_cpuinfo

- name: Keep the measured processors and start with no capacity refusal observed
  ansible.builtin.set_fact:
    verify_host_cpus: "{{ verify_cpuinfo.content | b64decode | regex_findall('(?m)^processor\\s*:') | length }}"
    verify_capacity_refused: false

- name: Check a capacity just within half of the host's processors
  ansible.builtin.include_role:
    name: porelo.host.forge
    tasks_from: capacity
  vars:
    forge_runner_capacity: "{{ (verify_host_cpus | int) // 2 }}"
    forge_job_cpus: 1
    forge_job_memory: 1m

- name: Run only the capacity check against jobs taking every processor
  block:
    - name: Check a capacity of one job per processor
      ansible.builtin.include_role:
        name: porelo.host.forge
        tasks_from: capacity
      vars:
        forge_runner_capacity: "{{ verify_host_cpus | int }}"
        forge_job_cpus: 1
        forge_job_memory: 1m
  rescue:
    - name: Assert the refusal names the jobs and the host's half
      ansible.builtin.assert:
        that:
          - "('asked for ' ~ verify_host_cpus ~ ' jobs of 1 CPUs') in ansible_failed_result.msg"
          - "(((verify_host_cpus | int) // 2) ~ ' of ' ~ verify_host_cpus ~ ' processors') in ansible_failed_result.msg"
        fail_msg: >-
          asked for {{ verify_host_cpus }} one-CPU jobs refused against half of {{ verify_host_cpus }} processors;
          got {{ ansible_failed_result }}

    - name: Keep the capacity refusal observed
      ansible.builtin.set_fact:
        verify_capacity_refused: true

- name: Assert the capacity check refused jobs taking every processor
  ansible.builtin.assert:
    that: verify_capacity_refused
    fail_msg: asked the capacity check to refuse jobs taking every processor, but it accepted them

- name: Read the test host's memory for the runner's capacity
  ansible.builtin.slurp:
    src: /proc/meminfo
  register: verify_capacity_meminfo

- name: Keep the measured memory and start with no memory refusal observed
  ansible.builtin.set_fact:
    verify_capacity_kib: >-
      {{ (verify_capacity_meminfo.content | b64decode | regex_findall('(?m)^MemTotal:\s+([0-9]+) kB$') | first) | int }}
    verify_capacity_memory_refused: []

# One job of the host's whole memory, and a pool of half the host beside one small job: each alone over the half.
- name: Run only the capacity check against jobs and a pool taking more than half the memory
  ansible.builtin.include_tasks: capacity_refused.yml
  loop:
    - {label: one job of all the memory, memory: "{{ verify_capacity_kib }}k", pool: {}}
    - label: a pool of half the memory beside one job
      memory: 1m
      pool: {systems: [ubuntu], accounts: 1}
      pool_mib: "{{ verify_capacity_kib // 2048 }}"
  loop_control:
    loop_var: verify_capacity_case
    label: "{{ verify_capacity_case.label }}"

- name: Assert the capacity check refused both, naming the memory
  ansible.builtin.assert:
    that: verify_capacity_memory_refused == ['one job of all the memory', 'a pool of half the memory beside one job']
    fail_msg: >-
      asked the capacity check to refuse a job of all the memory and a pool of half of it beside a job, each naming
      the host's KiB; refused only {{ verify_capacity_memory_refused }}

# No libvirt call is needed to prove an oversized pool would be refused before making VMs.
- name: Read the test host's memory for an oversized pool
  ansible.builtin.slurp:
    src: /proc/meminfo
  register: verify_meminfo

- name: Keep the measured host memory and start with no pool refusal observed
  ansible.builtin.set_fact:
    verify_host_memory_kib: >-
      {{ (verify_meminfo.content | b64decode | regex_findall('(?m)^MemTotal:\s+([0-9]+) kB$') | first) | int }}
    verify_pool_refused: false

- name: Check a pool just within half of the host's memory
  ansible.builtin.include_role:
    name: porelo.host.vm_pool
    tasks_from: memory
  vars:
    vm_pool_systems: [ubuntu]
    vm_pool_accounts: 1
    vm_pool_memory: "{{ verify_host_memory_kib // 2048 }}"

- name: Run only the memory check against a pool larger than the host
  vars:
    verify_pool_memory_mib: "{{ verify_host_memory_kib // 1024 + 1 }}"
  block:
    - name: Check a pool whose one VM exceeds the host's memory
      ansible.builtin.include_role:
        name: porelo.host.vm_pool
        tasks_from: memory
      vars:
        vm_pool_systems: [ubuntu]
        vm_pool_accounts: 1
        vm_pool_memory: "{{ verify_pool_memory_mib }}"
  rescue:
    - name: Assert the refusal names the pool memory and host memory
      ansible.builtin.assert:
        that:
          - "('pool memory ' ~ (verify_pool_memory_mib * 1024) ~ ' KiB') in ansible_failed_result.msg"
          - "('host memory ' ~ verify_host_memory_kib ~ ' KiB') in ansible_failed_result.msg"
        fail_msg: >-
          asked for pool memory {{ verify_pool_memory_mib * 1024 }} KiB refused against
          host memory {{ verify_host_memory_kib }} KiB; got {{ ansible_failed_result }}

    - name: Keep the oversized pool refusal observed
      ansible.builtin.set_fact:
        verify_pool_refused: true

- name: Assert the memory check refused the oversized pool
  ansible.builtin.assert:
    that: verify_pool_refused
    fail_msg: asked the memory check to refuse a pool larger than the host, but it accepted it
