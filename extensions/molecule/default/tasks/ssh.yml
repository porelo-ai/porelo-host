---
- name: ssh | Read all TCP listeners
  ansible.builtin.command:
    argv: [ss, -Hltn]
  register: verify_ssh_listeners
  changed_when: false

- name: ssh | Refuse TCP service ports for people
  ansible.builtin.assert:
    that:
      - verify_ssh_listeners.stdout_lines | select('search', ':(2222|3000|443|8448|8080)\\s') | list | length == 0
    fail_msg: "Unexpected TCP service listeners: {{ verify_ssh_listeners.stdout_lines }}"

- name: ssh | Check a person's socket forward using an isolated account and Unix socket
  ansible.builtin.script:
    cmd: "{{ playbook_dir }}/files/verify-ssh.py"
    executable: /usr/bin/python3
  changed_when: false
