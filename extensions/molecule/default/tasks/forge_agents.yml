---
# A readable credential or a team with wider access would let another account write the project's code.
- name: Read the agent's token directory and file permissions
  ansible.builtin.stat:
    path: "{{ item.path }}"
    get_checksum: false
    get_mime: false
  loop:
    - {path: /etc/porelo-host/forge/agents, mode: "0700", directory: true}
    - {path: /etc/porelo-host/forge/agents/probe.token, mode: "0600", directory: false}
  register: verify_agent_files
  no_log: true

- name: Assert root alone owns and reads the agent's credential
  ansible.builtin.assert:
    that:
      - item.stat.exists
      - item.stat.uid | default(-1) == 0
      - item.stat.gid | default(-1) == 0
      - item.stat.mode | default('') == item.item.mode
      - not (item.stat.islnk | default(false))
      - item.stat.isdir | default(false) if item.item.directory else item.stat.isreg | default(false)
      - item.item.directory or item.stat.size | default(0) > 0
    fail_msg: "asked for root:root {{ item.item.mode }} at {{ item.item.path }}, got {{ item.stat }}"
  loop: "{{ verify_agent_files.results }}"
  loop_control:
    label: "{{ item.item.path }}"
  no_log: true

- name: Check the second up kept the agent's first token file
  ansible.builtin.command:
    cmd: sha256sum --check /root/porelo-host-agent-probe.sha256
  register: verify_agent_retained
  changed_when: false
  failed_when: false
  no_log: true

- name: Assert idempotence kept the agent's first token file
  ansible.builtin.assert:
    that: verify_agent_retained.rc == 0
    fail_msg: >-
      asked for the agent's token file digest to match before and after the second up,
      got rc {{ verify_agent_retained.rc }}: {{ verify_agent_retained.stdout }} {{ verify_agent_retained.stderr }}

- name: Read the agents team's permissions and probe's membership
  ansible.builtin.shell:
    cmd: |
      set -euo pipefail
      api() { curl -fsS --max-time 10 --cacert /etc/porelo-host/forge/ca.pem \
          -H @<(sed 's/^/Authorization: token /' /home/porelo-forge/.config/porelo-forge/api.token) "$@"; }
      base=https://10.73.0.1:3000/api/v1
      team=$(api "$base/orgs/porelo/teams/search?q=agents" | python3 -I -c 'import json,sys;
      print(json.dumps(next((t for t in json.load(sys.stdin)["data"] if t["name"] == "agents"), {})))')
      id=$(printf '%s' "$team" | python3 -I -c 'import json,sys; print(int(json.load(sys.stdin)["id"]))')
      member=$(api -o /dev/null -w '%{http_code}' "$base/teams/$id/members/agent-probe")
      printf '{"team": %s, "member_http": %s}\n' "$team" "$member"
    executable: /bin/bash
  register: verify_agent_team
  changed_when: false
  failed_when: false
  no_log: true

- name: Assert the agent belongs to the team that writes repositories and reads actions and packages
  ansible.builtin.assert:
    that:
      - verify_agent_team.rc == 0
      - verify_agent_access.member_http | default(0) == 200
      - verify_agent_access.team.includes_all_repositories | default(false)
      - not (verify_agent_access.team.can_create_org_repo | default(true))
      - verify_agent_access.team.units_map | default({}) == verify_agent_units
    fail_msg: >-
      asked for agent-probe in agents with all repositories, no repository creation and units {{ verify_agent_units }},
      got rc {{ verify_agent_team.rc }}: {{ verify_agent_team.stdout }} {{ verify_agent_team.stderr }}
  vars:
    verify_agent_access: "{{ verify_agent_team.stdout | default('{}', true) | from_json }}"
    verify_agent_units:
      repo.code: write
      repo.pulls: write
      repo.issues: write
      repo.actions: read
      repo.packages: read

# Both pushes use the same credential, so a transport failure cannot stand in for an authorization refusal.
- name: Push an agent branch to the organization and try the same push to central
  ansible.builtin.shell:
    cmd: |
      set -euo pipefail
      umask 077
      work=$(mktemp -d)
      trap 'rm -rf "$work"' EXIT
      trap 'exit 130' INT
      trap 'exit 143' TERM
      git_as_agent() {
          GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.extraHeader \
              GIT_CONFIG_VALUE_0="Authorization: Basic $(
                  { printf 'agent-probe:'; tr -d '\r\n' < /etc/porelo-host/forge/agents/probe.token; } | base64 -w0)" \
              git "$@"
      }
      git_as_agent clone --branch main --single-branch \
          https://10.73.0.1:3000/porelo/stand-in.git "$work/repo" > "$work/clone.out" 2>&1
      push_rc=0
      git_as_agent -C "$work/repo" push origin main:refs/heads/agent-probe-push \
          > "$work/push.out" 2>&1 || push_rc=$?
      head=$(git -C "$work/repo" rev-parse HEAD)
      branch=$(git_as_agent -C "$work/repo" ls-remote --exit-code origin refs/heads/agent-probe-push | cut -f1)
      central_rc=0
      git_as_agent -C "$work/repo" push https://10.73.0.1:3000/central/stand-in.git \
          main:refs/heads/agent-probe-push > "$work/central.out" 2>&1 || central_rc=$?
      refused=false
      if grep -Eqi '403|permission denied|not authorized|not allowed|write access.*not granted' "$work/central.out"
      then
          refused=true
      fi
      central=$(curl -sS --max-time 10 --cacert /etc/porelo-host/forge/ca.pem -o /dev/null -w '%{http_code}' \
          -H @<(sed 's/^/Authorization: token /' /root/forge-central.token) \
          https://10.73.0.1:3000/api/v1/repos/central/stand-in/branches/agent-probe-push)
      same=false
      [ "$head" != "$branch" ] || same=true
      printf '{"push_rc": %s, "branch_matches": %s, "central_push_rc": %s, "refused": %s, "central_http": %s}\n' \
          "$push_rc" "$same" "$central_rc" "$refused" "$central"
    executable: /bin/bash
  become: true
  become_user: root
  environment:
    GIT_CONFIG_GLOBAL: /dev/null
    GIT_SSL_CAINFO: /etc/porelo-host/forge/ca.pem
    GIT_TERMINAL_PROMPT: "0"
    LC_ALL: C
  register: verify_agent_push
  changed_when: true
  failed_when: false
  no_log: true

- name: Assert the agent's branch reached the organization and central refused it
  ansible.builtin.assert:
    that:
      - verify_agent_push.rc == 0
      - verify_agent_pushed.push_rc | default(-1) == 0
      - verify_agent_pushed.branch_matches | default(false)
      - verify_agent_pushed.central_push_rc | default(0) != 0
      - verify_agent_pushed.refused | default(false)
      - verify_agent_pushed.central_http | default(0) == 404
    fail_msg: >-
      asked for agent-probe-push on porelo/stand-in and an authorization refusal with no branch on central/stand-in,
      got rc {{ verify_agent_push.rc }}: {{ verify_agent_push.stdout }} {{ verify_agent_push.stderr }}
  vars:
    verify_agent_pushed: "{{ verify_agent_push.stdout | default('{}', true) | from_json }}"
