---
# Digest comparison keeps the gate's raw token out of Ansible while detecting leaked candidates and testing the matcher.
- name: Search the verbose up, journal and actual task containers for the gate token read only from the vault pipe
  ansible.builtin.shell:
    cmd: |
      set -euo pipefail
      cd /
      uid=$(id -u {{ verify_account }})
      printf 'protocol=https\nhost=forge.porelo.internal\n\n' \
          | runuser -u {{ verify_account }} -- env XDG_RUNTIME_DIR=/run/user/$uid \
              porelo vault credential --entry git.token.forge.porelo.internal get \
          | python3 -I -c '
      import hashlib, json, re, subprocess, sys
      from pathlib import Path
      fields = dict(line.rstrip("\n").split("=", 1) for line in sys.stdin if "=" in line)
      token = fields.get("password", "").encode()
      if not re.fullmatch(rb"[0-9a-f]{40}", token):
          sys.exit("asked for a 40-digit vault token on the pipe, got another form")
      digest = hashlib.sha256(token).digest()
      if not re.fullmatch("[0-9a-f]{64}", sys.argv[3]):
          sys.exit("asked for the first token digest, got another form")
      prior_digest = bytes.fromhex(sys.argv[3])
      def leaked(data):
          return any(hashlib.sha256(candidate).digest() in (digest, prior_digest)
                     for candidate in re.findall(rb"(?=([0-9a-f]{40}))", data))
      if not leaked(b"planted=" + token + b"\n") or not leaked(b"a" + token + b"b") or leaked(b"clean input"):
          sys.exit("asked to refuse plain and embedded planted tokens and accept clean input, got another result")
      verbose = Path("/root/porelo-host-vvv.out").read_bytes()
      if not verbose:
          sys.exit("asked for nonempty up -vvv output, got an empty file")
      def run(argv):
          result = subprocess.run(argv, stdout=subprocess.PIPE, stderr=subprocess.PIPE, timeout=60)
          if result.returncode:
              said = re.sub(rb"[0-9a-f]{40}", b"<hex>", result.stderr)[-300:].decode(errors="replace")
              sys.exit("asked for a complete leak-search input from " + " ".join(argv[6:11] or argv[:3])
                       + ", got process exit " + str(result.returncode) + ": " + said)
          return result.stdout
      journal = run(["journalctl", "-o", "cat", "--no-pager"])
      if not journal:
          sys.exit("asked for a nonempty journal search input, got none")
      as_account = ["runuser", "-u", sys.argv[1], "--", "env", "XDG_RUNTIME_DIR=/run/user/" + sys.argv[2]]
      # Only Porelo task containers carry the repository label; a transport server need hold no shell.
      containers = run(as_account + ["podman", "ps", "-q", "--filter", "label=org.fuin.porelo.repository"]
                       ).decode().splitlines()
      if not containers:
          sys.exit("asked to search the running task containers, got none")
      task_data = run(as_account + ["podman", "inspect"] + containers)
      scan = """env
      find /porelo -type f -exec sh -c '\''
          for file do
              rc=0
              grep -ahE "[0-9a-f]{40}" "$file" || rc=$?
              [ "$rc" -le 1 ] || exit "$rc"
          done'\'' sh {} +
      """
      for container in containers:
          # As the container root, which is the account itself outside, so no file the task holds is skipped.
          task_data += run(as_account + ["podman", "exec", "--user", "0", container, "sh", "-ec", scan])
      measurements = {"planted_refused": True, "verbose_clean": not leaked(verbose),
                      "journal_clean": not leaked(journal), "tasks_clean": not leaked(task_data),
                      "containers": len(containers), "token_regenerated": digest != prior_digest}
      print(json.dumps(measurements))' {{ verify_account | quote }} "$uid" {{ verify_gate_prior_digest.stdout | quote }}
    executable: /bin/bash
  register: verify_gate_secrets
  changed_when: false
  failed_when: false
  no_log: true

- name: Assert the regenerated gate token reached no verbose output, journal line or task container
  ansible.builtin.assert:
    that:
      - verify_gate_secrets.rc == 0
      - verify_gate_leaks.planted_refused | default(false)
      - verify_gate_leaks.token_regenerated | default(false)
      - verify_gate_leaks.verbose_clean | default(false)
      - verify_gate_leaks.journal_clean | default(false)
      - verify_gate_leaks.tasks_clean | default(false)
      - verify_gate_leaks.containers | default(0) > 0
    fail_msg: >-
      asked for a new token, a planted-token refusal and clean verbose, journal and task-container searches
      covering the first token and its replacement;
      got exit {{ verify_gate_secrets.rc }}: {{ verify_gate_secrets.stdout }} {{ verify_gate_secrets.stderr }}
  vars:
    verify_gate_leaks: "{{ verify_gate_secrets.stdout | default('{}', true) | from_json }}"
