---
# The secrets the stop's standard input gave: the VPN's key lies only in its file of root's,
# and the central token left the host once the forge migrated.
- name: Read the host's key file the stop wrote
  ansible.builtin.stat:
    path: /etc/wireguard/porelo-host.key
  register: verify_stdin_key

- name: Read the run's own copy of the host's key, the one the stop was given
  ansible.builtin.stat:
    path: /root/vpn-host.key
  register: verify_stdin_given

- name: Assert the stop wrote the given key, root's alone with mode 0600
  ansible.builtin.assert:
    that:
      - verify_stdin_key.stat.exists and verify_stdin_key.stat.isreg
      - verify_stdin_key.stat.uid == 0 and verify_stdin_key.stat.mode == '0600'
      - verify_stdin_key.stat.checksum == verify_stdin_given.stat.checksum
    fail_msg: >-
      asked for /etc/wireguard/porelo-host.key root's, 0600, with the given key's checksum; got
      exists {{ verify_stdin_key.stat.exists }}, uid {{ verify_stdin_key.stat.uid | default('-') }},
      mode {{ verify_stdin_key.stat.mode | default('-') }}, same {{ verify_stdin_key.stat.checksum | default('')
      == verify_stdin_given.stat.checksum }}

# The room's registration token is the account's own: its file and directory the account's alone, holding the token.
- name: Read the room's registration token and its directory in the account's home
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - /home/{{ verify_account }}/.config/porelo/matrix
    - /home/{{ verify_account }}/.config/porelo/matrix/host-registration-token
    - /root/secrets/matrix-token
  register: verify_stdin_matrix
  no_log: true

- name: Read the token's content, compared without showing it
  ansible.builtin.shell:
    cmd: |
      set -euo pipefail
      cmp -s <(tr -d '\n' < /root/secrets/matrix-token) \
          /home/{{ verify_account }}/.config/porelo/matrix/host-registration-token
    executable: /bin/bash
  register: verify_stdin_matrix_same
  changed_when: false
  failed_when: false
  no_log: true

- name: Assert the stop wrote the room's token as the account's own, 0600 in a 0700 directory
  ansible.builtin.assert:
    that:
      - verify_stdin_matrix.results[0].stat.isdir | default(false)
      - verify_stdin_matrix.results[0].stat.mode == '0700'
      - verify_stdin_matrix.results[0].stat.pw_name == verify_account
      - verify_stdin_matrix.results[1].stat.isreg | default(false)
      - verify_stdin_matrix.results[1].stat.mode == '0600'
      - verify_stdin_matrix.results[1].stat.pw_name == verify_account
      - verify_stdin_matrix.results[1].stat.size > 20
      - verify_stdin_matrix.results[2].stat.size > 20
      - verify_stdin_matrix_same.rc == 0
    fail_msg: >-
      asked for the token {{ verify_account }}'s, 0600 in a 0700 directory, equal to the one given; got directory
      mode {{ verify_stdin_matrix.results[0].stat.mode | default('-') }}, file mode
      {{ verify_stdin_matrix.results[1].stat.mode | default('-') }}, owner
      {{ verify_stdin_matrix.results[1].stat.pw_name | default('-') }}, same {{ verify_stdin_matrix_same.rc == 0 }}

- name: Read the host's names, for the room's
  ansible.builtin.slurp:
    src: /etc/hosts
  register: verify_stdin_hosts

- name: Assert the room's name resolves to the person's peer, in a marked block
  ansible.builtin.assert:
    that: >-
      (verify_stdin_hosts.content | b64decode) is search('(?m)^# BEGIN porelo-host room name\n10\.73\.0\.2
      matrix\.porelo\.internal\n# END porelo-host room name$')
    fail_msg: >-
      asked for 10.73.0.2 matrix.porelo.internal in its marked block, got {{ verify_stdin_hosts.content | b64decode }}

# The setup's directory holds the machine file and the bundle alone: no key, token or key folder came with them.
- name: Search the setup's directory for a key, a token or a key folder
  ansible.builtin.find:
    paths: /etc/porelo-host/setup
    recurse: true
    file_type: any
    hidden: true
    patterns: ["*.key", "*.token", "keys"]
  register: verify_stdin_setup

- name: Read what is left in the stop's directory on the tmpfs
  ansible.builtin.find:
    paths: /run/porelo-host
    file_type: any
    hidden: true
  register: verify_stdin_run

- name: Assert the setup's directory holds no secret and nothing given at the stop is left on the tmpfs
  ansible.builtin.assert:
    that:
      - verify_stdin_setup.files | length == 0
      - verify_stdin_run.files | length == 0
    fail_msg: >-
      in /etc/porelo-host/setup {{ verify_stdin_setup.files | map(attribute='path') | list }};
      in /run/porelo-host {{ verify_stdin_run.files | map(attribute='path') | list }}

# The key read at the interface's start, as at a boot, from its file alone.
- name: Restart the VPN, as a reboot starts it
  ansible.builtin.systemd_service:
    name: wg-quick@wg-porelo.service
    state: restarted
  changed_when: false

- name: Read the public key the interface runs with, and the run's own
  ansible.builtin.command:
    cmd: "{{ item }}"
  loop: ["wg show wg-porelo public-key", "cat /root/vpn-host.pub"]
  register: verify_stdin_public
  changed_when: false

- name: Assert the restarted interface runs with the given key
  ansible.builtin.assert:
    that: verify_stdin_public.results[0].stdout == verify_stdin_public.results[1].stdout
    fail_msg: >-
      after a restart wg-porelo runs with {{ verify_stdin_public.results[0].stdout }},
      the given key's public key is {{ verify_stdin_public.results[1].stdout }}

# Each value given at the stop, searched in the host's files, /root's with every up's output among them, and the whole
# journal; only the VPN's key may be found, in its own file. The vault is encrypted, so a key in plain text under /home
# is a leak, the forge's accounts and their volumes included; only images' layers are left out.
- name: Search the host's files, journal and up's output for every value given at the stop
  ansible.builtin.shell:
    cmd: |
      set -uo pipefail
      umask 077
      work=$(mktemp -d) && trap 'rm -rf "$work"' EXIT
      journalctl -o cat --no-pager > "$work/journal" || { echo "journalctl failed" >&2; exit 1; }
      # up's outputs must be there to be searched: a missing one would read as clean.
      for out in /root/porelo-host-first-up.lines /root/porelo-host-up.lines /root/timed-1-first-up.lines; do
          [ -s "$out" ] || { echo "up's output $out is missing" >&2; exit 1; }
      done
      search_files() {  # pattern, then the directories; prints each file holding it
          : > "$work/errors"
          # A network namespace's file under /run/netns is a mount grep cannot read, and holds no file content; the
          # search's own directory holds its patterns, and the run's stand-ins for the secrets file hold the values.
          find "$@" \( -path /run/netns -o -path "$work" -o -path /root/secrets -o -path /root/vpn-host.key \
              -o -path /root/desktop-ca \
              -o -path /root/forge-central.token -o -path /root/.ansible/tmp -o -name overlay \
              -o -name overlay-layers -o -name overlay-images \) -prune -o -type f -print0 2>> "$work/errors" \
              | xargs -0 -r grep -lF -D skip -f "$pattern" -- 2>> "$work/errors"
          # A file gone between find and grep held nothing that stays on the host; every other error stays.
          while IFS= read -r line; do
              case $line in
                  *': No such file or directory')
                      gone=${line#*: }; gone=${gone%: No such file or directory}; gone=${gone#\'}; gone=${gone%\'}
                      if [ ! -e "$gone" ] && [ ! -L "$gone" ]; then continue; fi ;;
              esac
              echo "unreadable: $line" | cut -c1-200 >&2; exit 1
          done < "$work/errors"
      }
      for secret in vpn-key:/root/vpn-host.key converge-key:/root/secrets/converge-key \
          central-token:/root/forge-central.token passphrase:/root/secrets/vault-passphrase \
          forge-password:/root/secrets/forge-person-password desktop-ca-key:/root/desktop-ca/ca.key \
          matrix-token:/root/secrets/matrix-token; do
          name=${secret%%:*}; file=${secret#*:}
          pattern="$work/pattern"
          if [ "$name" = desktop-ca-key ]; then
              # A PEM key spans lines; one of its body lines is found wherever the key is copied.
              sed -n 2p "$file" > "$pattern"
          else
              tr -d '\r\n' < "$file" > "$pattern" && echo >> "$pattern"
          fi
          [ "$(wc -c < "$pattern")" -gt 12 ] || { echo "$name: its file is too short to search for" >&2; exit 1; }
          hits=$(search_files /root /etc /home /srv /var/log /run /tmp | sort | tr '\n' ' ') || exit 1
          echo "$name files: ${hits:-none}"
          if grep -qF -f "$pattern" -- "$work/journal"; then echo "$name journal: found"; fi
      done
    executable: /bin/bash
  register: verify_stdin_search
  changed_when: false
  failed_when: false
  no_log: true

- name: Assert the VPN's key lies in its own file alone, and no other value given at the stop is left anywhere
  ansible.builtin.assert:
    that:
      - verify_stdin_search.rc == 0
      - verify_stdin_search.stdout_lines == verify_stdin_expected
    fail_msg: >-
      asked for the VPN's key in its own file alone and nothing else anywhere; the search gave rc
      {{ verify_stdin_search.rc }}: {{ verify_stdin_search.stdout_lines }} {{ verify_stdin_search.stderr }}
  vars:
    verify_stdin_expected:
      - 'vpn-key files: /etc/wireguard/porelo-host.key '
      - 'converge-key files: none'
      - 'central-token files: none'
      - 'passphrase files: none'
      - 'forge-password files: none'
      - 'desktop-ca-key files: none'
      - 'matrix-token files: /home/{{ verify_account }}/.config/porelo/matrix/host-registration-token '
