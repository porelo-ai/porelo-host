            ):
                probe_bundle = work / f"{tag}.bundle"
                commit_bundle(a1_repo, "access.yml", access_yaml(hblock_probe, devs_probe), key_for_probe, probe_bundle)
                subprocess.run(
                    ["/usr/bin/git", "-C", str(a1_repo), "reset", "-q", "--hard", c_a1_2],
                    env=git_env,
                    check=True,
                )
                stage_bundles("bo", "alpha-four", p1_bundle, probe_bundle)
                refusal_results[tag] = run_sync("bo", "alpha-four")

            record_after_refusals = a1_conf.read_text(encoding="utf-8")
            gus_or_fae_created = any(
                pathlib.Path(f"/etc/porelo-host/people/{who}.conf").exists() for who in ("gus", "fae")
            )
            stage_bundles("bo", "alpha-four", p1_bundle, a1_bundle)

            p3_repo = init_repo("p3")
            a3_repo = init_repo("a3")
            p3_bundle = work / "p3.bundle"
            a3_bundle = work / "a3.bundle"
            c_p3 = commit_bundle(p3_repo, "project.yml", project_yaml("alpha-three"), signer2_path, p3_bundle)
            c_a3_1 = commit_bundle(a3_repo, "access.yml", access_yaml(host_block, devs_step2), signer2_path, a3_bundle)
            stage_bundles("cy", "alpha-three", p3_bundle, a3_bundle)
            sync_three_add = run_sync("cy", "alpha-three")
            eli_rec_both = pathlib.Path("/etc/porelo-host/people/eli.conf").read_text(encoding="utf-8")

            c_a1_3 = commit_bundle(a1_repo, "access.yml", access_yaml(host_block, {}), signer1_path, a1_bundle)
            stage_bundles("bo", "alpha-four", p1_bundle, a1_bundle)
            sync_drop_from_one = run_sync("bo", "alpha-four")
            eli_rec_still_in_three = pathlib.Path("/etc/porelo-host/people/eli.conf").read_text(encoding="utf-8")
            eli_keys_still_in_three = pathlib.Path("/etc/ssh/authorized_keys/eli").is_file()
            peers_still_in_three = wg_peers()
            team1_after_drop = team_members("alpha-four")
            team3_still = team_members("alpha-three")

            c_a3_2 = commit_bundle(a3_repo, "access.yml", access_yaml(host_block, {}), signer2_path, a3_bundle)
            stage_bundles("cy", "alpha-three", p3_bundle, a3_bundle)
            sync_drop_from_three = run_sync("cy", "alpha-three")
            eli_rec_locked = pathlib.Path("/etc/porelo-host/people/eli.conf").read_text(encoding="utf-8")
            eli_keys_locked = pathlib.Path("/etc/ssh/authorized_keys/eli").exists()
            eli_peers_file_locked = pathlib.Path("/etc/wireguard/porelo-host-peers/eli.conf").exists()
            eli_matrix_locked = pathlib.Path("/home/eli/.config/porelo/matrix/host-registration-token").exists()
            peers_locked = wg_peers()
            team3_after_drop = team_members("alpha-three")
            _, eli_user = api("GET", "/users/eli")

            rm_three = subprocess.run(
                ["/usr/local/sbin/porelo-host-project", "remove", "alpha-three"],
                input="",
                capture_output=True,
                text=True,
            )
            rm_four = subprocess.run(
                ["/usr/local/sbin/porelo-host-project", "remove", "alpha-four"],
                input="",
                capture_output=True,
                text=True,
            )
            purge_eli = subprocess.run(
                ["/usr/local/sbin/porelo-host-person", "purge", "eli"],
                input="",
                capture_output=True,
                text=True,
            )
            for home_setup in ("/home/bo/.local", "/home/cy/.local"):
                shutil.rmtree(home_setup, ignore_errors=True)

            print(
                json.dumps(
                    {
                        "add_three": json.loads(add_three.stdout),
                        "commits": {
                            "p1": c_p1,
                            "a1_1": c_a1_1,
                            "a1_2": c_a1_2,
                            "a1_3": c_a1_3,
                            "p3": c_p3,
                            "a3_1": c_a3_1,
                            "a3_2": c_a3_2,
                        },
                        "wrong_caller": wrong_caller,
                        "bad_usage": bad_usage,
                        "missing_team": missing_team,
                        "eli_before_team": eli_before_team,
                        "sync_add": sync_add,
                        "eli_rec_1": eli_rec_1,
                        "cy_rec_1": cy_rec_1,
                        "eli_keys_1_count": len(eli_keys_1),
                        "dev1_in_peers_1": dev1_wg in peers_1,
                        "dev2_in_peers_1": dev2_wg in peers_1,
                        "team1_after_add": team1_after_add,
                        "eli_matrix_1": eli_matrix_1,
                        "sync_tmp_empty_1": sync_tmp_empty_1,
                        "sync_unchanged": sync_unchanged,
                        "sync_drop_laptop_and_cy": sync_drop_laptop_and_cy,
                        "eli_rec_2": eli_rec_2,
                        "cy_rec_2": cy_rec_2,
                        "eli_keys_2_count": len(eli_keys_2),
                        "cy_keys_2": cy_keys_2,
                        "dev1_in_peers_2": dev1_wg in peers_2,
                        "dev2_in_peers_2": dev2_wg in peers_2,
                        "cy_in_peers_2": cy_wg in peers_2,
                        "team1_after_step2": team1_after_step2,
                        "refusals": refusal_results,
                        "records_unchanged_on_refusals": record_before_refusals == record_after_refusals,
                        "gus_or_fae_created": gus_or_fae_created,
                        "sync_three_add": sync_three_add,
                        "eli_rec_both": eli_rec_both,
                        "sync_drop_from_one": sync_drop_from_one,
                        "eli_rec_still_in_three": eli_rec_still_in_three,
                        "eli_keys_still_in_three": eli_keys_still_in_three,
                        "dev2_in_peers_still": dev2_wg in peers_still_in_three,
                        "team1_after_drop": team1_after_drop,
                        "team3_still": team3_still,
                        "sync_drop_from_three": sync_drop_from_three,
                        "eli_rec_locked": eli_rec_locked,
                        "eli_keys_locked": eli_keys_locked,
                        "eli_peers_file_locked": eli_peers_file_locked,
                        "eli_matrix_locked": eli_matrix_locked,
                        "dev2_in_peers_locked": dev2_wg in peers_locked,
                        "team3_after_drop": team3_after_drop,
                        "eli_prohibited": bool(eli_user.get("prohibit_login")),
                        "rm_three": {"rc": rm_three.returncode, "out": json.loads(rm_three.stdout)},
                        "rm_four": {"rc": rm_four.returncode, "out": json.loads(rm_four.stdout)},
                        "purge_eli": {"rc": purge_eli.returncode, "out": json.loads(purge_eli.stdout)},
                    }
                )
            )
      register: verify_projects_sync
      changed_when: true
      no_log: true

    - name: Assert porelo-host-person sync enforces every verification, diff, laptop, membership and lock rule
      ansible.builtin.assert:
        that:
          - "'failed_at_line' not in verify_sync"
          - verify_sync.wrong_caller.rc == 65
          - verify_sync.bad_usage.rc == 64
          - verify_sync.missing_team.rc == 65
          - "'developers' in verify_sync.missing_team.err and 'run bring first' in verify_sync.missing_team.err"
          - not verify_sync.eli_before_team
          - verify_sync.sync_add.rc == 0
          - >-
            verify_sync.sync_add.out == {
            'project': 'alpha-four',
            'commit': verify_sync.commits.p1,
            'access_commit': verify_sync.commits.a1_1,
            'added': ['eli', 'cy'],
            'dropped': [],
            'laptops_added': ['eli/l1', 'eli/l2'],
            'laptops_dropped': [],
            'unchanged': false
            }
          - >-
            verify_sync.eli_rec_1 is match('^member=alpha-four developer\nlocked=false\nlaptop=l1 .*\nlaptop=l2 ')
          - >-
            verify_sync.cy_rec_1 is match(
            '^member=hand\nmember=alpha-one developer\nmember=alpha-three project-admin\nmember=alpha-four developer\n'
            'locked=false\n'
            )
          - verify_sync.eli_keys_1_count == 2
          - verify_sync.dev1_in_peers_1 and verify_sync.dev2_in_peers_1
          - verify_sync.team1_after_add == ['cy', 'eli']
          - verify_sync.eli_matrix_1 and verify_sync.sync_tmp_empty_1
          - verify_sync.sync_unchanged.rc == 0 and verify_sync.sync_unchanged.out.unchanged
          - verify_sync.sync_drop_laptop_and_cy.rc == 0
          - verify_sync.sync_drop_laptop_and_cy.out.dropped == ['cy']
          - verify_sync.sync_drop_laptop_and_cy.out.laptops_dropped == ['eli/l1']
          - >-
            verify_sync.eli_rec_2 is match('^member=alpha-four developer\nlocked=false\nlaptop=l2 ')
          - >-
            verify_sync.cy_rec_2 is match(
            '^member=hand\nmember=alpha-one developer\nmember=alpha-three project-admin\nlocked=false\n'
            )
          - verify_sync.eli_keys_2_count == 1 and verify_sync.cy_keys_2
          - not verify_sync.dev1_in_peers_2 and verify_sync.dev2_in_peers_2 and verify_sync.cy_in_peers_2
          - verify_sync.team1_after_step2 == ['eli']
          - verify_sync.refusals.unknown_signer.rc == 65
          - verify_sync.refusals.other_host.rc == 65
          - "'network' in verify_sync.refusals.other_host.err and 'ca_sha256' in verify_sync.refusals.other_host.err"
          - verify_sync.refusals.taken_address.rc == 65
          - "'fae' in verify_sync.refusals.taken_address.err and '10.73.7.9' in verify_sync.refusals.taken_address.err"
          - verify_sync.records_unchanged_on_refusals and not verify_sync.gus_or_fae_created
          - verify_sync.sync_three_add.rc == 0
          - >-
            verify_sync.eli_rec_both is match(
            '^member=alpha-four developer\nmember=alpha-three developer\nlocked=false\n'
            )
          - verify_sync.sync_drop_from_one.rc == 0 and verify_sync.sync_drop_from_one.out.dropped == ['eli']
          - >-
            verify_sync.eli_rec_still_in_three is match('^member=alpha-three developer\nlocked=false\n')
          - verify_sync.eli_keys_still_in_three and verify_sync.dev2_in_peers_still
          - verify_sync.team1_after_drop == [] and verify_sync.team3_still == ['eli']
          - verify_sync.sync_drop_from_three.rc == 0 and verify_sync.sync_drop_from_three.out.dropped == ['eli']
          - >-
            verify_sync.eli_rec_locked is match('^locked=true\nlaptop=l2 ')
          - >-
            not verify_sync.eli_keys_locked
            and not verify_sync.eli_peers_file_locked
            and not verify_sync.eli_matrix_locked
          - not verify_sync.dev2_in_peers_locked and verify_sync.team3_after_drop == [] and verify_sync.eli_prohibited
          - "verify_sync.rm_three == {'rc': 0, 'out': {'project': 'alpha-three', 'removed': true, 'locked': []}}"
          - "verify_sync.rm_four == {'rc': 0, 'out': {'project': 'alpha-four', 'removed': true, 'locked': []}}"
          - "verify_sync.purge_eli == {'rc': 0, 'out': {'person': 'eli', 'purged': true}}"
        fail_msg: >-
          asked porelo-host-person sync to verify real signed bundles under DynamicUser, enforce
          sudo/team/signer/host/diff refusals, add and drop laptops and memberships per project, keep hand and
          second-project access, and lock only when zero memberships remain; got {{ verify_sync }}
      vars:
        verify_sync: "{{ verify_projects_sync.stdout_lines | last | from_json }}"

    - name: Delete alpha-one's repositories and remove alpha-one before purging the remaining people
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - |
            import json, pathlib, ssl, subprocess, urllib.request
            token = pathlib.Path("/home/porelo-forge/.config/porelo-forge/api.token").read_text(
                encoding="utf-8"
            ).strip()
            ctx = ssl.create_default_context(cafile="/etc/porelo-host/forge/ca.pem")
            opener = urllib.request.build_opener(
                urllib.request.ProxyHandler({}),
                urllib.request.HTTPSHandler(context=ctx),
            )
            deleted = {}
            for name in ("app", "code"):
                req = urllib.request.Request(
                    f"https://10.73.7.1:3000/api/v1/repos/alpha-one/{name}",
                    method="DELETE",
                    headers={"Authorization": "token " + token},
                )
                with opener.open(req, timeout=30) as resp:
                    deleted[name] = resp.status
            run = subprocess.run(
                ["/usr/local/sbin/porelo-host-project", "remove", "alpha-one"],
                input="",
                capture_output=True,
                text=True,
            )
            print(json.dumps({"repos_deleted": deleted, "rc": run.returncode, "out": run.stdout, "err": run.stderr}))
      register: verify_projects_cleanup_one
      changed_when: true
      no_log: true

    - name: Assert removing emptied alpha-one succeeds without locking hand-admitted bo or cy
      ansible.builtin.assert:
        that:
          - "verify_projects_cleanup_result.repos_deleted == {'app': 204, 'code': 204}"
          - verify_projects_cleanup_result.rc == 0
          - >-
            (verify_projects_cleanup_result.out | from_json)
            == {'project': 'alpha-one', 'removed': true, 'locked': []}
        fail_msg: >-
          asked DELETE /repos/alpha-one/{app,code} for 204 and 'porelo-host-project remove alpha-one' for
          {"project":"alpha-one","removed":true,"locked":[]}; got {{ verify_projects_cleanup_result }}
      vars:
        verify_projects_cleanup_result: "{{ verify_projects_cleanup_one.stdout | from_json }}"

    - name: Purge bo, cy and di so side_effect's down runs with every membership gone
      ansible.builtin.command:
        argv: [/usr/local/sbin/porelo-host-person, purge, "{{ item }}"]
        stdin: ""
      loop: [bo, cy, di]
      register: verify_projects_purge_all
      changed_when: true

    - name: Assert bo, cy and di are purged before side_effect runs down
      ansible.builtin.assert:
        that:
          - item.rc == 0
          - item.stdout_lines | length == 1
          - "(item.stdout | from_json) == {'person': item.item, 'purged': true}"
        fail_msg: >-
          asked 'porelo-host-person purge {{ item.item }}' for {'person': '{{ item.item }}', 'purged': true};
          got rc {{ item.rc }}: {{ item.stdout }} ({{ item.stderr }})
      loop: "{{ verify_projects_purge_all.results }}"
      loop_control:
        label: "{{ item.item }}"
  always:
    - name: Remove the temporary project registration key directory
      ansible.builtin.file:
        path: /root/verify-projects
        state: absent
