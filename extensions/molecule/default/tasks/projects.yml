    - name: Verify porelo-host-person sync reconciles developers, laptops, memberships and Forgejo teams
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - |
            import json, os, pathlib, pwd, shutil, ssl, subprocess, urllib.request
            import sys, traceback

            # A failure leaves only its line, its class, an HTTP code and the last sync's refusal; never its words.
            last_sync = {}

            def failed(kind, error, tb):
                lines = [f.lineno for f in traceback.extract_tb(tb) if f.filename == "<string>"]
                print(json.dumps({"failed_at_line": lines[-1] if lines else None, "error": kind.__name__,
                                  "code": getattr(error, "code", None), "last_sync": last_sync}), flush=True)
                os._exit(0)

            sys.excepthook = failed

            work = pathlib.Path("/root/verify-projects/sync")
            shutil.rmtree(work, ignore_errors=True)
            (work / "git-home").mkdir(parents=True, mode=0o700)
            host_info = json.loads(pathlib.Path("/etc/porelo-host/host.json").read_text(encoding="utf-8"))
            host_block = {
                key: host_info[key]
                for key in ("address", "endpoint", "wireguard_public_key", "network", "ssh_host_key", "ca_sha256")
            }
            signer2 = pathlib.Path("/root/verify-projects/signer2.line").read_text(encoding="utf-8").strip()
            cy_ssh = pathlib.Path("/root/verify-projects/cy.ssh.line").read_text(encoding="utf-8").strip()
            cy_wg = pathlib.Path("/root/verify-projects/cy.wg.line").read_text(encoding="utf-8").strip()

            def make_laptop_keys(tag):
                ssh_file = work / f"{tag}.ssh"
                subprocess.run(
                    ["/usr/bin/ssh-keygen", "-q", "-t", "ed25519", "-N", "", "-C", "", "-f", str(ssh_file)],
                    check=True,
                )
                ssh_pub = " ".join((work / f"{tag}.ssh.pub").read_text(encoding="utf-8").split()[:2])
                wg_priv = subprocess.check_output(["/usr/bin/wg", "genkey"], text=True)
                wg_pub = subprocess.check_output(["/usr/bin/wg", "pubkey"], input=wg_priv, text=True).strip()
                return ssh_pub, wg_pub

            dev1_ssh, dev1_wg = make_laptop_keys("eli-one")
            dev2_ssh, dev2_wg = make_laptop_keys("eli-two")
            probe_ssh, probe_wg = make_laptop_keys("probe")
            rogue_key = work / "rogue"
            subprocess.run(
                ["/usr/bin/ssh-keygen", "-q", "-t", "ed25519", "-N", "", "-C", "", "-f", str(rogue_key)],
                check=True,
            )

            git_env = {
                "PATH": "/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin",
                "LC_ALL": "C.UTF-8",
                "GIT_CONFIG_GLOBAL": "/dev/null",
                "GIT_CONFIG_NOSYSTEM": "1",
                "HOME": str(work / "git-home"),
            }

            def init_repo(name):
                repo = work / name
                subprocess.run(["/usr/bin/git", "init", "-q", "-b", "main", str(repo)], env=git_env, check=True)
                subprocess.run(
                    ["/usr/bin/git", "-C", str(repo), "config", "user.name", "Signer"], env=git_env, check=True
                )
                subprocess.run(
                    ["/usr/bin/git", "-C", str(repo), "config", "user.email", "signer@example.org"],
                    env=git_env,
                    check=True,
                )
                subprocess.run(
                    ["/usr/bin/git", "-C", str(repo), "config", "gpg.format", "ssh"], env=git_env, check=True
                )
                return repo

            def commit_bundle(repo, filename, content, key_path, out_bundle):
                (repo / filename).write_text(content, encoding="utf-8")
                subprocess.run(
                    ["/usr/bin/git", "-C", str(repo), "config", "user.signingkey", str(key_path)],
                    env=git_env,
                    check=True,
                )
                subprocess.run(["/usr/bin/git", "-C", str(repo), "add", filename], env=git_env, check=True)
                subprocess.run(
                    ["/usr/bin/git", "-C", str(repo), "commit", "-q", "-S", "-m", "Update " + filename],
                    env=git_env,
                    check=True,
                )
                sha = subprocess.check_output(
                    ["/usr/bin/git", "-C", str(repo), "rev-parse", "HEAD"], env=git_env, text=True
                ).strip()
                subprocess.run(
                    ["/usr/bin/git", "-C", str(repo), "bundle", "create", str(out_bundle), "HEAD", "main"],
                    env=git_env,
                    check=True,
                    stdout=subprocess.DEVNULL,
                    stderr=subprocess.DEVNULL,
                )
                return sha

            def project_yaml(project):
                return (
                    f'project:\n  name: "{project}"\n  security_class: "guarded"\n'
