    - name: Read prohibit_login and token counts on cy's and di's Forgejo identities after remove alpha-two
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - |
            import json, pathlib, secrets, ssl, subprocess, urllib.request
            conf = dict(
                line.split("=", 1)
                for line in pathlib.Path("/etc/porelo-host/forge.conf").read_text(encoding="utf-8").splitlines()
                if "=" in line
            )
            account = conf["account"]
            agents = [a for a in conf.get("agents", "").split(",") if a]
            uid = subprocess.check_output(["/usr/bin/id", "-u", account], text=True).strip()
            tname = "verify-remove-lock-" + secrets.token_hex(12)
            token = subprocess.check_output(
                [
                    "/usr/sbin/runuser", "-u", account, "--",
                    "/usr/bin/env", f"XDG_RUNTIME_DIR=/run/user/{uid}",
                    "/usr/bin/podman", "exec", "forgejo", "forgejo", "admin", "user",
                    "generate-access-token", "--username", "porelo-admin",
                    "--token-name", tname, "--scopes", "write:admin,read:user", "--raw",
                ],
                text=True,
                cwd="/",
            ).strip()
            ctx = ssl.create_default_context(cafile="/etc/porelo-host/forge/ca.pem")
            opener = urllib.request.build_opener(
                urllib.request.ProxyHandler({}),
                urllib.request.HTTPSHandler(context=ctx),
            )
            base = f"https://{conf['address']}:{conf['port']}/api/v1"
            def call(method, path):
                req = urllib.request.Request(
                    base + path,
                    method=method,
                    headers={"Authorization": "token " + token, "Content-Type": "application/json"},
                )
                with opener.open(req, timeout=30) as resp:
                    body = resp.read()
                    return resp.status, (json.loads(body) if body else None)
            cleaned = False
            try:
                people = {}
                for who in ("cy", "di"):
                    identities = [who, f"porelo-{who}", *(f"{a}-{who}" for a in agents)]
                    prohibited = {}
                    tokens = {}
                    for identity in identities:
                        _, user_obj = call("GET", f"/users/{identity}")
                        _, tok_list = call("GET", f"/admin/users/{identity}/tokens?limit=50&page=1")
                        prohibited[identity] = bool(user_obj.get("prohibit_login"))
                        tokens[identity] = len(tok_list)
                    people[who] = {"prohibited": prohibited, "tokens": tokens}
            finally:
                _, admin_tokens = call("GET", "/admin/users/porelo-admin/tokens?limit=50&page=1")
                for entry in admin_tokens:
                    if entry.get("name") == tname:
                        status, _ = call("DELETE", f"/admin/users/porelo-admin/tokens/{entry['id']}")
                        cleaned = status == 204
            print(json.dumps({"people": people, "cleaned": cleaned}))
      register: verify_projects_identities_after
      changed_when: false
      no_log: true

