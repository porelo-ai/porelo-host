---
# Projects registered and removed through /usr/local/sbin/porelo-host-project as root when the forge is on: two
# projects owned by bo and cy alone, package publishing isolated to each project's own organization, refusals leaving
# records untouched, down refusing while people hold memberships, empty-project removal deleting the organization and
# publisher while locking only people left with no membership (keeping hand-admitted cy unlocked and locking
# project-only di), removal of a project holding a committed repository refused, porelo-host-person sync reconciling
# developers, laptops, project memberships and Forgejo developers teams against real signed project and access bundles
# verified under DynamicUser, and every project and person removed at the end so side_effect's down goes through.
- name: Verify project registration, ownership, package isolation, refusals and removal guards
  block:
    - name: Create the root-only workspace, cy's and di's laptop keys and two canonical project signing keys
      ansible.builtin.shell:
        cmd: |
          set -euo pipefail
          umask 077
          d=/root/verify-projects
          rm -rf "$d"
          mkdir -p "$d"
          for who in cy di; do
              ssh-keygen -q -t ed25519 -N "" -C "" -f "$d/$who.ssh"
              awk '{print $1, $2}' "$d/$who.ssh.pub" > "$d/$who.ssh.line"
              wg genkey > "$d/$who.wg"
              wg pubkey < "$d/$who.wg" | tr -d '\r\n' > "$d/$who.wg.line"
              printf '%s-laptop %s %s\n' "$who" "$(cat "$d/$who.ssh.line")" "$(cat "$d/$who.wg.line")" > "$d/$who.in"
          done
          for name in signer1 signer2; do
              ssh-keygen -q -t ed25519 -N "" -C "" -f "$d/$name"
              awk '{print $1, $2}' "$d/$name.pub" > "$d/$name.line"
          done
        executable: /bin/bash
      changed_when: true
      no_log: true

    - name: Read the two canonical project signing keys and cy's and di's public laptop keys
      ansible.builtin.slurp:
        src: "{{ item }}"
      loop:
        - /root/verify-projects/signer1.line
        - /root/verify-projects/signer2.line
        - /root/verify-projects/cy.ssh.line
        - /root/verify-projects/cy.wg.line
        - /root/verify-projects/di.ssh.line
        - /root/verify-projects/di.wg.line
      register: verify_projects_signers

    - name: Admit cy as project-admin for the second project
      ansible.builtin.shell:
        cmd: >-
          set -euo pipefail
          && /usr/local/sbin/porelo-host-person add cy --role project-admin < /root/verify-projects/cy.in
        executable: /bin/bash
      register: verify_projects_add_cy
      changed_when: true

    - name: Assert admitting cy prints one JSON line assigning the freed VPN address 10.73.7.3
      ansible.builtin.assert:
        that:
          - verify_projects_add_cy.rc == 0
          - verify_projects_add_cy.stdout_lines | length == 1
          - (verify_projects_add_cy.stdout | from_json) == verify_projects_cy_expected
        fail_msg: >-
          asked 'porelo-host-person add cy --role project-admin' for {{ verify_projects_cy_expected }};
          got rc {{ verify_projects_add_cy.rc }}: {{ verify_projects_add_cy.stdout }}
          ({{ verify_projects_add_cy.stderr }})
      vars:
        verify_projects_cy_expected:
          person: cy
          role: project-admin
          laptops:
            - laptop: cy-laptop
              vpn_address: 10.73.7.3

    - name: Admit di so alpha-two can hold a person whose only membership is that project
      ansible.builtin.shell:
        cmd: >-
          set -euo pipefail
          && /usr/local/sbin/porelo-host-person add di --role project-admin < /root/verify-projects/di.in
        executable: /bin/bash
      register: verify_projects_add_di
      changed_when: true

    - name: Assert admitting di prints one JSON line assigning VPN address 10.73.7.4
      ansible.builtin.assert:
        that:
          - verify_projects_add_di.rc == 0
          - verify_projects_add_di.stdout_lines | length == 1
          - (verify_projects_add_di.stdout | from_json) == verify_projects_di_expected
        fail_msg: >-
          asked 'porelo-host-person add di --role project-admin' for {{ verify_projects_di_expected }};
          got rc {{ verify_projects_add_di.rc }}: {{ verify_projects_add_di.stdout }}
          ({{ verify_projects_add_di.stderr }})
      vars:
        verify_projects_di_expected:
          person: di
          role: project-admin
          laptops:
            - laptop: di-laptop
              vpn_address: 10.73.7.4

    - name: Register alpha-one for bo and alpha-two for cy with porelo-host-project
      ansible.builtin.command:
        argv:
          - /usr/local/sbin/porelo-host-project
          - add
          - "{{ item.project }}"
          - "{{ item.admin }}"
          - --signed-by
          - "{{ item.signer }}"
      loop:
        - project: alpha-one
          admin: bo
          signer: "{{ verify_projects_signers.results[0].content | b64decode | trim }}"
        - project: alpha-two
          admin: cy
          signer: "{{ verify_projects_signers.results[1].content | b64decode | trim }}"
      loop_control:
        label: "{{ item.project }}"
      register: verify_projects_added
      changed_when: true

    - name: Assert each registered project prints its contract JSON line
      ansible.builtin.assert:
        that:
          - item.rc == 0
          - item.stdout_lines | length == 1
          - (item.stdout | from_json) == verify_projects_expected
        fail_msg: >-
          asked 'porelo-host-project add {{ item.item.project }}' for {{ verify_projects_expected }};
          got rc {{ item.rc }}: {{ item.stdout }} ({{ item.stderr }})
      vars:
        verify_projects_expected:
          project: "{{ item.item.project }}"
          admin: "{{ item.item.admin }}"
          organization: "{{ item.item.project }}"
          publisher: "porelo-publisher-{{ item.item.project }}"
      loop: "{{ verify_projects_added.results }}"
      loop_control:
        label: "{{ item.item.project }}"

    - name: Record di as a developer of alpha-two alone, without hand admission
      ansible.builtin.copy:
        dest: /etc/porelo-host/people/di.conf
        owner: root
        group: root
        mode: "0600"
        content: |
          member=alpha-two developer
          locked=false
          laptop=di-laptop {{ verify_projects_di_ssh }} {{ verify_projects_di_wg }} 10.73.7.4
      vars:
        verify_projects_di_ssh: "{{ verify_projects_signers.results[4].content | b64decode | trim }}"
        verify_projects_di_wg: "{{ verify_projects_signers.results[5].content | b64decode | trim }}"

    - name: Read bo's, cy's and di's person records after project registration
      ansible.builtin.slurp:
        src: "{{ item }}"
      loop:
        - /etc/porelo-host/people/bo.conf
        - /etc/porelo-host/people/cy.conf
        - /etc/porelo-host/people/di.conf
      register: verify_projects_people_before

    - name: Assert porelo-host-project add recorded each admin's project membership after hand
      ansible.builtin.assert:
        that:
          - (verify_projects_people_before.results[0].content | b64decode)
            is match('^member=hand\nmember=alpha-one project-admin\nlocked=false\nlaptop=bo-laptop ')
          - (verify_projects_people_before.results[1].content | b64decode)
            == ('member=hand\nmember=alpha-two project-admin\nlocked=false\nlaptop=cy-laptop '
                ~ verify_projects_cy_ssh ~ ' ' ~ verify_projects_cy_wg ~ ' 10.73.7.3\n')
          - (verify_projects_people_before.results[2].content | b64decode)
            == ('member=alpha-two developer\nlocked=false\nlaptop=di-laptop '
                ~ verify_projects_di_ssh ~ ' ' ~ verify_projects_di_wg ~ ' 10.73.7.4\n')
        fail_msg: >-
          asked bo.conf, cy.conf and di.conf for fixed-order memberships;
          got bo '{{ verify_projects_people_before.results[0].content | b64decode }}',
          cy '{{ verify_projects_people_before.results[1].content | b64decode }}',
          di '{{ verify_projects_people_before.results[2].content | b64decode }}'
      vars:
        verify_projects_cy_ssh: "{{ verify_projects_signers.results[2].content | b64decode | trim }}"
        verify_projects_cy_wg: "{{ verify_projects_signers.results[3].content | b64decode | trim }}"
        verify_projects_di_ssh: "{{ verify_projects_signers.results[4].content | b64decode | trim }}"
        verify_projects_di_wg: "{{ verify_projects_signers.results[5].content | b64decode | trim }}"

    - name: Verify alpha-one brought in bo's account and joined in cy's account
      ansible.builtin.include_tasks: "{{ playbook_dir }}/tasks/bring.yml"
      when: verify_forge == 'on'

    - name: Query each organization's Owners team members with the forge's admin token
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - |
            import json, pathlib, ssl, urllib.request
            token = pathlib.Path("/home/porelo-forge/.config/porelo-forge/api.token").read_text(
                encoding="utf-8"
            ).strip()
            ctx = ssl.create_default_context(cafile="/etc/porelo-host/forge/ca.pem")
            opener = urllib.request.build_opener(
                urllib.request.ProxyHandler({}),
                urllib.request.HTTPSHandler(context=ctx),
            )
            base = "https://10.73.7.1:3000/api/v1"
            def get_json(path):
                req = urllib.request.Request(base + path, headers={"Authorization": "token " + token})
                with opener.open(req, timeout=30) as resp:
                    return json.load(resp)
            owners = {}
            for org in ("alpha-one", "alpha-two"):
                teams = [t for t in get_json(f"/orgs/{org}/teams?limit=50&page=1") if t.get("name") == "Owners"]
                if len(teams) != 1:
                    raise SystemExit(f"expected one Owners team in {org}, got {len(teams)}")
                members = get_json(f"/teams/{teams[0]['id']}/members?limit=50&page=1")
                owners[org] = [m["login"] for m in members]
            print(json.dumps(owners))
      register: verify_projects_owners
      changed_when: false
      no_log: true

    - name: Assert alpha-one's Owners team holds bo alone and alpha-two's holds cy alone
      ansible.builtin.assert:
        that:
          - "(verify_projects_owners.stdout | from_json) == {'alpha-one': ['bo'], 'alpha-two': ['cy']}"
        fail_msg: >-
          asked Owners teams for {'alpha-one': ['bo'], 'alpha-two': ['cy']};
          got {{ verify_projects_owners.stdout }}

    - name: Mint a write:package token for porelo-publisher-alpha-one, PUT generic packages to both orgs and delete it
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - |
            import base64, json, secrets, ssl, subprocess, time, urllib.error, urllib.request
            uid = subprocess.check_output(["/usr/bin/id", "-u", "porelo-forge"], text=True).strip()
            def mint(username, prefix, scopes):
                name = f"{prefix}-{secrets.token_hex(12)}"
                value = subprocess.check_output(
                    [
                        "/usr/sbin/runuser", "-u", "porelo-forge", "--",
                        "/usr/bin/env", f"XDG_RUNTIME_DIR=/run/user/{uid}",
                        "/usr/bin/podman", "exec", "forgejo", "forgejo", "admin", "user",
                        "generate-access-token", "--username", username,
                        "--token-name", name, "--scopes", scopes, "--raw",
                    ],
                    text=True,
                    cwd="/",
                ).strip()
                return name, value
            ctx = ssl.create_default_context(cafile="/etc/porelo-host/forge/ca.pem")
            opener = urllib.request.build_opener(
                urllib.request.ProxyHandler({}),
                urllib.request.HTTPSHandler(context=ctx),
            )
            host_base = "https://10.73.7.1:3000"
            retries = []
            def request(method, path, auth, data=None, content_type="application/octet-stream"):
                # A connection the forge drops is tried again a few times and counted, never hidden.
                for attempt in range(5):
                    req = urllib.request.Request(
                        host_base + path,
                        data=data,
                        method=method,
                        headers={"Authorization": auth, "Content-Type": content_type},
                    )
                    try:
                        with opener.open(req, timeout=30) as resp:
                            raw = resp.read()
                            return resp.status, raw
                    except urllib.error.HTTPError as err:
                        err.close()
                        return err.code, b""
                    except (ConnectionError, urllib.error.URLError):
                        if attempt == 4:
                            raise
                        retries.append(method + " " + path.split("?")[0])
                        time.sleep(3)
            # Only the step and the error's class leave a failure; its words may carry what the command was given.
            try:
                stage = "mint the package token"
                pkg_name, pkg_token = mint("porelo-publisher-alpha-one", "verify-pkg", "write:package")
                pkg_basic = "Basic " + base64.b64encode(
                    f"porelo-publisher-alpha-one:{pkg_token}".encode("utf-8")
                ).decode("ascii")
                stage = "mint the cleanup token"
                admin_name, admin_token = mint("porelo-admin", "verify-pkg-cleanup", "write:admin,read:package")
                admin_auth = "token " + admin_token
                pkg_deleted = False
                admin_deleted = False
                stage = "put the packages"
                try:
                    put_one, _ = request(
                        "PUT",
                        "/api/packages/alpha-one/generic/probe/1.0.0/probe.txt",
                        pkg_basic,
                        b"alpha-one package\n",
                    )
                    put_two, _ = request(
                        "PUT",
                        "/api/packages/alpha-two/generic/probe/1.0.0/probe.txt",
                        pkg_basic,
                        b"alpha-two package\n",
                    )
                    list_status, list_raw = request(
                        "GET",
                        "/api/v1/packages/alpha-two?limit=50&page=1",
                        admin_auth,
                        content_type="application/json",
                    )
                    alpha_two_count = len(json.loads(list_raw)) if list_status == 200 else -1
                finally:
                    stage = "delete the temporary tokens"
                    _, pub_raw = request(
                        "GET",
                        "/api/v1/admin/users/porelo-publisher-alpha-one/tokens?limit=50&page=1",
                        admin_auth,
                        content_type="application/json",
                    )
                    for row in json.loads(pub_raw):
                        if row.get("name") == pkg_name:
                            del_code, _ = request(
                                "DELETE",
                                f"/api/v1/admin/users/porelo-publisher-alpha-one/tokens/{row['id']}",
                                admin_auth,
                                content_type="application/json",
                            )
                            pkg_deleted = del_code == 204
                    _, adm_raw = request(
                        "GET",
                        "/api/v1/admin/users/porelo-admin/tokens?limit=50&page=1",
                        admin_auth,
                        content_type="application/json",
                    )
                    for row in json.loads(adm_raw):
                        if row.get("name") == admin_name:
                            del_code, _ = request(
                                "DELETE",
                                f"/api/v1/admin/users/porelo-admin/tokens/{row['id']}",
                                admin_auth,
                                content_type="application/json",
                            )
                            admin_deleted = del_code == 204
                print(
                    json.dumps(
                        {
                            "alpha_one_put": put_one,
                            "alpha_two_put": put_two,
                            "alpha_two_packages": alpha_two_count,
                            "pkg_deleted": pkg_deleted,
                            "admin_deleted": admin_deleted,
                            "retries": retries,
                        }
                    )
                )
            except Exception as error:
                print(json.dumps({"failed_at": stage, "error": type(error).__name__,
                                  "returncode": getattr(error, "returncode", None), "retries": retries}))
      register: verify_projects_isolation
      changed_when: true
      no_log: true

    - name: Assert porelo-publisher-alpha-one publishes 201 to alpha-one, is refused on alpha-two, and its token is gone
      ansible.builtin.assert:
        that:
          - "'failed_at' not in verify_projects_pkg"
          - verify_projects_pkg.alpha_one_put == 201
          - verify_projects_pkg.alpha_two_put in [401, 403, 404]
          - verify_projects_pkg.alpha_two_put < 200 or verify_projects_pkg.alpha_two_put >= 300
          - verify_projects_pkg.alpha_two_packages == 0
          - verify_projects_pkg.pkg_deleted
          - verify_projects_pkg.admin_deleted
        fail_msg: >-
          asked porelo-publisher-alpha-one PUT to return 201 on alpha-one and 401/403/404 on alpha-two with zero
          packages in alpha-two and temporary tokens deleted; got {{ verify_projects_pkg }}
      vars:
        verify_projects_pkg: "{{ verify_projects_isolation.stdout | from_json }}"

    - name: Ask porelo-host-project to refuse a taken project name, an unrecorded admin and a malformed signer
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - |
            import hashlib, json, pathlib, subprocess, sys
            args = json.loads(sys.argv[1])
            def state():
                root = pathlib.Path("/etc/porelo-host/projects")
                records = sorted((p.name, p.read_text(encoding="utf-8")) for p in root.iterdir())
                return hashlib.sha256(json.dumps(records).encode("utf-8")).hexdigest()
            before = state()
            run = subprocess.run(
                ["/usr/local/sbin/porelo-host-project", *args], input="", capture_output=True, text=True
            )
            after = state()
            answer = {"rc": run.returncode, "stdout": run.stdout, "stderr": run.stderr, "unchanged": before == after}
            print(json.dumps(answer))
          - "{{ item.argv | to_json }}"
      loop:
        - label: taken project name
          argv:
            - add
            - alpha-one
            - cy
            - --signed-by
            - "{{ verify_projects_signers.results[1].content | b64decode | trim }}"
          rc: 65
          words: /etc/porelo-host/projects/alpha-one.conf exists
        - label: admin who is no person on the host
          argv:
            - add
            - alpha-three
            - ghost
            - --signed-by
            - "{{ verify_projects_signers.results[1].content | b64decode | trim }}"
          rc: 65
          words: ghost is no person on this host
        - label: malformed signer
          argv:
            - add
            - alpha-three
            - bo
            - --signed-by
            - not-a-signing-key
          rc: 64
          words: signing key must be one canonical ssh-ed25519 signing key without a comment
      loop_control:
        label: "{{ item.label }}"
      register: verify_projects_refusals
      changed_when: false

    - name: Assert every project registration refusal exits with its code and words and leaves project records unchanged
      ansible.builtin.assert:
        that:
          - verify_projects_refusal.rc == item.item.rc
          - verify_projects_refusal.stdout == ''
          - "verify_projects_refusal.stderr is match('^porelo-host-project: ')"
          - item.item.words in verify_projects_refusal.stderr
          - verify_projects_refusal.unchanged
        fail_msg: >-
          asked '{{ item.item.label }}' for rc {{ item.item.rc }}, empty stdout, '{{ item.item.words }}' on stderr and
          unchanged /etc/porelo-host/projects; got {{ verify_projects_refusal }}
      vars:
        verify_projects_refusal: "{{ item.stdout | from_json }}"
      loop: "{{ verify_projects_refusals.results }}"
      loop_control:
        label: "{{ item.item.label }}"

    - name: Run down while bo, cy and di hold hand and project memberships
      ansible.builtin.command:
        argv: [ansible-playbook, -c, local, -i, /root/porelo-host-inventory.yml, porelo.host.down]
      environment:
        ANSIBLE_STDOUT_CALLBACK: porelo.host.lines
        LC_ALL: C.UTF-8
      register: verify_projects_down_refused
      changed_when: false
      failed_when: false

    - name: Assert down refuses naming each person with their hand and project memberships and stops nothing
      ansible.builtin.assert:
        that:
          - verify_projects_down_refused.rc == 2
          - verify_projects_down_failed | length == 1
          - "'bo (hand, alpha-one project-admin)' in verify_projects_down_failed[0].msg"
          - "'cy (hand, alpha-one developer, alpha-two project-admin)' in verify_projects_down_failed[0].msg"
          - "'di (alpha-two developer)' in verify_projects_down_failed[0].msg"
          - "'Take the project off' in verify_projects_down_failed[0].msg"
          - "'Purge' in verify_projects_down_failed[0].msg"
          - verify_projects_down_tasks | intersect(verify_projects_teardown_tasks) | length == 0
        fail_msg: >-
          asked down to refuse with rc 2 naming bo, cy and di with their memberships and both ways back without
          running any teardown task; got rc {{ verify_projects_down_refused.rc }}: {{ verify_projects_down_lines }}
      vars:
        verify_projects_down_lines: "{{ verify_projects_down_refused.stdout_lines | select | map('from_json') | list }}"
        verify_projects_down_failed: >-
          {{ verify_projects_down_lines | selectattr('state', 'equalto', 'failed') | list }}
        verify_projects_down_tasks: >-
          {{ verify_projects_down_lines | selectattr('task', 'defined') | map(attribute='task') | list }}
        verify_projects_teardown_tasks:
          - Stop the host's Matrix homeserver and remove its account
          - Take the host's VM pool off it, before the forge whose runner rents from it
          - Stop the host's forge, keeping nothing
          - Take the VPN down

    - name: Remove alpha-two with no repository through /usr/local/sbin/porelo-host-project remove alpha-two
      ansible.builtin.command:
        argv: [/usr/local/sbin/porelo-host-project, remove, alpha-two]
        stdin: ""
      register: verify_projects_remove_two
      changed_when: true

    - name: Read whether /etc/porelo-host/projects/alpha-two.conf remains after remove alpha-two
      ansible.builtin.stat:
        path: /etc/porelo-host/projects/alpha-two.conf
      register: verify_projects_two_record

    - name: Check whether organization alpha-two and publisher porelo-publisher-alpha-two are gone from Forgejo
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - |
            import json, pathlib, ssl, subprocess, urllib.error, urllib.request
            token = pathlib.Path("/home/porelo-forge/.config/porelo-forge/api.token").read_text(
                encoding="utf-8"
            ).strip()
            ctx = ssl.create_default_context(cafile="/etc/porelo-host/forge/ca.pem")
            opener = urllib.request.build_opener(
                urllib.request.ProxyHandler({}),
                urllib.request.HTTPSHandler(context=ctx),
            )
            def org_status(name):
                req = urllib.request.Request(
                    f"https://10.73.7.1:3000/api/v1/orgs/{name}",
                    headers={"Authorization": "token " + token},
                )
                try:
                    with opener.open(req, timeout=30) as resp:
                        return resp.status
                except urllib.error.HTTPError as err:
                    err.close()
                    return err.code
            uid = subprocess.check_output(["/usr/bin/id", "-u", "porelo-forge"], text=True).strip()
            listed = subprocess.check_output(
                [
                    "/usr/sbin/runuser", "-u", "porelo-forge", "--",
                    "/usr/bin/env", f"XDG_RUNTIME_DIR=/run/user/{uid}",
                    "/usr/bin/podman", "exec", "forgejo", "forgejo", "admin", "user", "list",
                ],
                text=True,
                cwd="/",
            ).splitlines()
            users = [line.split()[1] for line in listed[1:] if len(line.split()) >= 2]
            print(
                json.dumps(
                    {
                        "alpha_two_org": org_status("alpha-two"),
                        "alpha_one_org": org_status("alpha-one"),
                        "publisher_two_present": "porelo-publisher-alpha-two" in users,
                        "publisher_one_present": "porelo-publisher-alpha-one" in users,
                    }
                )
            )
      register: verify_projects_two_forge
      changed_when: false
      no_log: true

    - name: Assert remove alpha-two answers locked di and deletes alpha-two's record, organization and publisher
      ansible.builtin.assert:
        that:
          - verify_projects_remove_two.rc == 0
          - verify_projects_remove_two.stdout_lines | length == 1
          - "(verify_projects_remove_two.stdout | from_json)
            == {'project': 'alpha-two', 'removed': true, 'locked': ['di']}"
          - not verify_projects_two_record.stat.exists
          - verify_projects_two_state.alpha_two_org == 404
          - not verify_projects_two_state.publisher_two_present
          - verify_projects_two_state.alpha_one_org == 200
          - verify_projects_two_state.publisher_one_present
        fail_msg: >-
          asked 'porelo-host-project remove alpha-two' for {"project":"alpha-two","removed":true,"locked":["di"]},
          alpha-two.conf gone, alpha-two org 404 and porelo-publisher-alpha-two deleted while keeping alpha-one;
          got rc {{ verify_projects_remove_two.rc }}: {{ verify_projects_remove_two.stdout }}
          ({{ verify_projects_remove_two.stderr }}), record exists={{ verify_projects_two_record.stat.exists }},
          forge {{ verify_projects_two_state }}
      vars:
