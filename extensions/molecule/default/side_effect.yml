---
# Runs `down` on the host itself, as `host down` does, after verify has read what `up` left, and reads what `down`
# leaves: the VPN taken down, the client logged out and unlinked, the drive unmounted.
- name: Side effect
  hosts: all
  gather_facts: false
  become: true
  vars:
    side_effect_drive: /srv/porelo-host/drive
  tasks:
    # The person's token for the central forge, kept aside before down unmounts the drive, to search what down leaves.
    - name: Keep the stand-in's token aside, root's alone, to search the forge's accounts for it after down
      ansible.builtin.copy:
        src: /srv/porelo-host/drive/porelo-host/forge-central.token
        dest: /root/forge-central.token
        remote_src: true
        owner: root
        group: root
        mode: "0600"

    # First a down whose drive never reads synced: it must stop on the drive, saying what would be lost, and keep it.
    - name: Keep the stub's tresor syncing
      ansible.builtin.file:
        path: /home/porelo-test/.local/share/tresorit/stub-state/never-idle
        state: touch
        owner: porelo-test
        group: porelo-test
        mode: "0644"
        modification_time: preserve
        access_time: preserve

    - name: Run down while the drive does not read synced
      ansible.builtin.command:
        cmd: ansible-playbook -c local -i /root/porelo-host-inventory.yml porelo.host.down -e drive_sync_wait=10
      environment:
        ANSIBLE_STDOUT_CALLBACK: porelo.host.lines
        LC_ALL: C.UTF-8
      register: side_effect_unsynced
      changed_when: true
      failed_when: false

    - name: Read whether the drive is still mounted after it
      ansible.builtin.command:
        cmd: findmnt --noheadings --mountpoint {{ side_effect_drive }}
      register: side_effect_kept
      changed_when: false
      failed_when: false

    - name: Assert down stopped on the drive, saying what would be lost, and left it mounted and logged in
      ansible.builtin.assert:
        that:
          - side_effect_unsynced.rc == 2
          - side_effect_unsynced.stdout is search('did not read synced within 10 s')
          - side_effect_unsynced.stdout is search('would be lost with the host')
          - side_effect_kept.rc == 0
        fail_msg: >-
          down with an unsynced drive gave rc {{ side_effect_unsynced.rc }}:
          {{ side_effect_unsynced.stdout_lines | select('search', 'failed') | list }};
          mount rc {{ side_effect_kept.rc }}

    - name: Let the stub's tresor read synced again
      ansible.builtin.file:
        path: /home/porelo-test/.local/share/tresorit/stub-state/never-idle
        state: absent

    - name: Run down on the host itself, as host down does, its steps as JSON lines
      ansible.builtin.command:
        cmd: ansible-playbook -c local -i /root/porelo-host-inventory.yml porelo.host.down
      environment:
        ANSIBLE_STDOUT_CALLBACK: porelo.host.lines
        LC_ALL: C.UTF-8
      register: side_effect_down
      changed_when: >-
        side_effect_down.stdout is search('"state": "changed"')

    - name: Read whether the drive's folder is still mounted
      ansible.builtin.command:
        cmd: findmnt --noheadings --mountpoint {{ side_effect_drive }}
      register: side_effect_mount
      changed_when: false
      failed_when: false

    - name: Assert down left the drive unmounted
      ansible.builtin.assert:
        that: side_effect_mount.rc != 0
        fail_msg: "{{ side_effect_drive }} is still mounted after down: {{ side_effect_mount.stdout }}"

    - name: Read whether the VPN's interface is still there
      ansible.builtin.command:
        cmd: ip link show wg-porelo
      register: side_effect_vpn
      changed_when: false
      failed_when: false

    - name: Read whether the VPN's file is still there
      ansible.builtin.stat:
        path: /etc/wireguard/wg-porelo.conf
      register: side_effect_vpn_conf

    - name: Assert down took the VPN's interface and its file
      ansible.builtin.assert:
        that:
          - side_effect_vpn.rc != 0
          - not side_effect_vpn_conf.stat.exists
        fail_msg: "after down: interface rc {{ side_effect_vpn.rc }}, file {{ side_effect_vpn_conf.stat.exists }}"

    - name: Read the client's stub's state after down
      ansible.builtin.find:
        paths: /home/porelo-test/.local/share/tresorit/stub-state
      register: side_effect_stub

    - name: Assert down logged the client out with --unlink and stopped every sync
      ansible.builtin.assert:
        that: side_effect_stub.files | map(attribute='path') | map('basename') | list == ['unlinked']
        fail_msg: "the stub's state after down: {{ side_effect_stub.files | map(attribute='path') | list }}"

    - name: Ask Porelo whether the account still has a vault
      ansible.builtin.command:
        cmd: porelo vault status
      become: true
      become_user: porelo-test
      environment:
        XDG_RUNTIME_DIR: /run/user/1001
      register: side_effect_vault
      changed_when: false
      failed_when: false

    - name: Assert down cleared the vault
      ansible.builtin.assert:
        that: side_effect_vault.rc == 4
        fail_msg: "after down, porelo vault status gave {{ side_effect_vault.rc }}: {{ side_effect_vault.stdout }}"

    - name: Ask Porelo whether the machine file's task still runs
      ansible.builtin.command:
        cmd: porelo task status porelo-converge-converge-1 --json
      become: true
      become_user: porelo-test
      environment:
        XDG_RUNTIME_DIR: /run/user/1001
      register: side_effect_task
      changed_when: false

    - name: Assert down stopped the task and kept it
      ansible.builtin.assert:
        that:
          - not (side_effect_task.stdout | from_json).running
          - (side_effect_task.stdout | from_json).state != 'absent'
        fail_msg: "after down, porelo task status gave {{ side_effect_task.stdout }}"

    - name: Try the person's key as the account after down
      ansible.builtin.command:
        argv: [ssh, -o, BatchMode=yes, -o, IdentitiesOnly=yes, -o, StrictHostKeyChecking=accept-new,
               -o, UserKnownHostsFile=/root/person-known-hosts, -i, /root/person-ssh, porelo-test@127.0.0.1, "true"]
      register: side_effect_person_ssh
      changed_when: false
      failed_when: false

    - name: Assert down took the person's key off the account
      ansible.builtin.assert:
        that: side_effect_person_ssh.rc == 255 and side_effect_person_ssh.stderr is search('Permission denied')
        fail_msg: >-
          after down, ssh as porelo-test: rc {{ side_effect_person_ssh.rc }}, {{ side_effect_person_ssh.stderr }}

    # The forge role's down: nothing of the forge runs or would start again, and none of its secrets stays behind.
    - name: Search the forge's accounts for the person's token, outside the images' layers
      ansible.builtin.command:
        argv: [grep, -rFl, --exclude-dir=overlay, --exclude-dir=overlay-layers, --exclude-dir=overlay-images,
               -f, /root/forge-central.token, /home/porelo-forge, /home/porelo-runner]
      register: side_effect_forge_token
      changed_when: false
      failed_when: false

    - name: Ask which processes the forge's accounts still run
      ansible.builtin.command:
        cmd: pgrep -a -u porelo-forge,porelo-runner
      register: side_effect_forge_processes
      changed_when: false
      failed_when: false

    - name: Read what of the forge's units and secrets is left
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - /home/porelo-forge/.config/containers/systemd/forgejo.container
        - /home/porelo-runner/.config/containers/systemd/forgejo-runner.container
        - /home/porelo-forge/.config/porelo-forge/api.token
        - /home/porelo-runner/runner/.runner
        - /etc/porelo-host/forge/ca.key
      register: side_effect_forge_left

    - name: Assert down left none of the forge's secrets, nothing of it running, and no unit to start it again
      ansible.builtin.assert:
        that:
          - side_effect_forge_token.rc == 1
          - side_effect_forge_processes.rc == 1
          - side_effect_forge_left.results | selectattr('stat.exists') | list | length == 0
        fail_msg: >-
          after down, the person's token is in {{ side_effect_forge_token.stdout_lines }};
          running: {{ side_effect_forge_processes.stdout_lines }};
          left: {{ side_effect_forge_left.results | selectattr('stat.exists') | map(attribute='item') | list }}
