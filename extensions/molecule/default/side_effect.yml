---
# Runs `down` on the host itself, as `host down` does, after verify has read what `up` left, and reads what `down`
# leaves: the VPN taken down, the client logged out and unlinked, the drive unmounted.
- name: Side effect
  hosts: all
  gather_facts: false
  become: true
  vars:
    side_effect_drive: /srv/porelo-host/drive
    side_effect_vm_pool: "{{ lookup('ansible.builtin.env', 'PORELO_HOST_MOLECULE_POOL', default='on') }}"
    side_effect_forge: "{{ lookup('ansible.builtin.env', 'PORELO_HOST_MOLECULE_FORGE', default='on') }}"
  tasks:
    - name: Read the account's id before down
      ansible.builtin.getent:
        database: passwd
        key: porelo-test

    # Check installed trust before removal, so cleanup cannot pass when up left no trust to remove.
    - name: Read both CA files before down
      ansible.builtin.slurp:
        src: "{{ ansible_facts['getent_passwd']['porelo-test'][4] }}/.config/porelo/{{ item }}"
      loop: [ca-certificates.pem, task-ca-certificates.pem]
      register: side_effect_ca_before
      when: side_effect_forge == 'on'

    - name: Assert down has forge trust to remove and the person's certificate to keep
      ansible.builtin.assert:
        that:
          - side_effect_ca_before.results[1].content | b64decode is search('-----BEGIN CERTIFICATE-----')
          - side_effect_host_ca | regex_findall('(?m)^# BEGIN porelo-host forge CA$') | length == 1
          - side_effect_host_ca | regex_findall('(?m)^# END porelo-host forge CA$') | length == 1
          - side_effect_person_ca is search('-----BEGIN CERTIFICATE-----')
        fail_msg: >-
          asked for forge trust in both files and the person's certificate outside the marked block;
          account {{ side_effect_host_ca }}, task {{ side_effect_ca_before.results[1].content | b64decode }}
      vars:
        side_effect_host_ca: "{{ side_effect_ca_before.results[0].content | b64decode }}"
        side_effect_person_ca: >-
          {{ side_effect_host_ca
          | regex_replace('(?ms)^# BEGIN porelo-host forge CA\n.*?^# END porelo-host forge CA\n?', '') }}
      when: side_effect_forge == 'on'

    - name: Read whether verify left the task running
      ansible.builtin.command:
        cmd: porelo task status porelo-converge-converge-1 --json
      become: true
      become_user: porelo-test
      environment:
        XDG_RUNTIME_DIR: "/run/user/{{ ansible_facts['getent_passwd']['porelo-test'][1] }}"
      register: side_effect_before_task
      changed_when: false

    - name: Start the task by hand if verify left it stopped
      ansible.builtin.command:
        cmd: porelo task start converge-1 -p converge -r code --agent stub --detach --no-input
      become: true
      become_user: porelo-test
      environment:
        XDG_RUNTIME_DIR: "/run/user/{{ ansible_facts['getent_passwd']['porelo-test'][1] }}"
      when: not (side_effect_before_task.stdout | from_json).running
      changed_when: true

    - name: Read the task before down to check the shutdown guard has a running task
      ansible.builtin.command:
        cmd: porelo task status porelo-converge-converge-1 --json
      become: true
      become_user: porelo-test
      environment:
        XDG_RUNTIME_DIR: "/run/user/{{ ansible_facts['getent_passwd']['porelo-test'][1] }}"
      register: side_effect_running_task
      changed_when: false

    - name: Assert the task started by hand is running before down
      ansible.builtin.assert:
        that: (side_effect_running_task.stdout | from_json).running
        fail_msg: "asked for a running task before down, got {{ side_effect_running_task.stdout }}"

    # Checking both ends prevents a teardown test from passing when up never installed the proxy.
    - name: Read the forge's HTTPS units before down
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - /etc/systemd/system/porelo-forge-https.socket
        - /etc/systemd/system/porelo-forge-https.service
      register: side_effect_forge_https_before
      when: side_effect_forge == 'on'

    # The person's token for the central forge, kept aside before down unmounts the drive, to search what down leaves.
    - name: Keep the stand-in's token aside, root's alone, to search the forge's accounts for it after down
      ansible.builtin.copy:
        src: /srv/porelo-host/drive/porelo-host/forge-central.token
        dest: /root/forge-central.token
        remote_src: true
        owner: root
        group: root
        mode: "0600"
      when: side_effect_forge == 'on'
      no_log: true

    # First a down whose drive never reads synced: it must stop on the drive, saying what would be lost, and keep it.
    - name: Keep the stub's tresor syncing
      ansible.builtin.file:
        path: /home/porelo-test/.local/share/tresorit/stub-state/never-idle
        state: touch
        owner: porelo-test
        group: porelo-test
        mode: "0644"
        modification_time: preserve
        access_time: preserve

    - name: Run down while the drive does not read synced
      ansible.builtin.command:
        cmd: ansible-playbook -c local -i /root/porelo-host-inventory.yml porelo.host.down -e drive_sync_wait=10
      environment:
        ANSIBLE_STDOUT_CALLBACK: porelo.host.lines
        LC_ALL: C.UTF-8
      register: side_effect_unsynced
      changed_when: true
      failed_when: false

    - name: Read every running container after down with the unsynced drive
      ansible.builtin.command:
        argv: [podman, ps, --format, "{% raw %}{{.Names}}{% endraw %}"]
      become: true
      become_user: porelo-test
      environment:
        XDG_RUNTIME_DIR: "/run/user/{{ ansible_facts['getent_passwd']['porelo-test'][1] }}"
      register: side_effect_unsynced_containers
      changed_when: false

    - name: Assert down stopped every container before it reached the unsynced drive
      ansible.builtin.assert:
        that: side_effect_unsynced_containers.stdout_lines | length == 0
        fail_msg: >-
          asked for no running container after down, got {{ side_effect_unsynced_containers.stdout_lines }};
          down rc {{ side_effect_unsynced.rc }}: {{ side_effect_unsynced.stdout }}

    - name: Read whether the drive is still mounted after it
      ansible.builtin.command:
        cmd: findmnt --noheadings --mountpoint {{ side_effect_drive }}
      register: side_effect_kept
      changed_when: false
      failed_when: false

    - name: Assert down stopped on the drive, saying what would be lost, and left it mounted and logged in
      ansible.builtin.assert:
        that:
          - side_effect_unsynced.rc == 2
          - side_effect_unsynced.stdout is search('did not read synced within 10 s')
          - side_effect_unsynced.stdout is search('would be lost with the host')
          - side_effect_kept.rc == 0
        fail_msg: >-
          down with an unsynced drive gave rc {{ side_effect_unsynced.rc }}:
          {{ side_effect_unsynced.stdout_lines | select('search', 'failed') | list }};
          mount rc {{ side_effect_kept.rc }}

    - name: Let the stub's tresor read synced again
      ansible.builtin.file:
        path: /home/porelo-test/.local/share/tresorit/stub-state/never-idle
        state: absent

    - name: Run down on the host itself, as host down does, its steps as JSON lines
      # Each line stamped with when it came, beside the output, so the steps' usual durations can be read.
      ansible.builtin.shell:
        cmd: >-
          set -o pipefail && ansible-playbook -c local -i /root/porelo-host-inventory.yml porelo.host.down
          | tee >(while IFS= read -r l; do printf '%(%s)T %s\n' -1 "$l"; done > /root/timed-4-down.lines)
        executable: /bin/bash
      environment:
        ANSIBLE_STDOUT_CALLBACK: porelo.host.lines
        LC_ALL: C.UTF-8
      register: side_effect_down
      failed_when: false
      changed_when: >-
        side_effect_down.stdout is search('"state": "changed"')

    # The steps' durations as this run measured them, from each step's start to the next line after its last; read by
    # hand into the playbooks' porelo_host_step blocks, nothing asserted.
    - name: Read how long each step of up and down took
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - |
            import glob, json
            for path in sorted(glob.glob("/root/timed-*.lines")):
                rows = []
                for line in open(path):
                    stamp, _, text = line.partition(" ")
                    try:
                        data = json.loads(text)
                    except ValueError:
                        continue
                    rows.append((int(stamp), data))
                current = None
                for at, data in rows:
                    if data.get("state") == "started" and "text" in data:
                        if current:
                            print(path, current[1], at - current[0], sep="\t")
                        current = (at, data["text"])
                if current and rows:
                    print(path, current[1], rows[-1][0] - current[0], sep="\t")
      register: side_effect_durations
      changed_when: false

    - name: Show how long each step took
      ansible.builtin.debug:
        var: side_effect_durations.stdout_lines

    - name: Read every running container of the account after down
      ansible.builtin.command:
        argv: [podman, ps, --format, "{% raw %}{{.Names}}{% endraw %}"]
      become: true
      become_user: porelo-test
      environment:
        XDG_RUNTIME_DIR: "/run/user/{{ ansible_facts['getent_passwd']['porelo-test'][1] }}"
      register: side_effect_running_containers
      changed_when: false

    - name: Assert down left no running container of the account
      ansible.builtin.assert:
        that: side_effect_running_containers.stdout_lines | length == 0
        fail_msg: >-
          asked for no running container after down, got {{ side_effect_running_containers.stdout_lines }};
          down rc {{ side_effect_down.rc }}: {{ side_effect_down.stdout }}

    - name: Assert down succeeded
      ansible.builtin.assert:
        that: side_effect_down.rc == 0
        fail_msg: "asked for down rc 0, got {{ side_effect_down.rc }}: {{ side_effect_down.stdout }}"

    - name: Read whether the task's CA file is left after down
      ansible.builtin.stat:
        path: "{{ ansible_facts['getent_passwd']['porelo-test'][4] }}/.config/porelo/task-ca-certificates.pem"
      register: side_effect_task_ca
      when: side_effect_forge == 'on'

    - name: Read the person's CA bundle after down
      ansible.builtin.slurp:
        src: "{{ ansible_facts['getent_passwd']['porelo-test'][4] }}/.config/porelo/ca-certificates.pem"
      register: side_effect_ca_after
      when: side_effect_forge == 'on'

    - name: Assert down removed task trust and only the forge's marked block from the person's bundle
      ansible.builtin.assert:
        that:
          - not side_effect_task_ca.stat.exists
          - "'porelo-host forge CA' not in (side_effect_ca_after.content | b64decode)"
          - side_effect_ca_after.content | b64decode == side_effect_person_ca
        fail_msg: >-
          asked for no task CA and only the person's certificates left;
          task file {{ side_effect_task_ca.stat }}, account {{ side_effect_ca_after.content | b64decode }},
          expected {{ side_effect_person_ca }}
      vars:
        side_effect_person_ca: >-
          {{ side_effect_ca_before.results[0].content | b64decode
          | regex_replace('(?ms)^# BEGIN porelo-host forge CA\n.*?^# END porelo-host forge CA\n?', '') }}
      when: side_effect_forge == 'on'

    - name: Read the host's name mappings after down
      ansible.builtin.slurp:
        src: /etc/hosts
      register: side_effect_hosts_after
      when: side_effect_forge == 'on'

    - name: Assert down removed the forge's marked name mapping
      ansible.builtin.assert:
        that: "'porelo-host forge name' not in (side_effect_hosts_after.content | b64decode)"
        fail_msg: >-
          asked for no forge name block after down, got {{ side_effect_hosts_after.content | b64decode }}
      when: side_effect_forge == 'on'

    - name: Read whether the account's containers are still kept from the host's names after down
      ansible.builtin.stat:
        path: "{{ ansible_facts['getent_passwd']['porelo-test'][4]
          }}/.config/containers/containers.conf.d/porelo-host-hosts.conf"
      register: side_effect_hosts_dropin
      when: side_effect_forge == 'on'

    - name: Assert down removed the account's Podman setting for the host's names
      ansible.builtin.assert:
        that: not side_effect_hosts_dropin.stat.exists
        fail_msg: asked for no porelo-host-hosts.conf in porelo-test's Podman configuration after down, got one
      when: side_effect_forge == 'on'

    - name: Read whether the gathered push and its settings are left after down
      ansible.builtin.stat:
        path: "{{ item }}"
      loop: [/usr/local/sbin/porelo-host-push, /etc/porelo-host/forge/push.conf]
      register: side_effect_gathered
      when: side_effect_forge == 'on'

    - name: Assert down took the gathered push and its settings
      ansible.builtin.assert:
        that: side_effect_gathered.results | selectattr('stat.exists') | list | length == 0
        fail_msg: >-
          asked for neither the gathered push nor its settings after down; left
          {{ side_effect_gathered.results | selectattr('stat.exists') | map(attribute='item') | list }}
      when: side_effect_forge == 'on'

    - name: Read whether the drive's folder is still mounted
      ansible.builtin.command:
        cmd: findmnt --noheadings --mountpoint {{ side_effect_drive }}
      register: side_effect_mount
      changed_when: false
      failed_when: false

    - name: Assert down left the drive unmounted
      ansible.builtin.assert:
        that: side_effect_mount.rc != 0
        fail_msg: "{{ side_effect_drive }} is still mounted after down: {{ side_effect_mount.stdout }}"

    - name: Read whether the VPN's interface is still there
      ansible.builtin.command:
        cmd: ip link show wg-porelo
      register: side_effect_vpn
      changed_when: false
      failed_when: false

    - name: Read whether the VPN's file is still there
      ansible.builtin.stat:
        path: /etc/wireguard/wg-porelo.conf
      register: side_effect_vpn_conf

    - name: Assert down took the VPN's interface and its file
      ansible.builtin.assert:
        that:
          - side_effect_vpn.rc != 0
          - not side_effect_vpn_conf.stat.exists
        fail_msg: "after down: interface rc {{ side_effect_vpn.rc }}, file {{ side_effect_vpn_conf.stat.exists }}"

    - name: Read the client's stub's state after down
      ansible.builtin.find:
        paths: /home/porelo-test/.local/share/tresorit/stub-state
      register: side_effect_stub

    - name: Assert down logged the client out with --unlink and stopped every sync
      ansible.builtin.assert:
        that: side_effect_stub.files | map(attribute='path') | map('basename') | list == ['unlinked']
        fail_msg: "the stub's state after down: {{ side_effect_stub.files | map(attribute='path') | list }}"

    - name: Ask Porelo whether the account still has a vault
      ansible.builtin.command:
        cmd: porelo vault status
      become: true
      become_user: porelo-test
      environment:
        XDG_RUNTIME_DIR: /run/user/1001
      register: side_effect_vault
      changed_when: false
      failed_when: false

    - name: Assert down cleared the vault
      ansible.builtin.assert:
        that: side_effect_vault.rc == 4
        fail_msg: "after down, porelo vault status gave {{ side_effect_vault.rc }}: {{ side_effect_vault.stdout }}"

    - name: Ask Porelo whether the task started by hand still runs
      ansible.builtin.command:
        cmd: porelo task status porelo-converge-converge-1 --json
      become: true
      become_user: porelo-test
      environment:
        XDG_RUNTIME_DIR: /run/user/1001
      register: side_effect_task
      changed_when: false

    - name: Assert down stopped the task and kept it
      ansible.builtin.assert:
        that:
          - not (side_effect_task.stdout | from_json).running
          - (side_effect_task.stdout | from_json).state != 'absent'
        fail_msg: "after down, porelo task status gave {{ side_effect_task.stdout }}"

    - name: Ask systemd whether the homeserver unit is still active after down
      ansible.builtin.command:
        argv: [systemctl, --user, is-active, porelo-matrix-homeserver]
      become: true
      become_user: porelo-test
      environment:
        XDG_RUNTIME_DIR: /run/user/1001
      register: side_effect_homeserver
      changed_when: false
      failed_when: false

    - name: Assert down left the homeserver unit not active
      ansible.builtin.assert:
        that: side_effect_homeserver.stdout != 'active'
        fail_msg: >-
          asked for porelo-matrix-homeserver not to be active after down,
          got '{{ side_effect_homeserver.stdout }}' (rc {{ side_effect_homeserver.rc }})

    - name: Try the person's key as the account after down
      ansible.builtin.command:
        argv: [ssh, -o, BatchMode=yes, -o, IdentitiesOnly=yes, -o, StrictHostKeyChecking=accept-new,
               -o, UserKnownHostsFile=/root/person-known-hosts, -i, /root/person-ssh, porelo-test@127.0.0.1, "true"]
      register: side_effect_person_ssh
      changed_when: false
      failed_when: false

    - name: Assert down took the person's key off the account
      ansible.builtin.assert:
        that: side_effect_person_ssh.rc == 255 and side_effect_person_ssh.stderr is search('Permission denied')
        fail_msg: >-
          after down, ssh as porelo-test: rc {{ side_effect_person_ssh.rc }}, {{ side_effect_person_ssh.stderr }}

    # The forge role's down: nothing of the forge runs or would start again, and none of its secrets stays behind.
    - name: Search the forge's accounts for the person's token, outside the images' layers
      ansible.builtin.command:
        argv: [grep, -rFl, --exclude-dir=overlay, --exclude-dir=overlay-layers, --exclude-dir=overlay-images,
               -f, /root/forge-central.token, /home/porelo-forge, /home/porelo-runner]
      register: side_effect_forge_token
      changed_when: false
      failed_when: false
      no_log: true
      when: side_effect_forge == 'on'

    - name: Ask which processes the forge's accounts still run
      ansible.builtin.command:
        cmd: pgrep -a -u porelo-forge,porelo-runner
      register: side_effect_forge_processes
      changed_when: false
      failed_when: false
      when: side_effect_forge == 'on'

    - name: Read what of the forge's units and secrets is left
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - /home/porelo-forge/.config/containers/systemd/forgejo.container
        - /home/porelo-runner/.config/containers/systemd/forgejo-runner.container
        - /home/porelo-forge/.config/porelo-forge/api.token
        - /home/porelo-runner/runner/.runner
        - /etc/porelo-host/forge/ca.key
        - /etc/porelo-host/forge/agents
        - /etc/porelo-host/forge/person.password
        - /etc/systemd/system/porelo-forge-https.socket
        - /etc/systemd/system/porelo-forge-https.service
      register: side_effect_forge_left
      when: side_effect_forge == 'on'
      no_log: true

    - name: Ask systemd whether either forge HTTPS unit is still loaded after down
      ansible.builtin.command:
        argv: [systemctl, show, --property=LoadState, --value, porelo-forge-https.socket, porelo-forge-https.service]
      register: side_effect_forge_https_loaded
      changed_when: false
      failed_when: false
      when: side_effect_forge == 'on'

    - name: Assert down removed both HTTPS units that up installed
      ansible.builtin.assert:
        that:
          - side_effect_forge_https_before['results'] | selectattr('stat.exists') | list | length == 2
          - side_effect_forge_https_loaded['stdout_lines'] | select | list == ['not-found', 'not-found']
        fail_msg: >-
          asked for both forge HTTPS units before down and neither loaded afterward;
          before {{ side_effect_forge_https_before['results'] | selectattr('stat.exists')
          | map(attribute='item') | list }}, after rc {{ side_effect_forge_https_loaded['rc'] }}:
          {{ side_effect_forge_https_loaded['stdout'] }} {{ side_effect_forge_https_loaded['stderr'] }}
      when: side_effect_forge == 'on'

    - name: Read which pool VMs or volumes libvirt still lists, and what of the pool's keys or unit is left
      ansible.builtin.shell:
        cmd: |
          set -euo pipefail
          domains=$(virsh -c qemu:///system list --all --name)
          volumes=$(virsh -c qemu:///system vol-list images | awk 'NR > 2 {print $1}')
          printf '%s\n' "$domains" | grep '^porelo-pool-' || true
          printf '%s\n' "$volumes" | grep -E '^porelo-pool-(ubuntu|fedora)-' || true
          find /var/lib/porelo-host/pool -maxdepth 1 \
              \( -name 'porelo-pool-*' -o -name 'run-key*' -o -name cloud-config \) 2>/dev/null || true
          for path in /etc/porelo-host/pool /etc/systemd/system/porelo-pool-revert.service; do
              [ ! -e "$path" ] || echo "$path"
          done
        executable: /bin/bash
      register: side_effect_pool_left
      changed_when: false
      when: side_effect_vm_pool == 'on'

    - name: >-
        Assert down deleted the run key's Actions secret from the forge and left no pool VM, no pool volume, none of
        the pool's keys and no revert unit
      ansible.builtin.assert:
        that:
          - side_effect_pool_secret | map(attribute='state') | list == ['changed', 'ok']
          - side_effect_pool_left.stdout | trim == ''
        fail_msg: "after down: secret {{ side_effect_pool_secret }}; left {{ side_effect_pool_left.stdout_lines }}"
      vars:
        side_effect_pool_secret: >-
          {{ (side_effect_unsynced.stdout_lines + side_effect_down.stdout_lines) | select | map('from_json')
          | selectattr('task', 'defined')
          | selectattr('task', 'search', "down \\| Delete the run key's Actions secret from the forge")
          | rejectattr('state', 'equalto', 'started') | list }}
      when: side_effect_vm_pool == 'on'

    - name: Assert down left none of the forge's secrets, nothing of it running, and no unit to start it again
      ansible.builtin.assert:
        that:
          - side_effect_forge_token.rc == 1
          - side_effect_forge_processes.rc == 1
          - side_effect_forge_left.results | selectattr('stat.exists') | list | length == 0
        fail_msg: >-
          after down, the person's token is in {{ side_effect_forge_token.stdout_lines }};
          running: {{ side_effect_forge_processes.stdout_lines }};
          left: {{ side_effect_forge_left.results | selectattr('stat.exists') | map(attribute='item') | list }}
      when: side_effect_forge == 'on'
