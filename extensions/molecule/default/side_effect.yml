---
# Runs `down` on the host itself with the same v2 inventory, after verify has read what `up` left, and checks that
# `down` leaves no service account, linger file, process, VPN interface, host summary, /etc/hosts block, forge unit or
# pool VM behind.
- name: Side effect
  hosts: all
  gather_facts: false
  become: true
  vars:
    side_effect_vm_pool: "{{ lookup('ansible.builtin.env', 'PORELO_HOST_MOLECULE_POOL', default='on') }}"
    side_effect_forge: "{{ lookup('ansible.builtin.env', 'PORELO_HOST_MOLECULE_FORGE', default='on') }}"
    side_effect_expected_accounts: >-
      {{ ['porelo-matrix'] + (['porelo-forge', 'porelo-runner'] if side_effect_forge == 'on' else []) }}
  tasks:
    # Check that up placed what down is expected to remove, so teardown cannot pass vacuously.
    - name: Read every account on the host before down
      ansible.builtin.getent:
        database: passwd

    - name: Keep the numeric UIDs of the host's service accounts before down deletes them
      ansible.builtin.set_fact:
        side_effect_service_uids: >-
          {{ side_effect_expected_accounts | select('in', ansible_facts['getent_passwd'])
          | map('extract', ansible_facts['getent_passwd']) | map(attribute=1) | list }}

    - name: Read host.json, the linger files and any forge HTTPS units before down
      ansible.builtin.stat:
        path: "{{ item }}"
      loop: >-
        {{ ['/etc/porelo-host/host.json', '/var/lib/systemd/linger/porelo-matrix']
        + (['/var/lib/systemd/linger/porelo-forge', '/var/lib/systemd/linger/porelo-runner',
            '/etc/systemd/system/porelo-forge-https.socket', '/etc/systemd/system/porelo-forge-https.service']
           if side_effect_forge == 'on' else []) }}
      register: side_effect_before_paths

    - name: Read /etc/hosts before down
      ansible.builtin.slurp:
        src: /etc/hosts
      register: side_effect_hosts_before

    - name: Read whether wg-porelo exists before down
      ansible.builtin.command:
        argv: [ip, link, show, wg-porelo]
      register: side_effect_vpn_before
      changed_when: false
      failed_when: false

    - name: Assert the service accounts, linger files, host.json, /etc/hosts blocks and wg-porelo exist before down
      ansible.builtin.assert:
        that:
          - side_effect_service_uids | length == (side_effect_expected_accounts | length)
          - side_effect_before_paths.results | rejectattr('stat.exists') | list | length == 0
          - "'porelo-host matrix name' in side_effect_hosts_text"
          - "'matrix.alpha.porelo.internal' in side_effect_hosts_text"
          - side_effect_forge != 'on' or 'porelo-host forge name' in side_effect_hosts_text
          - side_effect_forge != 'on' or 'forge.alpha.porelo.internal' in side_effect_hosts_text
          - side_effect_vpn_before.rc == 0
        fail_msg: >-
          asked for accounts {{ side_effect_expected_accounts }}, paths, /etc/hosts blocks and wg-porelo before down;
          got uids {{ side_effect_service_uids }}, missing paths
          {{ side_effect_before_paths.results | rejectattr('stat.exists') | map(attribute='item') | list }},
          wg rc {{ side_effect_vpn_before.rc }}, hosts {{ side_effect_hosts_text }}
      vars:
        side_effect_hosts_text: "{{ side_effect_hosts_before.content | b64decode }}"

    - name: Run down on the host itself with the v2 inventory, its steps as JSON lines
      # Each line stamped with when it came, beside the output, so the steps' usual durations can be read.
      ansible.builtin.shell:
        cmd: >-
          set -o pipefail && ansible-playbook -c local -i /root/porelo-host-inventory.yml porelo.host.down
          | tee >(while IFS= read -r l; do printf '%(%s)T %s\n' -1 "$l"; done > /root/timed-3-down.lines)
        executable: /bin/bash
      environment:
        ANSIBLE_STDOUT_CALLBACK: porelo.host.lines
        LC_ALL: C.UTF-8
      register: side_effect_down
      changed_when: >-
        side_effect_down.stdout is search('"state": "changed"')
      failed_when: false

    # The steps' durations as this run measured them, from each step's start to the next line after its last; read by
    # hand into the playbooks' porelo_host_step blocks, nothing asserted.
    - name: Read how long each step of up and down took
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - |
            import glob, json
            for path in sorted(glob.glob("/root/timed-*.lines")):
                rows = []
                for line in open(path):
                    stamp, _, text = line.partition(" ")
                    try:
                        data = json.loads(text)
                    except ValueError:
                        continue
                    rows.append((int(stamp), data))
                current = None
                for at, data in rows:
                    if data.get("state") == "started" and "text" in data:
                        if current:
                            print(path, current[1], at - current[0], sep="\t")
                        current = (at, data["text"])
                if current and rows:
                    print(path, current[1], rows[-1][0] - current[0], sep="\t")
      register: side_effect_durations
      changed_when: false

    - name: Show how long each step took
      ansible.builtin.debug:
        var: side_effect_durations.stdout_lines

    - name: Assert down succeeded with rc 0 and no failed or waiting line
      ansible.builtin.assert:
        that:
          - side_effect_down.rc == 0
          - side_effect_down_lines | selectattr('state', 'in', ['failed', 'waiting']) | list | length == 0
        fail_msg: "asked for down rc 0 with no failed or waiting line, got rc {{ side_effect_down.rc }}:
          {{ side_effect_down.stdout }}"
      vars:
        side_effect_down_lines: "{{ side_effect_down.stdout_lines | select | map('from_json') | list }}"

    - name: Ask getent passwd whether porelo-forge, porelo-runner or porelo-matrix still exists after down
      ansible.builtin.command:
        argv: [getent, passwd, "{{ item }}"]
      loop: [porelo-forge, porelo-runner, porelo-matrix]
      register: side_effect_accounts_after
      changed_when: false
      failed_when: side_effect_accounts_after.rc not in [0, 2]

    - name: Assert down removed porelo-forge, porelo-runner and porelo-matrix
      ansible.builtin.assert:
        that: side_effect_accounts_after.results | map(attribute='rc') | list == [2, 2, 2]
        fail_msg: >-
          asked for no account porelo-forge, porelo-runner or porelo-matrix after down;
          got {{ side_effect_accounts_after.results | selectattr('rc', 'equalto', 0) | map(attribute='stdout') | list }}

    - name: Ask pgrep whether any process still runs under the service accounts' former UIDs
      ansible.builtin.command:
        argv: [pgrep, -a, -u, "{{ side_effect_service_uids | join(',') }}"]
      register: side_effect_processes_after
      changed_when: false
      failed_when: false

    - name: Assert down left no process running under the removed service accounts' UIDs
      ansible.builtin.assert:
        that: side_effect_processes_after.rc == 1
        fail_msg: >-
          asked pgrep for no process under UIDs {{ side_effect_service_uids }} (rc 1);
          got rc {{ side_effect_processes_after.rc }}: {{ side_effect_processes_after.stdout_lines }}

    - name: Read whether any home, linger file, host.json, VPN file or forge file remains after down
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - /home/porelo-forge
        - /home/porelo-runner
        - /home/porelo-matrix
        - /var/lib/systemd/linger/porelo-forge
        - /var/lib/systemd/linger/porelo-runner
        - /var/lib/systemd/linger/porelo-matrix
        - /etc/porelo-host/host.json
        - /etc/wireguard/wg-porelo.conf
        - /etc/wireguard/porelo-host.key
        - /etc/porelo-host/vpn.conf
        - /etc/porelo-host/forge
        - /etc/porelo-host/forge.conf
        - /usr/local/sbin/porelo-host-forge-password
        - /usr/local/sbin/porelo-host-push
        - /run/porelo-host/forge-central.token
        - /etc/systemd/system/porelo-forge-https.socket
        - /etc/systemd/system/porelo-forge-https.service
      register: side_effect_paths_after

    - name: Assert down removed every home, linger file, host.json, VPN file and forge file
      ansible.builtin.assert:
        that: side_effect_paths_after.results | selectattr('stat.exists') | list | length == 0
        fail_msg: >-
          asked for no service home, linger file, host.json, VPN file or forge file after down;
          left {{ side_effect_paths_after.results | selectattr('stat.exists') | map(attribute='item') | list }}

    - name: Read whether the VPN interface wg-porelo still exists after down
      ansible.builtin.command:
        argv: [ip, link, show, wg-porelo]
      register: side_effect_vpn_after
      changed_when: false
      failed_when: false

    - name: Assert down took the VPN interface wg-porelo down
      ansible.builtin.assert:
        that: side_effect_vpn_after.rc != 0
        fail_msg: >-
          asked for wg-porelo to be absent after down;
          got rc {{ side_effect_vpn_after.rc }}: {{ side_effect_vpn_after.stdout }}

    - name: Read /etc/hosts after down
      ansible.builtin.slurp:
        src: /etc/hosts
      register: side_effect_hosts_after

    - name: Assert down removed the forge.alpha and matrix.alpha blocks and names from /etc/hosts
      ansible.builtin.assert:
        that:
          - "'porelo-host forge name' not in side_effect_hosts_text"
          - "'porelo-host matrix name' not in side_effect_hosts_text"
          - "'forge.alpha' not in side_effect_hosts_text"
          - "'matrix.alpha' not in side_effect_hosts_text"
        fail_msg: >-
          asked /etc/hosts to hold no forge.alpha or matrix.alpha block after down;
          got {{ side_effect_hosts_text }}
      vars:
        side_effect_hosts_text: "{{ side_effect_hosts_after.content | b64decode }}"

    - name: Ask systemd whether either forge HTTPS unit is still loaded after down
      ansible.builtin.command:
        argv: [systemctl, show, --property=LoadState, --value, porelo-forge-https.socket, porelo-forge-https.service]
      register: side_effect_forge_https_loaded
      changed_when: false
      failed_when: false
      when: side_effect_forge == 'on'

    - name: Assert neither forge HTTPS unit remains loaded after down
      ansible.builtin.assert:
        that: side_effect_forge_https_loaded['stdout_lines'] | select | list == ['not-found', 'not-found']
        fail_msg: >-
          asked for neither forge HTTPS unit loaded after down;
          got rc {{ side_effect_forge_https_loaded['rc'] }}:
          {{ side_effect_forge_https_loaded['stdout'] }} {{ side_effect_forge_https_loaded['stderr'] }}
      when: side_effect_forge == 'on'

    - name: Read which pool VMs or volumes libvirt still lists, and what of the pool's keys or unit is left
      ansible.builtin.shell:
        cmd: |
          set -euo pipefail
          domains=$(virsh -c qemu:///system list --all --name)
          volumes=$(virsh -c qemu:///system vol-list images | awk 'NR > 2 {print $1}')
          printf '%s\n' "$domains" | grep '^porelo-pool-' || true
          printf '%s\n' "$volumes" | grep -E '^porelo-pool-(ubuntu|fedora)-' || true
          find /var/lib/porelo-host/pool -maxdepth 1 \
              \( -name 'porelo-pool-*' -o -name 'run-key*' -o -name cloud-config \) 2>/dev/null || true
          for path in /etc/porelo-host/pool /etc/systemd/system/porelo-pool-revert.service; do
              [ ! -e "$path" ] || echo "$path"
          done
        executable: /bin/bash
      register: side_effect_pool_left
      changed_when: false
      when: side_effect_vm_pool == 'on'

    - name: Assert down left no pool VM, no pool volume, none of the pool's keys and no revert unit
      ansible.builtin.assert:
        that: side_effect_pool_left.stdout | trim == ''
        fail_msg: >-
          asked for no pool VM, volume, key, /etc/porelo-host/pool or porelo-pool-revert.service after down;
          left {{ side_effect_pool_left.stdout_lines }}
      when: side_effect_vm_pool == 'on'
