---
# Does inside the VM what `host up` does on a host for the host admin's act: Ubuntu's own ansible-core, the collection
# from its tarball, and `up` run on the machine itself with no project and no person.
- name: Converge
  hosts: all
  gather_facts: false
  become: true
  vars:
    converge_tarball: "{{ lookup('ansible.builtin.env', 'PORELO_HOST_TARBALL') }}"
    converge_packages: "{{ lookup('ansible.builtin.env', 'PORELO_HOST_PACKAGES') }}"
    converge_host_version: "{{ lookup('ansible.builtin.env', 'PORELO_HOST_PACKAGE_VERSION') }}"
    converge_remote_packages: >-
      /root/porelo-packages-{{ lookup('ansible.builtin.file', converge_packages ~ '/SHA256SUMS') | hash('sha256') }}
    converge_vm_pool: "{{ lookup('ansible.builtin.env', 'PORELO_HOST_MOLECULE_POOL', default='on') }}"
    converge_forge: "{{ lookup('ansible.builtin.env', 'PORELO_HOST_MOLECULE_FORGE', default='on') }}"
    converge_kvm_asked: "{{ lookup('ansible.builtin.env', 'PORELO_HOST_MOLECULE_KVM', default='on') }}"
  tasks:
    # Whether nested virtualization reaches the Molecule VM itself, so a slow pool VM in CI can be told apart.
    - name: Read whether /dev/kvm exists on the Molecule VM
      ansible.builtin.stat:
        path: /dev/kvm
      register: converge_kvm

    - name: Read the CPU's flags from /proc/cpuinfo
      ansible.builtin.command:
        cmd: grep -m1 '^flags' /proc/cpuinfo
      register: converge_cpu_flags
      changed_when: false
      failed_when: false

    - name: Print whether /dev/kvm exists and whether the CPU flags carry vmx or svm
      ansible.builtin.debug:
        msg: >-
          /dev/kvm={{ converge_kvm.stat.exists }},
          vmx/svm={{ converge_cpu_flags.stdout.split(':', 1) | last | split | intersect(['vmx', 'svm']) }}

    - name: Say when the VM pool is left out of this run
      ansible.builtin.debug:
        msg: >-
          the VM pool is left out of this run (PORELO_HOST_MOLECULE_POOL=off): its VM did not say ready on GitHub's
          runner; build/molecule.sh runs it locally
      when: converge_vm_pool == 'off'

    - name: Install Ubuntu's own ansible-core
      ansible.builtin.apt:
        name: ansible-core
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Copy the collection's tarball onto the host
      ansible.builtin.copy:
        src: "{{ converge_tarball }}"
        dest: /root/porelo-host.tar.gz
        owner: root
        group: root
        mode: "0600"
      notify: Install the collection from that tarball

    - name: Install the collection before up runs
      ansible.builtin.meta: flush_handlers

    - name: Require local packages before the first up
      ansible.builtin.assert:
        that:
          - converge_packages | length > 0
          - converge_host_version | length > 0
        fail_msg: PORELO_HOST_PACKAGES and PORELO_HOST_PACKAGE_VERSION must come from the staged local packages

    - name: Copy the local packages before up installs anything
      ansible.builtin.copy:
        src: "{{ converge_packages }}/"
        dest: "{{ converge_remote_packages }}/"
        owner: root
        group: root
        mode: "0600"
        directory_mode: "0700"

    - name: Read the local Porelo version when supplied
      ansible.builtin.set_fact:
        converge_porelo_version: >-
          {{ lookup('ansible.builtin.file', converge_packages ~ '/porelo.version', errors='ignore')
             | default('', true) | trim }}

    - name: Check the package set again on the host before up
      ansible.builtin.command:
        argv: [sha256sum, --check, --strict, SHA256SUMS]
        chdir: "{{ converge_remote_packages }}"
      changed_when: false

    - name: Write the v2 inventory host up writes for host alpha on network 7
      ansible.builtin.copy:
        dest: /root/porelo-host-inventory.yml
        owner: root
        group: root
        mode: "0600"
        content: |
          all:
            hosts:
              localhost:
            vars:
              porelo_host_inventory_version: 2
              porelo_host_name: alpha
              porelo_host_network: 7
              porelo_host_distribution: snapshots
              porelo_local_packages: {{ converge_remote_packages | to_json }}
              porelo_host_version: {{ converge_host_version | to_json }}
          {% if converge_porelo_version | length > 0 %}
              porelo_version: {{ converge_porelo_version | to_json }}
          {% endif %}
              porelo_host_forge: {{ (converge_forge == 'on') | lower }}
              porelo_host_kvm: {{ (converge_kvm_asked == 'on') | lower }}
          {% if converge_forge == 'on' %}
              # Lets Forgejo migrate from the stand-in central organization on the host's own forge.
              forge_migrations_allow_local: true
          {% endif %}
              # Job bounds of the test VM's size: the runner's jobs and the pool share half of its 4 vCPUs and 6 GiB.
              # One job, not the default two, so the written capacity is the variable's.
              forge_runner_capacity: 1
              forge_job_cpus: 1
              forge_job_memory: 768m
              forge_job_omp_num_threads: 1
          {% if converge_vm_pool == 'on' %}
              # One pool VM, small enough for the test VM, which holds it nested.
              porelo_host_vm_pool: {systems: [ubuntu], accounts: 1}
              vm_pool_memory: 1024
          {% endif %}

    # What the host admin's desktop hands over for the organization: a read key is made on the host at up.
    - name: Make the fixture key of the organization's host admin and the machine file's directory
      ansible.builtin.shell:
        cmd: |
          set -eu
          umask 077
          mkdir -p /root/verify-org /etc/porelo-host/setup
          [ -e /root/verify-org/hostadmin ] || ssh-keygen -q -t ed25519 -N "" -C "" -f /root/verify-org/hostadmin
        creates: /root/verify-org/hostadmin

    - name: Read the host's own key and the host admin's, for the machine file
      ansible.builtin.slurp:
        src: "{{ item }}"
      loop: [/root/verify-org/hostadmin.pub, /etc/ssh/ssh_host_ed25519_key.pub]
      register: converge_machine_keys

    - name: Write the machine file's organization handover
      ansible.builtin.copy:
        dest: /etc/porelo-host/setup/machine.yml
        owner: root
        group: root
        mode: "0600"
        content: "{{ {'organization': converge_organization} | to_nice_yaml }}"
      vars:
        converge_organization:
          settings: "organization: {address: 'git@central.example:acme/organization.git', forge: central.example}\n"
          known_hosts: "central.example {{ (converge_machine_keys.results[1].content | b64decode).split()[:2]
            | join(' ') }}\n"
          pin: "hostadmin {{ (converge_machine_keys.results[0].content | b64decode).split()[:2] | join(' ') }}\n"

    # Stands in for the host admin: Molecule's own key is pinned for root, as `host up` pins the card's key. Once SSH
    # reads only /etc/ssh/authorized_keys/%u, the VM's own login keeps its key there, as an admitted login would.
    - name: Make root's SSH directory for the pinned host admin key
      ansible.builtin.file:
        path: /root/.ssh
        state: directory
        owner: root
        group: root
        mode: "0700"

    - name: Make the directory SSH reads each login's keys from
      ansible.builtin.file:
        path: /etc/ssh/authorized_keys
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Pin Molecule's key as the host admin's, and keep it for the VM's own login
      ansible.builtin.shell:
        cmd: |
          set -eu
          key=$(awk '$1 == "ssh-ed25519" { print $1 " " $2; exit }' ~{{ ansible_user }}/.ssh/authorized_keys)
          [ -n "$key" ]
          for target in /root/.ssh/authorized_keys /etc/ssh/authorized_keys/{{ ansible_user }}; do
              if [ "$(cat "$target" 2>/dev/null)" != "$key" ]; then
                  printf '%s\n' "$key" > "$target.new" && chmod 0644 "$target.new" && mv -f "$target.new" "$target"
                  echo changed
              fi
          done
        executable: /bin/bash
      register: converge_admin_key
      changed_when: "'changed' in converge_admin_key.stdout"

    # Once: the first up, before Porelo's handed-over packages are installed over the published ones.
    - name: Read whether the first up ran
      ansible.builtin.stat:
        path: /root/porelo-host-first-up.lines
      register: converge_first_seen

    # Before the first up: a machine lacking several things hears them together, and nothing on it changes.
    - name: Run an up that asks more than this machine has, with a port taken
      ansible.builtin.shell:
        cmd: |
          set -uo pipefail
          python3 -c 'import socket, time
          s = socket.socket(); s.bind(("127.0.0.1", 3001)); s.listen(); time.sleep(1800)' &
          holder=$!
          trap 'kill "$holder"' EXIT
          for _ in {1..50}; do
              (exec 3<>/dev/tcp/127.0.0.1/3001) 2>/dev/null && break
              sleep 0.1
          done
          (exec 3<>/dev/tcp/127.0.0.1/3001) || { echo "rc=no listener"; exit 0; }
          # A file's size, time, mode, owner and link as well as its name, so a rewrite shows too.
          look() {
              dpkg -l
              find /etc /var/lib -xdev \( -path /var/lib/systemd -o -path /var/lib/apt/lists -o -path /var/lib/cloud \
                  -o -path /var/lib/private -o -path /var/lib/snapd \
                  -o -path /var/lib/ubuntu-release-upgrader \) -prune \
                  -o -type d -printf '%p %m %u %g\n' -o -printf '%p %s %T@ %m %u %g %l\n' | sort
          }
          look > /root/converge-before-refusal
          ansible-playbook -c local -i /root/porelo-host-inventory.yml porelo.host.up \
              -e '{"porelo_host_kvm": true, "forge_runner_capacity": 64}' > /root/converge-refused.lines
          echo "rc=$?"
          look | diff /root/converge-before-refusal - && echo unchanged
        executable: /bin/bash
      environment:
        ANSIBLE_STDOUT_CALLBACK: porelo.host.lines
        LC_ALL: C.UTF-8
      register: converge_refused
      changed_when: false
      failed_when: false
      when:
        - converge_forge == 'on'
        - not converge_first_seen.stat.exists

    - name: Read the refused up's lines
      ansible.builtin.slurp:
        src: /root/converge-refused.lines
      register: converge_refused_lines
      when: converge_refused is not skipped

    - name: Assert the refusal named every lack at once and changed nothing
      ansible.builtin.assert:
        that:
          - converge_refused.stdout_lines[0] == 'rc=2'
          - "'unchanged' in converge_refused.stdout_lines"
          - converge_refused_failed | length == 1
          - converge_refused_failed[0].task is search('Stop on everything this machine lacks')
          - "'\"id\": \"jobs\"' in converge_refused_failed[0].msg"
          - "'\"id\": \"ports\"' in converge_refused_failed[0].msg"
          - >-
            (converge_kvm_asked == 'on') or '"id": "virtualization"' in converge_refused_failed[0].msg
        fail_msg: >-
          asked for one refusal of jobs and ports and nothing changed;
          got {{ converge_refused.stdout }} {{ converge_refused_failed }}
        quiet: true
      vars:
        converge_refused_failed: >-
          {{ (converge_refused_lines.content | b64decode).splitlines() | select | map('from_json')
             | selectattr('state', 'equalto', 'failed') | list }}
      when: converge_refused is not skipped

    - name: Run the first up
      # Each line stamped with when it came, beside the output, so the steps' usual durations can be read.
      ansible.builtin.shell:
        cmd: >-
          set -o pipefail && ansible-playbook -c local -i /root/porelo-host-inventory.yml porelo.host.up
          | tee >(while IFS= read -r l; do printf '%(%s)T %s\n' -1 "$l"; done > /root/timed-1-first-up.lines)
        executable: /bin/bash
      environment:
        ANSIBLE_STDOUT_CALLBACK: porelo.host.lines
        LC_ALL: C.UTF-8
      register: converge_first_up
      changed_when: true
      failed_when: false
      when: not converge_first_seen.stat.exists

    - name: Assert the first up ran to its end, with no stop of the host admin's left
      ansible.builtin.assert:
        that:
          - converge_first_up.rc == 0
          - converge_first_waiting | length == 0
          - converge_first_failed | length == 0
        fail_msg: >-
          asked the first up for rc 0 with no waiting and no failed step;
          got rc {{ converge_first_up.rc }} and lines {{ converge_first_up.stdout }}
      vars:
        converge_first_lines: "{{ converge_first_up.stdout_lines | select | map('from_json') | list }}"
        converge_first_waiting: "{{ converge_first_lines | selectattr('state', 'equalto', 'waiting') | list }}"
        converge_first_failed: "{{ converge_first_lines | selectattr('state', 'equalto', 'failed') | list }}"
      when: not converge_first_seen.stat.exists

    - name: Keep the first up's lines, so it runs once
      ansible.builtin.copy:
        dest: /root/porelo-host-first-up.lines
        content: "{{ converge_first_up.stdout }}\n"
        owner: root
        group: root
        mode: "0600"
      when: not converge_first_seen.stat.exists

    - name: Run up on the host itself again, its steps as JSON lines
      # Each line stamped with when it came, beside the output, so the steps' usual durations can be read.
      ansible.builtin.shell:
        cmd: >-
          set -o pipefail && ansible-playbook -c local -i /root/porelo-host-inventory.yml porelo.host.up
          | tee >(while IFS= read -r l; do printf '%(%s)T %s\n' -1 "$l"; done > /root/timed-2-up.lines)
        executable: /bin/bash
      environment:
        ANSIBLE_STDOUT_CALLBACK: porelo.host.lines
        LC_ALL: C.UTF-8
      register: converge_up
      changed_when: >-
        converge_up.stdout is search('"state": "changed"')

    - name: Print the installation time measured around the complete successful up
      ansible.builtin.debug:
        msg: >-
          installation time measured around the complete up, including its other steps:
          {{ converge_up.delta }} ({{ converge_up.start }} to {{ converge_up.end }})
        verbosity: 0

    - name: Keep the lines of the last up for verify
      ansible.builtin.copy:
        dest: /root/porelo-host-up.lines
        content: "{{ converge_up.stdout }}\n"
        owner: root
        group: root
        mode: "0600"
      changed_when: false

  handlers:
    - name: Install the collection from that tarball
      ansible.builtin.command:
        cmd: ansible-galaxy collection install --force /root/porelo-host.tar.gz
      changed_when: true
