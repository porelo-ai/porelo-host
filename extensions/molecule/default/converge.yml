---
# Does inside the VM what `host up` does on a host: Ubuntu's own ansible-core, the collection from its tarball, and
# `up` run on the machine itself.
- name: Converge
  hosts: all
  gather_facts: false
  become: true
  vars:
    converge_tarball: "{{ lookup('ansible.builtin.env', 'PORELO_HOST_TARBALL') }}"
    converge_account: porelo-test
    converge_packages: "{{ lookup('ansible.builtin.env', 'PORELO_HOST_PACKAGES') }}"
  tasks:
    - name: Install Ubuntu's own ansible-core
      ansible.builtin.apt:
        name: ansible-core
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Copy the collection's tarball onto the host
      ansible.builtin.copy:
        src: "{{ converge_tarball }}"
        dest: /root/porelo-host.tar.gz
        owner: root
        group: root
        mode: "0600"
      notify: Install the collection from that tarball

    - name: Install the collection before up runs
      ansible.builtin.meta: flush_handlers

    # Stands in for the part of Porelo's setup script up runs too, since the client's stub below goes into the
    # account's home before the first up: the script then finds the account and must leave it as it is.
    - name: Make the account as Porelo's setup script makes it
      ansible.builtin.user:
        name: "{{ converge_account }}"
        create_home: true
        shell: /bin/bash

    - name: Give the account its linger, as Porelo's setup script does
      ansible.builtin.command:
        cmd: loginctl enable-linger {{ converge_account }}
        creates: /var/lib/systemd/linger/{{ converge_account }}

    # Stands in for the person's drive: the host's VPN key is a file the role only names, never reads; here it is made
    # for the run, with the test peer's, which verify uses from a network namespace of its own.
    - name: Install WireGuard's tools to make the run's keys
      ansible.builtin.apt:
        name: wireguard-tools
        state: present

    # The host's key outside /etc/wireguard, where Ubuntu's AppArmor profile lets wg read it only by the role's rule;
    # the test peer's inside it, where the profile lets wg read it as it is.
    - name: Make the run's VPN keys, the host's and the test peer's
      ansible.builtin.shell:
        cmd: >-
          umask 077 && mkdir -p /etc/wireguard && wg genkey > {{ item }}.key
          && wg pubkey < {{ item }}.key > {{ item }}.pub
        creates: "{{ item }}.key"
      loop: [/root/vpn-host, /etc/wireguard/verify-peer]

    # Stands in for the person's ssh key, which porelo-host passes as porelo_host_authorized_key and logs in with as
    # the account itself, for the drive's login and the vault's step.
    - name: Make the person's ssh key for the run
      ansible.builtin.command:
        cmd: ssh-keygen -q -t ed25519 -N "" -C person -f /root/person-ssh
        creates: /root/person-ssh

    - name: Read the person's public ssh key
      ansible.builtin.slurp:
        src: /root/person-ssh.pub
      register: converge_person_public

    - name: Read the test peer's public key
      ansible.builtin.slurp:
        src: /etc/wireguard/verify-peer.pub
      register: converge_peer_public

    - name: Write the inventory host up writes
      ansible.builtin.copy:
        dest: /root/porelo-host-inventory.yml
        owner: root
        group: root
        mode: "0600"
        content: |
          all:
            hosts:
              localhost:
            vars:
              porelo_host_account: {{ converge_account }}
              # porelo vault status is in porelo's snapshots only, until a release carries it.
              porelo_host_distribution: snapshots
              # Tresorit is met only at a real up; here a stub of its client answers as the real one was measured.
              porelo_host_tresor: porelo-test-drive
              drive_sync_wait: 60
              porelo_host_vpn_peer_public_key: {{ converge_peer_public.content | b64decode | trim }}
              porelo_host_vpn_peer_address: 10.73.0.2/32
              porelo_host_authorized_key: {{ converge_person_public.content | b64decode | trim }}
              vpn_private_key_path: /root/vpn-host.key
              porelo_host_forge: true
              # The stand-in for the central forge is a repository on the host's own forge, at a private address.
              forge_migrations_allow_local: true

    # The client's stub in the place the installer puts the real one, so the role leaves it as an installed client.
    - name: Make the client's directory as the account's
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: "{{ converge_account }}"
        group: "{{ converge_account }}"
        mode: "0755"
      loop:
        - /home/{{ converge_account }}/.local
        - /home/{{ converge_account }}/.local/share
        - /home/{{ converge_account }}/.local/share/tresorit

    - name: Put the client's stub there
      ansible.builtin.copy:
        src: tresorit-cli
        dest: /home/{{ converge_account }}/.local/share/tresorit/tresorit-cli
        owner: "{{ converge_account }}"
        group: "{{ converge_account }}"
        mode: "0755"

    # Once, before the person's login: the drive is logged out, so up stops for it.
    - name: Read whether the first up ran
      ansible.builtin.stat:
        path: /root/porelo-host-first-up.lines
      register: converge_first_seen

    - name: Run up before the person's login, as the first host up does
      when: not converge_first_seen.stat.exists
      ansible.builtin.command:
        cmd: ansible-playbook -c local -i /root/porelo-host-inventory.yml porelo.host.up
      environment:
        ANSIBLE_STDOUT_CALLBACK: porelo.host.lines
        LC_ALL: C.UTF-8
      register: converge_first_up
      changed_when: true
      failed_when: false

    - name: Assert the first up stopped for the drive alone, with ansible-playbook's 2
      ansible.builtin.assert:
        that:
          - converge_first_up.rc == 2
          - converge_first_waiting | length == 1
          - converge_first_waiting[0].needs == ['drive', 'vault-new']
          - converge_first_failed | length == 0
        fail_msg: "the first up gave rc {{ converge_first_up.rc }} and these lines: {{ converge_first_up.stdout }}"
      vars:
        converge_first_lines: "{{ converge_first_up.stdout_lines | select | map('from_json') | list }}"
        converge_first_waiting: "{{ converge_first_lines | selectattr('state', 'equalto', 'waiting') | list }}"
        converge_first_failed: "{{ converge_first_lines | selectattr('state', 'equalto', 'failed') | list }}"
      when: not converge_first_seen.stat.exists

    - name: Keep the first up's lines, so it runs once
      ansible.builtin.copy:
        dest: /root/porelo-host-first-up.lines
        content: "{{ converge_first_up.stdout }}\n"
        owner: root
        group: root
        mode: "0600"
      when: not converge_first_seen.stat.exists

    # Porelo's packages from a build not yet published, when build/molecule.sh was given them: installed over the
    # published ones once the first up has installed those, and the account's daemon started again on them.
    - name: Copy Porelo's handed-over packages onto the host
      ansible.builtin.copy:
        src: "{{ converge_packages }}/"
        dest: /root/porelo-packages/
        owner: root
        group: root
        mode: "0600"
      when: converge_packages | length > 0
      notify: Install Porelo's handed-over packages and start the account's daemon on them

    - name: Install the handed-over packages before the next up
      ansible.builtin.meta: flush_handlers

    # Stands in for the person's project and their machine file on the drive: a project of its own in a local
    # repository, its commit signed by a key made for the run, the machine file naming that key's fingerprint and one
    # key file for the vault.
    - name: Make the run's project, signed, and the machine file on the drive
      ansible.builtin.shell:
        cmd: |
          set -euo pipefail
          ssh-keygen -q -t ed25519 -N "" -C converge-signer -f ~/.ssh/converge-signer
          mkdir ~/converge-project && cd ~/converge-project && git init -q -b main
          printf 'project:\n  name: "converge"\n  security_class: "offline"\nimage:\n  base_image: "ubuntu:24.04"\n' \
              > project.yml
          printf 'repositories:\n  code:\n    description: "Kept on this machine alone"\n' >> project.yml
          git add project.yml
          git -c user.name=converge -c user.email=converge@example.invalid -c gpg.format=ssh \
              -c user.signingkey="$HOME/.ssh/converge-signer.pub" commit -q -S -m "The run's project"
          drive=/srv/porelo-host/drive/porelo-host
          mkdir -p "$drive/keys" && (umask 077 && head -c 20 /dev/urandom | base64 > "$drive/keys/converge-key")
          signer=$(ssh-keygen -lf ~/.ssh/converge-signer.pub | cut -d' ' -f2)
          {
              echo 'project:'
              echo '  name: converge'
              echo "  url: \"$HOME/converge-project\""
              echo "  signed_by: \"$signer\""
              echo 'tasks:'
              echo '  - { name: converge-1, repository: code, agent: stub, package: porelo-agent-stub }'
              echo 'keys:'
              echo '  - { name: converge-key, path: keys/converge-key }'
          } > "$drive/machine.yml"
        creates: /srv/porelo-host/drive/porelo-host/machine.yml
        executable: /bin/bash
      become: true
      become_user: "{{ converge_account }}"

    # The person's step for the vault, as porelo-frontend gives it: the passphrase on porelo's stdin, as the account.
    - name: Make the account's vault, as the person's step does
      ansible.builtin.shell:
        cmd: >-
          set -o pipefail && printf 'converge-passphrase\n' | XDG_RUNTIME_DIR=/run/user/$(id -u)
          porelo vault init --passphrase-stdin
        creates: /home/{{ converge_account }}/.local/share/porelo/vault.bin
        executable: /bin/bash
      become: true
      become_user: "{{ converge_account }}"

    # The person's step, as porelo-frontend gives it: the password on the client's stdin, run as the account.
    - name: Log the client in, as the person's step does
      ansible.builtin.shell:
        cmd: >-
          set -o pipefail && printf 'stub-password\n' | XDG_RUNTIME_DIR=/run/user/$(id -u)
          ~/.local/share/tresorit/tresorit-cli login --email person@example.invalid --password-on-stdin
        creates: /home/{{ converge_account }}/.local/share/tresorit/stub-state/login
        executable: /bin/bash
      become: true
      become_user: "{{ converge_account }}"

    # Once, before the agent's sign-in: the vault is open but holds no credential for the stub's provider.
    - name: Read whether the up before the agent's sign-in ran
      ansible.builtin.stat:
        path: /root/porelo-host-sign-in-up.lines
      register: converge_sign_in_seen

    - name: Run up before the agent's sign-in
      when: not converge_sign_in_seen.stat.exists
      ansible.builtin.command:
        cmd: ansible-playbook -c local -i /root/porelo-host-inventory.yml porelo.host.up
      environment:
        ANSIBLE_STDOUT_CALLBACK: porelo.host.lines
        LC_ALL: C.UTF-8
      register: converge_sign_in_up
      changed_when: true
      failed_when: false

    - name: Assert that up stopped for the stub's sign-in alone, and started no task
      ansible.builtin.assert:
        that:
          - converge_sign_in_up.rc == 2
          - converge_sign_in_waiting | length == 1
          - converge_sign_in_waiting[0].needs == ['agent-login:stub']
          - converge_sign_in_failed | length == 0
        fail_msg: "that up gave rc {{ converge_sign_in_up.rc }} and these lines: {{ converge_sign_in_up.stdout }}"
      vars:
        converge_sign_in_lines: "{{ converge_sign_in_up.stdout_lines | select | map('from_json') | list }}"
        converge_sign_in_waiting: "{{ converge_sign_in_lines | selectattr('state', 'equalto', 'waiting') | list }}"
        converge_sign_in_failed: "{{ converge_sign_in_lines | selectattr('state', 'equalto', 'failed') | list }}"
      when: not converge_sign_in_seen.stat.exists

    # The container's name as the second play's inventory gives it: porelo-<project>-<task>.
    - name: Ask Porelo whether the task runs before the sign-in
      ansible.builtin.shell:
        cmd: XDG_RUNTIME_DIR=/run/user/$(id -u) porelo task status porelo-converge-converge-1 --json
      become: true
      become_user: "{{ converge_account }}"
      register: converge_before_sign_in
      changed_when: false
      when: not converge_sign_in_seen.stat.exists

    - name: Assert no task was started before the sign-in
      ansible.builtin.assert:
        that: (converge_before_sign_in.stdout | from_json).state == 'absent'
        fail_msg: "the task is there before the sign-in: {{ converge_before_sign_in.stdout }}"
      when: not converge_sign_in_seen.stat.exists

    - name: Keep that up's lines, so it runs once
      ansible.builtin.copy:
        dest: /root/porelo-host-sign-in-up.lines
        content: "{{ converge_sign_in_up.stdout }}\n"
        owner: root
        group: root
        mode: "0600"
      when: not converge_sign_in_seen.stat.exists

    # The person's sign-in, as porelo-frontend gives it, stands in by a key the stub's provider would refuse: whether
    # it is signed in is what the vault holds, not whether the provider takes it.
    - name: Sign the stub's provider in, as the person's step does
      ansible.builtin.shell:
        cmd: >-
          set -o pipefail && printf 'converge-not-a-key\n' | XDG_RUNTIME_DIR=/run/user/$(id -u)
          porelo vault put anthropic
        executable: /bin/bash
      become: true
      become_user: "{{ converge_account }}"
      changed_when: true
      when: not converge_sign_in_seen.stat.exists

    - name: Run up on the host itself, as host up does, its steps as JSON lines
      ansible.builtin.command:
        cmd: ansible-playbook -c local -i /root/porelo-host-inventory.yml porelo.host.up
      environment:
        ANSIBLE_STDOUT_CALLBACK: porelo.host.lines
        LC_ALL: C.UTF-8
      register: converge_up
      changed_when: >-
        converge_up.stdout is search('"state": "changed"')

    # Stands in for the central forge and the person's token for it: a user of the host's own forge with a public
    # repository, its token in the file on the drive where the person puts theirs. Made once, after the forge is up.
    - name: Make the stand-in for the central forge, its repository and the person's token for it
      ansible.builtin.shell:
        cmd: |
          set -euo pipefail
          # The forge's account cannot enter the directory Molecule runs this from.
          cd /
          uid=$(id -u porelo-forge)
          as_forge() { runuser -u porelo-forge -- env XDG_RUNTIME_DIR=/run/user/$uid "$@"; }
          as_forge podman exec forgejo forgejo admin user create --username central \
              --email central@example.invalid --random-password --must-change-password=false > /dev/null
          token=/srv/porelo-host/drive/porelo-host/forge-central.token
          (umask 077 && as_forge podman exec forgejo forgejo admin user generate-access-token --username central \
              --token-name stand-in --scopes all --raw > "$token")
          curl -fsS -o /dev/null --cacert /etc/porelo-host/forge/ca.pem \
              -H @<(printf 'Authorization: token %s\n' "$(cat "$token")") -H 'Content-Type: application/json' \
              -X POST https://10.73.0.1:3000/api/v1/user/repos -d '{"name": "stand-in", "auto_init": true}'
          touch /root/porelo-host-forge-stand-in
        creates: /root/porelo-host-forge-stand-in
        executable: /bin/bash

    - name: Write the inventory's forge repositories, as host up writes them
      ansible.builtin.copy:
        dest: /root/porelo-host-forge.yml
        owner: root
        group: root
        mode: "0600"
        content: |
          all:
            vars:
              porelo_host_forge_repositories:
                - name: stand-in
                  url: https://10.73.0.1:3000/central/stand-in.git

    - name: Run up with the forge's repositories, its steps as JSON lines
      ansible.builtin.command:
        cmd: ansible-playbook -c local -i /root/porelo-host-inventory.yml -i /root/porelo-host-forge.yml porelo.host.up
      environment:
        ANSIBLE_STDOUT_CALLBACK: porelo.host.lines
        LC_ALL: C.UTF-8
      register: converge_up_forge
      changed_when: >-
        converge_up_forge.stdout is search('"state": "changed"')

    # Stands in for a repository's workflow: one job on the host's runner, reaching the forge over TLS with the host's
    # CA. Publishing waits on which credential jobs get: the run's own token may not write the registry. Committed
    # once through the API, which starts the run.
    - name: Commit a workflow to the migrated repository whose job reaches the forge over TLS
      ansible.builtin.shell:
        cmd: |
          set -euo pipefail
          {% raw %}
          workflow=$(base64 -w0 <<'WORKFLOW'
          on: [push]
          jobs:
            probe:
              runs-on: porelo-host
              steps:
                - run: curl -fsS https://10.73.0.1:3000/api/v1/version
          WORKFLOW
          )
          {% endraw %}
          curl -fsS -o /dev/null --cacert /etc/porelo-host/forge/ca.pem -H 'Content-Type: application/json' \
              -H @<(printf 'Authorization: token %s\n' "$(cat /home/porelo-forge/.config/porelo-forge/api.token)") \
              -X POST https://10.73.0.1:3000/api/v1/repos/porelo/stand-in/contents/.forgejo/workflows/probe.yml \
              -d "{\"content\": \"$workflow\", \"message\": \"Reach the forge\"}"
          touch /root/porelo-host-forge-workflow
        creates: /root/porelo-host-forge-workflow
        executable: /bin/bash

    - name: Keep the lines of the last up for verify
      ansible.builtin.copy:
        dest: /root/porelo-host-up.lines
        content: "{{ converge_up_forge.stdout }}\n"
        owner: root
        group: root
        mode: "0600"
      changed_when: false

  handlers:
    # apt's module takes one .deb at a time, and these must go in together, since they depend on each other.
    - name: Install Porelo's handed-over packages and start the account's daemon on them
      ansible.builtin.shell:  # noqa: command-instead-of-module
        cmd: >-
          apt-get install -y -qq --allow-downgrades /root/porelo-packages/*.deb
          && runuser -u {{ converge_account }} -- env XDG_RUNTIME_DIR=/run/user/$(id -u {{ converge_account }})
          systemctl --user restart porelod
      changed_when: true

    - name: Install the collection from that tarball
      ansible.builtin.command:
        cmd: ansible-galaxy collection install --force /root/porelo-host.tar.gz
      changed_when: true
