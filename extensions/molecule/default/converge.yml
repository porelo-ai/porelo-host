---
# Does inside the VM what `host up` does on a host for the host admin's act: Ubuntu's own ansible-core, the collection
# from its tarball, and `up` run on the machine itself with no project and no person.
- name: Converge
  hosts: all
  gather_facts: false
  become: true
  vars:
    converge_tarball: "{{ lookup('ansible.builtin.env', 'PORELO_HOST_TARBALL') }}"
    converge_packages: "{{ lookup('ansible.builtin.env', 'PORELO_HOST_PACKAGES') }}"
    converge_vm_pool: "{{ lookup('ansible.builtin.env', 'PORELO_HOST_MOLECULE_POOL', default='on') }}"
    converge_forge: "{{ lookup('ansible.builtin.env', 'PORELO_HOST_MOLECULE_FORGE', default='on') }}"
  tasks:
    # Whether nested virtualization reaches the Molecule VM itself, so a slow pool VM in CI can be told apart.
    - name: Read whether /dev/kvm exists on the Molecule VM
      ansible.builtin.stat:
        path: /dev/kvm
      register: converge_kvm

    - name: Read the CPU's flags from /proc/cpuinfo
      ansible.builtin.command:
        cmd: grep -m1 '^flags' /proc/cpuinfo
      register: converge_cpu_flags
      changed_when: false
      failed_when: false

    - name: Print whether /dev/kvm exists and whether the CPU flags carry vmx or svm
      ansible.builtin.debug:
        msg: >-
          /dev/kvm={{ converge_kvm.stat.exists }},
          vmx/svm={{ converge_cpu_flags.stdout.split(':', 1) | last | split | intersect(['vmx', 'svm']) }}

    - name: Say when the VM pool is left out of this run
      ansible.builtin.debug:
        msg: >-
          the VM pool is left out of this run (PORELO_HOST_MOLECULE_POOL=off): its VM did not say ready on GitHub's
          runner; build/molecule.sh runs it locally
      when: converge_vm_pool == 'off'

    - name: Install Ubuntu's own ansible-core
      ansible.builtin.apt:
        name: ansible-core
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Copy the collection's tarball onto the host
      ansible.builtin.copy:
        src: "{{ converge_tarball }}"
        dest: /root/porelo-host.tar.gz
        owner: root
        group: root
        mode: "0600"
      notify: Install the collection from that tarball

    - name: Install the collection before up runs
      ansible.builtin.meta: flush_handlers


    - name: Write the v2 inventory host up writes for host alpha on network 7
      ansible.builtin.copy:
        dest: /root/porelo-host-inventory.yml
        owner: root
        group: root
        mode: "0600"
        content: |
          all:
            hosts:
              localhost:
            vars:
              porelo_host_inventory_version: 2
              porelo_host_name: alpha
              porelo_host_network: 7
              porelo_host_distribution: snapshots
              porelo_host_forge: {{ (converge_forge == 'on') | lower }}
          {% if converge_forge == 'on' %}
              porelo_host_forge_agents: [probe]
              # Lets Forgejo migrate from the stand-in central organization on the host's own forge.
              forge_migrations_allow_local: true
          {% endif %}
              # Job bounds of the test VM's size: the runner's jobs and the pool share half of its 4 vCPUs and 6 GiB.
              # One job, not the default two, so the written capacity is the variable's.
              forge_runner_capacity: 1
              forge_job_cpus: 1
              forge_job_memory: 768m
              forge_job_omp_num_threads: 1
          {% if converge_vm_pool == 'on' %}
              # One pool VM, small enough for the test VM, which holds it nested.
              porelo_host_vm_pool: {systems: [ubuntu], accounts: 1}
              vm_pool_memory: 1024
          {% endif %}

    # Stands in for the host admin: Molecule's own key is pinned for root, as `host up` pins the card's key. Once SSH
    # reads only /etc/ssh/authorized_keys/%u, the VM's own login keeps its key there, as an admitted login would.
    - name: Make root's SSH directory for the pinned host admin key
      ansible.builtin.file:
        path: /root/.ssh
        state: directory
        owner: root
        group: root
        mode: "0700"

    - name: Make the directory SSH reads each login's keys from
      ansible.builtin.file:
        path: /etc/ssh/authorized_keys
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Pin Molecule's key as the host admin's, and keep it for the VM's own login
      ansible.builtin.shell:
        cmd: |
          set -eu
          key=$(awk '$1 == "ssh-ed25519" { print $1 " " $2; exit }' ~{{ ansible_user }}/.ssh/authorized_keys)
          [ -n "$key" ]
          for target in /root/.ssh/authorized_keys /etc/ssh/authorized_keys/{{ ansible_user }}; do
              if [ "$(cat "$target" 2>/dev/null)" != "$key" ]; then
                  printf '%s\n' "$key" > "$target.new" && chmod 0644 "$target.new" && mv -f "$target.new" "$target"
                  echo changed
              fi
          done
        executable: /bin/bash
      register: converge_admin_key
      changed_when: "'changed' in converge_admin_key.stdout"

    # Once: the first up, before Porelo's handed-over packages are installed over the published ones.
    - name: Read whether the first up ran
      ansible.builtin.stat:
        path: /root/porelo-host-first-up.lines
      register: converge_first_seen

    - name: Run the first up
      # Each line stamped with when it came, beside the output, so the steps' usual durations can be read.
      ansible.builtin.shell:
        cmd: >-
          set -o pipefail && ansible-playbook -c local -i /root/porelo-host-inventory.yml porelo.host.up
          | tee >(while IFS= read -r l; do printf '%(%s)T %s\n' -1 "$l"; done > /root/timed-1-first-up.lines)
        executable: /bin/bash
      environment:
        ANSIBLE_STDOUT_CALLBACK: porelo.host.lines
        LC_ALL: C.UTF-8
      register: converge_first_up
      changed_when: true
      failed_when: false
      when: not converge_first_seen.stat.exists

    - name: Assert the first up ran to its end, with no stop of the host admin's left
      ansible.builtin.assert:
        that:
          - converge_first_up.rc == 0
          - converge_first_waiting | length == 0
          - converge_first_failed | length == 0
        fail_msg: >-
          asked the first up for rc 0 with no waiting and no failed step;
          got rc {{ converge_first_up.rc }} and lines {{ converge_first_up.stdout }}
      vars:
        converge_first_lines: "{{ converge_first_up.stdout_lines | select | map('from_json') | list }}"
        converge_first_waiting: "{{ converge_first_lines | selectattr('state', 'equalto', 'waiting') | list }}"
        converge_first_failed: "{{ converge_first_lines | selectattr('state', 'equalto', 'failed') | list }}"
      when: not converge_first_seen.stat.exists

    - name: Keep the first up's lines, so it runs once
      ansible.builtin.copy:
        dest: /root/porelo-host-first-up.lines
        content: "{{ converge_first_up.stdout }}\n"
        owner: root
        group: root
        mode: "0600"
      when: not converge_first_seen.stat.exists

    # Porelo's packages from a build not yet published, when build/molecule.sh was given them: installed over the
    # published ones once the first up has configured apt, before the second up starts the homeserver.
    - name: Copy Porelo's handed-over packages onto the host
      ansible.builtin.copy:
        src: "{{ converge_packages }}/"
        dest: /root/porelo-packages/
        owner: root
        group: root
        mode: "0600"
      when: converge_packages | length > 0
      notify: Install Porelo's handed-over packages

    - name: Install the handed-over packages before the next up
      ansible.builtin.meta: flush_handlers

    - name: Ask porelo-host-stop --stdin as root to refuse every need
      ansible.builtin.shell:
        cmd: |
          set -uo pipefail
          rc=0
          porelo-host-stop --stdin {{ item | quote }} < /dev/null || rc=$?
          written=none
          for f in /etc/porelo-host/forge/ca.pem /etc/porelo-host/forge/forge.pem /etc/porelo-host/forge/matrix.pem; do
              if [ -e "$f" ] || [ -L "$f" ]; then written=$f; break; fi
          done
          printf 'rc=%s written=%s\n' "$rc" "$written"
        executable: /bin/bash
      loop: [vault-new, vault, keys, matrix-token, forge-central-token, wireguard, forge-certificate]
      register: converge_need_refusals
      changed_when: false

    - name: Assert porelo-host-stop --stdin as root refused each need with rc 64 and wrote nothing
      ansible.builtin.assert:
        that:
          - item.stdout_lines == ['rc=64 written=none']
          - item.stderr is search("takes no secret as root any more")
        fail_msg: >-
          asked porelo-host-stop --stdin {{ item.item }} for rc 64, "takes no secret as root any more" and nothing
          written to /etc/porelo-host/forge/{ca,forge,matrix}.pem; got {{ item.stdout_lines }} and '{{ item.stderr }}'
      loop: "{{ converge_need_refusals.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Run up on the host itself again, its steps as JSON lines
      # Each line stamped with when it came, beside the output, so the steps' usual durations can be read.
      ansible.builtin.shell:
        cmd: >-
          set -o pipefail && ansible-playbook -c local -i /root/porelo-host-inventory.yml porelo.host.up
          | tee >(while IFS= read -r l; do printf '%(%s)T %s\n' -1 "$l"; done > /root/timed-2-up.lines)
        executable: /bin/bash
      environment:
        ANSIBLE_STDOUT_CALLBACK: porelo.host.lines
        LC_ALL: C.UTF-8
      register: converge_up
      changed_when: >-
        converge_up.stdout is search('"state": "changed"')

    - name: Print the installation time measured around the complete successful up
      ansible.builtin.debug:
        msg: >-
          installation time measured around the complete up, including its other steps:
          {{ converge_up.delta }} ({{ converge_up.start }} to {{ converge_up.end }})
        verbosity: 0

    - name: Keep the lines of the last up for verify
      ansible.builtin.copy:
        dest: /root/porelo-host-up.lines
        content: "{{ converge_up.stdout }}\n"
        owner: root
        group: root
        mode: "0600"
      changed_when: false

  handlers:
    # apt's module takes one .deb at a time, and these must go in together, since they depend on each other.
    - name: Install Porelo's handed-over packages
      ansible.builtin.shell:  # noqa: command-instead-of-module
        cmd: apt-get install -y -qq --allow-downgrades /root/porelo-packages/*.deb
      changed_when: true

    - name: Install the collection from that tarball
      ansible.builtin.command:
        cmd: ansible-galaxy collection install --force /root/porelo-host.tar.gz
      changed_when: true
