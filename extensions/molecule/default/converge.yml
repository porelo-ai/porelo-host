---
# Does inside the VM what `host up` does on a host for the host admin's act: Ubuntu's own ansible-core, the collection
# from its tarball, and `up` run on the machine itself with no project and no person.
- name: Converge
  hosts: all
  gather_facts: false
  become: true
  vars:
    converge_tarball: "{{ lookup('ansible.builtin.env', 'PORELO_HOST_TARBALL') }}"
    converge_packages: "{{ lookup('ansible.builtin.env', 'PORELO_HOST_PACKAGES') }}"
    converge_vm_pool: "{{ lookup('ansible.builtin.env', 'PORELO_HOST_MOLECULE_POOL', default='on') }}"
    converge_forge: "{{ lookup('ansible.builtin.env', 'PORELO_HOST_MOLECULE_FORGE', default='on') }}"
  tasks:
    # Whether nested virtualization reaches the Molecule VM itself, so a slow pool VM in CI can be told apart.
    - name: Read whether /dev/kvm exists on the Molecule VM
      ansible.builtin.stat:
        path: /dev/kvm
      register: converge_kvm

    - name: Read the CPU's flags from /proc/cpuinfo
      ansible.builtin.command:
        cmd: grep -m1 '^flags' /proc/cpuinfo
      register: converge_cpu_flags
      changed_when: false
      failed_when: false

    - name: Print whether /dev/kvm exists and whether the CPU flags carry vmx or svm
      ansible.builtin.debug:
        msg: >-
          /dev/kvm={{ converge_kvm.stat.exists }},
          vmx/svm={{ converge_cpu_flags.stdout.split(':', 1) | last | split | intersect(['vmx', 'svm']) }}

    - name: Say when the VM pool is left out of this run
      ansible.builtin.debug:
        msg: >-
          the VM pool is left out of this run (PORELO_HOST_MOLECULE_POOL=off): its VM did not say ready on GitHub's
          runner; build/molecule.sh runs it locally
      when: converge_vm_pool == 'off'

    - name: Install Ubuntu's own ansible-core
      ansible.builtin.apt:
        name: ansible-core
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Copy the collection's tarball onto the host
      ansible.builtin.copy:
        src: "{{ converge_tarball }}"
        dest: /root/porelo-host.tar.gz
        owner: root
        group: root
        mode: "0600"
      notify: Install the collection from that tarball

    - name: Install the collection before up runs
      ansible.builtin.meta: flush_handlers

    # Stands in for the host admin's lasting CA on the desktop, constrained critically to alpha.porelo.internal and
    # 10.73.7.0/24 with its key never in /etc/porelo-host, plus a wider CA constrained only to porelo.internal that the
    # stop must refuse.
    - name: Make the stand-in host admin's constrained CA and a wider CA for refusal
      ansible.builtin.shell:
        cmd: |
          set -euo pipefail
          umask 077
          mkdir -p /root/desktop-ca
          nc='nameConstraints=critical,permitted;DNS:alpha.porelo.internal,permitted;IP:10.73.7.0/255.255.255.0'
          openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:P-256 -nodes -days 3650 \
              -subj "/CN=Porelo host alpha" -addext basicConstraints=critical,CA:TRUE \
              -addext keyUsage=critical,keyCertSign,cRLSign -addext "$nc" \
              -keyout /root/desktop-ca/ca.key -out /root/desktop-ca/ca.pem 2> /dev/null
          openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:P-256 -nodes -days 3650 \
              -subj "/CN=Porelo wide" -addext basicConstraints=critical,CA:TRUE \
              -addext keyUsage=critical,keyCertSign,cRLSign \
              -addext 'nameConstraints=critical,permitted;DNS:porelo.internal,permitted;IP:10.73.7.0/255.255.255.0' \
              -keyout /root/desktop-ca/wide-ca.key -out /root/desktop-ca/wide-ca.pem 2> /dev/null
        creates: /root/desktop-ca/wide-ca.pem
        executable: /bin/bash
      no_log: true

    - name: Write the v2 inventory host up writes for host alpha on network 7
      ansible.builtin.copy:
        dest: /root/porelo-host-inventory.yml
        owner: root
        group: root
        mode: "0600"
        content: |
          all:
            hosts:
              localhost:
            vars:
              porelo_host_inventory_version: 2
              porelo_host_name: alpha
              porelo_host_network: 7
              porelo_host_distribution: snapshots
              porelo_host_forge: {{ (converge_forge == 'on') | lower }}
          {% if converge_forge == 'on' %}
              porelo_host_forge_agents: [probe]
              # Lets Forgejo migrate from the stand-in central organization on the host's own forge.
              forge_migrations_allow_local: true
          {% endif %}
              # Job bounds of the test VM's size: the runner's jobs and the pool share half of its 4 vCPUs and 6 GiB.
              # One job, not the default two, so the written capacity is the variable's.
              forge_runner_capacity: 1
              forge_job_cpus: 1
              forge_job_memory: 768m
              forge_job_omp_num_threads: 1
          {% if converge_vm_pool == 'on' %}
              # One pool VM, small enough for the test VM, which holds it nested.
              porelo_host_vm_pool: {systems: [ubuntu], accounts: 1}
              vm_pool_memory: 1024
          {% endif %}

    # Once, before the host admin's root stop: neither signed certificates are on the host yet.
    - name: Read whether the first up ran
      ansible.builtin.stat:
        path: /root/porelo-host-first-up.lines
      register: converge_first_seen

    - name: Run the first up before the root stop supplies the certificates
      # Each line stamped with when it came, beside the output, so the steps' usual durations can be read.
      ansible.builtin.shell:
        cmd: >-
          set -o pipefail && ansible-playbook -c local -i /root/porelo-host-inventory.yml porelo.host.up
          | tee >(while IFS= read -r l; do printf '%(%s)T %s\n' -1 "$l"; done > /root/timed-1-first-up.lines)
        executable: /bin/bash
      environment:
        ANSIBLE_STDOUT_CALLBACK: porelo.host.lines
        LC_ALL: C.UTF-8
      register: converge_first_up
      changed_when: true
      failed_when: false
      when: not converge_first_seen.stat.exists

    - name: Assert the first up stopped with rc 2 waiting for forge-certificate alone
      ansible.builtin.assert:
        that:
          - converge_first_up.rc == 2
          - converge_first_waiting | length == 1
          - converge_first_waiting[0].needs == ['forge-certificate']
          - converge_first_failed | length == 0
        fail_msg: >-
          asked the first up for rc 2 and waiting needs ['forge-certificate'] with no failed step;
          got rc {{ converge_first_up.rc }} and lines {{ converge_first_up.stdout }}
      vars:
        converge_first_lines: "{{ converge_first_up.stdout_lines | select | map('from_json') | list }}"
        converge_first_waiting: "{{ converge_first_lines | selectattr('state', 'equalto', 'waiting') | list }}"
        converge_first_failed: "{{ converge_first_lines | selectattr('state', 'equalto', 'failed') | list }}"
      when: not converge_first_seen.stat.exists

    - name: Keep the first up's lines, so it runs once
      ansible.builtin.copy:
        dest: /root/porelo-host-first-up.lines
        content: "{{ converge_first_up.stdout }}\n"
        owner: root
        group: root
        mode: "0600"
      when: not converge_first_seen.stat.exists

    # Porelo's packages from a build not yet published, when build/molecule.sh was given them: installed over the
    # published ones once the first up has configured apt, before the second up starts the homeserver.
    - name: Copy Porelo's handed-over packages onto the host
      ansible.builtin.copy:
        src: "{{ converge_packages }}/"
        dest: /root/porelo-packages/
        owner: root
        group: root
        mode: "0600"
      when: converge_packages | length > 0
      notify: Install Porelo's handed-over packages

    - name: Install the handed-over packages before the next up
      ansible.builtin.meta: flush_handlers

    - name: Read whether the root stop has already placed the host's CA
      ansible.builtin.stat:
        path: /etc/porelo-host/forge/ca.pem
      register: converge_ca_placed

    # porelo-host-stop --request prints two PEM requests, the forge's then the homeserver's; sign both valid leaves and
    # the invalid certificate bundles the stop must refuse before writing anything.
    - name: Split the two requests from porelo-host-stop --request and sign the valid and refused certificates
      ansible.builtin.shell:
        cmd: |
          set -euo pipefail
          umask 077
          d=/root/desktop-ca
          porelo-host-stop --request > "$d/requests.pem"
          awk -v out="$d" '
              /^-----BEGIN CERTIFICATE REQUEST-----$/ { n++; inside = 1 }
              inside { print > (out "/" (n == 1 ? "forge.csr" : n == 2 ? "matrix.csr" : "extra.csr")) }
              /^-----END CERTIFICATE REQUEST-----$/ { inside = 0 }
              END { if (n != 2) { printf "asked --request for 2 CSRs, got %d\n", n > "/dev/stderr"; exit 1 } }
          ' "$d/requests.pem"
          [ "$(openssl req -noout -subject -nameopt RFC2253 -in "$d/forge.csr")" \
              = 'subject=CN=forge.alpha.porelo.internal' ]
          [ "$(openssl req -noout -subject -nameopt RFC2253 -in "$d/matrix.csr")" \
              = 'subject=CN=matrix.alpha.porelo.internal' ]
          sign() {
              local csr=$1 ca=$2 cakey=$3 dns=$4 out=$5
              {
                  printf 'subjectAltName=DNS:%s,IP:10.73.7.1\n' "$dns"
                  printf 'basicConstraints=critical,CA:FALSE\n'
                  printf 'keyUsage=critical,digitalSignature\n'
                  printf 'extendedKeyUsage=serverAuth\n'
              } > "$d/ext"
              openssl x509 -req -in "$csr" -CA "$ca" -CAkey "$cakey" -CAcreateserial -days 365 \
                  -extfile "$d/ext" -out "$out" 2> /dev/null
          }
          sign "$d/forge.csr" "$d/ca.pem" "$d/ca.key" forge.alpha.porelo.internal "$d/forge.pem"
          sign "$d/matrix.csr" "$d/ca.pem" "$d/ca.key" matrix.alpha.porelo.internal "$d/matrix.pem"
          sign "$d/forge.csr" "$d/wide-ca.pem" "$d/wide-ca.key" forge.alpha.porelo.internal "$d/wide-forge.pem"
          sign "$d/matrix.csr" "$d/wide-ca.pem" "$d/wide-ca.key" matrix.alpha.porelo.internal "$d/wide-matrix.pem"
          sign "$d/matrix.csr" "$d/ca.pem" "$d/ca.key" forge.alpha.porelo.internal "$d/matrix-as-forge.pem"
          cat "$d/forge.pem" "$d/matrix.pem" "$d/ca.pem" > "$d/bundle-good.pem"
          cat "$d/wide-forge.pem" "$d/wide-matrix.pem" "$d/wide-ca.pem" > "$d/bundle-wide.pem"
          cat "$d/forge.pem" "$d/ca.pem" > "$d/bundle-two.pem"
          cat "$d/forge.pem" "$d/matrix-as-forge.pem" "$d/ca.pem" > "$d/bundle-wrong-name.pem"
        executable: /bin/bash
      changed_when: true
      no_log: true
      when: not converge_ca_placed.stat.exists

    - name: Ask porelo-host-stop to refuse the wide CA, two certificates and a misnamed homeserver certificate
      ansible.builtin.shell:
        cmd: |
          set -uo pipefail
          rc=0
          printf 'forge-certificate %s\n' "$(base64 -w0 < {{ item.bundle | quote }})" \
              | porelo-host-stop --stdin forge-certificate || rc=$?
          written=none
          for f in /etc/porelo-host/forge/ca.pem /etc/porelo-host/forge/forge.pem /etc/porelo-host/forge/matrix.pem; do
              if [ -e "$f" ] || [ -L "$f" ]; then written=$f; break; fi
          done
          printf 'rc=%s written=%s\n' "$rc" "$written"
        executable: /bin/bash
      loop:
        - label: wide CA
          bundle: /root/desktop-ca/bundle-wide.pem
          expected: is not held to alpha.porelo.internal
        - label: two certificates
          bundle: /root/desktop-ca/bundle-two.pem
          expected: three certificates
        - label: homeserver certificate for the forge's name
          bundle: /root/desktop-ca/bundle-wrong-name.pem
          expected: does not name exactly
      loop_control:
        label: "{{ item.label }}"
      register: converge_cert_refusals
      changed_when: false
      when: not converge_ca_placed.stat.exists

    - name: Assert each invalid certificate bundle was refused with rc 64 and wrote nothing to /etc/porelo-host/forge
      ansible.builtin.assert:
        that:
          - item.stdout_lines == ['rc=64 written=none']
          - item.stderr is search(item.item.expected)
        fail_msg: >-
          asked porelo-host-stop to refuse {{ item.item.label }} with rc 64, '{{ item.item.expected }}' and nothing
          written to /etc/porelo-host/forge/{ca,forge,matrix}.pem; got {{ item.stdout_lines }} and '{{ item.stderr }}'
      loop: "{{ converge_cert_refusals.results }}"
      loop_control:
        label: "{{ item.item.label }}"
      when: not converge_ca_placed.stat.exists

    - name: Ask porelo-host-stop --stdin to refuse every person need removed from the root act
      ansible.builtin.shell:
        cmd: |
          set -uo pipefail
          rc=0
          porelo-host-stop --stdin {{ item | quote }} < /dev/null || rc=$?
          written=none
          for f in /etc/porelo-host/forge/ca.pem /etc/porelo-host/forge/forge.pem /etc/porelo-host/forge/matrix.pem; do
              if [ -e "$f" ] || [ -L "$f" ]; then written=$f; break; fi
          done
          printf 'rc=%s written=%s\n' "$rc" "$written"
        executable: /bin/bash
      loop: [vault-new, vault, keys, matrix-token, forge-central-token]
      register: converge_need_refusals
      changed_when: false
      when: not converge_ca_placed.stat.exists

    - name: Assert porelo-host-stop --stdin refused each person need with rc 64 and wrote nothing
      ansible.builtin.assert:
        that:
          - item.stdout_lines == ['rc=64 written=none']
          - item.stderr is search("no need of the host's root act")
        fail_msg: >-
          asked porelo-host-stop --stdin {{ item.item }} for rc 64, "no need of the host's root act" and nothing
          written to /etc/porelo-host/forge/{ca,forge,matrix}.pem; got {{ item.stdout_lines }} and '{{ item.stderr }}'
      loop: "{{ converge_need_refusals.results }}"
      loop_control:
        label: "{{ item.item }}"
      when: not converge_ca_placed.stat.exists

    # The pipeline the host admin's interface runs as root: the three certificates, base64 on two lines.
    - name: Give the host's three certificates on porelo-host-stop --stdin
      ansible.builtin.shell:
        cmd: |
          set -euo pipefail
          {
              printf 'forge-certificate %s\n' "$(base64 -w0 < /root/desktop-ca/bundle-good.pem)"
          } | porelo-host-stop --stdin forge-certificate
        executable: /bin/bash
      register: converge_good_stop
      changed_when: true
      failed_when: false
      no_log: true
      when: not converge_ca_placed.stat.exists

    - name: Assert porelo-host-stop accepted forge-certificate with rc 0
      ansible.builtin.assert:
        that: converge_good_stop.rc == 0
        fail_msg: >-
          asked porelo-host-stop --stdin forge-certificate for rc 0,
          got rc {{ converge_good_stop.rc }}: {{ converge_good_stop.stderr }}
      when: not converge_ca_placed.stat.exists

    - name: Run up on the host itself after the stop, its steps as JSON lines
      # Each line stamped with when it came, beside the output, so the steps' usual durations can be read.
      ansible.builtin.shell:
        cmd: >-
          set -o pipefail && ansible-playbook -c local -i /root/porelo-host-inventory.yml porelo.host.up
          | tee >(while IFS= read -r l; do printf '%(%s)T %s\n' -1 "$l"; done > /root/timed-2-up.lines)
        executable: /bin/bash
      environment:
        ANSIBLE_STDOUT_CALLBACK: porelo.host.lines
        LC_ALL: C.UTF-8
      register: converge_up
      changed_when: >-
        converge_up.stdout is search('"state": "changed"')

    - name: Print the installation time measured around the complete successful up
      ansible.builtin.debug:
        msg: >-
          installation time measured around the complete up, including its other steps:
          {{ converge_up.delta }} ({{ converge_up.start }} to {{ converge_up.end }})
        verbosity: 0

    - name: Keep the lines of the last up for verify
      ansible.builtin.copy:
        dest: /root/porelo-host-up.lines
        content: "{{ converge_up.stdout }}\n"
        owner: root
        group: root
        mode: "0600"
      changed_when: false

  handlers:
    # apt's module takes one .deb at a time, and these must go in together, since they depend on each other.
    - name: Install Porelo's handed-over packages
      ansible.builtin.shell:  # noqa: command-instead-of-module
        cmd: apt-get install -y -qq --allow-downgrades /root/porelo-packages/*.deb
      changed_when: true

    - name: Install the collection from that tarball
      ansible.builtin.command:
        cmd: ansible-galaxy collection install --force /root/porelo-host.tar.gz
      changed_when: true
