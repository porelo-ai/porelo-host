# Checks the collection on every push to main and every pull request: the documents' shared rules, then yamllint,
# ansible-lint in its production profile, and the tarball, which may hold only what the collection ships; then the
# Molecule scenario on a VM the runner makes and deletes. The Ansible tools run from the image build/tools-image pins,
# as they do locally. It rents no machine.
name: Build

on:
    push:
        branches: [main]
        # A change only to porelo.yml, issues, docs or Markdown builds nothing; a workflow change builds.
        paths-ignore: ['porelo.yml', 'issues/**', 'doc/**', '**/*.md']
    pull_request:
        paths-ignore: ['porelo.yml', 'issues/**', 'doc/**', '**/*.md']
    workflow_dispatch:

permissions:
    contents: read

jobs:
    build:
        runs-on: ubuntu-26.04
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  # Nothing here pushes, so the job's token has no business staying in .git/config.
                  persist-credentials: false

            # Maven by the wrapper's pinned distribution and digest; the runner's own Java 25 only runs porelo-machines
            # once, which installs the pinned GraalVM, checked against its digest, as JAVA_HOME for the steps after it.
            - name: The shared build tools and the pinned GraalVM
              run: |
                  set -eu
                  [ -n "${JAVA_HOME_25_X64:-}" ] || { echo "::error::this runner has no Java 25 (JAVA_HOME_25_X64)"; exit 1; }
                  export JAVA_HOME="$JAVA_HOME_25_X64"
                  ./mvnw -B -q -f build/pom.xml dependency:build-classpath -Dmdep.outputFile="$RUNNER_TEMP/tools-cp.txt"
                  "$JAVA_HOME/bin/java" -cp "$(cat "$RUNNER_TEMP/tools-cp.txt")" org.fuin.porelo.machines.Main jdk --github

            - name: The shared blocks against their hashes
              run: '"$JAVA_HOME/bin/java" -cp "$(cat "$RUNNER_TEMP/tools-cp.txt")" org.fuin.porelo.release.Main check-shared AGENTS.md .editorconfig'

            - name: No citation of an issue that goes stale
              run: '"$JAVA_HOME/bin/java" -cp "$(cat "$RUNNER_TEMP/tools-cp.txt")" org.fuin.porelo.release.Main check-citations .'

            - name: The documentation chapter
              run: '"$JAVA_HOME/bin/java" -cp "$(cat "$RUNNER_TEMP/tools-cp.txt")" org.fuin.porelo.release.Main check-doc-site doc mkdocs.yml'

            - name: Every step pinned
              run: '"$JAVA_HOME/bin/java" -cp "$(cat "$RUNNER_TEMP/tools-cp.txt")" org.fuin.porelo.release.Main check-actions .github'

            # Two spaces where the collection's Ansible YAML lives, four everywhere else, as .editorconfig says.
            - name: The YAML
              run: |
                  set -eu
                  build/tools.sh yamllint --strict -c build/yamllint-ansible.yml .
                  build/tools.sh yamllint --strict -c build/yamllint.yml .

            - name: The collection against ansible-lint's production profile
              run: build/tools.sh ansible-lint -c build/ansible-lint.yml

            # The collection's Python, with what the pinned image holds: its format, that it compiles, and the tests
            # that run it under the image's own ansible-playbook. The image's pytest-ansible plugin is left out, since
            # it would link the collection into the checkout as collections/.
            - name: The plugins' Python and their tests
              run: |
                  set -eu
                  build/tools.sh black --check -l 120 plugins tests
                  build/tools.sh python3 -c "import sys; [compile(open(f).read(), f, 'exec') for f in sys.argv[1:]]" plugins/callback/lines.py plugins/modules/tresorit_installer.py
                  build/tools.sh python3 -m pytest -q -p no:cacheprovider -p no:pytest-ansible tests/unit

            - name: The tarball, holding only what the collection ships
              run: |
                  set -eu
                  build/tools.sh ansible-galaxy collection build --output-path target
                  build/check-tarball.sh target/porelo-host-*.tar.gz

    # The roles on a VM made and deleted for the run, as build/molecule.sh runs them locally and as the Forgejo build
    # runs them: GitHub's runner offers KVM, measured by a probe that ran the scenario green there. Never for a fork's
    # pull request, whose code would run with this repository's runner.
    molecule:
        needs: build
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        runs-on: ubuntu-26.04
        # Its scenario also boots a pool VM nested below the Molecule VM, a third level of virtualization on the runner.
        timeout-minutes: 45
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            # The runner's account may not open /dev/kvm by default; this rule lets the kvm group do so.
            - name: KVM for the runner's account
              run: |
                  set -eu
                  echo 'KERNEL=="kvm", GROUP="kvm", MODE="0660", OPTIONS+="static_node=kvm"' \
                      | sudo tee /etc/udev/rules.d/99-kvm4all.rules
                  sudo udevadm control --reload-rules
                  sudo udevadm trigger --name-match=kvm
                  ls -l /dev/kvm

            # Pinned by version; a version the archive no longer carries stops here, and the pins are moved by hand.
            - name: libvirt with its network, qemu-img, virt-install and xorriso, by version
              run: |
                  set -eu
                  sudo apt-get update -qq
                  sudo apt-get install -y -qq --no-install-recommends \
                      libvirt-daemon-system=12.0.0-1ubuntu5.6 \
                      qemu-system-x86=1:10.2.1+ds-1ubuntu3.3 \
                      qemu-utils=1:10.2.1+ds-1ubuntu3.3 \
                      dnsmasq-base=2.92-1ubuntu0.5 \
                      virtinst=1:5.1.0-1 \
                      xorriso=1:1.5.6-1.1ubuntu4
                  sudo virsh pool-info images >/dev/null 2>&1 || {
                      sudo mkdir -p /var/lib/libvirt/images
                      sudo virsh pool-define-as images dir --target /var/lib/libvirt/images
                      sudo virsh pool-start images
                  }
                  # libvirt's NAT network must be active before the script runs, and saying so fails here.
                  sudo virsh net-info default >/dev/null 2>&1 || sudo virsh net-define /usr/share/libvirt/networks/default.xml
                  LC_ALL=C sudo virsh net-info default | grep -q '^Active: *yes' || sudo virsh net-start default
                  LC_ALL=C sudo virsh net-info default | grep '^Active: *yes'
                  # libvirt's socket for this one account, by an ACL: a step under `sg libvirt` would start rootless
                  # podman under a new group, whose user namespace newuidmap refuses.
                  sudo setfacl -m "u:$USER:rw" /run/libvirt/libvirt-sock
                  virsh -c qemu:///system list --all >/dev/null

            - name: The Molecule scenario on its VM
              run: build/molecule.sh
