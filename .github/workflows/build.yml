# Checks the collection on every push to main and every pull request: the documents' shared rules, then yamllint,
# ansible-lint in its production profile, and the tarball, which may hold only what the collection ships; then the
# Molecule scenario on a VM the runner makes and deletes. The Ansible tools run from the image build/tools-image pins,
# as they do locally. It rents no machine.
name: Build

on:
    push:
        branches: [main]
        # A change only to porelo.yml, issues, docs or Markdown builds nothing. Workflows alone build nothing either: an
        # action's move is checked by its pull request, and the next push with content builds with it.
        paths-ignore: ['porelo.yml', 'issues/**', 'doc/**', '**/*.md', '.github/**']
    pull_request:
        # A pull request of workflows alone gets the light Workflow check instead: it builds nothing and rents nothing.
        paths-ignore: ['porelo.yml', 'issues/**', 'doc/**', '**/*.md', '.github/**']
    workflow_dispatch:

permissions:
    contents: read

jobs:
    build:
        runs-on: ubuntu-26.04
        timeout-minutes: 35
        steps:
            # Every commit, so the push's own range can be read by the commit messages' step.
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  # Nothing here pushes, so the job's token has no business staying in .git/config.
                  persist-credentials: false
                  fetch-depth: 0

            - name: The shared build tools and the pinned GraalVM
              uses: ./.github/actions/pinned-jdk

            - name: The shared blocks against their hashes
              run: '"$JAVA_HOME/bin/java" -cp "$(cat "$RUNNER_TEMP/tools-cp.txt")" org.fuin.porelo.release.Main check-shared AGENTS.md .editorconfig'

            - name: No citation of an issue that goes stale
              run: '"$JAVA_HOME/bin/java" -cp "$(cat "$RUNNER_TEMP/tools-cp.txt")" org.fuin.porelo.release.Main check-citations .'

            - name: The documentation chapter
              run: '"$JAVA_HOME/bin/java" -cp "$(cat "$RUNNER_TEMP/tools-cp.txt")" org.fuin.porelo.release.Main check-doc-site doc mkdocs.yml'

            - name: Every step pinned
              run: '"$JAVA_HOME/bin/java" -cp "$(cat "$RUNNER_TEMP/tools-cp.txt")" org.fuin.porelo.release.Main check-actions .github'

            # Two spaces where the collection's Ansible YAML lives, four everywhere else, as .editorconfig says.
            - name: The YAML
              run: |
                  set -eu
                  build/tools.sh yamllint --strict -c build/yamllint-ansible.yml .
                  build/tools.sh yamllint --strict -c build/yamllint.yml .

            - name: The collection against ansible-lint's production profile
              run: build/tools.sh ansible-lint -c build/ansible-lint.yml

            # The collection's Python, with what the pinned image holds: its format, that it compiles, and the tests
            # that run it under the image's own ansible-playbook. The image's pytest-ansible plugin is left out, since
            # it would link the collection into the checkout as collections/.
            - name: The plugins' Python and their tests
              run: |
                  set -eu
                  build/tools.sh black --check -l 120 plugins tests
                  build/tools.sh python3 -c "import sys; [compile(open(f).read(), f, 'exec') for f in sys.argv[1:]]" plugins/callback/lines.py
                  build/tools.sh python3 -m pytest -q -p no:cacheprovider -p no:pytest-ansible tests/unit

            # ansible-test sanity on the whole collection, in the tools image with sanity's requirements installed by
            # hash and no network while it runs; what it leaves out on purpose is named in tests/sanity/ with its reason.
            - name: The collection under ansible-test sanity
              run: build/sanity.sh

            - name: The tarball, holding only what the collection ships
              run: |
                  set -eu
                  build/tools.sh ansible-galaxy collection build --output-path target
                  build/check-tarball.sh target/porelo-host-*.tar.gz

            # A direct push to main never meets the pull request's check, so the push's own range is read here, by the
            # rule of the shared tools this commit pins. A tag checks the commit it names. A new branch or a branch pushed
            # over has no start this checkout holds, so its range starts at main; main itself cannot be pushed over.
            - name: The pushed commits' messages
              if: github.event_name == 'push'
              env:
                  PUSH_BEFORE: ${{ github.event.before }}
              run: |
                  set -eu
                  case "$PUSH_BEFORE" in
                      '') echo "::error::the push names no commit it started from"; exit 1 ;;
                  esac
                  start=$PUSH_BEFORE
                  if [ "$GITHUB_REF_TYPE" = tag ]; then
                      start="$GITHUB_SHA~1"
                  elif ! git cat-file -e "$PUSH_BEFORE^{commit}" 2>/dev/null; then
                      if [ "$GITHUB_REF" = refs/heads/main ]; then
                          echo "::error::main moved from $PUSH_BEFORE, a commit this checkout does not hold"
                          exit 1
                      fi
                      start=origin/main
                  fi
                  "$JAVA_HOME/bin/java" -cp "$(cat "$RUNNER_TEMP/tools-cp.txt")" org.fuin.porelo.release.Main \
                      check-commits "$start..$GITHUB_SHA"

    # The roles on a VM made and deleted for the run, as build/molecule.sh runs them locally and as the Forgejo build
    # runs them: GitHub's runner offers KVM, measured by a probe that ran the scenario green there. Never for a fork's
    # pull request, whose code would run with this repository's runner.
    molecule:
        needs: build
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        runs-on: ubuntu-26.04
        # Its scenario also boots a pool VM nested below the Molecule VM, a third level of virtualization on the runner.
        timeout-minutes: 60
        strategy:
            fail-fast: false
            matrix:
                # The second as a cloud server without virtualization, which asks for no KVM.
                kvm: ["on", "off"]
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            # The runner's account may not open /dev/kvm by default; this rule lets the kvm group do so.
            - name: KVM for the runner's account
              run: |
                  set -eu
                  echo 'KERNEL=="kvm", GROUP="kvm", MODE="0660", OPTIONS+="static_node=kvm"' \
                      | sudo tee /etc/udev/rules.d/99-kvm4all.rules
                  sudo udevadm control --reload-rules
                  sudo udevadm trigger --name-match=kvm
                  ls -l /dev/kvm

            # Pinned by version; a version the archive no longer carries stops here, and the pins are moved by hand.
            - name: libvirt with its network, qemu-img, virt-install, xorriso and skopeo, by version
              run: |
                  set -eu
                  install() {
                      sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends \
                          libvirt-daemon-system=12.0.0-1ubuntu5.6 \
                          qemu-system-x86=1:10.2.1+ds-1ubuntu3.3 \
                          qemu-utils=1:10.2.1+ds-1ubuntu3.3 \
                          dnsmasq-base=2.92-1ubuntu0.5 \
                          virtinst=1:5.1.0-1 \
                          xorriso=1:1.5.6-1.1ubuntu4 \
                          skopeo=1.21.0~pre1-2build1
                  }
                  # Temporary, for Canonical's archive outage of 2026-11-11, removed once Canonical is back: after a
                  # failed install, the same suites from a public mirror, still checked against Ubuntu's keyring.
                  install || { sudo build/apt-fallback.sh && install; }
                  sudo virsh pool-info images >/dev/null 2>&1 || {
                      sudo mkdir -p /var/lib/libvirt/images
                      sudo virsh pool-define-as images dir --target /var/lib/libvirt/images
                      sudo virsh pool-start images
                  }
                  # libvirt's NAT network must be active before the script runs, and saying so fails here.
                  sudo virsh net-info default >/dev/null 2>&1 || sudo virsh net-define /usr/share/libvirt/networks/default.xml
                  LC_ALL=C sudo virsh net-info default | grep -q '^Active: *yes' || sudo virsh net-start default
                  LC_ALL=C sudo virsh net-info default | grep '^Active: *yes'
                  # libvirt's socket for this one account, by an ACL: a step under `sg libvirt` would start rootless
                  # podman under a new group, whose user namespace newuidmap refuses.
                  sudo setfacl -m "u:$USER:rw" /run/libvirt/libvirt-sock
                  virsh -c qemu:///system list --all >/dev/null

            # The forge role's three pinned images from a cache, so an outage of their registries leaves the run green.
            # The key is the hash of their digests: a new pin starts a new entry, and GitHub removes an entry no run
            # used for 7 days, so only the newest pins stay.
            - name: The forge's pinned images and their cache key
              id: forge-images
              run: |
                  set -eu
                  python3 - > "$RUNNER_TEMP/forge-images.txt" <<'PY'
                  import re, sys, yaml
                  pins = yaml.safe_load(open("roles/forge/vars/main.yml"))
                  for key in ("__forge_image", "__forge_runner_image", "__forge_runner_proxy_image"):
                      reference = str(pins.get(key, "")).strip()
                      if not re.fullmatch(r"[a-z0-9./-]+(:[A-Za-z0-9._-]+)?@sha256:[0-9a-f]{64}", reference):
                          sys.exit(f"{key} names no image pinned by its digest: {reference}")
                      print(reference)
                  PY
                  digests=$(sed 's/.*@sha256://' "$RUNNER_TEMP/forge-images.txt" | sort | sha256sum | cut -d' ' -f1)
                  echo "key=forge-images-$digests" >> "$GITHUB_OUTPUT"

            - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              id: forge-images-cache
              with:
                  path: ${{ runner.temp }}/images
                  key: ${{ steps.forge-images.outputs.key }}

            # --all keeps each image's index, whose digest is the pin; a single platform would carry another digest.
            - name: Each pinned image the cache lacks, fetched once as an OCI archive that keeps its digest
              run: |
                  set -eu
                  mkdir -p "$RUNNER_TEMP/images"
                  digests='import json, sys; print(*(m["digest"] for m in json.load(sys.stdin)["manifests"]))'
                  while read -r reference; do
                      digest=${reference##*@sha256:}
                      # skopeo takes no tag beside a digest.
                      name=$(printf '%s\n' "${reference%@*}" | sed -E 's/:[^:/]+$//')
                      archive=$RUNNER_TEMP/images/$digest.tar
                      if [ ! -f "$archive" ]; then
                          rm -f "$archive.part"
                          skopeo copy --quiet --all --preserve-digests --retry-times 3 \
                              "docker://$name@sha256:$digest" "oci-archive:$archive.part" < /dev/null
                          mv "$archive.part" "$archive"
                      fi
                      index=$(tar --extract --to-stdout --wildcards --no-anchored --file "$archive" index.json)
                      indexed=$(printf '%s' "$index" | python3 -c "$digests")
                      [ "$indexed" = "sha256:$digest" ] \
                          || { echo "::error::$archive holds $indexed, not the pinned sha256:$digest"; exit 1; }
                      echo "$name@sha256:$digest in $(du -h "$archive" | cut -f1)"
                  done < "$RUNNER_TEMP/forge-images.txt"

            # Saved at once, so a red scenario still leaves the images for the next run.
            - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              if: steps.forge-images-cache.outputs.cache-hit != 'true'
              with:
                  path: ${{ runner.temp }}/images
                  key: ${{ steps.forge-images.outputs.key }}

            # The VM's pinned cloud image from a cache too, keyed by its digest, so an outage of cloud-images.ubuntu.com
            # leaves a warm run green; build/molecule.sh downloads it only on a miss and holds it to the digest.
            - name: The test image's cache key and place
              id: test-image
              run: |
                  set -eu
                  read -r url digest < build/test-image
                  echo "key=test-image-$digest" >> "$GITHUB_OUTPUT"
                  echo "path=$HOME/.porelo/cache/${url##*/}.$digest" >> "$GITHUB_OUTPUT"
                  echo "digest=$digest" >> "$GITHUB_OUTPUT"

            - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              id: test-image-cache
              with:
                  path: ${{ steps.test-image.outputs.path }}
                  key: ${{ steps.test-image.outputs.key }}

            # The runner has no local hand-over: the pinned published porelo-host and porelo of its run, signed.
            - name: The Molecule scenario on its VM
              env:
                  # The pool VM got an address on GitHub's runner but never said ready; local Molecule runs the pool.
                  PORELO_HOST_MOLECULE_POOL: "off"
                  PORELO_HOST_MOLECULE_KVM: ${{ matrix.kvm }}
                  # The forge's images from the cache above, loaded in the VM instead of pulled.
                  PORELO_HOST_IMAGES: ${{ runner.temp }}/images
              run: |
                  set -eu
                  PORELO_HOST_DEB=$(build/fetch-host-deb.sh "$RUNNER_TEMP/packages")
                  PORELO_HOST_PACKAGES=$RUNNER_TEMP/packages
                  export PORELO_HOST_DEB PORELO_HOST_PACKAGES
                  build/molecule.sh

            # Saved even after a red scenario, but only an image that has the pinned digest.
            - name: The downloaded test image holds its pinned digest
              id: test-image-checked
              if: always() && steps.test-image-cache.outputs.cache-hit != 'true'
              env:
                  IMAGE: ${{ steps.test-image.outputs.path }}
                  DIGEST: ${{ steps.test-image.outputs.digest }}
              run: |
                  set -eu
                  if [ -f "$IMAGE" ] && [ "$(sha256sum "$IMAGE" | cut -d' ' -f1)" = "$DIGEST" ]; then
                      echo "ok=true" >> "$GITHUB_OUTPUT"
                  fi

            - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              if: always() && steps.test-image-checked.outputs.ok == 'true'
              with:
                  path: ${{ steps.test-image.outputs.path }}
                  key: ${{ steps.test-image.outputs.key }}
