---
# What `host down` runs on the host itself, with `-c local`, before the host is given back. Its steps come with the
# roles that bring something up, the other way round: the store's last copy first, which must succeed before anything
# stops; then the tasks and services; then the vault; then the VPN; the person's key off the account last. Each takes
# down only what is there, so it also follows a failed `up`.
- name: Take the host down
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Take the host's VM pool off it, before the forge whose runner rents from it
      ansible.builtin.include_role:
        name: porelo.host.vm_pool
        tasks_from: down
      vars:
        porelo_host_step:
          text: Removing the virtual machines
          seconds: 10

    - name: Stop the host's forge, keeping nothing
      ansible.builtin.include_role:
        name: porelo.host.forge
        tasks_from: down
      vars:
        porelo_host_step:
          text: Stopping the forge
          seconds: 10

    - name: Take the vault off the host
      ansible.builtin.include_role:
        name: porelo.host.porelo
        tasks_from: down
      vars:
        porelo_host_step:
          text: Taking the vault off the host
          seconds: 10

    - name: Take the VPN down
      ansible.builtin.include_role:
        name: porelo.host.vpn
        tasks_from: down
      vars:
        porelo_host_step:
          text: Closing the VPN
          seconds: 10

    - name: Take the person's key off the account
      ansible.builtin.include_role:
        name: porelo.host.base
        tasks_from: down
      vars:
        porelo_host_step:
          text: Removing the access key
          seconds: 10
