---
# What `host down` runs on the host itself, with `-c local`, before the host is given back. Its steps come with the
# roles that bring something up, the other way round: the store's last copy first, which must succeed before anything
# stops; then the tasks and services; then the vault; then the VPN; the drive synced and unmounted last. Each takes
# down only what is there, so it also follows a failed `up`.
- name: Take the host down
  hosts: localhost
  connection: local
  gather_facts: false
  tasks: []
