---
# What `host up` runs on the host itself, with `-c local`. Its roles come with the issues that build them.
- name: Bring the host up
  hosts: localhost
  connection: local
  gather_facts: false
  roles:
    - porelo.host.base
  tasks:
    # Stands where Porelo's setup script will run, which makes the account this part reads.
    - name: Let Porelo's account open KVM and libvirt
      ansible.builtin.include_role:
        name: porelo.host.base
        tasks_from: account
