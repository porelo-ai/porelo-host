---
# What `host up` runs on the host itself, with `-c local`: two plays around the one step only the host admin can take.
# Each role that step serves adds what is missing to the fact porelo_host_needs in the first play; the second play's
# first task stops on it, and the lines callback reports that stop as a waiting line.
- name: Bring the host up to the person's step
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Stop on an inventory of a version this playbook does not know
      ansible.builtin.assert:
        that:
          - porelo_host_inventory_version is defined
          - porelo_host_inventory_version is not boolean
          - porelo_host_inventory_version == 2
        fail_msg: >-
          porelo_host_inventory_version must be 2;
          got {{ porelo_host_inventory_version | to_json if porelo_host_inventory_version is defined else 'undefined' }}
        quiet: true

    - name: Stop on a host name that is not one lower-case DNS label
      ansible.builtin.assert:
        that:
          - porelo_host_name is defined
          - porelo_host_name is string
          - porelo_host_name is match('^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?\Z')
        fail_msg: >-
          porelo_host_name must match ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$;
          got {{ porelo_host_name | to_json if porelo_host_name is defined else 'undefined' }}
        quiet: true

    - name: Stop on a host network outside 0 to 255
      ansible.builtin.assert:
        that:
          - porelo_host_network is defined
          - porelo_host_network is integer
          - porelo_host_network is not boolean
          - 0 <= porelo_host_network <= 255
        fail_msg: >-
          porelo_host_network must be an integer from 0 to 255;
          got {{ porelo_host_network | to_json if porelo_host_network is defined else 'undefined' }}
        quiet: true

    - name: Install the host's packages, KVM and podman
      ansible.builtin.include_role:
        name: porelo.host.base
      vars:
        porelo_host_step:
          text: Installing the host's packages
          seconds: 90

    - name: Install Porelo's repository, packages and stop command
      ansible.builtin.include_role:
        name: porelo.host.porelo
        tasks_from: install
      vars:
        porelo_host_step:
          text: Installing Porelo
          seconds: 50


- name: Bring the host up from the person's step
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Stop for what only the person can give
      ansible.builtin.fail:
        msg: "{{ porelo_host_needs | default([]) | to_json }}"
      when: porelo_host_needs | default([]) | length > 0
      tags: [porelo_host_waiting]

    - name: Run the host's forge behind its gate, where the host asks for one
      ansible.builtin.include_role:
        name: porelo.host.forge
      vars:
        porelo_host_step:
          text: Starting the forge
          seconds: 20
      when: porelo_host_forge | default(false) | bool

    - name: Make the host's VM pool, where the host asks for one
      ansible.builtin.include_role:
        name: porelo.host.vm_pool
      vars:
        porelo_host_step:
          text: Making the virtual machines
          seconds: 10
      when: porelo_host_vm_pool is defined

    - name: Run the host's Matrix homeserver
      ansible.builtin.include_role:
        name: porelo.host.matrix
      vars:
        porelo_host_step:
          text: Starting the Matrix homeserver
          seconds: 20

    - name: Install the helper by which the host admin admits, locks and purges people
      ansible.builtin.include_role:
        name: porelo.host.porelo
        tasks_from: person
      vars:
        porelo_host_step:
          text: Installing the people's helper
          seconds: 5

    - name: Write and print what a project's access file needs of the host
      ansible.builtin.include_role:
        name: porelo.host.base
        tasks_from: host
      vars:
        porelo_host_step:
          text: Writing the host's summary
          seconds: 5
