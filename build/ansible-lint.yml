---
# The collection is held to ansible-lint's strictest profile.
profile: production
# Not offline: its prerun installs this collection from the checkout, so the playbooks find its roles by name;
# the collection names no dependency for it to fetch.
offline: false
exclude_paths:
    - .github/
    - build/
    - doc/
    - issues/
    # Plays a test runs on purpose with what the production profile refuses, such as ignore_errors.
    - tests/
    - mkdocs.yml
