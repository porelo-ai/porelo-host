---
- name: Check one installer
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
      - name: Check the installer against the pinned CA
        porelo.host.tresorit_installer:
            path: "{{ installer }}"
            ca_sha256: "{{ ca_sha256 }}"
        register: checked
        ignore_errors: true
      - name: Keep the result for the test
        ansible.builtin.copy:
            dest: "{{ result }}"
            content: "{{ checked | to_json }}"
            mode: "0600"
